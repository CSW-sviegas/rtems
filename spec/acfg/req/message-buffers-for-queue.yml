requirement-type: functional
text: |
  The ${../if/message-buffers-for-queue:/name} macro shall evaluate to at least
  the number of bytes which the message buffers of a message queue need, where
  the first parameter is the maximum number of pending messages and the second
  parameter is the maximum message size of the message queue.
