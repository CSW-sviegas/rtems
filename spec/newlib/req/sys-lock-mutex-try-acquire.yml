text: |
  The ${../if/sys-lock-mutex-try-acquire:/name} directive shall seize the mutex
  as specified by ${/score/mtx/req/seize-try:/spec} where the mutex does not use
  the priority ceiling or MrsP locking protocol, the thread queue of the mutex
  uses the priority discipline, and a recursive seize of the mutex results in an
  unavailable status.
