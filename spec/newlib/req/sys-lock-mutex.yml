enabled-by: true
identifier: RTEMSScoreSysLockMutex
links:
- role: interface-ingroup
  uid: /score/if/group
non-functional-type: design-group
rationale: |
  The system lock mutexes are used for Newlib internal locking, the C++ standard
  library provided by ${/glossary/gcc:/term}, the OpenMP support provided by GCC,
  the self-contained objects ${/glossary/api:/term} provided by RTEMS, and the
  super core internal mutexes such as the objects allocator lock.
requirement-type: non-functional
text: |
  The super core shall have a component containing the system lock mutex
  implementation whose interfaces are defined by Newlib.
type: requirement
