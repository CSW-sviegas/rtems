- role: requirement-refinement
  uid: sys-lock-semaphore
rationale: |
  The ${../if/sys-lock-semaphore-post:/name} directive can increment the count of
  a semaphore beyond one. The directive returns no status.
references: []
requirement-type: functional
text: |
  While the count of the semaphore is greater than one, the
  ${../if/sys-lock-semaphore-post-binary:/name} directive shall set the count of
  the semaphore to one.
type: requirement
