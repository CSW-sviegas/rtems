text: |
  While the timeout parameter is zero, the
  ${../if/sys-lock-semaphore-wait-timed-ticks:/name} directive shall seize the
  semaphore as specified by ${/score/sem/req/seize-wait:/spec} where the thread
  queue of the semaphore uses the priority discipline and the directive waits
  without a timeout.
