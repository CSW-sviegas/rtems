enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/sys-lock-mutex-recursive-acquire-timed
- role: requirement-refinement
  uid: sys-lock-mutex
post-conditions:
- name: Status
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The return value of ${../if/sys-lock-mutex-recursive-acquire-timed:/name} shall
      be equal to zero.
  - name: ETIMEDOUT
    test-code: |
      T_eq_int( ctx->status, ETIMEDOUT );
    text: |
      The return value of ${../if/sys-lock-mutex-recursive-acquire-timed:/name} shall
      be equal to ${/c/errno/if/etimedout:/name}.
  - name: EINVAL
    test-code: |
      T_eq_int( ctx->status, EINVAL );
    text: |
      The return value of ${../if/sys-lock-mutex-recursive-acquire-timed:/name} shall
      be equal to ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: Owner
  states:
  - name: Caller
    test-code: |
      T_eq_ptr( ctx->owner_after, ctx->worker_tcb );
    text: |
      The calling task shall be the owner of the mutex after the return of the
      ${../if/sys-lock-mutex-recursive-acquire-timed:/name} call.
  - name: Other
    test-code: |
      T_eq_ptr( ctx->owner_after, ctx->runner_tcb );
    text: |
      The owner of the mutex before the
      ${../if/sys-lock-mutex-recursive-acquire-timed:/name} call shall be the owner
      of the mutex after the return of the
      ${../if/sys-lock-mutex-recursive-acquire-timed:/name} call.
  test-epilogue: null
  test-prologue: null
- name: Timer
  states:
  - name: Inactive
    test-code: |
      T_eq_int( ctx->timer_info.state, TASK_TIMER_INACTIVE );
    text: |
      The timer of the calling task shall be inactive.
  - name: Realtime
    test-code: |
      T_eq_int( ctx->timer_info.state, TASK_TIMER_REALTIME );
    text: |
      The timer of the calling task shall be active using the
      ${/glossary/clock-realtime:/term}.
  test-epilogue: null
  test-prologue: null
- name: Expire
  states:
  - name: Last
    test-code: |
      T_eq_u64( ctx->timer_info.expire_ticks, 0xffffffffffffffff );
    text: |
      The timer of the calling task shall expire at the last valid time point of the
      ${/glossary/clock-realtime:/term}.
  - name: Absolute
    test-code: |
      T_eq_i64( ctx->timer_info.expire_timespec.tv_sec, ctx->abstime.tv_sec );
      T_eq_long( ctx->timer_info.expire_timespec.tv_nsec, ctx->abstime.tv_nsec );
    text: |
      The timer of the calling task shall expire at the time point specified by the
      timeout parameter.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Owner
  states:
  - name: None
    test-code: |
      ctx->owner = OWNER_NONE;
    text: |
      While the mutex has no owner.
  - name: Caller
    test-code: |
      ctx->owner = OWNER_CALLER;
    text: |
      While the calling task is the owner of the mutex.
  - name: Other
    test-code: |
      ctx->owner = OWNER_OTHER;
    text: |
      While a task other than the calling task is the owner of the mutex.
  test-epilogue: null
  test-prologue: null
- name: AbstimeNSec
  states:
  - name: Valid
    test-code: |
      ctx->abstime.tv_nsec = 999999999;
    text: |
      While the `tv_nsec` member of the object referenced by the timeout parameter is
      a valid nanoseconds value.
  - name: Invalid
    test-code: |
      ctx->abstime.tv_nsec = -1;
    text: |
      While the `tv_nsec` member of the object referenced by the timeout parameter is
      an invalid nanoseconds value.
  test-epilogue: null
  test-prologue: null
- name: AbstimeSec
  states:
  - name: Negative
    test-code: |
      ctx->abstime.tv_sec = -238479;
    text: |
      While the `tv_sec` member of the object referenced by the timeout parameter is
      negative.
  - name: FarFuture
    test-code: |
      ctx->abstime.tv_sec = INT64_MAX;
    text: |
      While the `tv_sec` member of the object referenced by the timeout parameter
      specifies a time point which is past the implementation limit.
  - name: Future
    test-code: |
      ctx->abstime.tv_sec = 1621322302;
    text: |
      While the `tv_sec` member of the object referenced by the timeout parameter
      specifies a time point which is after the current time of the
      ${/glossary/clock-realtime:/term} and is within the implementation limits.
  - name: PastOrNow
    test-code: |
      ctx->abstime.tv_sec = 0;

      if ( ctx->abstime.tv_nsec == 999999999 ) {
        ctx->abstime.tv_nsec = 0;
      }
    text: |
      While the `tv_sec` member of the object referenced by the timeout parameter is
      non-negative and specifies a time point which is before or at the current time
      of the ${/glossary/clock-realtime:/term}.
  test-epilogue: null
  test-prologue: null
- name: Surrender
  states:
  - name: 'Yes'
    test-code: |
      ctx->surrender = true;
    text: |
      While the owner of the mutex surrenders the mutex before the time point
      specified by the timeout parameter.
  - name: 'No'
    test-code: |
      ctx->surrender = false;
    text: |
      While the owner of the mutex does not surrender the mutex before the time point
      specified by the timeout parameter.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
requirement-type: functional
skip-reasons: {}
test-action: |
  if ( ctx->owner == OWNER_OTHER ) {
    _Mutex_recursive_Acquire( &ctx->mutex );
  }

  ResumeTask( ctx->worker_id );
  GetTaskTimerInfo( ctx->worker_id, &ctx->timer_info );

  if ( ctx->owner == OWNER_OTHER ) {
    if ( ctx->surrender ) {
      _Mutex_recursive_Release( &ctx->mutex );
    } else {
      FinalClockTick();
      _Mutex_recursive_Release( &ctx->mutex );
    }
  }
