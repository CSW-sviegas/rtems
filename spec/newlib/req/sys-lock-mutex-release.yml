  uid: sys-lock-mutex
rationale: null
requirement-type: functional
text: |
  The ${../if/sys-lock-mutex-release:/name} directive shall surrender the mutex
  as specified by ${/score/mtx/req/surrender:/spec} where the mutex uses the
  priority inheritance locking protocol, the thread queue of the mutex uses the
  priority discipline, a recursive seize of the mutex is not allowed, and the
  surrender does not check that the mutex owner is the calling thread.
type: requirement
