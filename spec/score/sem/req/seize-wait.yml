post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      status = TQEnqueue( &ctx->tq_ctx->base, ctx->tq_ctx->base.wait );
      T_eq_int( status, Status( ctx, STATUS_SUCCESSFUL ) );
    text: |
      The return status of the directive call shall be derived from
      ${../../status/if/successful:/name}.
  test-epilogue: null
  test-prologue: |
    Status_Control status;
- name: Enqueued
  states:
  - name: 'No'
    test-code: |
      /* The test runner would block if the worker is enqueued */
    text: |
      The calling thread shall not be enqueued on the thread queue of the semaphore.
  - name: FIFO
    test-code: |
      ${../../tq/req/enqueue-fifo:/test-run}( &ctx->tq_ctx->base );
    text: |
      The calling thread shall be enqueued in FIFO order.
  - name: Priority
    test-code: |
      ${../../tq/req/enqueue-priority:/test-run}( &ctx->tq_ctx->base );
    text: |
      The calling thread shall be enqueued in priority order.
  test-epilogue: null
  test-prologue: null
- name: Count
  states:
  - name: Nop
    test-code: |
      /* Checked by GetProperties() */
    text: |
      The count of the semaphore shall not be modified.
  - name: MinusOne
    test-code: |
      T_eq_u32( TQSemGetCount( ctx->tq_ctx ), 1 );
    text: |
      The count of the semaphore shall be decremented by one.
  test-epilogue: null
  test-prologue: null
- name: Timer
  states:
  - name: Ticks
    test-code: |
      /* Checked by GetProperties() */
    text: |
      The thread timer of the calling task shall fire after the specified clock
      ticks.
  - name: 'No'
    test-code: |
      T_eq_int( T_get_thread_timer_state( RTEMS_SELF ), T_THREAD_TIMER_INACTIVE );
    text: |
      The thread timer of the calling task shall be inactive.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Discipline
  states:
  - name: FIFO
    test-code: |
      if ( ctx->tq_ctx->base.discipline != TQ_FIFO ) {
        ${.:skip}
      }
    text: |
      Where the thread queue of the semaphore uses the FIFO discipline.
  - name: Priority
    test-code: |
      if ( ctx->tq_ctx->base.discipline != TQ_PRIORITY ) {
        ${.:skip}
      }
    text: |
      Where the thread queue of the semaphore uses the priority discipline.
  test-epilogue: null
  test-prologue: null
- name: Timeout
  states:
  - name: Ticks
    test-code: |
      if ( ctx->tq_ctx->base.wait != TQ_WAIT_TIMED ) {
        ${.:skip}
      }
    text: |
      Where the directive waits with a timeout in clock ticks.
  - name: None
    test-code: |
      if ( ctx->tq_ctx->base.wait != TQ_WAIT_FOREVER ) {
        ${.:skip}
      }
    text: |
      Where the directive waits without a timeout.
  test-epilogue: null
  test-prologue: null
- name: Count
  states:
  - name: Zero
    test-code: |
      /* Done by TQEnqueuePrepareDefault() */
    text: |
      While the count of the semaphore is zero.
  - name: Positive
    test-code: |
      TQSemSetCount( ctx->tq_ctx, 2 );
    text: |
      While the count of the semaphore is greater than zero.
  test-epilogue: null
  test-prologue: null
