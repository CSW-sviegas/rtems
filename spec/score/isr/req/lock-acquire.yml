post-conditions:
- name: ISRLevel
  states:
  - name: Disabled
    test-code: |
      T_false( ctx->isr_enabled_after );
    text: |
      Maskable interrupts shall be disabled on the calling processor.
  test-epilogue: null
  test-prologue: null
- name: Saved
  states:
  - name: Enabled
    test-code: |
      T_true( ctx->saved_enabled );
    text: |
      The lock shall save that maskable interrupts were enabled.
  - name: Disabled
    test-code: |
      T_false( ctx->saved_enabled );
    text: |
      The lock shall save that maskable interrupts were disabled.
  test-epilogue: null
  test-prologue: null
- name: Owner
  states:
  - name: Caller
    test-code: |
      T_false( ctx->free_after );
    text: |
      The calling processor shall own the lock.
  test-epilogue: null
  test-prologue: null
- name: Wait
  states:
  - name: UntilReleased
    test-code: |
      T_true( ctx->owner_released );
    text: |
      The calling processor shall wait until the owner releases the lock.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: ISRRestoreLevel
  states:
  - name: ToContext
    test-code: |
      if ( ctx->lock_ctx->restore != ISR_LOCK_RESTORE_TO_CONTEXT ) {
        ${.:skip}
      }
    text: |
      Where the lock disables maskable interrupts at the acquire and restores their
      status from the lock context at the release.
  - name: ToObject
    test-code: |
      if ( ctx->lock_ctx->restore != ISR_LOCK_RESTORE_TO_OBJECT ) {
        ${.:skip}
      }
    text: |
      Where the lock disables maskable interrupts at the acquire and restores their
      status from the lock object at the release.
  - name: None
    test-code: |
      if ( ctx->lock_ctx->restore != ISR_LOCK_RESTORE_NONE ) {
        ${.:skip}
      }
    text: |
      Where the lock does not change the status of maskable interrupts.
  test-epilogue: null
  test-prologue: null
- name: ISRLevel
  states:
  - name: Enabled
    test-code: |
      ctx->isr_enabled = true;
    text: |
      While maskable interrupts are enabled on the calling processor.
  - name: Disabled
    test-code: |
      ctx->isr_enabled = false;
    text: |
      While maskable interrupts are disabled on the calling processor.
  test-epilogue: null
  test-prologue: null
- name: Owner
  states:
  - name: Free
    test-code: |
      ctx->other = false;
    text: |
      While no processor owns the lock.
  - name: Other
    test-code: |
      ctx->other = true;

      #if defined( RTEMS_SMP )
      if ( ISRLockGetOtherProcessors( &ctx->other_cpu_index, 1 ) == 0 ) {
        ${.:skip}
      }
      #endif
    text: |
      While another processor owns the lock.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension ISRRestoreLevel covers the place where the lock saves the status of
  maskable interrupts, 3 states. The lock saves it in the lock context or in the
  lock object, or the lock leaves the status of maskable interrupts to the
  caller.

  Dimension ISRLevel covers the status of maskable interrupts on the calling
  processor, 2 states. Where the lock does not change the status of maskable
  interrupts, a call with maskable interrupts enabled is undefined behaviour.

  Dimension Owner covers the owner of the lock, 2 states. An acquire of a lock
  which the calling processor owns is undefined behaviour in every configuration,
  so it is not a state. The calling processor waits only for a lock which another
  processor owns, and so only where the system was built with SMP support
  enabled.
requirement-type: functional
skip-reasons:
  InterruptsEnabled: |
    Where the lock acquire directive does not change the status of maskable
    interrupts, a call with maskable interrupts enabled is undefined behaviour.
  NeedsSMP: |
    Where the system was built with SMP support disabled, no other processor can
    own the lock.
test-action: |
  ISR_Level level;

  level = 0;

  if ( !ctx->isr_enabled ) {
    _ISR_Local_disable( level );
  }

  #if defined( RTEMS_SMP )
  if ( ctx->other ) {
    ISRLockStartWorker(
      ctx->lock_ctx,
      &ctx->worker,
      ctx->other_cpu_index,
      1,
      false
    );
    TicketLockWaitForOwned(
      ( *ctx->lock_ctx->get_ticket_lock )( ctx->lock_ctx )
    );
  }
  #endif

  ( *ctx->lock_ctx->acquire )( ctx->lock_ctx, &ctx->lock_context );
  ctx->isr_enabled_after = AreInterruptsEnabled();
  ctx->free_after = ISRLockIsFree( ctx->lock_ctx );

  #if defined( RTEMS_SMP )
  if ( ctx->other ) {
    ctx->owner_released = ISRLockWorkerReleased( &ctx->worker );
  }
  #endif

  if ( ctx->lock_ctx->get_saved_level != NULL ) {
    ctx->saved_enabled = _ISR_Is_enabled(
      ( *ctx->lock_ctx->get_saved_level )( ctx->lock_ctx, &ctx->lock_context )
    );
  }

  ( *ctx->lock_ctx->release )( ctx->lock_ctx, &ctx->lock_context );

  if ( !ctx->isr_enabled ) {
    _ISR_Local_enable( level );
  }

  #if defined( RTEMS_SMP )
  if ( ctx->other ) {
    ISRLockWaitForWorker( &ctx->worker );
  }
  #endif
test-brief: null
test-cleanup: |
  ( *ctx->lock_ctx->destroy )( ctx->lock_ctx );
