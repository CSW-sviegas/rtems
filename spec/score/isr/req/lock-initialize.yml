  target: testsuites/validation/tr-isr-lock-initialize.h
test-includes: []
test-local-includes:
- tr-isr-lock-initialize.h
- tx-support.h
test-prepare: null
test-setup: null
test-stop: null
test-support: |
  typedef ${.:/test-context-type} Context;

  static void FillArbitrary( Context *ctx )
  {
    uint8_t *bytes;
    size_t   i;

    bytes = ctx->lock_ctx->lock;

    for ( i = 0; i < ctx->lock_ctx->lock_size; ++i ) {
      bytes[ i ] = (uint8_t) ( 0x11 * ( ( i % 15 ) + 1 ) );
    }
  }

  static void MakeDestroyed( Context *ctx )
  {
    ISR_Level        level;
    ISR_lock_Context lock_context;

    ( *ctx->lock_ctx->initialize )( ctx->lock_ctx );
    _ISR_Local_disable( level );
    ( *ctx->lock_ctx->acquire )( ctx->lock_ctx, &lock_context );
    ( *ctx->lock_ctx->release )( ctx->lock_ctx, &lock_context );
    _ISR_Local_enable( level );
    ( *ctx->lock_ctx->destroy )( ctx->lock_ctx );
  }
test-target: testsuites/validation/tr-isr-lock-initialize.c
test-teardown: null
text: |
  When the lock is initialized.
