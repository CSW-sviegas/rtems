post-conditions:
- name: ISRLevel
  states:
  - name: Nop
    test-code: |
      T_eq( ctx->isr_enabled_after, ctx->isr_enabled_before );
    text: |
      The status of maskable interrupts on the calling processor shall not change.
  test-epilogue: null
  test-prologue: null
- name: Lock
  states:
  - name: Nop
    test-code: |
      T_eq_int( ctx->lock_compare, 0 );
    text: |
      The lock object shall not change.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: ISRLevel
  states:
  - name: Enabled
    test-code: |
      ctx->isr_enabled = true;
    text: |
      While maskable interrupts are enabled on the calling processor.
  - name: Disabled
    test-code: |
      ctx->isr_enabled = false;
    text: |
      While maskable interrupts are disabled on the calling processor.
  test-epilogue: null
  test-prologue: null
rationale: |
  A destroy of a lock which a processor owns or waits for is undefined behaviour.
  After the destroy, only an initialization of the lock is defined.

  Where the system was built with SMP support and profiling enabled, the destroy
  removes the statistics of the lock from the registered statistics. This may
  change the lock object, so the lock object is not specified for this
  configuration.

  Dimension ISRLevel covers the status of maskable interrupts on the calling
  processor, 2 states.
requirement-type: functional
skip-reasons: {}
test-action: |
  ISR_Level level;

  level = 0;

  if ( !ctx->isr_enabled ) {
    _ISR_Local_disable( level );
  }

  T_quiet_le_sz( ctx->lock_ctx->lock_size, sizeof( ctx->lock_before ) );
  memcpy( ctx->lock_before, ctx->lock_ctx->lock, ctx->lock_ctx->lock_size );
  ctx->isr_enabled_before = AreInterruptsEnabled();
  ( *ctx->lock_ctx->destroy )( ctx->lock_ctx );
  ctx->isr_enabled_after = AreInterruptsEnabled();
  ctx->lock_compare = memcmp(
    ctx->lock_before,
    ctx->lock_ctx->lock,
    ctx->lock_ctx->lock_size
  );

  if ( !ctx->isr_enabled ) {
    _ISR_Local_enable( level );
  }
