enabled-by: sparc/gr712rc
links: []
test-actions:
- action-brief: |
    Validate the use of the `-mfix-gr712rc` compiler option.
  action-code: |
    const char *s;
  checks:
  - brief: |
      Check that the compiler built-in define `__FIX_LEON3FT_B2BST` is defined.
    code: |
      #if !defined( __FIX_LEON3FT_B2BST )
      #error "__FIX_LEON3FT_B2BST is not defined"
      #endif
    links:
    - role: validation
      uid: ../req/errata-gr712rc-compiler-fix
    - role: validation
      uid: ../req/errata-gr712rc
    - role: errata-resolution
      uid: /errata/gaisler/gr712rc/13
    - role: errata-resolution
      uid: /errata/gaisler/gr712rc/16
    - role: errata-resolution
      uid: /errata/gaisler/gr712rc/17
    - role: errata-resolution
      uid: /errata/gaisler/gr712rc/20
  - brief: |
      Check that the compiler built-in define `__FIX_LEON3FT_TN0018` is defined.
    code: |
      #if !defined( __FIX_LEON3FT_TN0018 )
      #error "__FIX_LEON3FT_TN0018 is not defined"
      #endif
    links:
    - role: validation
      uid: ../req/errata-gr712rc-compiler-fix
    - role: validation
      uid: ../req/errata-gr712rc
    - role: errata-resolution
      uid: /errata/gaisler/gr712rc/13
    - role: errata-resolution
      uid: /errata/gaisler/gr712rc/16
    - role: errata-resolution
      uid: /errata/gaisler/gr712rc/17
    - role: errata-resolution
      uid: /errata/gaisler/gr712rc/20
  - brief: |
      Check that the `SPARC_LEON3FT_B2BST_NOP` define expands to a `nop` instruction.
    code: |
      s = RTEMS_XSTRING( SPARC_LEON3FT_B2BST_NOP );
      T_true( IsEqualIgnoreWhiteSpace( s, "nop" ) );
    links:
    - role: validation
      uid: ../req/errata-b2bst-nop
    - role: validation
      uid: ../req/errata-gr712rc
    - role: errata-resolution
      uid: /errata/gaisler/gr712rc/13
  links: []
- action-brief: |
    Validate the required FTMCTRL bootloader settings.
  action-code: |
    ftmctrl *regs;
    uint32_t mcfg2;

    regs = (ftmctrl *) GR712RC_FTMCTRL_BASE;
    mcfg2 = grlib_load_32( &regs->mcfg2 );
  checks:
  - brief: |
      Check that the bootloader did set the MCFG2.TRP register field.
    code: |
      T_ne_u32( mcfg2 & FTMCTRL_MCFG2_TRP, 0 );
    links:
    - role: validation
      uid: ../req/ftmctrl-mcfg2-trp
    - role: validation
      uid: ../req/errata-gr712rc
    - role: errata-resolution
      uid: /errata/gaisler/gr712rc/9
  links: []
- action-brief: |
    Decode the machine code of a function which has a floating-point operate
    instruction at the target of an integer branch.
  action-code: |
    BranchTargets targets;

    CountBranchTargets(
      (const uint32_t *) (uintptr_t) FpopAtBranchTarget,
      &targets
    );
  checks:
  - brief: |
      Check that no integer branch targets a floating-point operate instruction.
    code: |
      T_eq_sz( targets.fpop, 0 );
    links:
    - role: validation
      uid: ../req/errata-gr712rc-compiler-fix
    - role: validation
      uid: ../req/errata-gr712rc
    - role: errata-resolution
      uid: /errata/gaisler/gr712rc/16
  - brief: |
      Check that an integer branch targets a `nop` instruction which a floating-point
      operate instruction follows.
    code: |
      T_ne_sz( targets.nop_fpop, 0 );
    links:
    - role: validation
      uid: ../req/errata-gr712rc-compiler-fix
    - role: validation
      uid: ../req/errata-gr712rc
    - role: errata-resolution
      uid: /errata/gaisler/gr712rc/16
  links: []
- action-brief: |
    Decode the machine code of a function which has a control transfer instruction
    after an `fdivd` instruction.
  action-code: |
    DivSqrtSequences sequences;

    CountDivSqrtSequences(
      (const uint32_t *) (uintptr_t) DivBeforeReturn,
      &sequences
    );
  checks:
  - brief: |
      Check that the function contains an `fdiv` or `fsqrt` instruction.
    code: |
      T_ne_sz( sequences.div_sqrt, 0 );
    links:
    - role: validation
      uid: ../req/errata-gr712rc-compiler-fix
    - role: validation
      uid: ../req/errata-gr712rc
    - role: errata-resolution
      uid: /errata/gaisler/gr712rc/17
  - brief: |
      Check that a `nop` instruction separates each `fdiv` and `fsqrt` instruction
      from a control transfer instruction in the next three instructions.
    code: |
      T_eq_sz( sequences.unguarded, 0 );
    links:
    - role: validation
      uid: ../req/errata-gr712rc-compiler-fix
    - role: validation
      uid: ../req/errata-gr712rc
    - role: errata-resolution
      uid: /errata/gaisler/gr712rc/17
  links: []
