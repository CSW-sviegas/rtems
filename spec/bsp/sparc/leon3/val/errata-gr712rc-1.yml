method: by-analysis
text: |
  The linker command file of the software product places all sections in the
  SRAM/SDRAM area at 0x40000000. This area is cacheable. The software product
  does not access the on-chip memory at 0xa0000000. The erratum is therefore not
  applicable to the software product.
