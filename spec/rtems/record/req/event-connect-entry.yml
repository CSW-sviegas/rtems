rationale: |
  The enumerators of ${../if/event:/name} have no explicit values, so their
  values follow from their position in the enumeration of the interface item.
  This requirement fixes the position of one enumerator.
requirement-type: functional
text: |
  The ${../if/event:/enumerators[42]/name} enumerator of ${../if/event:/name}
  shall be equal to 42.
type: requirement
