links:
- role: requirement-refinement
  uid: buffer
rationale: |
  A host program can then extend the time stamps to the uptime without ambiguity.
requirement-type: functional
text: |
  Where the ${/acfg/if/record-per-processor-items:/name} application
  configuration option is greater than zero, the interval of the productions of
  ${uptime-periodic:/spec} shall be the largest count of
  ${/glossary/clock-tick:/plural} which lasts at most two to the power of
  ${../if/time-bits:/name} ${/glossary/countertick:/plural}, and at least one
  ${/glossary/clock-tick:/term}.
type: requirement
