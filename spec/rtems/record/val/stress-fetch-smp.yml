  - not: RTEMS_QUAL
links: []
test-actions:
- action-brief: |
    Start one producer on each processor except processor 0. Fetch the record items
    of all processors with an item array of each item count of the rounds. Stop the
    producers. Fetch the remaining record items.
  action-code: |
    rtems_status_code sc;
    uint32_t          i;

    atomic_store_explicit( &ctx->run, 1, memory_order_relaxed );

    for ( i = 0; i < ctx->producer_count; ++i ) {
      sc = rtems_task_start( ctx->producers[ i ].id, ProducerBody, i );
      T_assert_rsc_success( sc );
    }

    for ( i = 0; i < ROUND_COUNT; ++i ) {
      RunRound( ctx, &ctx->rounds[ i ] );
    }

    atomic_store_explicit( &ctx->run, 0, memory_order_relaxed );

    while (
      atomic_load_explicit( &ctx->acks, memory_order_acquire ) !=
      ctx->producer_count
    ) {
      /* Wait for the producers */
    }

    Drain( ctx, &ctx->rounds[ ROUND_COUNT - 1 ] );
  checks:
  - brief: |
      Check that each call of ${../if/fetch:/name} returned
      ${../if/fetch-continue:/name} or ${../if/fetch-done:/name}. Check that each
      fetched item array started with an ${../if/event:/enumerators[9]/name} item,
      which an optional ${../if/event:/enumerators[8]/name} item followed. Check that
      the other items were items of the producer of the processor.
    code: |
      T_eq_u32( ctx->format_errors, 0 );
    links: []
  - brief: |
      Check that the event data of each fetched item of a producer was the event data
      of the item fetched before it, plus one, plus the count of lost items which the
      overflow items reported in between.
    code: |
      T_eq_u32( ctx->order_errors, 0 );
    links: []
  - brief: |
      Check that the fetched items and the lost items of each producer added up to
      the items which the producer produced.
    code: |
      T_eq_u32( CountBalanceErrors( ctx ), 0 );
    links: []
  - brief: |
      Check that each round fetched at least one item of a producer.
    code: |
      T_eq_u32( CountIdleRounds( ctx ), 0 );
    links: []
  - brief: |
      Check that the producers overwrote items before the fetches copied them.
    code: |
      T_true( ctx->producer_count == 0 || CountLostItems( ctx ) > 0 );
    links: []
  links: []
- action-brief: |
    Print the figures of the rounds and of the producers.
  action-code: |
    PrintFigures( ctx );
  checks: []
  links: []
test-brief: |
  Stresses ${../if/fetch:/name} with a producer on each other processor.
