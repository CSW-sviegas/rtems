test-context-support: |
  #define PROCESSOR_MAX 32

  #define ROUND_COUNT 4

  #define ROUND_SECONDS 10

  #define ITEM_COUNT_MAX 64

  #define PRODUCER_PRIORITY 2

  typedef struct {
    /**
     * @brief This member contains the identifier of the producer task.
     */
    rtems_id id;

    /**
     * @brief This member contains the count of items which the producer
     *   produced.
     */
    uintptr_t produced;
  } Producer;

  typedef struct {
    /**
     * @brief This member contains the event data of the next item.
     */
    uintptr_t next;

    /**
     * @brief This member contains the count of lost items since the last
     *   fetched item.
     */
    uintptr_t pending;

    /**
     * @brief This member contains the count of fetched items.
     */
    uint64_t fetched;

    /**
     * @brief This member contains the count of lost items.
     */
    uint64_t lost;
  } Processor;

  typedef struct {
    /**
     * @brief This member contains the item count of the item array.
     */
    size_t item_count;

    /**
     * @brief This member contains the count of fetches.
     */
    uint64_t fetches;

    /**
     * @brief This member contains the count of fetched items of producers.
     */
    uint64_t items;

    /**
     * @brief This member contains the count of lost items.
     */
    uint64_t lost;
  } Round;
test-description: |
  A fetch of the record items competes with the producers on the other
  processors. A producer can overwrite an item between two fetches or while a
  fetch copies it. This test checks that ${../if/fetch:/name} returns each item
  either unchanged or counts it as lost.

  The test runs one producer on each processor except processor 0, up to 32
  processors. Each producer is pinned to its processor and produces items of the
  event ${../if/event:/enumerators[512]/name} with the event data 0, 1, 2 and so
  on. It produces with interrupts disabled, so that no other item enters its
  record buffer. The test removes the uptime watchdogs for the same reason. The
  producers use ${../if/produce:/name}, so each production consists of one item.
  The record buffer has 16 items.

  The runner fetches the items of all processors on processor 0. The load
  consists of four rounds of 10 s. The rounds use item arrays of 3, 4 and 9 items
  and of the item count which ${../if/get-item-count-for-fetch:/name} returns. A
  small item array makes the fetch of one processor take several calls. After the
  rounds, the runner stops the producers and fetches the remaining items.

  The event data of a fetched item tells its position in the stream of its
  producer. The test checks that each fetched item follows from the item before
  it and from the lost items which the overflow items report in between. An item
  which a fetch returned twice, out of order or after an overwrite shows up as an
  order error. An item which got lost without a count shows up as an order error
  as well. At the end, the fetched items and the lost items of each producer must
  add up to its produced items.

  The test suite of this test case exists only in an SMP build without the pre-
  qualified configuration. The build option BUILD_STRESS_TESTS enables it.
