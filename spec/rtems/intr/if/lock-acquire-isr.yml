brief: |
  Acquires the ISR lock from within an ISR.
copyrights:
- Copyright (C) 2021, 2026 embedded brains GmbH & Co. KG
- Copyright (C) 1988, 2008 On-Line Applications Research Corporation (OAR)
definition:
  default:
    attributes: null
    body: do { (void) ${.:/params[1]/name}; } while ( 0 )
    params:
    - ${lock:/name} *${.:/params[0]/name}
    - ${lock-context:/name} *${.:/params[1]/name}
    return: void
  variants:
  - definition:
      attributes: null
      body: |
        ${/score/smp/if/lock-acquire:/name}(
          &( ${.:/params[0]/name} )->Lock,
          &( ${.:/params[1]/name} )->Lock_context
        )
      params:
      - ${lock:/name} *${.:/params[0]/name}
      - ${lock-context:/name} *${.:/params[1]/name}
      return: void
    enabled-by: ${/score/isr/if/lock-needs-object:/name}
description: |
  This directive acquires the ISR lock specified by ${.:/params[0]/name} using
  the lock context provided by ${.:/params[1]/name}. The interrupt level will
  remain unchanged.
enabled-by: true
index-entries: []
interface-type: macro
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- role: constraint
  uid: /constraint/directive-ctx-any
- role: constraint
  uid: /constraint/directive-no-preempt
- role: constraint
  uid: ../constraint/lock-not-owned
- role: constraint
  uid: ../constraint/lock-interrupts-disabled
- role: constraint
  uid: ../constraint/lock-initialized
- role: constraint
  uid: ../constraint/lock-no-blocking
name: rtems_interrupt_lock_acquire_isr
notes: |
  A caller-specific lock context shall be provided for each acquire/release pair,
  for example an automatic variable.

  Where the system was built with SMP support enabled, this directive acquires an
  SMP lock.

  This directive is intended for device drivers and should be called from the
  corresponding interrupt service routine.
params:
- description: |
    is the ISR lock to acquire within an ISR.
  dir: inout
  name: _lock
- description: |
    is the ISR lock context. The directive does not change the status of maskable
    interrupts which ${lock-isr-disable:/name} stored in this lock context. This
    lock context shall be used to release the lock by calling
    ${lock-release-isr:/name} or ${lock-release:/name}.
  dir: out
  name: _lock_context
return: null
type: interface
