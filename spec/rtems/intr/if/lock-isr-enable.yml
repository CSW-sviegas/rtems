brief: |
  Restores the status of maskable interrupts on the current processor.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: ${/score/isr/if/lock-isr-enable:/name}( ${.:/params[0]/name} )
    params:
    - ${lock-context:/name} *${.:/params[0]/name}
    return: void
  variants: []
description: |
  This directive restores the status of maskable interrupts on the current
  processor to the status stored in ${.:/params[0]/name}.
enabled-by: true
index-entries: []
interface-type: macro
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- role: constraint
  uid: /constraint/directive-ctx-any
- role: constraint
  uid: /constraint/directive-no-preempt
- role: constraint
  uid: /constraint/interrupt-enable
name: rtems_interrupt_lock_interrupt_enable
notes: null
params:
- description: |
    is the ISR lock context. The status of maskable interrupts shall have been
    stored in this lock context by calling ${lock-isr-disable:/name} or
    ${lock-acquire:/name}.
  dir: in
  name: _lock_context
return: null
type: interface
