brief: |
  Disables maskable interrupts on the current processor.
copyrights:
- Copyright (C) 2021, 2026 embedded brains GmbH & Co. KG
- Copyright (C) 1988, 2008 On-Line Applications Research Corporation (OAR)
definition:
  default:
    attributes: null
    body: ${/score/isr/if/lock-isr-disable:/name}( ${.:/params[0]/name} )
    params:
    - ${lock-context:/name} *${.:/params[0]/name}
    return: void
  variants: []
description: |
  This directive disables maskable interrupts on the current processor and stores
  the previous status of maskable interrupts in ${.:/params[0]/name}.
enabled-by: true
index-entries: []
interface-type: macro
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- role: constraint
  uid: /constraint/directive-ctx-any
- role: constraint
  uid: /constraint/directive-no-preempt
name: rtems_interrupt_lock_interrupt_disable
notes: null
params:
- description: |
    is the ISR lock context. This lock context shall be used to restore the status
    of maskable interrupts by calling ${lock-isr-enable:/name}, or to acquire the
    lock by calling ${lock-acquire-isr:/name}.
  dir: out
  name: _lock_context
return: null
type: interface
