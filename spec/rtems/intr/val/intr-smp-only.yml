enabled-by: RTEMS_SMP
links: []
test-actions:
- action-brief: |
    Validate the interrupt lock directives.
  action-code: |
    struct {
      int a;
      RTEMS_INTERRUPT_LOCK_MEMBER( member )
      int b;
    } lock = { .member = RTEMS_INTERRUPT_LOCK_INITIALIZER( "name" ) };

    RTEMS_INTERRUPT_LOCK_REFERENCE( ref, &the_lock )
  checks:
  - brief: |
      Assert that ${../if/lock-needs-object:/name} is a constant expression which
      evaluates to a non-zero value.
    code: |
      RTEMS_STATIC_ASSERT( RTEMS_INTERRUPT_LOCK_NEEDS_OBJECT, LOCK_NEEDS_OBJECT );
    links:
    - role: validation
      uid: ../if/lock-needs-object
    - role: validation
      uid: ../req/lock-needs-object
  - brief: |
      Check that ${../if/lock-reference:/name} expanded to a lock reference
      definition. Check that the lock is available after static initialization.
    code: |
      T_true( ISRLockIsAvailable( ref ) );
    links:
    - role: validation
      uid: ../req/lock-reference-identifier
    - role: validation
      uid: ../req/lock-reference-target
    - role: validation
      uid: ../req/lock-reference-type
  - brief: |
      Check that the lock is available after initialization.
    code: |
      T_true( ISRLockIsAvailable( &lock.member ) );
    links:
    - role: validation
      uid: ../req/lock-initializer
  links:
  - role: validation
    uid: ../req/lock-declare-identifier
  - role: validation
    uid: ../req/lock-declare-specifier
  - role: validation
    uid: ../req/lock-define-identifier
  - role: validation
    uid: ../req/lock-define-specifier
  - role: validation
    uid: ../req/lock-member-identifier
  - role: validation
    uid: ../req/lock-member-type
- action-brief: |
    Validate the order in which processors acquire an interrupt lock.
  action-code: |
    ISRLockSetClassic( &ctx->lock_ctx, &ctx->lock, ISR_LOCK_RESTORE_TO_CONTEXT );
  checks:
  - brief: |
      Validate the order for ${../if/lock-release:/name}.
    code: |
      ${/score/isr/req/lock-fifo:/test-run}( &ctx->lock_ctx );
    links:
    - role: validation
      uid: ../req/lock-release-fifo
  - brief: |
      Validate the order for ${../if/lock-release-isr:/name}.
    code: |
      ISRLockSetClassic( &ctx->lock_ctx, &ctx->lock, ISR_LOCK_RESTORE_NONE );
      ${/score/isr/req/lock-fifo:/test-run}( &ctx->lock_ctx );
    links:
    - role: validation
      uid: ../req/lock-release-isr-fifo
  links: []
test-brief: |
  Tests some ${../if/group:/name} directives.
test-context:
- brief: |
    This member contains the context of the ISR lock test runs.
  description: null
  member: |
    ISRLockContext lock_ctx
- brief: |
    This member contains the lock under test.
  description: null
  member: |
    rtems_interrupt_lock lock
test-context-support: null
test-description: null
test-header: null
test-includes:
- rtems.h
test-local-includes:
- tr-isr-lock-fifo.h
- tx-isr-lock.h
- tx-support.h
test-setup: null
test-stop: null
test-support: |
  RTEMS_INTERRUPT_LOCK_DECLARE( static, the_lock )
  RTEMS_INTERRUPT_LOCK_DEFINE( static, the_lock, "name " )
test-target: testsuites/validation/tc-intr-smp-only.c
test-teardown: null
type: test-case
