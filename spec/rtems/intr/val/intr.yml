enabled-by: true
links: []
test-actions:
- action-brief: |
    Validate ${../if/local-disable:/name} and ${../if/local-enable:/name}.
  action-code: |
    rtems_interrupt_level level;
    rtems_interrupt_level level_2;
  checks:
  - brief: |
      Check that maskable interrupts are enabled before the call to
      ${../if/local-disable:/name} and disabled afterwards.
    code: |
      T_true( AreInterruptsEnabled() );
      rtems_interrupt_local_disable( level );
      T_false( AreInterruptsEnabled() );
    links:
    - role: validation
      uid: ../if/local-disable
    - role: validation
      uid: ../req/disable-interrupts
    - role: validation
      uid: ../req/local-disable-assign
  - brief: |
      Check that maskable interrupts are disabled before the call to
      ${../if/local-disable:/name} and disabled afterwards.
    code: |
      T_false( AreInterruptsEnabled() );
      rtems_interrupt_local_disable( level_2 );
      T_false( AreInterruptsEnabled() );
    links:
    - role: validation
      uid: ../if/local-disable
    - role: validation
      uid: ../req/disable-interrupts
    - role: validation
      uid: ../req/local-disable-assign
  - brief: |
      Check that the maskable interrupt status is restored by the call to
      ${../if/local-enable:/name} according to the
      ${../if/local-enable:/params[0]/name} parameter. In this case maskable
      interrupts are still disabled afterwards.
    code: |
      T_false( AreInterruptsEnabled() );
      rtems_interrupt_local_enable( level_2 );
      T_false( AreInterruptsEnabled() );
    links:
    - role: validation
      uid: ../if/local-enable
    - role: validation
      uid: ../req/local-disable-assign
    - role: validation
      uid: ../req/local-enable
  - brief: |
      Check that the maskable interrupt status is restored by the call to
      ${../if/local-enable:/name} according to the
      ${../if/local-enable:/params[0]/name} parameter. In this case maskable
      interrupts are enabled afterwards.
    code: |
      T_false( AreInterruptsEnabled() );
      rtems_interrupt_local_enable( level );
      T_true( AreInterruptsEnabled() );
    links:
    - role: validation
      uid: ../if/local-enable
    - role: validation
      uid: ../req/local-disable-assign
    - role: validation
      uid: ../req/local-enable
  links: []
- action-brief: |
    Validate ${../if/lock-isr-disable:/name}.
  action-code: |
    rtems_interrupt_lock_context lock_context;
  checks:
  - brief: |
      Check that maskable interrupts are enabled before the call to
      ${../if/lock-isr-disable:/name} and disabled afterwards.
    code: |
      T_true( AreInterruptsEnabled() );
      rtems_interrupt_lock_interrupt_disable( &lock_context );
      T_false( AreInterruptsEnabled() );
    links:
    - role: validation
      uid: ../if/lock-isr-disable
    - role: validation
      uid: ../req/disable-interrupts
  - brief: |
      Restore the status of maskable interrupts with ${../if/lock-isr-enable:/name}.
      Check that maskable interrupts are enabled afterwards.
    code: |
      rtems_interrupt_lock_interrupt_enable( &lock_context );
      T_true( AreInterruptsEnabled() );
    links:
    - role: validation
      uid: ../req/lock-restore-interrupt-status
  links: []
- action-brief: |
    Validate the interrupt entry initialization.
  action-code: |
    int                   entry_arg;
    int                   entry_arg_2;
    const char            entry_info[] = "1";
    const char            entry_info_2[] = "1";
    rtems_interrupt_entry entry = RTEMS_INTERRUPT_ENTRY_INITIALIZER(
      EntryRoutine,
      &entry_arg,
      entry_info
    );
  checks:
  - brief: |
      Check that the entry is properly initialized by
      ${../if/entry-initializer:/name}.
    code: |
      T_eq_ptr( entry.handler, EntryRoutine );
      T_eq_ptr( entry.arg, &entry_arg );
      T_eq_ptr( entry.next, NULL );
      T_eq_ptr( entry.info, entry_info );
    links:
    - role: validation
      uid: ../req/entry-initializer-handler
    - role: validation
      uid: ../req/entry-initializer-arg
    - role: validation
      uid: ../req/entry-initializer-next
    - role: validation
      uid: ../req/entry-initializer-info
  - brief: |
      Call ${../if/entry-initialize:/name}. Check that the entry is properly
      initialized by ${../if/entry-initialize:/name}.
    code: |
      entry.next = &entry;
      rtems_interrupt_entry_initialize(
        &entry,
        EntryRoutine2,
        &entry_arg_2,
        entry_info_2
      );
      T_eq_ptr( entry.handler, EntryRoutine2 );
      T_eq_ptr( entry.arg, &entry_arg_2 );
      T_eq_ptr( entry.next, NULL );
      T_eq_ptr( entry.info, entry_info_2 );
    links:
    - role: validation
      uid: ../req/entry-initialize-handler
    - role: validation
      uid: ../req/entry-initialize-arg
    - role: validation
      uid: ../req/entry-initialize-next
    - role: validation
      uid: ../req/entry-initialize-info
  links: []
- action-brief: |
    Check ${../if/get-priority:/name} for each valid vector.
  action-code: |
    rtems_vector_number vector;

    for ( vector = 0; vector < BSP_INTERRUPT_VECTOR_COUNT; ++vector ) {
      rtems_interrupt_attributes attr;
      rtems_status_code          sc;

      memset( &attr, 0, sizeof( attr ) );
      sc = rtems_interrupt_get_attributes( vector, &attr );

      if ( sc == RTEMS_INVALID_ID ) {
        continue;
      }

      T_rsc_success( sc );
      ${../req/get-priority:/test-run}( vector, attr.can_get_priority );
    }
  checks: []
  links: []
- action-brief: |
    Check ${../if/set-priority:/name} for each valid vector.
  action-code: |
    rtems_vector_number vector;

    for ( vector = 0; vector < BSP_INTERRUPT_VECTOR_COUNT; ++vector ) {
      rtems_interrupt_attributes attr;
      rtems_status_code          sc;

      memset( &attr, 0, sizeof( attr ) );
      sc = rtems_interrupt_get_attributes( vector, &attr );

      if ( sc == RTEMS_INVALID_ID ) {
        continue;
      }

      T_rsc_success( sc );
      ${../req/set-priority:/test-run}(
        vector,
        attr.maximum_priority,
        attr.can_set_priority
      );
    }
  checks: []
  links: []
- action-brief: |
    Check ${../if/entry-install:/name} for each valid vector which is maskable and
    which carries no entry.
  action-code: |
    rtems_vector_number vector;

    for ( vector = 0; vector < BSP_INTERRUPT_VECTOR_COUNT; ++vector ) {
      rtems_interrupt_attributes attr;
      rtems_status_code          sc;
      bool                       enabled;

      memset( &attr, 0, sizeof( attr ) );
      sc = rtems_interrupt_get_attributes( vector, &attr );

      if ( sc == RTEMS_INVALID_ID ) {
        continue;
      }

      T_rsc_success( sc );

      /* The probe of IsFreeForEntryInstall() disables the vector. */
      enabled = false;
      (void) rtems_interrupt_vector_is_enabled( vector, &enabled );

      if ( !IsFreeForEntryInstall( vector, &attr ) ) {
        continue;
      }

      ${../req/entry-install:/test-run}( vector, &attr, enabled );
    }
  checks: []
  links: []
test-brief: |
  Tests some ${../if/group:/name} directives.
