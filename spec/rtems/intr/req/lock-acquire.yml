text: |
  The ${../if/lock-acquire:/name} directive shall acquire the lock referenced by
  the ${../if/lock-acquire:/params[0]/name} parameter as specified by
  ${/score/isr/req/lock-acquire:/spec} where the lock disables maskable
  interrupts at the acquire and restores their status from the lock context at
  the release.
