requirement-type: functional
text: |
  The ${../if/lock-release:/name} directive shall pass the lock referenced by the
  ${../if/lock-release:/params[0]/name} parameter to a waiting processor as
  specified by ${/score/isr/req/lock-fifo:/spec} where the lock disables maskable
  interrupts at the acquire and restores their status from the lock context at
  the release.
type: requirement
