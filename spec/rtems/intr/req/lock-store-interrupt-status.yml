rationale: |
  The stored status is the status which ${../if/lock-release:/name} or
  ${../if/lock-isr-enable:/name} restores, see
  ${/score/isr/req/lock-release:/spec}.
requirement-type: functional
text: |
  The ${../if/lock-isr-disable:/name} directive shall store the status of
  maskable interrupts before the call in the lock context referenced by the
  ${../if/lock-isr-disable:/params[0]/name} parameter as specified by
  ${/score/isr/req/lock-isr-disable:/spec}.
type: requirement
