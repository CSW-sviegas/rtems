test-actions:
- action-brief: |
    Read the uptime and the processor time of the executing thread. Restore the
    counter of the software timecounter after each read.
  action-code: |
    Thread_Control   *self;
    Timestamp_Control used;
    struct timespec   uptime;
    struct timespec   expected;
    struct timespec   ts;
    uint32_t          counter;

    self = GetThread( RTEMS_SELF );
    counter = GetTimecountCounter();
    T_rsc_success( rtems_clock_get_uptime( &uptime ) );
    SetTimecountCounter( counter );
    used = _Thread_Get_CPU_time_used( self );
    SetTimecountCounter( counter );
  checks:
  - brief: |
      Check that the time of the ${/c/time/if/clock-process-cputime-id:/name} clock
      is equal to the uptime.
    code: |
      T_eq_int( clock_gettime( CLOCK_PROCESS_CPUTIME_ID, &ts ), 0 );
      SetTimecountCounter( counter );
      T_eq_i64( ts.tv_sec, uptime.tv_sec );
      T_eq_long( ts.tv_nsec, uptime.tv_nsec );
    links:
    - role: validation
      uid: ../req/reset-point-init
  - brief: |
      Check that the time of the ${/c/time/if/clock-thread-cputime-id:/name} clock is
      equal to the processor time which the executing thread used since its creation.
    code: |
      T_eq_int( clock_gettime( CLOCK_THREAD_CPUTIME_ID, &ts ), 0 );
      SetTimecountCounter( counter );
      _Timestamp_To_timespec( &used, &expected );
      T_eq_i64( ts.tv_sec, expected.tv_sec );
      T_eq_long( ts.tv_nsec, expected.tv_nsec );
    links:
    - role: validation
      uid: ../req/reset-point-init
  - brief: |
      Check that the sum of the processor time which each thread used since its
      creation is less than or equal to the processor maximum times the uptime. Read
      the uptime after the sum.
    code: |
      Timestamp_Control sum;

      sum = 0;
      rtems_task_iterate( SumProcessorTimeUsed, &sum );
      T_rsc_success( rtems_clock_get_uptime( &uptime ) );
      T_le_u64(
        _Timestamp_Get_as_nanoseconds( &sum ),
        rtems_scheduler_get_processor_maximum() *
          _Timespec_Get_as_nanoseconds( &uptime )
      );
    links:
    - role: validation
      uid: ../req/processor-time-start
  links: []
test-brief: |
  Tests the CPU usage reset point which the system initialization establishes and
  the start of the processor time accounting.
test-context: []
test-context-support: null
test-description: |
  No test case of the test suite may call ${../if/reset:/name}.
test-header: null
test-includes:
- rtems.h
- rtems/score/threadimpl.h
- rtems/score/timespec.h
- time.h
test-local-includes:
- tx-support.h
test-setup: null
test-stop: null
test-support: |
  static bool SumProcessorTimeUsed( rtems_tcb *thread, void *arg )
  {
    Timestamp_Control *sum;

    sum = arg;
    *sum += _Thread_Get_CPU_time_used( thread );
    return false;
  }
test-target: testsuites/validation/tc-cpuuse-reset-point-init.c
test-teardown: null
type: test-case
