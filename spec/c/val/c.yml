test-support: |
  static void Clear( volatile uint8_t *b, const volatile uint8_t *e )
  {
    while ( b != e ) {
      *b = 0;
      ++b;
    }
  }

  static bool Compare(
    volatile uint8_t       *b,
    const volatile uint8_t *e,
    uint8_t                 expected
  )
  {
    bool result;

    result = true;

    while ( b != e ) {
      result = result && *b == expected;
      ++b;
    }

    return result;
  }
