test-actions:
- action-brief: |
    Call ${/c/string/if/memset:/name} for a sample set of buffers.
  action-code: |
    uint8_t  dst[ sizeof( long ) * 10 ];
    uint8_t *begin;
    uint8_t *end;
    uint8_t *aligned;
    size_t   offset;

    begin = dst;
    end = begin + sizeof( dst );
    aligned = (uint8_t *) RTEMS_ALIGN_UP( (uintptr_t) dst, sizeof( long ) );

    for ( offset = 0; offset < sizeof( long ); ++offset ) {
      size_t size;

      for ( size = 0; size < sizeof( long ) * 8; ++size ) {
        uint8_t *p;
        uint8_t *q;

        p = aligned + offset;
        q = p + size;

        Clear( begin, end );
        memset( p, 0x85, size );
        T_true( Compare( begin, p, 0 ) );
        T_true( Compare( p, q, 0x85 ) );
        T_true( Compare( q, end, 0 ) );
      }
    }
  checks: []
  links:
  - role: validation
    uid: /c/string/req/memset
- action-brief: |
    Check that ${/c/errno/if/errno:/name} has a signed integer type.
  action-code: |
    errno = -1;
    T_eq_int( errno, -1 );
    T_lt_int( errno, 0 );
  checks: []
  links:
  - role: validation
    uid: /c/errno/req/errno-signed-integer
- action-brief: |
    Check that ${/c/errno/if/errno:/name} has thread storage duration.
  action-code: |
    T_true( IsTLSObjectOfThread( RTEMS_SELF, &errno ) );
  checks: []
  links:
  - role: validation
    uid: /c/errno/req/errno-thread-local
