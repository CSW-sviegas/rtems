term: scheduling policy
text: |
  A set of rules that determines the order in which processes or threads are
  selected for execution. See
  [POSIX.1-2024, Base Definitions, Section 3.337 Scheduling Policy](https://pubs.opengroup.org/onlinepubs/9799919799/basedefs/V1_chap03.html#tag_04_337).
  It can be ${../if/fifo:/name}, ${../if/rr:/name}, ${../if/sporadic:/name}, or
  ${../if/other:/name}.
type: glossary
