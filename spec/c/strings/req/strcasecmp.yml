    A null byte is no letter.
test-action: |
  memcpy( ctx->s1_before, ctx->s1_buf, sizeof( ctx->s1_buf ) );
  memcpy( ctx->s2_before, ctx->s2_buf, sizeof( ctx->s2_buf ) );
  errno = -1;
  ctx->retval = strcasecmp( ctx->s1, ctx->s2 );
  ctx->errno_value = errno;
