enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/strcasecmp
- role: reference
  uid: /ref/std/posix-2024/strcasecmp
post-conditions:
- name: Result
  states:
  - name: Less
    test-code: |
      T_lt_int( ctx->retval, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/strcasecmp:/name} shall be less
      than zero.
  - name: Equal
    test-code: |
      T_eq_int( ctx->retval, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/strcasecmp:/name} shall be equal
      to zero.
  - name: Greater
    test-code: |
      T_gt_int( ctx->retval, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/strcasecmp:/name} shall be
      greater than zero.
  test-epilogue: null
  test-prologue: null
- name: S1
  states:
  - name: Nop
    test-code: |
      T_eq_mem( ctx->s1_buf, ctx->s1_before, sizeof( ctx->s1_buf ) );
    text: |
      The bytes of the string referenced by the ${../if/strcasecmp:/params[0]/name}
      parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: S2
  states:
  - name: Nop
    test-code: |
      T_eq_mem( ctx->s2_buf, ctx->s2_before, sizeof( ctx->s2_buf ) );
    text: |
      The bytes of the string referenced by the ${../if/strcasecmp:/params[1]/name}
      parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: Errno
  states:
  - name: Nop
    test-code: |
      T_eq_int( ctx->errno_value, -1 );
    text: |
      The value of ${/c/errno/if/errno:/name} shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Stop
  states:
  - name: BothEnd
    test-code: |
      ctx->pairs = both_end_pairs;
    text: |
      While both strings hold a null byte at the ${../glossary/stop-index:/term}.
  - name: S1Ends
    test-code: |
      ctx->pairs = s1_ends_pairs;
    text: |
      While the string referenced by the ${../if/strcasecmp:/params[0]/name}
      parameter holds a null byte at the ${../glossary/stop-index:/term}, while the
      string referenced by the ${../if/strcasecmp:/params[1]/name} parameter holds no
      null byte at the ${../glossary/stop-index:/term}.
  - name: S2Ends
    test-code: |
      ctx->pairs = s2_ends_pairs;
    text: |
      While the string referenced by the ${../if/strcasecmp:/params[0]/name}
      parameter holds no null byte at the ${../glossary/stop-index:/term}, while the
      string referenced by the ${../if/strcasecmp:/params[1]/name} parameter holds a
      null byte at the ${../glossary/stop-index:/term}.
  - name: Less
    test-code: |
      ctx->pairs = less_pairs;
    text: |
      While no string holds a null byte at the ${../glossary/stop-index:/term}, while
      the byte of the string referenced by the ${../if/strcasecmp:/params[0]/name}
      parameter at the ${../glossary/stop-index:/term} is less than the byte of the
      string referenced by the ${../if/strcasecmp:/params[1]/name} parameter at the
      ${../glossary/stop-index:/term}, after the conversion of each
      ${/c/ctype/glossary/uppercase:/term} to the corresponding
      ${/c/ctype/glossary/lowercase:/term}, where both bytes are interpreted as type
      `unsigned char`.
  - name: Greater
    test-code: |
      ctx->pairs = greater_pairs;
    text: |
      While no string holds a null byte at the ${../glossary/stop-index:/term}, while
      the byte of the string referenced by the ${../if/strcasecmp:/params[0]/name}
      parameter at the ${../glossary/stop-index:/term} is greater than the byte of
      the string referenced by the ${../if/strcasecmp:/params[1]/name} parameter at
      the ${../glossary/stop-index:/term}, after the conversion of each
      ${/c/ctype/glossary/uppercase:/term} to the corresponding
      ${/c/ctype/glossary/lowercase:/term}, where both bytes are interpreted as type
      `unsigned char`.
  test-epilogue: null
  test-prologue: null
- name: Letters
  states:
  - name: None
    test-code: |
      SetPair( ctx, ctx->pairs[ 0 ] );
    text: |
      While no byte of the strings at the ${../glossary/stop-index:/term} is an
      ${/c/ctype/glossary/uppercase:/term} or a ${/c/ctype/glossary/lowercase:/term}.
  - name: One
    test-code: |
      SetPair( ctx, ctx->pairs[ 1 ] );
    text: |
      While exactly one byte of the strings at the ${../glossary/stop-index:/term} is
      an ${/c/ctype/glossary/uppercase:/term} or a
      ${/c/ctype/glossary/lowercase:/term}.
  - name: Both
    test-code: |
      SetPair( ctx, ctx->pairs[ 2 ] );
    text: |
      While each byte of the strings at the ${../glossary/stop-index:/term} is an
      ${/c/ctype/glossary/uppercase:/term} or a ${/c/ctype/glossary/lowercase:/term}.
  test-epilogue: null
  test-prologue: null
- name: CaseDiffers
  states:
  - name: 'Yes'
    test-code: |
      ctx->s1_buf[ 0 ] = 'X';
      ctx->s2_buf[ 1 ] = 'X';
    text: |
      While the strings hold different bytes at an index less than the
      ${../glossary/stop-index:/term}.
  - name: 'No'
    test-code: |
      /* The prepared strings hold equal bytes. */
    text: |
      While the strings hold equal bytes at each index less than the
      ${../glossary/stop-index:/term}.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/strcasecmp:/name} defines no error for the function. It
  leaves the behaviour undefined where a parameter references no string, so the
  item states no ${/c/if/null:/name} pointer.

  ${/ref/std/posix-2024/strcasecmp:/name} specifies the comparison where the
  `LC_CTYPE` category of the locale is from the POSIX locale. The item states the
  behaviour for this locale.

  ${/ref/std/posix-2024/strcasecmp:/name} specifies a byte comparison after the
  conversion to lowercase. It states no sign rule for this comparison. The item
  takes the rule of ${/c/string/if/strcmp:/name}, which interprets both bytes as
  type `unsigned char`.

  The ${../glossary/stop-index:/term} decides the result. Its position does not,
  so the test places it at index 3.

  Dimension Stop covers the pair of bytes at the ${../glossary/stop-index:/term},
  5 states. A null byte ends each string, so the end of each string takes a state
  of its own.

  Dimension Letters covers the number of letters in the pair of bytes at the
  ${../glossary/stop-index:/term}, 3 states.
  ${/ref/std/posix-2024/strcasecmp:/name} converts the letters to lowercase, so
  the number of letters in the pair decides whether the conversion acts on the
  pair. A byte between the ${/c/ctype/glossary/uppercase:/term} `Z` and the
  ${/c/ctype/glossary/lowercase:/term} `a` separates the conversion to lowercase
  from a conversion to uppercase. A pair of letters in different case can hold
  bytes whose order is the inverse of their order after the conversion. The bytes
  0x80 to 0xff are no letters, and their order depends on the interpretation as
  type `unsigned char`.

  Dimension CaseDiffers covers the bytes at the indices less than the
  ${../glossary/stop-index:/term}, 2 states. These bytes are equal after the
  conversion, so a different byte differs in case only.

  The Yes state places an ${/c/ctype/glossary/uppercase:/term} into the first
  string at index zero and into the second string at index one. The
  implementation converts the byte of each string on its own.

  The Stop and Letters arrangements write the bytes at the
  ${../glossary/stop-index:/term}. The CaseDiffers arrangement writes the bytes
  before it.

  ${/ref/std/posix-2024/strcasecmp:/name} states that the function does not
  change ${/c/errno/if/errno:/name} on valid input.
