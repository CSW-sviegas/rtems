term: stop index
text: |
  The stop index of two arrays is the first index at which the arrays hold bytes
  which differ after the conversion of each ${/c/ctype/glossary/uppercase:/term}
  to the corresponding ${/c/ctype/glossary/lowercase:/term}, or at which both
  arrays hold a null byte.
