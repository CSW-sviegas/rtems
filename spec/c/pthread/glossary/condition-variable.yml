term: condition variable
text: |
  A synchronization object which allows a thread to suspend execution,
  repeatedly, until some associated condition becomes true. See
  [POSIX.1-2024, Base Definitions, Section 3.79 Condition Variable](https://pubs.opengroup.org/onlinepubs/9799919799/basedefs/V1_chap03.html#tag_04_79).
