term: thread detach state attribute
text: |
  An attribute of a ${thread:/term} that specifies whether the thread is created
  in a detached state. See
  ${/ref/std/posix-2024/pthread-attr-getdetachstate:/name}. This attribute can be
  set to ${../if/create-detached:/name} or ${../if/create-joinable:/name}.
