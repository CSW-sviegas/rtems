term: process-shared attribute
text: |
  An attribute that indicates whether an object can be operated upon by any
  thread that has access to the memory where the object is allocated, even if the
  object is allocated in memory that is shared by multiple processes. See
  ${/ref/std/posix-2024/pthread-condattr-getpshared:/name}. This attribute can be
  set to ${../if/process-private:/name} or ${../if/process-shared:/name}.
