term: condition variable clock attribute
text: |
  An attribute of a ${condition-variable:/term} that specifies the clock used to
  measure timeouts. See
  [POSIX.1-2024, System Interfaces, pthread_condattr_getclock](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_condattr_getclock.html).
  This attribute can be set to ${../../time/if/clock-realtime:/name} or
  ${../../time/if/clock-monotonic:/name}.
type: glossary
