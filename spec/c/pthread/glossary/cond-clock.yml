term: condition variable clock attribute
text: |
  An attribute of a ${condition-variable:/term} that specifies the clock used to
  measure the timeout of a timed wait on the condition variable. See
  ${/ref/std/posix-2024/pthread-condattr-getclock:/name}. This attribute can be
  set to ${../../time/if/clock-realtime:/name} or
  ${../../time/if/clock-monotonic:/name}.
type: glossary
