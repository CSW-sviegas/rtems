SPDX-License-Identifier: CC-BY-SA-4.0 OR BSD-2-Clause
brief: |
  Get the attributes of the ${../glossary/thread:/term} specified by
  ${.:/params[0]/name} and store them in the ${../glossary/thread:/term}
  attributes object referenced by ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 Critical Software S.A.
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/pthread_t:/name} ${.:/params[0]/name}
    - ${/c/if/pthread_attr_t:/name} *${.:/params[1]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    The ${.:/params[1]/name} parameter is ${/c/if/null:/name}.
  role: errno
  uid: /c/errno/if/einval
- description: |
    The ${.:/params[0]/name} parameter is associated with no
    ${../glossary/thread:/term}.
  role: errno
  uid: /c/errno/if/esrch
- path: man3/pthread_getattr_np.3.html
  role: reference
  uid: /ref/man/linux
name: pthread_getattr_np
notes: |
  The standard does not contain this function. It is a GNU extension.

  The stack address and the stack size are those of the stack which the
  ${../glossary/thread:/term} uses. They can differ from the values of the
  attributes which created the ${../glossary/thread:/term}.
params:
- description: |
    is the ${../glossary/thread:/term} to get the attributes of.
  dir: null
  name: thread
- description: |
    is the pointer to the ${../glossary/thread:/term} attributes object where the
    attributes of the ${../glossary/thread:/term} specified by ${.:/params[0]/name}
    will be stored.
  dir: out
  name: attr
return:
  return: null
  return-values:
  - description: |
      The requested operation was successful.
    value: 0
  - description: |
      The ${.:/params[1]/name} parameter was ${/c/if/null:/name}.
    value: ${/c/errno/if/einval:/name}
  - description: |
      The ${.:/params[0]/name} parameter was associated with no
      ${../glossary/thread:/term}.
    value: ${/c/errno/if/esrch:/name}
type: interface
