brief: |
  Set the ${../glossary/thread-contention-scope:/term} of the
  ${../glossary/thread:/term} attributes object referenced by
  ${.:/params[0]/name} to the contention scope specified by
  ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
- Copyright (C) 2026 Critical Software S.A.
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/pthread_attr_t:/name} *${.:/params[0]/name}
    - int ${.:/params[1]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    This error number indicates the following error conditions:

    - The ${.:/params[0]/name} parameter is ${/c/if/null:/name}.
    - The ${../glossary/thread:/term} attributes object referenced by the
      ${.:/params[0]/name} parameter is not initialized.
    - The value specified by ${.:/params[1]/name} is not a valid
      ${../glossary/thread-contention-scope:/term}.
  role: errno
  uid: /c/errno/if/einval
- description: |
    The value specified by ${.:/params[1]/name} is ${../if/scope-system:/name},
    which is a valid but unsupported
    ${../glossary/thread-contention-scope:/term}.
  role: errno
  uid: /c/errno/if/enotsup
name: pthread_attr_setscope
notes: |
  See [POSIX.1-2024, System Interfaces, pthread_attr_setscope()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_attr_setscope.html).
params:
- description: |
    is the thread attributes object.
  dir: inout
  name: attr
- description: |
    is the ${../glossary/thread-contention-scope:/term}.
  dir: null
  name: contentionscope
return:
  return: |
    Returns zero on success.
  return-values:
  - description: |
      This error number indicates the following error conditions:

      - The ${.:/params[0]/name} parameter is ${/c/if/null:/name}.
      - The ${../glossary/thread:/term} attributes object referenced by the
        ${.:/params[0]/name} parameter is not initialized.
      - The value specified by ${.:/params[1]/name} is not a valid
        ${../glossary/thread-contention-scope:/term}.
    value: ${/c/errno/if/einval:/name}
  - description: |
      The value specified by ${.:/params[1]/name} is
      ${../if/scope-system:/name}, which is a valid but unsupported
      ${../glossary/thread-contention-scope:/term}.
    value: ${/c/errno/if/enotsup:/name}
type: interface
