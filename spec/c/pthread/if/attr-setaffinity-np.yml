brief: |
  Set the processor affinity set of the ${../glossary/thread:/term} attributes
  object referenced by ${.:/params[0]/name} to the processor set referenced by
  ${.:/params[2]/name} with the size specified by ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 Critical Software S.A.
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/pthread_attr_t:/name} *${.:/params[0]/name}
    - ${/c/if/size_t:/name} ${.:/params[1]/name}
    - const ${/c/if/cpu_set_t:/name} *${.:/params[2]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    The ${.:/params[0]/name} parameter is ${/c/if/null:/name}.
  role: errno
  uid: /c/errno/if/einval
- description: |
    The ${../glossary/thread:/term} attributes object referenced by the
    ${.:/params[0]/name} parameter is not initialized.
  role: errno
  uid: /c/errno/if/einval
- description: |
    The ${.:/params[2]/name} parameter is ${/c/if/null:/name}.
  role: errno
  uid: /c/errno/if/einval
- description: |
    The ${.:/params[1]/name} parameter is not equal to the size of an object of
    type ${/c/if/cpu_set_t:/name}.
  role: errno
  uid: /c/errno/if/einval
- path: man.cgi?query=pthread_attr_setaffinity_np&sektion=3
  role: reference
  uid: /ref/man/freebsd
name: pthread_attr_setaffinity_np
notes: |
  The standard does not contain this function. It is a non-portable extension
  which the FreeBSD manual page pthread_attr_setaffinity_np(3) describes.
params:
- description: |
    is the pointer to the ${../glossary/thread:/term} attributes object.
  dir: inout
  name: attr
- description: |
    is the size of the processor set referenced by ${.:/params[2]/name} in bytes.
  dir: null
  name: cpusetsize
- description: |
    is the pointer to the processor set.
  dir: in
  name: cpuset
return:
  return: null
  return-values:
  - description: |
      The requested operation was successful.
    value: 0
  - description: |
      The ${.:/params[0]/name} parameter was ${/c/if/null:/name}.
    value: ${/c/errno/if/einval:/name}
  - description: |
      The ${../glossary/thread:/term} attributes object referenced by the
      ${.:/params[0]/name} parameter was not initialized.
    value: ${/c/errno/if/einval:/name}
  - description: |
      The ${.:/params[2]/name} parameter was ${/c/if/null:/name}.
    value: ${/c/errno/if/einval:/name}
  - description: |
      The ${.:/params[1]/name} parameter was not equal to the size of an object of
      type ${/c/if/cpu_set_t:/name}.
    value: ${/c/errno/if/einval:/name}
type: interface
