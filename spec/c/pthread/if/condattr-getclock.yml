brief: |
  Get the ${../glossary/cond-clock:/term} of the
  ${../glossary/condition-variable:/term} attributes object referenced by
  ${.:/params[0]/name} and store it in the object referenced by
  ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 Critical Software S.A.
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - const ${/c/if/pthread_condattr_t:/name} *restrict ${.:/params[0]/name}
    - ${/c/if/clockid_t:/name} *restrict ${.:/params[1]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    The ${.:/params[0]/name} parameter is ${/c/if/null:/name}.
  role: errno
  uid: /c/errno/if/einval
- description: |
    The ${.:/params[1]/name} parameter is ${/c/if/null:/name}.
  role: errno
  uid: /c/errno/if/einval
- role: reference
  uid: /ref/std/posix-2024/pthread-condattr-getclock
name: pthread_condattr_getclock
notes: |
  See ${/ref/std/posix-2024/pthread-condattr-getclock:/name}.
params:
- description: |
    is the pointer to the ${../glossary/condition-variable:/term} attributes
    object.
  dir: in
  name: attr
- description: |
    is the pointer to the location where the ${../glossary/cond-clock:/term} will
    be stored.
  dir: out
  name: clock_id
return:
  return: null
  return-values:
  - description: |
      The requested operation was successful.
    value: 0
  - description: |
      The ${.:/params[0]/name} parameter was ${/c/if/null:/name}.
    value: ${/c/errno/if/einval:/name}
  - description: |
      The ${.:/params[1]/name} parameter was ${/c/if/null:/name}.
    value: ${/c/errno/if/einval:/name}
type: interface
