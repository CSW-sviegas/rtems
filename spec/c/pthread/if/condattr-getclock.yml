brief: |
  Get the ${../glossary/cond-clock:/term} of the
  ${../glossary/condition-variable:/term} attributes object referenced by
  ${.:/params[0]/name} and store it in the object referenced by
  ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
- Copyright (C) 2026 Critical Software S.A.
definition:
  default:
    attributes: null
    body: null
    params:
    - const ${/c/if/pthread_condattr_t:/name} *restrict ${.:/params[0]/name}
    - ${/c/if/clockid_t:/name} *restrict ${.:/params[1]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    This error number indicates the following error conditions:

    - The ${.:/params[0]/name} parameter is ${/c/if/null:/name}.
    - The ${.:/params[1]/name} parameter is ${/c/if/null:/name}.
  role: errno
  uid: /c/errno/if/einval
name: pthread_condattr_getclock
notes: |
  See [POSIX.1-2024, System Interfaces, pthread_condattr_getclock()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_condattr_getclock.html).
params:
- description: |
    is the condition variable attributes object.
  dir: in
  name: attr
- description: |
    is the pointer to a ${/c/if/clockid_t:/name} object. When the directive call is
    successful, the ${../glossary/cond-clock:/term} of the attributes object will
    be stored in this object.
  dir: out
  name: clock_id
return:
  return: null
  return-values:
  - description: |
      The requested operation was successful.
    value: 0
  - description: |
      This error number indicates the following error conditions:

      - The ${.:/params[0]/name} parameter is ${/c/if/null:/name}.
      - The ${.:/params[1]/name} parameter is ${/c/if/null:/name}.
    value: ${/c/errno/if/einval:/name}
type: interface
