brief: |
  Get the CPU-time clock of the ${../glossary/thread:/term} specified by
  ${.:/params[0]/name} and store it in the object referenced by
  ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 Critical Software S.A.
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/pthread_t:/name} ${.:/params[0]/name}
    - ${/c/if/clockid_t:/name} *${.:/params[1]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    The ${.:/params[1]/name} parameter is ${/c/if/null:/name}.
  role: errno
  uid: /c/errno/if/einval
- description: |
    No thread with the ID ${.:/params[0]/name} could be found.
  role: errno
  uid: /c/errno/if/esrch
- role: reference
  uid: /ref/std/posix-2024/pthread-getcpuclockid
- role: reference
  uid: /ref/std/posix-2024/thread-ids
name: pthread_getcpuclockid
notes: |
  See ${/ref/std/posix-2024/pthread-getcpuclockid:/name}.

  The clock identifier is valid during the lifetime of the thread identifier
  specified by ${.:/params[0]/name}, see ${/ref/std/posix-2024/thread-ids:/name}.
  The use of the clock identifier after this lifetime results in undefined
  behaviour. The implementation uses the thread identifier as the clock
  identifier. A thread identifier may be reused after its lifetime. A clock
  identifier of a deleted thread may therefore be rejected or refer to the
  CPU-time clock of another thread.
params:
- description: |
    is the thread identifier.
  dir: null
  name: thread
- description: |
    is the pointer to the ${/c/if/clockid_t:/name} object to store the clock
    identifier.
  dir: out
  name: clock_id
return:
  return: null
  return-values:
  - description: |
      The successful completion returns zero.
    value: 0
  - description: |
      The ${.:/params[1]/name} parameter was ${/c/if/null:/name}.
    value: ${/c/errno/if/einval:/name}
  - description: |
      No thread could be found corresponding to that specified by the given
      ${.:/params[0]/name} ID.
    value: ${/c/errno/if/esrch:/name}
type: interface
