brief: |
  Set the ${../glossary/thread-inherit-scheduler:/term} of the
  ${../glossary/thread:/term} attributes object referenced by
  ${.:/params[0]/name} to the indicator specified by ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 Critical Software S.A.
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/pthread_attr_t:/name} *${.:/params[0]/name}
    - int ${.:/params[1]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    The ${.:/params[0]/name} parameter is ${/c/if/null:/name}.
  role: errno
  uid: /c/errno/if/einval
- description: |
    The ${../glossary/thread:/term} attributes object referenced by the
    ${.:/params[0]/name} parameter is not initialized.
  role: errno
  uid: /c/errno/if/einval
- description: |
    The value specified by ${.:/params[1]/name} is not a valid
    ${../glossary/thread-inherit-scheduler:/term}.
  role: errno
  uid: /c/errno/if/enotsup
- role: reference
  uid: /ref/std/posix-2024/pthread-attr-getinheritsched
name: pthread_attr_setinheritsched
notes: |
  See ${/ref/std/posix-2024/pthread-attr-getinheritsched:/name}.
params:
- description: |
    is the pointer to the ${../glossary/thread:/term} attributes object.
  dir: inout
  name: attr
- description: |
    is the new ${../glossary/thread-inherit-scheduler:/term}.
  dir: null
  name: inheritsched
return:
  return: null
  return-values:
  - description: |
      The requested operation was successful.
    value: 0
  - description: |
      The ${.:/params[0]/name} parameter was ${/c/if/null:/name}.
    value: ${/c/errno/if/einval:/name}
  - description: |
      The ${../glossary/thread:/term} attributes object referenced by the
      ${.:/params[0]/name} parameter was not initialized.
    value: ${/c/errno/if/einval:/name}
  - description: |
      The value specified by ${.:/params[1]/name} was not a valid
      ${../glossary/thread-inherit-scheduler:/term}.
    value: ${/c/errno/if/enotsup:/name}
type: interface
