brief: |
  Get the ${../glossary/process-shared:/term} of the
  ${../glossary/condition-variable:/term} attributes object referenced by
  ${.:/params[0]/name} and store it in the object referenced by
  ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 Critical Software S.A.
definition:
  default:
    attributes: null
    body: null
    params:
    - const ${/c/if/pthread_condattr_t:/name} *restrict ${.:/params[0]/name}
    - int *restrict ${.:/params[1]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    The value specified by ${.:/params[0]/name} is invalid.
  role: errno
  uid: /c/errno/if/einval
name: pthread_condattr_getpshared
notes: |
  See
  [POSIX.1-2024, System Interfaces, pthread_condattr_getpshared()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_condattr_getpshared.html).
params:
- description: |
    is the condition variable attributes object to get the
    ${../glossary/process-shared:/term} from.
  dir: in
  name: attr
- description: |
    is the pointer to an object where the ${../glossary/process-shared:/term} will
    be stored.
  dir: out
  name: pshared
return:
  return: null
  return-values:
  - description: |
      The requested operation was successful.
    value: 0
  - description: |
      The value specified by ${.:/params[0]/name} is invalid.
    value: ${/c/errno/if/einval:/name}
type: interface
