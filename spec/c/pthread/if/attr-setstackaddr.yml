brief: |
  Set the ${../glossary/thread-stack-address:/term} of the
  ${../glossary/thread:/term} attributes object referenced by
  ${.:/params[0]/name} to the stack address specified by ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 Critical Software S.A.
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/pthread_attr_t:/name} *${.:/params[0]/name}
    - void *${.:/params[1]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    The ${.:/params[0]/name} parameter is ${/c/if/null:/name}.
  role: errno
  uid: /c/errno/if/einval
- description: |
    The ${../glossary/thread:/term} attributes object referenced by the
    ${.:/params[0]/name} parameter is not initialized.
  role: errno
  uid: /c/errno/if/einval
- path: man3/pthread_attr_setstackaddr.3.html
  role: reference
  uid: /ref/man/linux
name: pthread_attr_setstackaddr
notes: |
  POSIX.1-2001 marked this function obsolescent and POSIX.1-2008 removed it.
  ${attr-setstack:/name} sets the stack address of a ${../glossary/thread:/term}
  attributes object.
params:
- description: |
    is the pointer to the ${../glossary/thread:/term} attributes object.
  dir: inout
  name: attr
- description: |
    is the ${../glossary/thread-stack-address:/term}.
  dir: in
  name: stackaddr
return:
  return: null
  return-values:
  - description: |
      The requested operation was successful.
    value: 0
  - description: |
      The ${.:/params[0]/name} parameter was ${/c/if/null:/name}.
    value: ${/c/errno/if/einval:/name}
  - description: |
      The ${../glossary/thread:/term} attributes object referenced by the
      ${.:/params[0]/name} parameter was not initialized.
    value: ${/c/errno/if/einval:/name}
type: interface
