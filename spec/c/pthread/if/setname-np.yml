brief: |
  Set the name of the ${../glossary/thread:/term} specified by
  ${.:/params[0]/name} to the name specified by ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
- Copyright (C) 2026 Critical Software S.A.
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/pthread_t:/name} ${.:/params[0]/name}
    - const char *${.:/params[1]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    The length of the string specified by ${.:/params[1]/name} exceeds the allowed
    limit.
  role: errno
  uid: /c/errno/if/erange
- description: |
    The ${.:/params[0]/name} parameter is not associated with a thread.
  role: errno
  uid: /c/errno/if/esrch
name: pthread_setname_np
notes: |
  See [FreeBSD Manual Pages, pthread_setname_np()](https://man.freebsd.org/cgi/man.cgi?query=pthread_setname_np&sektion=3).
params:
- description: |
    is the thread to set the name of.
  dir: null
  name: thread
- description: |
    is the new name for the thread.
  dir: in
  name: name
return:
  return: null
  return-values:
  - description: |
      The requested operation was successful.
    value: 0
  - description: |
      The length of the string pointed to by ${.:/params[1]/name} exceeds the maximum
      allowed length.
    value: ${/c/errno/if/erange:/name}
  - description: |
      The ${.:/params[0]/name} parameter is not associated with a thread.
    value: ${/c/errno/if/esrch:/name}
type: interface
