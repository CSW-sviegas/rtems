brief: |
  Initialize the ${../glossary/condition-variable:/term} object referenced by
  ${.:/params[0]/name} using the attributes object referenced by
  ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
- Copyright (C) 2026 Critical Software S.A.
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/pthread_cond_t:/name} *restrict ${.:/params[0]/name}
    - const ${/c/if/pthread_condattr_t:/name} *restrict ${.:/params[1]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    This error number indicates the following error conditions:

    - The ${.:/params[0]/name} parameter is ${/c/if/null:/name}.
    - The attributes object referenced by ${.:/params[1]/name} is not initialized.
    - The process-shared attribute of the attributes object referenced by
      ${.:/params[1]/name} is neither ${../if/process-private:/name} nor
      ${../if/process-shared:/name}.
  role: errno
  uid: /c/errno/if/einval
name: pthread_cond_init
notes: |
  See [POSIX.1-2024, System Interfaces, pthread_cond_init()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_cond_init.html).
params:
- description: |
    is the condition variable object to initialize.
  dir: out
  name: cond
- description: |
    is the condition variable attributes object. If ${.:/params[1]/name} is
    ${/c/if/null:/name}, the default attributes are used.
  dir: in
  name: attr
return:
  return: null
  return-values:
  - description: |
      The requested operation was successful.
    value: 0
  - description: |
      This error number indicates the following error conditions:

      - The ${.:/params[0]/name} parameter is ${/c/if/null:/name}.
      - The attributes object referenced by ${.:/params[1]/name} is not initialized.
      - The process-shared attribute of the attributes object referenced by
        ${.:/params[1]/name} is neither ${../if/process-private:/name} nor
        ${../if/process-shared:/name}.
    value: ${/c/errno/if/einval:/name}
type: interface
