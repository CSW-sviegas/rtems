brief: |
  Get the ${../glossary/thread-stack-size:/term} of the
  ${../glossary/thread:/term} attributes object referenced by
  ${.:/params[0]/name} and store it in the object referenced by
  ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
- Copyright (C) 2026 Critical Software S.A.
definition:
  default:
    attributes: null
    body: null
    params:
    - const ${/c/if/pthread_attr_t:/name} *restrict ${.:/params[0]/name}
    - ${/c/if/size_t:/name} *restrict ${.:/params[1]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    This error number indicates the following error conditions:

    - The ${.:/params[0]/name} parameter is ${/c/if/null:/name}.
    - The ${../glossary/thread:/term} attributes object referenced by the
      ${.:/params[0]/name} parameter is not initialized.
    - The ${.:/params[1]/name} parameter is ${/c/if/null:/name}.
  role: errno
  uid: /c/errno/if/einval
name: pthread_attr_getstacksize
notes: |
  See [POSIX.1-2024, System Interfaces, pthread_attr_getstacksize()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_attr_getstacksize.html).
params:
- description: |
    is the pointer to the thread attributes object.
  dir: in
  name: attr
- description: |
    is the pointer to the location where the stack size will be stored.
  dir: out
  name: stacksize
return:
  return: |
    Returns zero on success.
  return-values:
  - description: |
      This error number indicates the following error conditions:

      - The ${.:/params[0]/name} parameter is ${/c/if/null:/name}.
      - The ${../glossary/thread:/term} attributes object referenced by the
        ${.:/params[0]/name} parameter is not initialized.
      - The ${.:/params[1]/name} parameter is ${/c/if/null:/name}.
    value: ${/c/errno/if/einval:/name}
type: interface
