- Copyright (C) 2026 Critical Software S.A.
definition:
  default:
    attributes: null
    body: null
    params:
    - const ${/c/if/pthread_attr_t:/name} *restrict ${.:/params[0]/name}
    - void **restrict ${.:/params[1]/name}
    - ${/c/if/size_t:/name} *restrict ${.:/params[2]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    The ${.:/params[0]/name} parameter is ${/c/if/null:/name}.
  role: errno
  uid: /c/errno/if/einval
- description: |
    The ${../glossary/thread:/term} attributes object referenced by the
    ${.:/params[0]/name} parameter is not initialized.
  role: errno
  uid: /c/errno/if/einval
- description: |
    The ${.:/params[1]/name} parameter is ${/c/if/null:/name}.
  role: errno
  uid: /c/errno/if/einval
- description: |
    The ${.:/params[2]/name} parameter is ${/c/if/null:/name}.
  role: errno
  uid: /c/errno/if/einval
- role: reference
  uid: /ref/std/posix-2024/pthread-attr-getstack
name: pthread_attr_getstack
notes: |
  See ${/ref/std/posix-2024/pthread-attr-getstack:/name}.
params:
- description: |
    is the pointer to the ${../glossary/thread:/term} attributes object.
  dir: in
  name: attr
- description: |
    is the pointer to the location where the stack address will be stored.
  dir: out
  name: stackaddr
- description: |
    is the pointer to the location where the stack size will be stored.
  dir: out
  name: stacksize
return:
  return: null
  return-values:
  - description: |
      The requested operation was successful.
    value: 0
  - description: |
      The ${.:/params[0]/name} parameter was ${/c/if/null:/name}.
    value: ${/c/errno/if/einval:/name}
  - description: |
