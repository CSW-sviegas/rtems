brief: |
  Set the thread-specific data associated with the key specified by
  ${.:/params[0]/name} to the value specified by ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2020 embedded brains GmbH & Co. KG
- Copyright (C) 2026 Critical Software S.A.
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/pthread_key_t:/name} ${.:/params[0]/name}
    - const void *${.:/params[1]/name}
    return: int
  variants: []
description: |
  If ${.:/params[1]/name} is ${/c/if/null:/name}, the association of the calling
  thread with the key is removed.
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    The value specified by ${.:/params[0]/name} is not associated with a
    thread-specific data key.
  role: errno
  uid: /c/errno/if/einval
- description: |
    Insufficient memory exists to associate the ${.:/params[1]/name} with the
    ${.:/params[0]/name}.
  role: errno
  uid: /c/errno/if/enomem
name: pthread_setspecific
notes: |
  See
  [POSIX.1-2024, System Interfaces, pthread_setspecific()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_setspecific.html).
params:
- description: |
    is the thread-specific data key to associate the value with.
  dir: null
  name: key
- description: |
    is the thread-specific data value to associate with the key.
  dir: null
  name: value
return:
  return: null
  return-values:
  - description: |
      The requested operation was successful.
    value: 0
  - description: |
      The value specified by ${.:/params[0]/name} is not associated with a
      thread-specific data key.
    value: ${/c/errno/if/einval:/name}
  - description: |
      Insufficient memory exists to associate the ${.:/params[1]/name} with the
      ${.:/params[0]/name}.
    value: ${/c/errno/if/enomem:/name}
type: interface
