SPDX-License-Identifier: CC-BY-SA-4.0 OR BSD-2-Clause
brief: |
  Set the processor affinity of the ${../glossary/thread:/term} specified by
  ${.:/params[0]/name} to the processor set referenced by ${.:/params[2]/name}
  with the size specified by ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 Critical Software S.A.
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/pthread_t:/name} ${.:/params[0]/name}
    - ${/c/if/size_t:/name} ${.:/params[1]/name}
    - const ${/c/if/cpu_set_t:/name} *${.:/params[2]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    The ${.:/params[2]/name} parameter is ${/c/if/null:/name}.
  role: errno
  uid: /c/errno/if/efault
- description: |
    The ${.:/params[0]/name} parameter does not specify a
    ${../glossary/thread:/term}.
  role: errno
  uid: /c/errno/if/esrch
- description: |
    This error number indicates the following error conditions:

    - The ${.:/params[1]/name} parameter is not a multiple of `sizeof( long )`.
    - The processor set referenced by ${.:/params[2]/name} contains only processors
      which are not available to the system.
    - The processor set referenced by ${.:/params[2]/name}, restricted to the
      online processors, is not supported by the ${/glossary/scheduler-home:/term}
      of the ${../glossary/thread:/term}.
  role: errno
  uid: /c/errno/if/einval
name: pthread_setaffinity_np
notes: |
  See [FreeBSD Manual Pages, pthread_setaffinity_np()](https://man.freebsd.org/cgi/man.cgi?query=pthread_setaffinity_np&sektion=3).
params:
- description: |
    is the thread to set the processor affinity of.
  dir: null
  name: thread
- description: |
    is the size of the processor set referenced by ${.:/params[2]/name} in bytes.
  dir: null
  name: cpusetsize
- description: |
    is the pointer to a ${/c/if/cpu_set_t:/name} object. A set bit in the processor
    set means that the corresponding processor shall be in the processor affinity
    set of the thread, otherwise the bit shall be cleared.
  dir: in
  name: cpuset
return:
  return: null
  return-values:
  - description: |
      The requested operation was successful.
    value: 0
  - description: |
      The value of ${.:/params[2]/name} was ${/c/if/null:/name}.
    value: ${/c/errno/if/efault:/name}
  - description: |
      The value of ${.:/params[0]/name} did not specify a
      ${../glossary/thread:/term}.
    value: ${/c/errno/if/esrch:/name}
  - description: |
      This error number indicates the following error conditions:

      - The ${.:/params[1]/name} parameter is not a multiple of `sizeof( long )`.
      - The processor set referenced by ${.:/params[2]/name} contains only processors
        which are not available to the system.
      - The processor set referenced by ${.:/params[2]/name}, restricted to the
        online processors, is not supported by the ${/glossary/scheduler-home:/term}
        of the ${../glossary/thread:/term}.
    value: ${/c/errno/if/einval:/name}
type: interface
