  - name: Detached
    test-code: |
      ctx->detached = true;
    text: |
      While the ${../glossary/thread:/term} associated with the
      ${../if/getattr-np:/params[0]/name} parameter is a
      ${../glossary/detached-thread:/term}.
  test-epilogue: null
  test-prologue: null
- name: Timeslice
  states:
  - name: 'No'
    test-code: |
      ctx->modes = RTEMS_NO_TIMESLICE;
    text: |
      While the ${../glossary/thread:/term} associated with the
      ${../if/getattr-np:/params[0]/name} parameter is a started
      ${/glossary/task:/term} with the ${/rtems/mode/if/no-timeslice:/name} mode.
  - name: 'Yes'
    test-code: |
      ctx->modes = RTEMS_TIMESLICE;
    text: |
      While the ${../glossary/thread:/term} associated with the
      ${../if/getattr-np:/params[0]/name} parameter is a started
      ${/glossary/task:/term} with the ${/rtems/mode/if/timeslice:/name} mode.
  test-epilogue: null
  test-prologue: null
- name: Priority
