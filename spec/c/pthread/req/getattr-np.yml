    text: |
      While the ${/glossary/priority-current:/term} of the
      ${../glossary/thread:/term} associated with the
      ${../if/getattr-np:/params[0]/name} parameter is equal to its
      ${/glossary/priority-real:/term}.
  - name: Raised
    test-code: |
      ctx->raise_priority = true;
    text: |
      While the ${../glossary/thread:/term} associated with the
      ${../if/getattr-np:/params[0]/name} parameter owns a mutex with the
      ${/rtems/attr/if/priority-ceiling:/name} locking protocol and a ceiling
