  - name: Low
    test-code: |
      ctx->priority = PRIO_LOW;
    text: |
      While the ${/glossary/priority-real:/term} of the ${../glossary/thread:/term}
      associated with the ${../if/getattr-np:/params[0]/name} parameter is the low
