  test-prologue: null
rationale: |
  The standard does not contain ${../if/getattr-np:/name}. The Linux manual page
  pthread_getattr_np(3) describes it: the call initializes the
  ${../glossary/thread:/term} attributes object so that it contains the actual
  attribute values of the ${../glossary/thread:/term}. It names
  ${/c/errno/if/enomem:/name} as the only error. RTEMS stores the processor
  affinity set in the attributes object and allocates no memory, so it does not
  return this error. This processor affinity set has the size of
  ${/c/if/cpu_set_t:/name}, which can contain each processor of every
  architecture which RTEMS supports. Getting the processor affinity set therefore
  does not fail, and the function returns no error for it.

  The manual page does not define the behaviour where the
  ${../if/getattr-np:/params[1]/name} parameter is ${/c/if/null:/name} or where
  the ${../if/getattr-np:/params[0]/name} parameter is associated with no
  ${../glossary/thread:/term}. Dimensions Attr and Thread specify the behaviour
  of RTEMS: it returns ${/c/errno/if/einval:/name} and
  ${/c/errno/if/esrch:/name}. RTEMS clears the object before it looks up the
  ${../glossary/thread:/term}, which post-condition Object specifies.

  In RTEMS, the identifier of a ${/glossary/task:/term} is the identifier of a
  ${../glossary/thread:/term}. The test uses ${/rtems/task/if/construct:/name}
  for the ${../glossary/thread:/term}, so that the qualified build provides every
  function of the test. Dimensions DetachState, Timeslice, Priority, Stack and
  Affinity give each attribute which this function reads two values. The manual
  page states that a joinable ${../glossary/thread:/term} may have been detached
  after its creation, which ${../if/detach:/name} does in state Detached. A
  ${/glossary/task:/term} with the ${/rtems/mode/if/no-timeslice:/name} mode has
  the ${/c/sched/glossary/policy:/term} ${/c/sched/if/fifo:/name}, and a
  ${/glossary/task:/term} with the ${/rtems/mode/if/timeslice:/name} mode has the
  ${/c/sched/glossary/policy:/term} ${/c/sched/if/other:/name}. The system
  assigns the CPU budget of a ${/glossary/task:/term} when it starts the
  ${/glossary/task:/term}. A ${/glossary/task:/term} which is not started has the
  ${/c/sched/glossary/policy:/term} ${/c/sched/if/fifo:/name} in both modes, so
  pre-condition Timeslice names a started ${/glossary/task:/term}. The priority
  of the scheduling parameters is the maximum priority of the
  ${/glossary/scheduler-home:/term} minus the ${/glossary/priority-real:/term}.
  Dimension CurrentPriority shows that the function does not report the
  ${/glossary/priority-current:/term}. The ${/glossary/task:/term} starts with
  the high priority, so that it runs before the call, and gets the
  ${/glossary/priority-real:/term} of dimension Priority afterwards.

  The stack of the ${../glossary/thread:/term} begins at the begin of the task
  storage area. It does not contain the ${/glossary/tls:/term} area and the
  floating-point context of the ${../glossary/thread:/term}, which the system
  allocates at the end of the task storage area. The stack and the task storage
  area therefore begin at the same address and differ in size. The test checks
  the stack size through the address of a local variable of the
  ${../glossary/thread:/term}, which lies in the stack, and the address of a
  thread-local object, which lies above the stack in the task storage area. This
  check does not find a stack size which is a few bytes too small.

  Only ${../if/create:/name} gives a ${../glossary/thread:/term} the
  ${../glossary/thread-inherit-scheduler:/term} ${../if/inherit-sched:/name}.
  Only ${../if/create:/name} and the function which sets the scheduling
  parameters of a ${../glossary/thread:/term} give it a
  ${/c/sched/glossary/policy:/term} for which the ${../glossary/thread:/term}
  exhausts its time slice. This item does not cover these values, since the
  qualified build provides neither function. RTEMS provides no guard area and
  supports only the ${../glossary/thread-contention-scope:/term}
  ${../if/scope-process:/name}, so each of these attributes has one value. After
  the construction of a ${/glossary/task:/term}, its
  ${/glossary/taskprocessoraffinity:/term} contains each processor of the system.
  State One of pre-condition Affinity sets it to the processor with index zero
  before the start. In uniprocessor configurations, both states give the same
  set, so the item uses state One only in SMP configurations.

  The ${../glossary/thread:/term} attributes object of RTEMS contains further
  data which no function of RTEMS reads. The item does not specify it. The item
  does not specify the parameters of the sporadic server policy in the scheduling
  parameters, which RTEMS writes only where the configuration enables the POSIX
  API.
requirement-type: functional
skip-reasons:
  OnlyOneProcessor: |
    In uniprocessor configurations, the processor with index zero is the only
    processor of the system, so the processor affinity set of state One is the
    processor affinity set of state All.
test-action: |
  if ( ctx->thread_is_task ) {
    rtems_task_config config;

    memset( &config, 0, sizeof( config ) );
    config.name = rtems_build_name( 'A', 'T', 'T', 'R' );
    config.initial_priority = PRIO_HIGH;
    config.storage_area = ctx->storage;
    config.storage_size = ctx->storage_size;
    config.maximum_thread_local_storage_size = TEST_MAXIMUM_TLS_SIZE;
    config.initial_modes = ctx->modes;
    config.attributes = TASK_ATTRIBUTES;
    T_rsc_success( rtems_task_construct( &config, &ctx->task_id ) );

    if ( ctx->one_processor ) {
      cpu_set_t affinity;

      CPU_ZERO( &affinity );
      CPU_SET( 0, &affinity );
      T_rsc_success(
        rtems_task_set_affinity( ctx->task_id, sizeof( affinity ), &affinity )
      );
    }

    StartTask( ctx->task_id, Worker, ctx );
    (void) ReceiveAnyEvents();
    SetPriority( ctx->task_id, ctx->priority );
    ctx->thread = (pthread_t) ctx->task_id;

    if ( ctx->detached ) {
      T_eno_success( pthread_detach( ctx->thread ) );
    }
  } else {
    ctx->thread = INVALID_ID;
  }

  ctx->status = pthread_getattr_np( ctx->thread, ctx->attr );
test-brief: null
test-cleanup: |
  if ( ctx->task_id != 0 ) {
    SendEvents( ctx->task_id, RTEMS_EVENT_0 );
    (void) ReceiveAnyEvents();
    DeleteTask( ctx->task_id );
  }
