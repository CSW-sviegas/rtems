      cpu_set_t expected;
      uint32_t  cpu_max;
      uint32_t  cpu_index;

      CPU_ZERO( &expected );
      cpu_max = rtems_scheduler_get_processor_maximum();

      for ( cpu_index = 0; cpu_index < cpu_max; ++cpu_index ) {
        CPU_SET( (int) cpu_index, &expected );
      }

