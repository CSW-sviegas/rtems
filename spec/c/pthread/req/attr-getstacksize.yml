post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/attr-getstacksize:/name} shall be
      zero.
  - name: Inval
    test-code: |
      T_eq_int( ctx->status, EINVAL );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/attr-getstacksize:/name} shall be
      ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: StackSize
  states:
  - name: Zero
    test-code: |
      T_eq_sz( ctx->stacksize_obj, 0 );
    text: |
      The object referenced by the ${../if/attr-getstacksize:/params[1]/name}
      parameter shall be zero.
  - name: Positive
    test-code: |
      T_eq_sz( ctx->stacksize_obj, STACK_SIZE );
    text: |
      The object referenced by the ${../if/attr-getstacksize:/params[1]/name}
      parameter shall be the ${../glossary/thread-stack-size:/term} of the object
      referenced by the ${../if/attr-getstacksize:/params[0]/name} parameter.
  - name: Nop
    test-code: |
      T_eq_sz( ctx->stacksize_obj, SIZE_MAX );
    text: |
      The object referenced by the ${../if/attr-getstacksize:/params[1]/name}
      parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: Attr
  states:
  - name: Nop
    test-code: |
      T_eq_mem( &ctx->attr_obj, &ctx->attr_before, sizeof( ctx->attr_obj ) );
    text: |
      The object referenced by the ${../if/attr-getstacksize:/params[0]/name}
      parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Obj
    test-code: |
      ctx->attr = &ctx->attr_obj;
    text: |
      While the ${../if/attr-getstacksize:/params[0]/name} parameter references an
      object of type ${/c/if/pthread_attr_t:/name}.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/attr-getstacksize:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Initialized
  states:
  - name: 'Yes'
    test-code: |
      T_eno_success( pthread_attr_init( &ctx->attr_obj ) );
    text: |
      While the object referenced by the ${../if/attr-getstacksize:/params[0]/name}
      parameter is an initialized ${../glossary/thread:/term} attributes object.
  - name: 'No'
    test-code: |
      memset( &ctx->attr_obj, 0, sizeof( ctx->attr_obj ) );
    text: |
      While the object referenced by the ${../if/attr-getstacksize:/params[0]/name}
      parameter is not an initialized ${../glossary/thread:/term} attributes object.
  test-epilogue: null
  test-prologue: null
- name: StoredStackSize
  states:
  - name: Zero
    test-code: |
      ctx->attr_obj.stacksize = 0;
    text: |
      While the ${../glossary/thread-stack-size:/term} of the object referenced by
      the ${../if/attr-getstacksize:/params[0]/name} parameter is zero.
  - name: Positive
    test-code: |
      ctx->attr_obj.stacksize = STACK_SIZE;
    text: |
      While the ${../glossary/thread-stack-size:/term} of the object referenced by
      the ${../if/attr-getstacksize:/params[0]/name} parameter is greater than zero.
  test-epilogue: null
  test-prologue: null
- name: StackSize
  states:
  - name: Obj
    test-code: |
      ctx->stacksize_obj = SIZE_MAX;
      ctx->stacksize = &ctx->stacksize_obj;
    text: |
      While the ${../if/attr-getstacksize:/params[1]/name} parameter references an
      object.
  - name: 'Null'
    test-code: |
      ctx->stacksize = NULL;
    text: |
      While the ${../if/attr-getstacksize:/params[1]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/pthread-attr-getstacksize:/name} specifies that
  ${../if/attr-getstacksize:/name} stores the
  ${../glossary/thread-stack-size:/term} in the object referenced by the
  ${../if/attr-getstacksize:/params[1]/name} parameter. This gives post-condition
  StackSize. The states of pre-condition StoredStackSize are zero, the default of
  ${../if/attr-init:/name} in RTEMS, and a value greater than zero.

  The standard does not define the behaviour where the
  ${../if/attr-getstacksize:/params[1]/name} parameter is ${/c/if/null:/name}.
  The ${/c/if/null:/name} states specify the behaviour of RTEMS which returns
  ${/c/errno/if/einval:/name}.

  The standard leaves the behaviour undefined where the
  ${../if/attr-getstacksize:/params[0]/name} parameter references no initialized
  ${../glossary/thread:/term} attributes object. It recommends
  ${/c/errno/if/einval:/name} for that case. State Null of pre-condition Attr and
  state No of pre-condition Initialized specify the behaviour of RTEMS which
  follows that recommendation.

  ${../if/attr-getstacksize:/name} does not write the ${../glossary/thread:/term}
  attributes object, which post-condition Attr specifies.
requirement-type: functional
