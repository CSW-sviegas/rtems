test-support: |
  #define STACK_SIZE_VALUE ( (size_t) 65536 )
  #define STALE_STACK_SIZE ( (size_t) -1 )
test-target: testsuites/validation/tc-pthread-attr-getstacksize.c
test-teardown: null
text: ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Attr:
          - 'Null'
          - Invalid
      then: Einval
    - if:
        pre-conditions:
          Stacksize: 'Null'
      then: Einval
    - else: Ok
    StackSizeObj:
    - if:
        pre-conditions:
          Stacksize: 'Null'
      then: N/A
    - if:
        post-conditions:
          Status: Ok
      then: Set
    - else: Nop
  pre-conditions:
    Attr: all
    Stacksize: all
