enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/attr-destroy
post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_rsc_success( ctx->retval );
    text: |
      The return status of ${../if/attr-destroy:/name} shall be zero.
  - name: Einval
    test-code: |
      T_rsc( ctx->retval, EINVAL );
    text: |
      The return status of ${../if/attr-destroy:/name} shall be
      ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: AttrObj
  states:
  - name: NotInitialized
    test-code: |
      T_eq_int( ctx->attr_obj.is_initialized, 0 );
    text: |
      The value of the is_initialized member of the ${../glossary/thread:/term}
      attributes object referenced by the ${../if/attr-destroy:/params[0]/name}
      parameter shall be false after the return of the
      ${../if/attr-destroy:/name} call.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Valid
    test-code: |
      ctx->attr = &ctx->attr_obj;
      pthread_attr_init( &ctx->attr_obj );
    text: |
      While the ${../if/attr-destroy:/params[0]/name} parameter references an
      initialized ${../glossary/thread:/term} attributes object.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/attr-destroy:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  - name: Invalid
    test-code: |
      ctx->attr = &ctx->attr_obj;
      memset( &ctx->attr_obj, 0x0, sizeof( ctx->attr_obj ) );
    text: |
      While the ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-destroy:/params[0]/name} parameter is not initialized.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
requirement-type: functional
skip-reasons: {}
test-action: |
  ctx->retval = pthread_attr_destroy( ctx->attr );
test-brief: null
test-cleanup: null
test-context:
- brief: |
    This member specifies the ${../if/attr-destroy:/params[0]/name} parameter
    value.
  description: null
  member: pthread_attr_t *attr
- brief: |
    This member contains the return value.
  description: null
  member: int retval
- brief: |
    This member contains the ${../glossary/thread:/term} attributes object.
  description: null
  member: pthread_attr_t attr_obj
test-context-support: null
test-description: null
test-header: null
test-includes:
- errno.h
- pthread.h
- string.h
test-local-includes: []
test-prepare: null
test-setup: null
test-stop: null
test-support: null
test-target: testsuites/validation/tc-pthread-attr-destroy.c
test-teardown: null
text: |
  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Attr:
          - 'Null'
          - Invalid
      then: Einval
    - else: Ok
    AttrObj:
    - if:
        pre-conditions:
          Attr: 'Null'
      then: N/A
    - else: NotInitialized
  pre-conditions:
    Attr: all
type: requirement
