    value.
  description: null
  member: pthread_attr_t *attr
- brief: |
    This member contains the return value of the ${../if/attr-destroy:/name} call.
  description: null
  member: int status
- brief: |
    This member contains the ${../glossary/thread:/term} attributes object.
  description: null
