transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Attr: 'Null'
      then: Inval
    - if:
        pre-conditions:
          Initialized: 'No'
      then: Inval
    - else: Ok
    Initialized:
    - if:
        pre-conditions:
          Attr: 'Null'
      then: N/A
    - if:
        post-conditions:
          Status: Ok
      then: 'No'
    - else: Nop
    Other:
    - if:
        pre-conditions:
          Attr: 'Null'
      then: N/A
    - else: Nop
  pre-conditions:
    Attr: all
    Initialized:
      applicable:
        pre-conditions:
          Attr: Obj
