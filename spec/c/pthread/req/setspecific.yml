post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/setspecific:/name} shall be zero.
  - name: Inval
    test-code: |
      T_eq_int( ctx->status, EINVAL );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/setspecific:/name} shall be
      ${/c/errno/if/einval:/name}.
  - name: NoMem
    test-code: |
      T_eq_int( ctx->status, ENOMEM );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/setspecific:/name} shall be
      ${/c/errno/if/enomem:/name}.
  test-epilogue: null
  test-prologue: null
- name: Value
  states:
  - name: Obj
    test-code: |
      pair = _POSIX_Keys_Key_value_find( ctx->key_obj, GetExecuting() );
      T_assert_not_null( pair );
      T_eq_ptr( pair->value, &new_value );
    text: |
      The value which the calling ${../glossary/thread:/term} associated with the key
      specified by the ${../if/setspecific:/params[0]/name} parameter shall be the
      value specified by the ${../if/setspecific:/params[1]/name} parameter.
  - name: 'Null'
    test-code: |
      T_null( _POSIX_Keys_Key_value_find( ctx->key_obj, GetExecuting() ) );
    text: |
      The calling ${../glossary/thread:/term} shall have no value associated with the
      key specified by the ${../if/setspecific:/params[0]/name} parameter.
  - name: Nop
    test-code: |
      T_eq_ptr( GetValue( ctx->key_obj ), ctx->value_before );
    text: |
      The value which the calling ${../glossary/thread:/term} associated with the key
      specified by the ${../if/setspecific:/params[0]/name} parameter shall not be
      modified.
  test-epilogue: null
  test-prologue: |
    const POSIX_Keys_Key_value_pair *pair;
- name: Pairs
  states:
  - name: Allocated
    test-code: |
      T_eq_sz( CountFreePairs(), ctx->pairs_before - 1 );
    text: |
      One inactive key value pair shall be used, see
      ${/acfg/if/max-posix-key-value-pairs:/name}.
  - name: Released
    test-code: |
      T_eq_sz( CountFreePairs(), ctx->pairs_before + 1 );
    text: |
      One key value pair shall become inactive, see
      ${/acfg/if/max-posix-key-value-pairs:/name}.
  - name: Nop
    test-code: |
      T_eq_sz( CountFreePairs(), ctx->pairs_before );
    text: |
      The count of inactive key value pairs shall not be modified, see
      ${/acfg/if/max-posix-key-value-pairs:/name}.
  test-epilogue: null
  test-prologue: null
- name: OtherValues
  states:
  - name: Nop
    test-code: |
      T_eq_ptr( GetValue( ctx->other_keys[ 0 ] ), ctx->other_before[ 0 ] );
      T_eq_ptr( GetValue( ctx->other_keys[ 1 ] ), ctx->other_before[ 1 ] );
    text: |
      The values which the calling ${../glossary/thread:/term} associated with keys
      other than the key specified by the ${../if/setspecific:/params[0]/name}
      parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Key
  states:
  - name: Valid
    test-code: |
      ctx->key = ctx->key_obj;
    text: |
      While the ${../if/setspecific:/params[0]/name} parameter is a valid
      ${../glossary/thread-specific-data-key:/term}.
  - name: Invalid
    test-code: |
      ctx->key = KEY_INVALID;
    text: |
      While the ${../if/setspecific:/params[0]/name} parameter is not a valid
      ${../glossary/thread-specific-data-key:/term}.
  test-epilogue: null
  test-prologue: null
- name: Value
  states:
  - name: Obj
    test-code: |
      ctx->value = &new_value;
    text: |
      While the ${../if/setspecific:/params[1]/name} parameter is not
      ${/c/if/null:/name}.
  - name: 'Null'
    test-code: |
      ctx->value = NULL;
    text: |
      While the ${../if/setspecific:/params[1]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: OtherKey
  states:
  - name: 'Yes'
    test-code: |
      T_eq_int( pthread_setspecific( ctx->other_keys[ 0 ], &other_value ), 0 );
      T_eq_int( pthread_setspecific( ctx->other_keys[ 1 ], &other_value ), 0 );
    text: |
      While the calling ${../glossary/thread:/term} has values associated with keys
      other than the key specified by the ${../if/setspecific:/params[0]/name}
      parameter.
  - name: 'No'
    test-code: |
      T_null( _POSIX_Keys_Key_value_find( ctx->other_keys[ 0 ], GetExecuting() ) );
      T_null( _POSIX_Keys_Key_value_find( ctx->other_keys[ 1 ], GetExecuting() ) );
    text: |
      While the calling ${../glossary/thread:/term} has no value associated with a
      key other than the key specified by the ${../if/setspecific:/params[0]/name}
      parameter.
  test-epilogue: null
  test-prologue: null
- name: Associated
  states:
  - name: 'Yes'
    test-code: |
      T_eq_int( pthread_setspecific( ctx->key_obj, &old_value ), 0 );
    text: |
      While the calling ${../glossary/thread:/term} has a value associated with the
      key specified by the ${../if/setspecific:/params[0]/name} parameter.
  - name: 'No'
    test-code: |
      T_null( _POSIX_Keys_Key_value_find( ctx->key_obj, GetExecuting() ) );
    text: |
      While the calling ${../glossary/thread:/term} has no value associated with the
      key specified by the ${../if/setspecific:/params[0]/name} parameter.
  test-epilogue: null
  test-prologue: null
- name: Pairs
  states:
  - name: Available
    test-code: |
      T_gt_sz( CountFreePairs(), 0 );
    text: |
      While at least one key value pair is inactive, see
      ${/acfg/if/max-posix-key-value-pairs:/name}.
  - name: Exhausted
    test-code: |
      _Objects_Allocator_lock();

      while ( ctx->pairs_used < RTEMS_ARRAY_SIZE( ctx->pairs ) ) {
        POSIX_Keys_Key_value_pair *pair;

        pair = _POSIX_Keys_Key_value_allocate();

        if ( pair == NULL ) {
          break;
        }

        ctx->pairs[ ctx->pairs_used ] = pair;
        ++ctx->pairs_used;
      }

      _Objects_Allocator_unlock();

      T_lt_sz( ctx->pairs_used, RTEMS_ARRAY_SIZE( ctx->pairs ) );
      T_eq_sz( CountFreePairs(), 0 );
    text: |
      While no key value pair is inactive, see
      ${/acfg/if/max-posix-key-value-pairs:/name}.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/pthread-getspecific:/name} specifies that
  ${../if/setspecific:/name} associates the value with the
  ${../glossary/thread-specific-data-key:/term} for the calling thread. This
  gives pre-condition Value and post-condition Value. The standard requires
  ${/c/errno/if/enomem:/name} where insufficient memory exists to associate a
  value other than ${/c/if/null:/name} with the key. The behaviour is undefined
  where the ${../if/setspecific:/params[0]/name} parameter is not a valid key.
  The standard recommends ${/c/errno/if/einval:/name} in this case, which RTEMS
  returns. This gives pre-condition Key and the states Inval and NoMem of
  post-condition Status.

  RTEMS stores an association in a key value pair. It uses an inactive pair only
  where the calling thread has no value associated with the key and the value is
  not ${/c/if/null:/name}. Otherwise it changes the existing association, or
  removes it for the value ${/c/if/null:/name} and makes its pair inactive. This
  gives pre-conditions Associated and Pairs and post-condition Pairs. The item
  does not cover the unlimited allocation mode of
  ${/acfg/if/max-posix-key-value-pairs:/name}.

  RTEMS stores the associations of a thread in a tree ordered by the key. The
  standard requires that the call changes only the association of the specified
  key. This gives pre-condition OtherKey and post-condition OtherValues. The test
  associates values with one key less than and one key greater than the specified
  key, so that the tree lookup visits nodes on both sides.
requirement-type: functional
skip-reasons: {}
test-action: |
  ctx->value_before = GetValue( ctx->key_obj );
  ctx->other_before[ 0 ] = GetValue( ctx->other_keys[ 0 ] );
  ctx->other_before[ 1 ] = GetValue( ctx->other_keys[ 1 ] );
  ctx->pairs_before = CountFreePairs();
  ctx->status = pthread_setspecific( ctx->key, ctx->value );
test-brief: null
test-cleanup: |
  _Objects_Allocator_lock();

  while ( ctx->pairs_used > 0 ) {
    --ctx->pairs_used;
    _Freechain_Put( &_POSIX_Keys_Keypool, ctx->pairs[ ctx->pairs_used ] );
  }

  _Objects_Allocator_unlock();

  T_eq_int( pthread_key_delete( ctx->key_obj ), 0 );
  T_eq_int( pthread_key_delete( ctx->other_keys[ 0 ] ), 0 );
  T_eq_int( pthread_key_delete( ctx->other_keys[ 1 ] ), 0 );
