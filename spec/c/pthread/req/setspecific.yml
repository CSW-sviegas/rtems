post-conditions:
- name: Status
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->retval, 0 );
    text: |
      The return value of ${../if/setspecific:/name} shall be equal to zero.
  - name: EINVAL
    test-code: |
      T_eq_int( ctx->retval, EINVAL );
    text: |
      The return value of ${../if/setspecific:/name} shall be equal to
      ${/c/errno/if/einval:/name}.
  - name: ENOMEM
    test-code: |
      T_eq_int( ctx->retval, ENOMEM );
    text: |
      The return value of ${../if/setspecific:/name} shall be equal to
      ${/c/errno/if/enomem:/name}.
  test-epilogue: null
  test-prologue: null
- name: Value
  states:
  - name: Stored
    test-code: |
      T_eq_ptr( pthread_getspecific( ctx->key_value ), ctx->value );
    text: |
      The value associated with the thread-specific data key for the calling thread
      shall be equal to the ${../if/setspecific:/params[1]/name} parameter.
  - name: Cleared
    test-code: |
      T_null( pthread_getspecific( ctx->key_value ) );
    text: |
      The calling thread shall have no value associated with the thread-specific data
      key.
  - name: Nop
    test-code: |
      T_null( pthread_getspecific( ctx->key_value ) );
    text: |
      The value associated with the thread-specific data key for the calling thread
      shall not be changed.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Key
  states:
  - name: Valid
    test-code: |
      ctx->key = ctx->key_value;
    text: |
      While the ${../if/setspecific:/params[0]/name} parameter is associated with a
      thread-specific data key.
  - name: Invalid
    test-code: |
      ctx->key = KEY_INVALID;
    text: |
      While the ${../if/setspecific:/params[0]/name} parameter is not associated with
      a thread-specific data key.
  test-epilogue: null
  test-prologue: null
- name: Value
  states:
  - name: NonNull
    test-code: |
      ctx->value = ctx;
    text: |
      While the ${../if/setspecific:/params[1]/name} parameter is not equal to
      ${/c/if/null:/name}.
  - name: 'Null'
    test-code: |
      ctx->value = NULL;
    text: |
      While the ${../if/setspecific:/params[1]/name} parameter is equal to
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Current
  states:
  - name: Set
    test-code: |
      eno = pthread_setspecific( ctx->key_value, &ctx->current_value );
      T_eq_int( eno, 0 );
    text: |
      While the calling thread has a value associated with the thread-specific data
      key.
  - name: Unset
    test-code: |
      /* Nothing to do */
    text: |
      While the calling thread has no value associated with the thread-specific data
      key.
  test-epilogue: null
  test-prologue: |
    int eno;
- name: Memory
  states:
  - name: Available
    test-code: |
      /* Nothing to do */
    text: |
      While the system has at least one inactive key value pair object available, see
      ${/acfg/if/max-posix-key-value-pairs:/name}.
  - name: None
    test-code: |
      ctx->worker_id = CreateTask( "WORK", PRIO_HIGH );
      StartTask( ctx->worker_id, Worker, ctx );
      (void) ReceiveAnyEvents();

      /*
       * Ensure that the worker stopped due to a failed operation and not due
       * to the bound given by the size of the extra keys member.
       */
      T_ne_int( ctx->extra_status, 0 );
      T_lt_sz( ctx->extra_used, RTEMS_ARRAY_SIZE( ctx->extra_keys ) );
    text: |
      While the system has no inactive key value pair object available, see
      ${/acfg/if/max-posix-key-value-pairs:/name}.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
requirement-type: functional
skip-reasons: {}
test-action: |
  ctx->retval = pthread_setspecific( ctx->key, ctx->value );
test-brief: null
test-cleanup: |
  int    eno;
  size_t i;

  if ( ctx->key_value != KEY_INVALID ) {
    eno = pthread_key_delete( ctx->key_value );
    T_eq_int( eno, 0 );
  }

  for ( i = 0; i < ctx->extra_used; ++i ) {
    eno = pthread_key_delete( ctx->extra_keys[ i ] );
    T_eq_int( eno, 0 );
  }

  DeleteTask( ctx->worker_id );
