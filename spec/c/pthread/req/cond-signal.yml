        pre-conditions:
          State: Zeroed
      then: Initialized
    - else: Nop
    Binding:
    - if:
        pre-conditions:
          State: Zeroed
      then: None
    - else: Nop
  pre-conditions:
    Cond:
    - Obj
    State:
    - Zeroed
    - Other
