post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/cond-signal:/name} shall be zero.
  - name: Inval
    test-code: |
      T_eq_int( ctx->status, EINVAL );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/cond-signal:/name} shall be
      ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: Unblock
  states:
  - name: One
    test-code: |
      T_eq_u32( ctx->woken, 1 );
    text: |
      Exactly one of the ${../glossary/thread:/plural} blocked on the
      ${../glossary/condition-variable:/term} referenced by the
      ${../if/cond-signal:/params[0]/name} parameter shall be unblocked.
  - name: Nop
    test-code: |
      T_eq_u32( ctx->woken, 0 );
    text: |
      No ${../glossary/thread:/term} shall be unblocked.
  test-epilogue: null
  test-prologue: null
- name: State
  states:
  - name: Initialized
    test-code: |
      T_eq_ulong( ctx->cond_obj._flags, InitializedFlags( &ctx->cond_obj ) );
    text: |
      The object referenced by the ${../if/cond-signal:/params[0]/name} parameter
      shall be an initialized ${../glossary/condition-variable:/term} with the
      ${../glossary/cond-clock:/term} ${/c/time/if/clock-realtime:/name}.
  - name: Nop
    test-code: |
      T_eq_ulong( ctx->cond_obj._flags, ctx->cond_before._flags );
    text: |
      Whether the object referenced by the ${../if/cond-signal:/params[0]/name}
      parameter is an initialized ${../glossary/condition-variable:/term} and its
      ${../glossary/cond-clock:/term} shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: Binding
  states:
  - name: None
    test-code: |
      T_null( ctx->cond_obj._mutex );
    text: |
      The ${../glossary/condition-variable:/term} referenced by the
      ${../if/cond-signal:/params[0]/name} parameter shall be bound to no mutex.
  - name: Nop
    test-code: |
      T_eq_ptr( ctx->cond_obj._mutex, ctx->cond_before._mutex );
    text: |
      The binding of the ${../glossary/condition-variable:/term} referenced by the
      ${../if/cond-signal:/params[0]/name} parameter to a mutex shall not be
      modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Cond
  states:
  - name: Obj
    test-code: |
      ctx->cond = &ctx->cond_obj;
    text: |
      While the ${../if/cond-signal:/params[0]/name} parameter references an object
      of type ${/c/if/pthread_cond_t:/name}.
  - name: 'Null'
    test-code: |
      ctx->cond = NULL;
    text: |
      While the ${../if/cond-signal:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: State
  states:
  - name: Initialized
    test-code: |
      T_eno_success( pthread_cond_init( &ctx->cond_obj, NULL ) );
      ctx->cond_obj._mutex = &ctx->mutex_obj;
    text: |
      While the object referenced by the ${../if/cond-signal:/params[0]/name}
      parameter is an initialized ${../glossary/condition-variable:/term}.
  - name: Zeroed
    test-code: |
      memset( &ctx->cond_obj, 0, sizeof( ctx->cond_obj ) );
    text: |
      While the object referenced by the ${../if/cond-signal:/params[0]/name}
      parameter is filled with zero bytes.
  - name: Other
    test-code: |
      memset( &ctx->cond_obj, 0xff, sizeof( ctx->cond_obj ) );
    text: |
      While the object referenced by the ${../if/cond-signal:/params[0]/name}
      parameter is neither an initialized ${../glossary/condition-variable:/term} nor
      filled with zero bytes.
  test-epilogue: null
  test-prologue: null
- name: Waiters
  states:
  - name: None
    test-code: |
      StartWorkers( ctx, 0 );
    text: |
      While no ${../glossary/thread:/term} is blocked on the
      ${../glossary/condition-variable:/term} referenced by the
      ${../if/cond-signal:/params[0]/name} parameter.
  - name: One
    test-code: |
      StartWorkers( ctx, 1 );
    text: |
      While exactly one ${../glossary/thread:/term} is blocked on the
      ${../glossary/condition-variable:/term} referenced by the
      ${../if/cond-signal:/params[0]/name} parameter.
  - name: Two
    test-code: |
      StartWorkers( ctx, 2 );
    text: |
      While two ${../glossary/thread:/plural} are blocked on the
      ${../glossary/condition-variable:/term} referenced by the
      ${../if/cond-signal:/params[0]/name} parameter.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/pthread-cond-broadcast:/name} specifies that
  ${../if/cond-signal:/name} unblocks at least one of the
  ${../glossary/thread:/plural} blocked on the
  ${../glossary/condition-variable:/term} and has no effect if no thread is
  blocked. RTEMS unblocks exactly one thread, which post-condition Unblock
  specifies. Dimension Waiters covers no, one and two blocked threads. Two
  blocked threads show that the call unblocks no more than one.

  The standard states that the scheduling policy determines the order in which
  blocked threads are unblocked. RTEMS unblocks the thread which waits longest,
  whatever its priority. The order does not depend on the scheduling policy,
  which deviates from the standard. The item does not specify which thread the
  call unblocks. The blocked threads of the test have equal priorities.

  The standard leaves the behaviour undefined where the
  ${../if/cond-signal:/params[0]/name} parameter does not refer to an initialized
  ${../glossary/condition-variable:/term}. It recommends
  ${/c/errno/if/einval:/name} for that case. Dimension Cond covers the pointer,
  dimension State the object. RTEMS checks one member of the object, which
  ${../if/cond-init:/name} derives from the address of the object. A copy of an
  initialized object is therefore not initialized.
  ${/ref/std/posix-2024/synchronization-object-copies:/name} states that for a
  ${../if/process-private:/name} object, only the synchronization object at the
  address used to initialize it can be used for performing synchronization. RTEMS
  initializes an object filled with zero bytes with the default attributes, which
  post-condition State specifies. The static initializer of the standard gives
  such an object. For the ${/c/if/null:/name} pointer and for every other object,
  RTEMS returns ${/c/errno/if/einval:/name} and follows the recommendation. The
  states of dimension State specify the behaviour of RTEMS.

  ${/ref/std/posix-2024/pthread-cond-clockwait:/name} states that a wait binds
  the ${../glossary/condition-variable:/term} to the mutex of the wait as long as
  a thread is blocked on it. Once all waiting threads have been unblocked, the
  next wait shall form a new binding with its mutex. ${../if/cond-signal:/name}
  ends the binding only in a call which finds no thread blocked, which
  post-condition Binding specifies. ${../if/cond-init:/name} ends it as well.
  Where ${../if/cond-signal:/name} unblocks the last blocked thread, the binding
  remains, and a following wait with another mutex returns
  ${/c/errno/if/einval:/name}. This deviates from the standard. State Nop of
  post-condition Binding for one blocked thread specifies the behaviour of RTEMS.
  In state Initialized of pre-condition State, the test binds the condition
  variable to a mutex before the call, as a returned wait leaves it, so that the
  call changes the binding. An object filled with zero bytes is bound to no mutex
  before the call.

  The standard states that the function shall not return the error number of an
  interrupted function call. RTEMS returns only zero and
  ${/c/errno/if/einval:/name}.

  The item does not cover that an unblocked thread owns the mutex when its wait
  returns. The items of the wait functions specify it. Concurrent calls on other
  processors are not covered.
requirement-type: functional
skip-reasons:
  NoWaiters: |
    A ${../glossary/thread:/term} blocks on a
    ${../glossary/condition-variable:/term} only through a wait. A wait initializes
    an object filled with zero bytes and rejects an object which is not
    initialized, and ${../if/cond-destroy:/name} rejects a condition variable on
    which threads are blocked. Threads are therefore blocked only on an initialized
    condition variable.
test-action: |
  memcpy( &ctx->cond_before, &ctx->cond_obj, sizeof( ctx->cond_before ) );
  ctx->status = pthread_cond_signal( ctx->cond );
test-brief: null
test-cleanup: |
  size_t i;

  for ( i = 0; i < RTEMS_ARRAY_SIZE( ctx->worker_id ); ++i ) {
    if ( ctx->worker_id[ i ] != 0 ) {
      DeleteTask( ctx->worker_id[ i ] );
    }
  }

  (void) pthread_cond_destroy( &ctx->cond_obj );
