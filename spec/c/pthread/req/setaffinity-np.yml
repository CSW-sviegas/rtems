    cpu_set_t *cpuset
test-context-support: null
test-description: null
test-header: null
test-includes:
- errno.h
- pthread.h
- rtems/test-scheduler.h
test-local-includes: []
test-prepare: |
  CPU_FILL_S( sizeof( ctx->cpuset_obj ), &ctx->cpuset_obj[ 0 ] );
test-setup: null
test-stop: null
test-support: |
  #define INVALID_THREAD_ID ( (pthread_t) 0xffffffff )
test-target: testsuites/validation/tc-pthread-setaffinity-np.c
test-teardown: null
text: |
  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          CPUSet: 'Null'
      then: EFAULT
    - if:
        pre-conditions:
          Thread: NoObj
      then: ESRCH
    - if:
        pre-conditions:
          CPUSetSize: Askew
      then: EINVAL
    - if:
        pre-conditions:
          CPUSetOnline: Unsupported
      then: EINVAL
    - else: Zero
    SetAffinity:
    - if:
        post-conditions:
          Status: Zero
      then: Set
    - else: Nop
  pre-conditions:
    Thread: all
    CPUSetSize: all
    CPUSetOnline:
      applicable:
        pre-conditions:
          CPUSet: Valid
          Thread: Valid
    CPUSetHuge:
      applicable:
        pre-conditions:
          CPUSet: Valid
          CPUSetSize: Huge
          Thread: Valid
    CPUSet: all
type: requirement
