text: |
  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          CPUSet: 'Null'
      then: Fault
    - if:
        pre-conditions:
          Thread: NoObj
      then: Srch
    - if:
        pre-conditions:
          CPUSetSize: Askew
      then: Inval
    - if:
        pre-conditions:
          CPUSetOnline: Unsupported
      then: Inval
    - if:
        pre-conditions:
          CPUSetHuge: Only
      then: Inval
    - else: Ok
    SetAffinity:
    - if:
        post-conditions:
          Status: Ok
      then: Set
    - else: Nop
  pre-conditions:
    Thread: all
    CPUSetSize: all
    CPUSetOnline:
      applicable:
        pre-conditions:
          CPUSet: Obj
          Thread: Valid
    CPUSetHuge:
      applicable:
        pre-conditions:
          CPUSet: Obj
          CPUSetSize: Huge
          Thread: Valid
    CPUSet: all
- enabled-by: true
  post-conditions: OnlyBeyond
  pre-conditions:
    Thread:
    - Valid
    CPUSetSize:
    - Huge
    CPUSetOnline:
    - Supported
    CPUSetHuge:
    - Only
    CPUSet:
    - Obj
type: requirement
