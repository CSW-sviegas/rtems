    cpu_set_t cpuset_obj[ 2 ]
- brief: |
    This member contains the return value of the ${../if/setaffinity-np:/name}
    call.
  description: null
  member: |
    int status
- brief: |
    This member specifies the ${../if/setaffinity-np:/params[0]/name}
    parameter value.
  description: null
  member: |
    pthread_t thread
- brief: |
    This member specifies the ${../if/setaffinity-np:/params[1]/name}
    parameter value.
  description: null
  member: |
    size_t cpusetsize
- brief: |
    This member specifies the ${../if/setaffinity-np:/params[2]/name}
    parameter value.
  description: null
