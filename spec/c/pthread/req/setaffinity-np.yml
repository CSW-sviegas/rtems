test-includes:
- errno.h
- pthread.h
- rtems/test-scheduler.h
test-local-includes: []
test-prepare: |
  CPU_FILL_S( sizeof( ctx->cpuset_obj ), &ctx->cpuset_obj[ 0 ] );
test-setup: null
test-stop: null
test-support: |
  #define INVALID_THREAD_ID ( (pthread_t) 0xffffffff )
