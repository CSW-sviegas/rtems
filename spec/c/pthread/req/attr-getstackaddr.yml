text: |
  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Attr:
          - 'Null'
          - Invalid
      then: Einval
    - if:
        pre-conditions:
          Stackaddr: 'Null'
      then: Einval
    - else: Ok
    StackAddrObj:
    - if:
        pre-conditions:
          Stackaddr: 'Null'
      then: N/A
    - if:
        post-conditions:
          Status: Ok
      then: Set
    - else: Nop
  pre-conditions:
    Attr: all
    Stackaddr: all
