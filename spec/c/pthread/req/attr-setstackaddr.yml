enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/attr-setstackaddr
- role: requirement-refinement
  uid: ../../req/group-posix-api
- path: man3/pthread_attr_setstackaddr.3.html
  role: reference
  uid: /ref/man/linux
post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/attr-setstackaddr:/name} shall be
      zero.
  - name: Inval
    test-code: |
      T_eq_int( ctx->status, EINVAL );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/attr-setstackaddr:/name} shall be
      ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: StackAddr
  states:
  - name: 'Null'
    test-code: |
      T_null( ctx->attr_obj.stackaddr );
    text: |
      The ${../glossary/thread-stack-address:/term} of the
      ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-setstackaddr:/params[0]/name} parameter shall be
      ${/c/if/null:/name}.
  - name: Area
    test-code: |
      T_eq_ptr( ctx->attr_obj.stackaddr, stack_area );
    text: |
      The ${../glossary/thread-stack-address:/term} of the
      ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-setstackaddr:/params[0]/name} parameter shall be the value of the
      ${../if/attr-setstackaddr:/params[1]/name} parameter.
  - name: Nop
    test-code: |
      T_eq_ptr( ctx->attr_obj.stackaddr, ctx->attr_before.stackaddr );
    text: |
      The ${../glossary/thread-stack-address:/term} of the
      ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-setstackaddr:/params[0]/name} parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: Other
  states:
  - name: Nop
    test-code: |
      pthread_attr_t expected;

      memcpy( &expected, &ctx->attr_before, sizeof( expected ) );
      expected.stackaddr = ctx->attr_obj.stackaddr;
      T_eq_mem( &ctx->attr_obj, &expected, sizeof( expected ) );
    text: |
      The content of the ${../glossary/thread:/term} attributes object referenced by
      the ${../if/attr-setstackaddr:/params[0]/name} parameter, other than its
      ${../glossary/thread-stack-address:/term}, shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Obj
    test-code: |
      ctx->attr = &ctx->attr_obj;
    text: |
      While the ${../if/attr-setstackaddr:/params[0]/name} parameter references an
      object of type ${/c/if/pthread_attr_t:/name}.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/attr-setstackaddr:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Initialized
  states:
  - name: 'Yes'
    test-code: |
      T_eno_success( pthread_attr_init( &ctx->attr_obj ) );
      ctx->attr_obj.stackaddr = STACK_ADDR_POISON;
    text: |
      While the object referenced by the ${../if/attr-setstackaddr:/params[0]/name}
      parameter is an initialized ${../glossary/thread:/term} attributes object.
  - name: 'No'
    test-code: |
      memset( &ctx->attr_obj, 0, sizeof( ctx->attr_obj ) );
      ctx->attr_obj.stackaddr = STACK_ADDR_POISON;
    text: |
      While the object referenced by the ${../if/attr-setstackaddr:/params[0]/name}
      parameter is not an initialized ${../glossary/thread:/term} attributes object.
  test-epilogue: null
  test-prologue: null
- name: StackAddr
  states:
  - name: 'Null'
    test-code: |
      ctx->stackaddr = NULL;
    text: |
      While the ${../if/attr-setstackaddr:/params[1]/name} parameter is
      ${/c/if/null:/name}.
  - name: Area
    test-code: |
      ctx->stackaddr = stack_area;
    text: |
      While the ${../if/attr-setstackaddr:/params[1]/name} parameter is not
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
rationale: |
  The standard POSIX.1-2008 removed ${../if/attr-setstackaddr:/name}. The Linux
  manual page pthread_attr_setstackaddr(3) describes it:
  ${../if/attr-setstackaddr:/name} sets the
  ${../glossary/thread-stack-address:/term} of the ${../glossary/thread:/term}
  attributes object. The states of pre-condition StackAddr are
  ${/c/if/null:/name}, the default of ${../if/attr-init:/name} in RTEMS, and an
  address of a stack area.

  For the error conditions, RTEMS behaves like ${../if/attr-setstack:/name}:
  state Null of pre-condition Attr and state No of pre-condition Initialized
  specify that ${../if/attr-setstackaddr:/name} returns
  ${/c/errno/if/einval:/name}.

  ${../if/attr-setstackaddr:/name} writes no other attribute of the object, which
  post-condition Other specifies.
requirement-type: functional
skip-reasons: {}
