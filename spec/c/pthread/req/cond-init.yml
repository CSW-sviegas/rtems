test-support: |
  #define PSHARED_INVALID 0x7fffffff

  static unsigned long InitializedFlags( const pthread_cond_t *cond )
  {
    return ( (uintptr_t) cond ^ POSIX_CONDITION_VARIABLES_MAGIC ) &
           ~POSIX_CONDITION_VARIABLES_FLAGS_MASK;
  }
