transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Cond: 'Null'
      then: Inval
    - if:
        pre-conditions:
          Initialized: 'No'
      then: Inval
    - if:
        pre-conditions:
          Pshared: Invalid
      then: Inval
    - else: Ok
    State:
    - if:
        pre-conditions:
          Cond: 'Null'
      then: N/A
    - if:
        and:
        - post-conditions:
            Status: Ok
        - pre-conditions:
            Attr: 'Null'
      then: Realtime
    - if:
        post-conditions:
          Status: Ok
      then-specified-by: Clock
    - else: Nop
    Binding:
    - if:
        pre-conditions:
          Cond: 'Null'
      then: N/A
    - if:
        post-conditions:
          Status: Ok
      then: None
    - else: Nop
    Waiters:
    - if:
        pre-conditions:
          Cond: 'Null'
      then: N/A
    - if:
        post-conditions:
          Status: Ok
      then: None
    - else: Nop
  pre-conditions:
    Cond: all
    Attr: all
    Initialized:
      applicable:
        pre-conditions:
          Attr: Obj
    Clock:
      applicable:
        pre-conditions:
          Attr: Obj
    Pshared:
      applicable:
        pre-conditions:
          Attr: Obj
