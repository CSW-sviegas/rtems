test-local-includes: []
test-prepare: |
  memset( &ctx->cond_obj, 0xa5, sizeof( ctx->cond_obj ) );
  memcpy( &ctx->cond_ref, &ctx->cond_obj, sizeof( ctx->cond_ref ) );
