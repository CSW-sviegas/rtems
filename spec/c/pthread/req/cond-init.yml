enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/cond-init
- role: requirement-refinement
  uid: ../../req/group-posix-api
post-conditions:
- name: Status
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->retval, 0 );
    text: |
      The return value of ${../if/cond-init:/name} shall be equal to zero.
  - name: EINVAL
    test-code: |
      T_eq_int( ctx->retval, EINVAL );
    text: |
      The return value of ${../if/cond-init:/name} shall be equal to
      ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: Clock
  states:
  - name: Realtime
    test-code: |
      T_eq_int(
        _POSIX_Condition_variables_Get_clock( ctx->cond_obj._flags ),
        CLOCK_REALTIME
      );
    text: |
      The ${../glossary/cond-clock:/term} of the condition variable object referenced
      by ${../if/cond-init:/params[0]/name} shall be
      ${/c/time/if/clock-realtime:/name}.
  - name: Monotonic
    test-code: |
      T_eq_int(
        _POSIX_Condition_variables_Get_clock( ctx->cond_obj._flags ),
        CLOCK_MONOTONIC
      );
    text: |
      The ${../glossary/cond-clock:/term} of the condition variable object referenced
      by ${../if/cond-init:/params[0]/name} shall be
      ${/c/time/if/clock-monotonic:/name}.
  test-epilogue: null
  test-prologue: null
- name: CondObj
  states:
  - name: Initialized
    test-code: |
      T_eq_int( pthread_cond_destroy( &ctx->cond_obj ), 0 );
    text: |
      The condition variable object referenced by ${../if/cond-init:/params[0]/name}
      shall be initialized.
  - name: Nop
    test-code: |
      T_eq_int(
        memcmp( &ctx->cond_obj, &ctx->cond_ref, sizeof( ctx->cond_obj ) ),
        0
      );
    text: |
      The condition variable object referenced by ${../if/cond-init:/params[0]/name}
      shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Cond
  states:
  - name: Valid
    test-code: |
      ctx->cond = &ctx->cond_obj;
    text: |
      While the ${../if/cond-init:/params[0]/name} parameter references an object of
      type ${/c/if/pthread_cond_t:/name}.
  - name: 'Null'
    test-code: |
      ctx->cond = NULL;
    text: |
      While the ${../if/cond-init:/params[0]/name} parameter is ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Attr
  states:
  - name: Default
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/cond-init:/params[1]/name} parameter is ${/c/if/null:/name}.
  - name: Valid
    test-code: |
      T_eq_int( pthread_condattr_init( &ctx->attr_obj ), 0 );
      ctx->attr = &ctx->attr_obj;
    text: |
      While the condition variable attributes object referenced by
      ${../if/cond-init:/params[1]/name} is initialized.
  - name: Monotonic
    test-code: |
      T_eq_int( pthread_condattr_init( &ctx->attr_obj ), 0 );
      T_eq_int( pthread_condattr_setclock( &ctx->attr_obj, CLOCK_MONOTONIC ), 0 );
      ctx->attr = &ctx->attr_obj;
    text: |
      While the ${../glossary/cond-clock:/term} of the condition variable attributes
      object referenced by ${../if/cond-init:/params[1]/name} is
      ${/c/time/if/clock-monotonic:/name}.
  - name: Uninitialized
    test-code: |
      memset( &ctx->attr_obj, 0, sizeof( ctx->attr_obj ) );
      ctx->attr = &ctx->attr_obj;
    text: |
      While the condition variable attributes object referenced by
      ${../if/cond-init:/params[1]/name} is not initialized.
  - name: InvalidPshared
    test-code: |
      T_eq_int( pthread_condattr_init( &ctx->attr_obj ), 0 );
      ctx->attr_obj.process_shared = -1;
      ctx->attr = &ctx->attr_obj;
    text: |
      While the ${../glossary/process-shared:/term} of the condition variable
      attributes object referenced by ${../if/cond-init:/params[1]/name} is invalid.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
