text: |
  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Cond: 'Null'
      then: EINVAL
    - if:
        pre-conditions:
          Attr:
          - Uninitialized
          - InvalidPshared
      then: EINVAL
    - else: Zero
    Clock:
    - if:
        and:
        - post-conditions:
            Status: Zero
        - pre-conditions:
            Attr: Monotonic
      then: Monotonic
    - if:
        post-conditions:
          Status: Zero
      then: Realtime
    - else: N/A
    CondObj:
    - if:
        post-conditions:
          Status: Zero
      then: Initialized
    - if:
        pre-conditions:
          Cond: 'Null'
      then: N/A
    - else: Nop
  pre-conditions:
    Cond: all
    Attr: all
type: requirement
