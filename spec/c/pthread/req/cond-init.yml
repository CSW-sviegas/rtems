  uid: /ref/std/posix-2024/pthread-cond-destroy
post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/cond-init:/name} shall be zero.
  - name: Inval
    test-code: |
      T_eq_int( ctx->status, EINVAL );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/cond-init:/name} shall be
      ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: State
  states:
  - name: Realtime
    test-code: |
      T_eq_ulong( ctx->cond_obj._flags, InitializedFlags( &ctx->cond_obj ) );
    text: |
      The object referenced by the ${../if/cond-init:/params[0]/name} parameter shall
      be an initialized ${../glossary/condition-variable:/term} with the
      ${../glossary/cond-clock:/term} ${/c/time/if/clock-realtime:/name}.
  - name: Monotonic
    test-code: |
      T_eq_ulong(
        ctx->cond_obj._flags,
        InitializedFlags( &ctx->cond_obj ) |
          POSIX_CONDITION_VARIABLES_CLOCK_MONOTONIC
      );
    text: |
      The object referenced by the ${../if/cond-init:/params[0]/name} parameter shall
      be an initialized ${../glossary/condition-variable:/term} with the
      ${../glossary/cond-clock:/term} ${/c/time/if/clock-monotonic:/name}.
  - name: Nop
    test-code: |
      T_eq_ulong( ctx->cond_obj._flags, ctx->cond_before._flags );
    text: |
      Whether the object referenced by the ${../if/cond-init:/params[0]/name}
      parameter is an initialized ${../glossary/condition-variable:/term} and its
      ${../glossary/cond-clock:/term} shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: Binding
  states:
  - name: None
    test-code: |
      T_null( ctx->cond_obj._mutex );
    text: |
      The ${../glossary/condition-variable:/term} referenced by the
      ${../if/cond-init:/params[0]/name} parameter shall be bound to no mutex.
  - name: Nop
    test-code: |
      T_eq_ptr( ctx->cond_obj._mutex, ctx->cond_before._mutex );
    text: |
      The binding of the object referenced by the ${../if/cond-init:/params[0]/name}
      parameter to a mutex shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: Waiters
  states:
  - name: None
    test-code: |
      T_null( ctx->cond_obj._Queue._heads );
    text: |
      No ${../glossary/thread:/term} shall be blocked on the
      ${../glossary/condition-variable:/term} referenced by the
      ${../if/cond-init:/params[0]/name} parameter.
  - name: Nop
    test-code: |
      T_eq_ptr( ctx->cond_obj._Queue._heads, ctx->cond_before._Queue._heads );
    text: |
      The record of the ${../glossary/thread:/plural} blocked on the object
      referenced by the ${../if/cond-init:/params[0]/name} parameter shall not be
      modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Cond
  states:
  - name: Obj
    test-code: |
      ctx->cond = &ctx->cond_obj;
    text: |
      While the ${../if/cond-init:/params[0]/name} parameter references an object of
      type ${/c/if/pthread_cond_t:/name}.
  - name: 'Null'
    test-code: |
      ctx->cond = NULL;
    text: |
      While the ${../if/cond-init:/params[0]/name} parameter is ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Attr
  states:
  - name: Obj
    test-code: |
      ctx->attr = &ctx->attr_obj;
    text: |
      While the ${../if/cond-init:/params[1]/name} parameter references an object of
      type ${/c/if/pthread_condattr_t:/name}.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/cond-init:/params[1]/name} parameter is ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Initialized
  states:
  - name: 'Yes'
    test-code: |
      T_eno_success( pthread_condattr_init( &ctx->attr_obj ) );
    text: |
      While the object referenced by the ${../if/cond-init:/params[1]/name} parameter
      is an initialized ${../glossary/condition-variable:/term} attributes object.
  - name: 'No'
    test-code: |
      memset( &ctx->attr_obj, 0xff, sizeof( ctx->attr_obj ) );
      ctx->attr_obj.is_initialized = 0;
    text: |
      While the object referenced by the ${../if/cond-init:/params[1]/name} parameter
      is not an initialized ${../glossary/condition-variable:/term} attributes
      object.
  test-epilogue: null
  test-prologue: null
- name: Clock
  states:
  - name: Realtime
    test-code: |
      ctx->attr_obj.clock = CLOCK_REALTIME;
    text: |
      While the ${../glossary/cond-clock:/term} of the object referenced by the
      ${../if/cond-init:/params[1]/name} parameter is
      ${/c/time/if/clock-realtime:/name}.
  - name: Monotonic
    test-code: |
      ctx->attr_obj.clock = CLOCK_MONOTONIC;
    text: |
      While the ${../glossary/cond-clock:/term} of the object referenced by the
      ${../if/cond-init:/params[1]/name} parameter is
      ${/c/time/if/clock-monotonic:/name}.
  test-epilogue: null
  test-prologue: null
- name: Pshared
  states:
  - name: Private
    test-code: |
      ctx->attr_obj.process_shared = PTHREAD_PROCESS_PRIVATE;
    text: |
      While the ${../glossary/process-shared:/term} of the object referenced by the
      ${../if/cond-init:/params[1]/name} parameter is ${../if/process-private:/name}.
  - name: Shared
    test-code: |
      ctx->attr_obj.process_shared = PTHREAD_PROCESS_SHARED;
    text: |
      While the ${../glossary/process-shared:/term} of the object referenced by the
      ${../if/cond-init:/params[1]/name} parameter is ${../if/process-shared:/name}.
  - name: Invalid
    test-code: |
      ctx->attr_obj.process_shared = PSHARED_INVALID;
    text: |
      While the ${../glossary/process-shared:/term} of the object referenced by the
      ${../if/cond-init:/params[1]/name} parameter is neither
      ${../if/process-private:/name} nor ${../if/process-shared:/name}.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/pthread-cond-destroy:/name} specifies that
  ${../if/cond-init:/name} initializes the
  ${../glossary/condition-variable:/term} with the attributes referenced by the
  ${../if/cond-init:/params[1]/name} parameter, or with the default attributes
  where this parameter is ${/c/if/null:/name}, and that the condition variable
  becomes initialized. RTEMS records in the object whether it is initialized and
  its ${../glossary/cond-clock:/term}, which post-condition State specifies. The
  call binds the condition variable to no mutex and leaves no thread blocked on
  it, which post-conditions Binding and Waiters specify.

  ${../if/cond-init:/name} reads from the attributes object whether it is
  initialized, its ${../glossary/process-shared:/term} and its
  ${../glossary/cond-clock:/term}. This gives pre-conditions Initialized, Pshared
  and Clock. The states of pre-condition Clock are the two values which
  ${../if/condattr-init:/name} and ${../if/condattr-setclock:/name} store in
  RTEMS. The default ${../glossary/cond-clock:/term} is
  ${/c/time/if/clock-realtime:/name}. RTEMS has one process.
  ${../if/cond-init:/name} accepts ${../if/process-private:/name} and
  ${../if/process-shared:/name} and does not record the attribute in the
  condition variable.

  The standard leaves the behaviour undefined where the
  ${../if/cond-init:/params[1]/name} parameter references no initialized
  ${../glossary/condition-variable:/term} attributes object. It recommends
  ${/c/errno/if/einval:/name} for that case. RTEMS checks one member of the
  attributes object, which ${../if/condattr-init:/name} sets and
  ${../if/condattr-destroy:/name} clears, returns ${/c/errno/if/einval:/name} and
  follows the recommendation. An attributes object with a
  ${../glossary/process-shared:/term} other than the two values is not one which
  the functions of the standard produce. RTEMS returns
  ${/c/errno/if/einval:/name} for it, which state Invalid of pre-condition
  Pshared specifies. The standard does not define the behaviour where the
  ${../if/cond-init:/params[0]/name} parameter is ${/c/if/null:/name} and lists
  no error for it. State Null of pre-condition Cond specifies the behaviour of
  RTEMS which returns ${/c/errno/if/einval:/name}.

  The standard requires ${/c/errno/if/eagain:/name} where the system lacks the
  necessary resources other than memory, and ${/c/errno/if/enomem:/name} where
  not enough memory exists to initialize the condition variable. The object
  referenced by the ${../if/cond-init:/params[0]/name} parameter holds all data
  of the ${../glossary/condition-variable:/term}, and ${../if/cond-init:/name}
  allocates no resource. These conditions never exist, so RTEMS conforms without
  returning these errors.

  The standard leaves the behaviour undefined where the object referenced by the
  ${../if/cond-init:/params[0]/name} parameter is an initialized
  ${../glossary/condition-variable:/term}. It recommends
  ${/c/errno/if/ebusy:/name} where the implementation detects that the object is
  already initialized or in use by another thread. ${../if/cond-init:/name} does
  not read the object and initializes it in each case, also where threads are
  blocked on it, and does not follow the recommendation. The item therefore has
  no pre-condition for the object. The test fills it with bytes of the value 255
  before the call.

  Besides the record of the blocked threads, the thread queue of the
  ${../glossary/condition-variable:/term} contains a lock, an owner and a name.
  ${../if/cond-init:/name} initializes them as well, the lock only in SMP
  configurations. They are internal data of the thread queue, which the item does
  not specify.
