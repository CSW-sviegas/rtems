transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Attr: 'Null'
      then: Inval
    - if:
        pre-conditions:
          Initialized: 'No'
      then: Inval
    - if:
        pre-conditions:
          ContentionScope: Invalid
      then: Inval
    - if:
        pre-conditions:
          ContentionScope: System
      then: NotSup
    - else: Ok
    ContentionScope:
    - if:
        pre-conditions:
          Attr: 'Null'
      then: N/A
    - if:
        post-conditions:
          Status: Ok
      then-specified-by: ContentionScope
    - else: Nop
    Other:
    - if:
        pre-conditions:
          Attr: 'Null'
      then: N/A
    - else: Nop
  pre-conditions:
    Attr: all
    Initialized:
      applicable:
        pre-conditions:
          Attr: Obj
    ContentionScope: all
