enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/attr-setscope
- role: requirement-refinement
  uid: ../../req/group-posix-api
post-conditions:
- name: Status
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->retval, 0 );
    text: |
      The return value of ${../if/attr-setscope:/name} shall be equal to zero.
  - name: EINVAL
    test-code: |
      T_eq_int( ctx->retval, EINVAL );
    text: |
      The return value of ${../if/attr-setscope:/name} shall be equal to
      ${/c/errno/if/einval:/name}.
  - name: ENOTSUP
    test-code: |
      T_eq_int( ctx->retval, ENOTSUP );
    text: |
      The return value of ${../if/attr-setscope:/name} shall be equal to
      ${/c/errno/if/enotsup:/name}.
  test-epilogue: null
  test-prologue: null
- name: AttrObj
  states:
  - name: Set
    test-code: |
      int contentionscope;
      int eno;

      eno = pthread_attr_getscope( &ctx->attr_obj, &contentionscope );
      T_eno_success( eno );
      T_eq_int( contentionscope, ctx->contentionscope );
    text: |
      The value of the ${../glossary/thread-contention-scope:/term} of the
      ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-setscope:/params[0]/name} parameter shall be set to the contention
      scope specified by the ${../if/attr-setscope:/params[1]/name} parameter.
  - name: Nop
    test-code: |
      T_eq_int( ctx->attr_obj.contentionscope, -1 );
    text: |
      The ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-setscope:/params[0]/name} parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Valid
    test-code: |
      ctx->attr = &ctx->attr_obj;
      pthread_attr_init( &ctx->attr_obj );
      ctx->attr_obj.contentionscope = -1;
    text: |
      While the ${../if/attr-setscope:/params[0]/name} parameter references an
      initialized ${../glossary/thread:/term} attributes object.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/attr-setscope:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  - name: Invalid
    test-code: |
      ctx->attr = &ctx->attr_obj;
      memset( &ctx->attr_obj, 0x0, sizeof( ctx->attr_obj ) );
      ctx->attr_obj.contentionscope = -1;
    text: |
      While the ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-setscope:/params[0]/name} parameter is not initialized.
  test-epilogue: null
  test-prologue: null
- name: ContentionScope
  states:
  - name: Process
    test-code: |
      ctx->contentionscope = PTHREAD_SCOPE_PROCESS;
    text: |
      While the ${../if/attr-setscope:/params[1]/name} parameter is equal to
      ${../if/scope-process:/name}.
  - name: System
    test-code: |
      ctx->contentionscope = PTHREAD_SCOPE_SYSTEM;
    text: |
      While the ${../if/attr-setscope:/params[1]/name} parameter is equal to
      ${../if/scope-system:/name}.
  - name: Invalid
    test-code: |
      ctx->contentionscope = CONTENTIONSCOPE_INVALID;
    text: |
      While the ${../if/attr-setscope:/params[1]/name} parameter is not a valid
      ${../glossary/thread-contention-scope:/term}.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
requirement-type: functional
skip-reasons: {}
