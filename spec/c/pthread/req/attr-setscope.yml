text: |
  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Attr:
          - 'Null'
          - Invalid
      then: EINVAL
    - if:
        pre-conditions:
          ContentionScope: Invalid
      then: EINVAL
    - if:
        pre-conditions:
          ContentionScope: System
      then: ENOTSUP
    - else: Zero
    AttrObj:
    - if:
        pre-conditions:
          Attr: 'Null'
      then: N/A
    - if:
        post-conditions:
          Status: Zero
      then: Set
    - else: Nop
  pre-conditions:
    Attr: all
    ContentionScope: all
type: requirement
