enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/attr-setscope
- role: requirement-refinement
  uid: ../../req/group-posix-api
- role: reference
  uid: /ref/std/posix-2024/pthread-attr-getscope
post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/attr-setscope:/name} shall be
      zero.
  - name: Inval
    test-code: |
      T_eq_int( ctx->status, EINVAL );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/attr-setscope:/name} shall be
      ${/c/errno/if/einval:/name}.
  - name: NotSup
    test-code: |
      T_eq_int( ctx->status, ENOTSUP );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/attr-setscope:/name} shall be
      ${/c/errno/if/enotsup:/name}.
  test-epilogue: null
  test-prologue: null
- name: ContentionScope
  states:
  - name: Process
    test-code: |
      T_eq_int( ctx->attr_obj.contentionscope, PTHREAD_SCOPE_PROCESS );
    text: |
      The ${../glossary/thread-contention-scope:/term} of the
      ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-setscope:/params[0]/name} parameter shall be
      ${../if/scope-process:/name}.
  - name: Nop
    test-code: |
      T_eq_int( ctx->attr_obj.contentionscope, ctx->attr_before.contentionscope );
    text: |
      The ${../glossary/thread-contention-scope:/term} of the
      ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-setscope:/params[0]/name} parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: Other
  states:
  - name: Nop
    test-code: |
      pthread_attr_t expected;

      memcpy( &expected, &ctx->attr_before, sizeof( expected ) );
      expected.contentionscope = ctx->attr_obj.contentionscope;
      T_eq_mem( &ctx->attr_obj, &expected, sizeof( expected ) );
    text: |
      The content of the ${../glossary/thread:/term} attributes object referenced by
      the ${../if/attr-setscope:/params[0]/name} parameter, other than its
      ${../glossary/thread-contention-scope:/term}, shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Obj
    test-code: |
      ctx->attr = &ctx->attr_obj;
    text: |
      While the ${../if/attr-setscope:/params[0]/name} parameter references an object
      of type ${/c/if/pthread_attr_t:/name}.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/attr-setscope:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Initialized
  states:
  - name: 'Yes'
    test-code: |
      T_eno_success( pthread_attr_init( &ctx->attr_obj ) );
      ctx->attr_obj.contentionscope = CONTENTION_SCOPE_POISON;
    text: |
      While the object referenced by the ${../if/attr-setscope:/params[0]/name}
      parameter is an initialized ${../glossary/thread:/term} attributes object.
  - name: 'No'
    test-code: |
      memset( &ctx->attr_obj, 0, sizeof( ctx->attr_obj ) );
      ctx->attr_obj.contentionscope = CONTENTION_SCOPE_POISON;
    text: |
      While the object referenced by the ${../if/attr-setscope:/params[0]/name}
      parameter is not an initialized ${../glossary/thread:/term} attributes object.
  test-epilogue: null
  test-prologue: null
- name: ContentionScope
  states:
  - name: Process
    test-code: |
      ctx->contentionscope = PTHREAD_SCOPE_PROCESS;
    text: |
      While the ${../if/attr-setscope:/params[1]/name} parameter is equal to
      ${../if/scope-process:/name}.
  - name: System
    test-code: |
      ctx->contentionscope = PTHREAD_SCOPE_SYSTEM;
    text: |
      While the ${../if/attr-setscope:/params[1]/name} parameter is equal to
      ${../if/scope-system:/name}.
  - name: Invalid
    test-code: |
      ctx->contentionscope = CONTENTION_SCOPE_INVALID;
    text: |
      While the ${../if/attr-setscope:/params[1]/name} parameter is not a valid
      ${../glossary/thread-contention-scope:/term}.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/pthread-attr-getscope:/name} defines the values
  ${../if/scope-process:/name} and ${../if/scope-system:/name} for the
  ${../glossary/thread-contention-scope:/term}. It requires
  ${/c/errno/if/enotsup:/name} for a value which the implementation does not
  support and permits ${/c/errno/if/einval:/name} for an invalid value. RTEMS
  supports only ${../if/scope-process:/name}. This gives the states of
  pre-condition ContentionScope and the states NotSup and Inval of post-condition
  Status.

  The standard leaves the behaviour undefined where the
  ${../if/attr-setscope:/params[0]/name} parameter references no initialized
  ${../glossary/thread:/term} attributes object. It recommends
  ${/c/errno/if/einval:/name} for that case. State Null of pre-condition Attr and
  state No of pre-condition Initialized specify the behaviour of RTEMS which
  follows that recommendation.

  ${../if/attr-setscope:/name} writes no other attribute of the object, which
  post-condition Other specifies.
requirement-type: functional
skip-reasons: {}
test-action: |
  memcpy( &ctx->attr_before, &ctx->attr_obj, sizeof( ctx->attr_before ) );
  ctx->status = pthread_attr_setscope( ctx->attr, ctx->contentionscope );
test-brief: null
test-cleanup: null
