enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/attr-getscope
- role: requirement-refinement
  uid: ../../req/group-posix-api
post-conditions:
- name: Status
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->retval, 0 );
    text: |
      The return value of ${../if/attr-getscope:/name} shall be equal to zero.
  - name: EINVAL
    test-code: |
      T_eq_int( ctx->retval, EINVAL );
    text: |
      The return value of ${../if/attr-getscope:/name} shall be equal to
      ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: ScopeObj
  states:
  - name: Set
    test-code: |
      T_eq_int( ctx->contentionscope_value, CONTENTION_SCOPE_VALUE );
    text: |
      The value of the object referenced by the
      ${../if/attr-getscope:/params[1]/name} parameter shall be set to the
      ${../glossary/thread-contention-scope:/term} of the ${../glossary/thread:/term}
      attributes object referenced by the ${../if/attr-getscope:/params[0]/name}
      parameter.
  - name: Nop
    test-code: |
      T_eq_int( ctx->contentionscope_value, -1 );
    text: |
      The object referenced by the ${../if/attr-getscope:/params[1]/name} parameter
      shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Valid
    test-code: |
      ctx->attr = &ctx->attr_obj;
      pthread_attr_init( &ctx->attr_obj );
      pthread_attr_setscope( &ctx->attr_obj, CONTENTION_SCOPE_VALUE );
    text: |
      While the ${../if/attr-getscope:/params[0]/name} parameter references an
      initialized ${../glossary/thread:/term} attributes object.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/attr-getscope:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  - name: Invalid
    test-code: |
      ctx->attr = &ctx->attr_obj;
      memset( &ctx->attr_obj, 0x0, sizeof( ctx->attr_obj ) );
    text: |
      While the ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-getscope:/params[0]/name} parameter is not initialized.
  test-epilogue: null
  test-prologue: null
- name: ContentionScope
  states:
  - name: Valid
    test-code: |
      ctx->contentionscope_value = -1;
      ctx->contentionscope = &ctx->contentionscope_value;
    text: |
      While the ${../if/attr-getscope:/params[1]/name} parameter references an object
      of type `int`.
  - name: 'Null'
    test-code: |
      ctx->contentionscope = NULL;
    text: |
      While the ${../if/attr-getscope:/params[1]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
requirement-type: functional
skip-reasons: {}
test-action: |
  ctx->retval = pthread_attr_getscope( ctx->attr, ctx->contentionscope );
test-brief: null
test-cleanup: null
test-context:
- brief: |
    This member specifies the ${../if/attr-getscope:/params[0]/name}
    parameter value.
  description: null
  member: const pthread_attr_t *attr
- brief: |
    This member specifies the ${../if/attr-getscope:/params[1]/name}
    parameter value.
  description: null
  member: int *contentionscope
- brief: |
    This member contains the return value.
  description: null
  member: int retval
- brief: |
    This member contains the ${../glossary/thread:/term} attributes object.
  description: null
  member: pthread_attr_t attr_obj
- brief: |
    This member contains the contention scope output object.
  description: null
  member: int contentionscope_value
test-context-support: null
test-description: null
test-header: null
test-includes:
- errno.h
- pthread.h
- string.h
test-local-includes: []
test-prepare: null
test-setup: null
test-stop: null
test-support: |
  /*
   * PTHREAD_SCOPE_PROCESS is both the only contention scope accepted by
   * pthread_attr_setscope() and the default contention scope.  The Set
   * post-condition therefore cannot distinguish a copied value from the
   * default value of an initialized attributes object.
   */
  #define CONTENTION_SCOPE_VALUE PTHREAD_SCOPE_PROCESS
test-target: testsuites/validation/tc-pthread-attr-getscope.c
test-teardown: null
text: |
  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Attr:
          - 'Null'
          - Invalid
      then: EINVAL
    - if:
        pre-conditions:
          ContentionScope: 'Null'
      then: EINVAL
    - else: Zero
    ScopeObj:
    - if:
        pre-conditions:
          ContentionScope: 'Null'
      then: N/A
    - if:
        post-conditions:
          Status: Zero
      then: Set
    - else: Nop
  pre-conditions:
    Attr: all
    ContentionScope: all
type: requirement
