post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/attr-getscope:/name} shall be
      zero.
  - name: Inval
    test-code: |
      T_eq_int( ctx->status, EINVAL );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/attr-getscope:/name} shall be
      ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: ContentionScope
  states:
  - name: Process
    test-code: |
      T_eq_int( ctx->contentionscope_obj, PTHREAD_SCOPE_PROCESS );
    text: |
      The object referenced by the ${../if/attr-getscope:/params[1]/name} parameter
      shall be ${../if/scope-process:/name}.
  - name: System
    test-code: |
      T_eq_int( ctx->contentionscope_obj, PTHREAD_SCOPE_SYSTEM );
    text: |
      The object referenced by the ${../if/attr-getscope:/params[1]/name} parameter
      shall be ${../if/scope-system:/name}.
  - name: Nop
    test-code: |
      T_eq_int( ctx->contentionscope_obj, CONTENTION_SCOPE_POISON );
    text: |
      The object referenced by the ${../if/attr-getscope:/params[1]/name} parameter
      shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: Attr
  states:
  - name: Nop
    test-code: |
      T_eq_mem( &ctx->attr_obj, &ctx->attr_before, sizeof( ctx->attr_obj ) );
    text: |
      The object referenced by the ${../if/attr-getscope:/params[0]/name} parameter
      shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Obj
    test-code: |
      ctx->attr = &ctx->attr_obj;
    text: |
      While the ${../if/attr-getscope:/params[0]/name} parameter references an object
      of type ${/c/if/pthread_attr_t:/name}.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/attr-getscope:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Initialized
  states:
  - name: 'Yes'
    test-code: |
      T_eno_success( pthread_attr_init( &ctx->attr_obj ) );
    text: |
      While the object referenced by the ${../if/attr-getscope:/params[0]/name}
      parameter is an initialized ${../glossary/thread:/term} attributes object.
  - name: 'No'
    test-code: |
      memset( &ctx->attr_obj, 0, sizeof( ctx->attr_obj ) );
    text: |
      While the object referenced by the ${../if/attr-getscope:/params[0]/name}
      parameter is not an initialized ${../glossary/thread:/term} attributes object.
  test-epilogue: null
  test-prologue: null
- name: StoredContentionScope
  states:
  - name: Process
    test-code: |
      ctx->attr_obj.contentionscope = PTHREAD_SCOPE_PROCESS;
    text: |
      While the ${../glossary/thread-contention-scope:/term} of the object referenced
      by the ${../if/attr-getscope:/params[0]/name} parameter is
      ${../if/scope-process:/name}.
  - name: System
    test-code: |
      ctx->attr_obj.contentionscope = PTHREAD_SCOPE_SYSTEM;
    text: |
      While the ${../glossary/thread-contention-scope:/term} of the object referenced
      by the ${../if/attr-getscope:/params[0]/name} parameter is
      ${../if/scope-system:/name}.
  test-epilogue: null
  test-prologue: null
- name: ContentionScope
  states:
  - name: Obj
    test-code: |
      ctx->contentionscope_obj = CONTENTION_SCOPE_POISON;
      ctx->contentionscope = &ctx->contentionscope_obj;
    text: |
      While the ${../if/attr-getscope:/params[1]/name} parameter references an
      object.
  - name: 'Null'
    test-code: |
      ctx->contentionscope = NULL;
    text: |
      While the ${../if/attr-getscope:/params[1]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/pthread-attr-getscope:/name} specifies that
  ${../if/attr-getscope:/name} stores the
  ${../glossary/thread-contention-scope:/term} in the object referenced by the
  ${../if/attr-getscope:/params[1]/name} parameter. This gives post-condition
  ContentionScope. The states of pre-condition StoredContentionScope are the two
  values which the standard defines for this attribute.

  The standard does not define the behaviour where the
  ${../if/attr-getscope:/params[1]/name} parameter is ${/c/if/null:/name}. The
  ${/c/if/null:/name} states specify the behaviour of RTEMS which returns
  ${/c/errno/if/einval:/name}.

  The standard leaves the behaviour undefined where the
  ${../if/attr-getscope:/params[0]/name} parameter references no initialized
  ${../glossary/thread:/term} attributes object. It recommends
  ${/c/errno/if/einval:/name} for that case. State Null of pre-condition Attr and
  state No of pre-condition Initialized specify the behaviour of RTEMS which
  follows that recommendation.

  ${../if/attr-getscope:/name} does not write the ${../glossary/thread:/term}
  attributes object, which post-condition Attr specifies.
requirement-type: functional
skip-reasons: {}
