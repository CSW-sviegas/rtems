links:
- role: interface-function
  uid: ../if/attr-setaffinity-np
- role: requirement-refinement
  uid: ../../req/group-posix-api
- path: man.cgi?query=pthread_attr_setaffinity_np&sektion=3
  role: reference
  uid: /ref/man/freebsd
post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/attr-setaffinity-np:/name} shall
      be zero.
  - name: Inval
    test-code: |
      T_eq_int( ctx->status, EINVAL );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/attr-setaffinity-np:/name} shall
      be ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: Affinity
  states:
  - name: CPUSet
    test-code: |
      T_eq_mem(
        &ctx->attr_obj.affinitysetpreallocated,
        &ctx->cpuset_obj,
        sizeof( ctx->cpuset_obj )
      );
    text: |
      The processor affinity set of the ${../glossary/thread:/term} attributes object
      referenced by the ${../if/attr-setaffinity-np:/params[0]/name} parameter shall
      be equal to the processor set referenced by the
      ${../if/attr-setaffinity-np:/params[2]/name} parameter.
  - name: Nop
    test-code: |
      T_eq_mem(
        &ctx->attr_obj.affinitysetpreallocated,
        &ctx->attr_before.affinitysetpreallocated,
        sizeof( ctx->attr_obj.affinitysetpreallocated )
      );
    text: |
      The processor affinity set of the ${../glossary/thread:/term} attributes object
      referenced by the ${../if/attr-setaffinity-np:/params[0]/name} parameter shall
      not be modified.
  test-epilogue: null
  test-prologue: null
- name: Other
  states:
  - name: Nop
    test-code: |
      pthread_attr_t expected;

      memcpy( &expected, &ctx->attr_before, sizeof( expected ) );
      memcpy(
        &expected.affinitysetpreallocated,
        &ctx->attr_obj.affinitysetpreallocated,
        sizeof( expected.affinitysetpreallocated )
      );
      T_eq_mem( &ctx->attr_obj, &expected, sizeof( expected ) );
    text: |
      The content of the ${../glossary/thread:/term} attributes object referenced by
      the ${../if/attr-setaffinity-np:/params[0]/name} parameter, other than its
      processor affinity set, shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Obj
    test-code: |
      ctx->attr = &ctx->attr_obj;
    text: |
      While the ${../if/attr-setaffinity-np:/params[0]/name} parameter references an
      object of type ${/c/if/pthread_attr_t:/name}.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/attr-setaffinity-np:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Initialized
  states:
  - name: 'Yes'
    test-code: |
      T_eno_success( pthread_attr_init( &ctx->attr_obj ) );
      CPU_ZERO( &ctx->attr_obj.affinitysetpreallocated );
    text: |
      While the object referenced by the ${../if/attr-setaffinity-np:/params[0]/name}
      parameter is an initialized ${../glossary/thread:/term} attributes object.
  - name: 'No'
    test-code: |
      T_eno_success( pthread_attr_init( &ctx->attr_obj ) );
      ctx->attr_obj.is_initialized = false;
      CPU_ZERO( &ctx->attr_obj.affinitysetpreallocated );
    text: |
      While the object referenced by the ${../if/attr-setaffinity-np:/params[0]/name}
      parameter is not an initialized ${../glossary/thread:/term} attributes object.
  test-epilogue: null
  test-prologue: null
- name: CPUSetSize
  states:
  - name: Valid
    test-code: |
      ctx->cpusetsize = sizeof( cpu_set_t );
    text: |
      While the ${../if/attr-setaffinity-np:/params[1]/name} parameter is equal to
      the size of an object of type ${/c/if/cpu_set_t:/name}.
  - name: Small
    test-code: |
      ctx->cpusetsize = sizeof( cpu_set_t ) - 1;
    text: |
      While the ${../if/attr-setaffinity-np:/params[1]/name} parameter is less than
      the size of an object of type ${/c/if/cpu_set_t:/name}.
  - name: Large
    test-code: |
      ctx->cpusetsize = sizeof( cpu_set_t ) + 1;
    text: |
      While the ${../if/attr-setaffinity-np:/params[1]/name} parameter is greater
      than the size of an object of type ${/c/if/cpu_set_t:/name}.
  test-epilogue: null
  test-prologue: null
- name: CPUSet
  states:
  - name: Obj
    test-code: |
      ctx->cpuset = &ctx->cpuset_obj;
    text: |
      While the ${../if/attr-setaffinity-np:/params[2]/name} parameter references an
      object of type ${/c/if/cpu_set_t:/name}.
  - name: 'Null'
    test-code: |
      ctx->cpuset = NULL;
    text: |
      While the ${../if/attr-setaffinity-np:/params[2]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
rationale: |
  The standard does not contain ${../if/attr-setaffinity-np:/name}. The FreeBSD
  manual page pthread_attr_setaffinity_np(3) describes it. RTEMS differs from
  this description. The FreeBSD function accepts a processor set of any size,
  while RTEMS returns ${/c/errno/if/einval:/name} where the
  ${../if/attr-setaffinity-np:/params[1]/name} parameter is not equal to the size
  of an object of type ${/c/if/cpu_set_t:/name}, which states Small and Large of
  pre-condition CPUSetSize specify. RTEMS compares the parameter with the size
  stored in the attributes object. ${../if/attr-init:/name} sets this size to the
  size of an object of type ${/c/if/cpu_set_t:/name} and no function changes it,
  so the item fixes it. The FreeBSD function returns ${/c/errno/if/einval:/name}
  for a processor set which contains a processor that the system does not have.
  RTEMS copies the processor set without a check of its content.
  ${../if/create:/name} checks the processor affinity set and returns
  ${/c/errno/if/einval:/name} if the ${/glossary/scheduler-home:/term} of the new
  ${../glossary/thread:/term} does not support it. The attributes object contains
  the storage of the processor affinity set, so RTEMS does not return the
  ${/c/errno/if/enomem:/name} error of the FreeBSD function.

  The test uses one processor set which contains the first and the last processor
  of an object of type ${/c/if/cpu_set_t:/name}, so that post-condition Affinity
  detects a partial copy. The set differs from the processor affinity set which
  ${../if/attr-init:/name} stores and from the empty set which the test stores
  before the call.

  State Null of pre-condition Attr and state No of pre-condition Initialized
  specify that RTEMS returns ${/c/errno/if/einval:/name}, as the FreeBSD manual
  page describes. The manual page does not mention a
  ${../if/attr-setaffinity-np:/params[2]/name} parameter which is
  ${/c/if/null:/name}. State Null of pre-condition CPUSet specifies that RTEMS
  returns ${/c/errno/if/einval:/name}.

  ${../if/attr-setaffinity-np:/name} writes no other attribute of the object,
  which post-condition Other specifies.
