enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/condattr-getpshared
- role: requirement-refinement
  uid: ../../req/group-posix-api
post-conditions:
- name: Status
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->retval, 0 );
    text: |
      The return value of ${../if/condattr-getpshared:/name} shall be equal to zero.
  - name: EINVAL
    test-code: |
      T_eq_int( ctx->retval, EINVAL );
    text: |
      The return value of ${../if/condattr-getpshared:/name} shall be equal to
      ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: PsharedObj
  states:
  - name: Set
    test-code: |
      T_eq_int( ctx->pshared_value, ctx->pshared_obj );
    text: |
      The value of the object referenced by the
      ${../if/condattr-getpshared:/params[1]/name} parameter shall be set to the
      process-shared attribute of the condition variable attributes object referenced
      by the ${../if/condattr-getpshared:/params[0]/name} parameter.
  - name: Nop
    test-code: |
      T_eq_int( ctx->pshared_value, -1 );
    text: |
      The value of the object referenced by the
      ${../if/condattr-getpshared:/params[1]/name} parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Valid
    test-code: |
      ctx->attr = &ctx->attr_obj;
      T_eq_int( pthread_condattr_init( &ctx->attr_obj ), 0 );
      T_eq_int(
        pthread_condattr_setpshared( &ctx->attr_obj, ctx->pshared_obj ),
        0
      );
    text: |
      While the ${../if/condattr-getpshared:/params[0]/name} parameter references a
      valid condition variable attributes object.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/condattr-getpshared:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
