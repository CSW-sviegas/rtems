post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/condattr-getpshared:/name} shall
      be zero.
  - name: Inval
    test-code: |
      T_eq_int( ctx->status, EINVAL );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/condattr-getpshared:/name} shall
      be ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: Pshared
  states:
  - name: Shared
    test-code: |
      T_eq_int( ctx->pshared_obj, PTHREAD_PROCESS_SHARED );
    text: |
      The object referenced by the ${../if/condattr-getpshared:/params[1]/name}
      parameter shall be ${../if/process-shared:/name}.
  - name: Private
    test-code: |
      T_eq_int( ctx->pshared_obj, PTHREAD_PROCESS_PRIVATE );
    text: |
      The object referenced by the ${../if/condattr-getpshared:/params[1]/name}
      parameter shall be ${../if/process-private:/name}.
  - name: Nop
    test-code: |
      T_eq_int( ctx->pshared_obj, PSHARED_POISON );
    text: |
      The object referenced by the ${../if/condattr-getpshared:/params[1]/name}
      parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: Attr
  states:
  - name: Nop
    test-code: |
      T_eq_mem( &ctx->attr_obj, &ctx->attr_before, sizeof( ctx->attr_obj ) );
    text: |
      The object referenced by the ${../if/condattr-getpshared:/params[0]/name}
      parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Obj
    test-code: |
      ctx->attr = &ctx->attr_obj;
    text: |
      While the ${../if/condattr-getpshared:/params[0]/name} parameter references an
      object of type ${/c/if/pthread_condattr_t:/name}.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/condattr-getpshared:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Initialized
  states:
  - name: 'Yes'
    test-code: |
      T_eno_success( pthread_condattr_init( &ctx->attr_obj ) );
    text: |
      While the object referenced by the ${../if/condattr-getpshared:/params[0]/name}
      parameter is an initialized ${../glossary/condition-variable:/term} attributes
      object.
  - name: 'No'
    test-code: |
      memset( &ctx->attr_obj, 0xff, sizeof( ctx->attr_obj ) );
      ctx->attr_obj.is_initialized = 0;
    text: |
      While the object referenced by the ${../if/condattr-getpshared:/params[0]/name}
      parameter is not an initialized ${../glossary/condition-variable:/term}
      attributes object.
  test-epilogue: null
  test-prologue: null
- name: StoredPshared
  states:
  - name: Shared
    test-code: |
      ctx->attr_obj.process_shared = PTHREAD_PROCESS_SHARED;
    text: |
      While the ${../glossary/process-shared:/term} of the object referenced by the
      ${../if/condattr-getpshared:/params[0]/name} parameter is
      ${../if/process-shared:/name}.
  - name: Private
    test-code: |
      ctx->attr_obj.process_shared = PTHREAD_PROCESS_PRIVATE;
    text: |
      While the ${../glossary/process-shared:/term} of the object referenced by the
      ${../if/condattr-getpshared:/params[0]/name} parameter is
      ${../if/process-private:/name}.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/pthread-condattr-getpshared:/name} specifies that
  ${../if/condattr-getpshared:/name} stores the
  ${../glossary/process-shared:/term} of the attributes object in the object
  referenced by the ${../if/condattr-getpshared:/params[1]/name} parameter. This
  gives post-condition Pshared. The states of pre-condition StoredPshared are the
  two values which ${../if/condattr-init:/name} and
  ${../if/condattr-setpshared:/name} store in RTEMS.

  The standard leaves the behaviour undefined where the
  ${../if/condattr-getpshared:/params[0]/name} parameter references no
  initialized ${../glossary/condition-variable:/term} attributes object. It
  recommends ${/c/errno/if/einval:/name} for that case.
  ${../if/condattr-getpshared:/name} does not check whether the object is
  initialized and does not follow the recommendation. State No of pre-condition
  Initialized specifies the behaviour of RTEMS which stores the
  ${../glossary/process-shared:/term} of the object and returns zero in this case
  as well.

  The standard does not define the behaviour where the
  ${../if/condattr-getpshared:/params[0]/name} parameter is ${/c/if/null:/name}.
  State Null of pre-condition Attr specifies the behaviour of RTEMS which returns
  ${/c/errno/if/einval:/name}. The standard specifies no error for
  ${../if/condattr-getpshared:/name}.

  The standard does not define the behaviour where the
  ${../if/condattr-getpshared:/params[1]/name} parameter is ${/c/if/null:/name}.
  RTEMS does not check this parameter and stores the attribute through it. The
  item does not cover this case, since the call does not return.

  ${../if/condattr-getpshared:/name} does not write the
  ${../glossary/condition-variable:/term} attributes object, which post-condition
  Attr specifies.
requirement-type: functional
skip-reasons: {}
