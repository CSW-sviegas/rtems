transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Attr:
          - 'Null'
          - Invalid
      then: Einval
    - if:
        pre-conditions:
          Inheritsched: Invalid
      then: Enotsup
    - else: Ok
    AttrObj:
    - if:
        pre-conditions:
          Attr: 'Null'
      then: N/A
    - if:
        post-conditions:
          Status: Ok
      then: Set
    - else: Nop
  pre-conditions:
    Attr: all
    Inheritsched: all
