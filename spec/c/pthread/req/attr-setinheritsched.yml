enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/attr-setinheritsched
post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_rsc_success( ctx->retval );
    text: |
      The return status of ${../if/attr-setinheritsched:/name} shall be zero.
  - name: Einval
    test-code: |
      T_rsc( ctx->retval, EINVAL );
    text: |
      The return status of ${../if/attr-setinheritsched:/name} shall be
      ${/c/errno/if/einval:/name}.
  - name: Enotsup
    test-code: |
      T_rsc( ctx->retval, ENOTSUP );
    text: |
      The return status of ${../if/attr-setinheritsched:/name} shall be
      ${/c/errno/if/enotsup:/name}.
  test-epilogue: null
  test-prologue: null
- name: AttrObj
  states:
  - name: Set
    test-code: |
      int inheritsched;
      int eno;

      eno = pthread_attr_getinheritsched( &ctx->attr_obj, &inheritsched );
      T_eno_success( eno );
      T_eq_int( inheritsched, ctx->inheritsched );
    text: |
      The value of the ${../glossary/thread-inherit-scheduler:/term} of the
      ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-setinheritsched:/params[0]/name} parameter shall be set to the
      indicator specified by the ${../if/attr-setinheritsched:/params[1]/name}
      parameter.
  - name: Nop
    test-code: |
      T_eq_int( ctx->attr_obj.inheritsched, -1 );
    text: |
      The ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-setinheritsched:/params[0]/name} parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Valid
    test-code: |
      ctx->attr = &ctx->attr_obj;
      pthread_attr_init( &ctx->attr_obj );
      ctx->attr_obj.inheritsched = -1;
    text: |
      While the ${../if/attr-setinheritsched:/params[0]/name} parameter references an
      initialized ${../glossary/thread:/term} attributes object.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/attr-setinheritsched:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  - name: Invalid
    test-code: |
      ctx->attr = &ctx->attr_obj;
      memset( &ctx->attr_obj, 0x0, sizeof( ctx->attr_obj ) );
      ctx->attr_obj.inheritsched = -1;
    text: |
      While the ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-setinheritsched:/params[0]/name} parameter is not initialized.
  test-epilogue: null
  test-prologue: null
- name: Inheritsched
  states:
  - name: Inherit
    test-code: |
      ctx->inheritsched = PTHREAD_INHERIT_SCHED;
    text: |
      While the ${../if/attr-setinheritsched:/params[1]/name} parameter is equal to
      ${../if/inherit-sched:/name}.
  - name: Explicit
    test-code: |
      ctx->inheritsched = PTHREAD_EXPLICIT_SCHED;
    text: |
      While the ${../if/attr-setinheritsched:/params[1]/name} parameter is equal to
      ${../if/explicit-sched:/name}.
  - name: Invalid
    test-code: |
      ctx->inheritsched = INHERITSCHED_INVALID;
    text: |
      While the ${../if/attr-setinheritsched:/params[1]/name} parameter is not a
      valid ${../glossary/thread-inherit-scheduler:/term}.
  test-epilogue: null
  test-prologue: null
rationale: null
