enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/condattr-getclock
- role: requirement-refinement
  uid: ../../req/group-posix-api
post-conditions:
- name: Status
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->retval, 0 );
    text: |
      The return value of ${../if/condattr-getclock:/name} shall be equal to zero.
  - name: EINVAL
    test-code: |
      T_eq_int( ctx->retval, EINVAL );
    text: |
      The return value of ${../if/condattr-getclock:/name} shall be equal to
      ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: ClockObj
  states:
  - name: Set
    test-code: |
      T_eq_int( ctx->clock_value, ctx->clock_obj );
    text: |
      The value of the object referenced by the
      ${../if/condattr-getclock:/params[1]/name} parameter shall be set to the
      ${../glossary/cond-clock:/term} of the condition variable attributes object
      referenced by the ${../if/condattr-getclock:/params[0]/name} parameter.
  - name: Nop
    test-code: |
      T_eq_int( ctx->clock_value, -1 );
    text: |
      The value of the object referenced by the
      ${../if/condattr-getclock:/params[1]/name} parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Valid
    test-code: |
      ctx->attr = &ctx->attr_obj;
      T_eq_int( pthread_condattr_init( &ctx->attr_obj ), 0 );
      T_eq_int( pthread_condattr_setclock( &ctx->attr_obj, ctx->clock_obj ), 0 );
    text: |
      While the condition variable attributes object referenced by
      ${../if/condattr-getclock:/params[0]/name} is valid.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/condattr-getclock:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: ClockId
  states:
  - name: Valid
    test-code: |
      ctx->clock_value = -1;
      ctx->clock_id = &ctx->clock_value;
    text: |
      While the ${../if/condattr-getclock:/params[1]/name} parameter references an
      object of type ${/c/if/clockid_t:/name}.
  - name: 'Null'
    test-code: |
      ctx->clock_id = NULL;
    text: |
      While the ${../if/condattr-getclock:/params[1]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
