transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Attr: 'Null'
      then: EINVAL
    - if:
        pre-conditions:
          ClockId: 'Null'
      then: EINVAL
    - else: Zero
    ClockObj:
    - if:
        pre-conditions:
          ClockId: 'Null'
      then: N/A
    - if:
        pre-conditions:
          Attr: 'Null'
      then: Nop
    - else: Set
  pre-conditions:
    Attr: all
    ClockId: all
