post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/condattr-getclock:/name} shall be
      zero.
  - name: Inval
    test-code: |
      T_eq_int( ctx->status, EINVAL );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/condattr-getclock:/name} shall be
      ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: Clock
  states:
  - name: Realtime
    test-code: |
      T_eq_ulong( ctx->clock_obj, CLOCK_REALTIME );
    text: |
      The object referenced by the ${../if/condattr-getclock:/params[1]/name}
      parameter shall be ${../../time/if/clock-realtime:/name}.
  - name: Monotonic
    test-code: |
      T_eq_ulong( ctx->clock_obj, CLOCK_MONOTONIC );
    text: |
      The object referenced by the ${../if/condattr-getclock:/params[1]/name}
      parameter shall be ${../../time/if/clock-monotonic:/name}.
  - name: Nop
    test-code: |
      T_eq_ulong( ctx->clock_obj, CLOCK_POISON );
    text: |
      The object referenced by the ${../if/condattr-getclock:/params[1]/name}
      parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: Attr
  states:
  - name: Nop
    test-code: |
      T_eq_mem( &ctx->attr_obj, &ctx->attr_before, sizeof( ctx->attr_obj ) );
    text: |
      The object referenced by the ${../if/condattr-getclock:/params[0]/name}
      parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Obj
    test-code: |
      ctx->attr = &ctx->attr_obj;
    text: |
      While the ${../if/condattr-getclock:/params[0]/name} parameter references an
      object of type ${/c/if/pthread_condattr_t:/name}.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/condattr-getclock:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Initialized
  states:
  - name: 'Yes'
    test-code: |
      T_eno_success( pthread_condattr_init( &ctx->attr_obj ) );
    text: |
      While the object referenced by the ${../if/condattr-getclock:/params[0]/name}
      parameter is an initialized ${../glossary/condition-variable:/term} attributes
      object.
  - name: 'No'
    test-code: |
      memset( &ctx->attr_obj, 0xff, sizeof( ctx->attr_obj ) );
      ctx->attr_obj.is_initialized = 0;
    text: |
      While the object referenced by the ${../if/condattr-getclock:/params[0]/name}
      parameter is not an initialized ${../glossary/condition-variable:/term}
      attributes object.
  test-epilogue: null
  test-prologue: null
- name: StoredClock
  states:
  - name: Realtime
    test-code: |
      ctx->attr_obj.clock = CLOCK_REALTIME;
    text: |
      While the ${../glossary/cond-clock:/term} of the object referenced by the
      ${../if/condattr-getclock:/params[0]/name} parameter is
      ${../../time/if/clock-realtime:/name}.
  - name: Monotonic
    test-code: |
      ctx->attr_obj.clock = CLOCK_MONOTONIC;
    text: |
      While the ${../glossary/cond-clock:/term} of the object referenced by the
      ${../if/condattr-getclock:/params[0]/name} parameter is
      ${../../time/if/clock-monotonic:/name}.
  test-epilogue: null
  test-prologue: null
- name: Clock
  states:
  - name: Obj
    test-code: |
      ctx->clock_obj = CLOCK_POISON;
      ctx->clock = &ctx->clock_obj;
    text: |
      While the ${../if/condattr-getclock:/params[1]/name} parameter references an
      object of type ${/c/if/clockid_t:/name}.
  - name: 'Null'
    test-code: |
      ctx->clock = NULL;
    text: |
      While the ${../if/condattr-getclock:/params[1]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/pthread-condattr-getclock:/name} specifies that
  ${../if/condattr-getclock:/name} stores the ${../glossary/cond-clock:/term} of
  the attributes object in the object referenced by the
  ${../if/condattr-getclock:/params[1]/name} parameter. This gives post-condition
  Clock. The states of pre-condition StoredClock are the two values which
  ${../if/condattr-init:/name} and ${../if/condattr-setclock:/name} store in
  RTEMS.

  The standard leaves the behaviour undefined where the
  ${../if/condattr-getclock:/params[0]/name} parameter references no initialized
  ${../glossary/condition-variable:/term} attributes object.
  ${../if/condattr-getclock:/name} does not check whether the object is
  initialized. State No of pre-condition Initialized specifies the behaviour of
  RTEMS which stores the ${../glossary/cond-clock:/term} of the object in this
  case as well.

  The standard does not define the behaviour where the
  ${../if/condattr-getclock:/params[0]/name} or the
  ${../if/condattr-getclock:/params[1]/name} parameter is ${/c/if/null:/name}.
  The ${/c/if/null:/name} states specify the behaviour of RTEMS which returns
  ${/c/errno/if/einval:/name}. The standard specifies no error for
  ${../if/condattr-getclock:/name}.

  ${../if/condattr-getclock:/name} does not write the
  ${../glossary/condition-variable:/term} attributes object, which post-condition
  Attr specifies.
requirement-type: functional
