  uid: /ref/std/posix-2024/pthread-key-create
post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/key-create:/name} shall be zero.
  - name: Again
    test-code: |
      T_eq_int( ctx->status, EAGAIN );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/key-create:/name} shall be
      ${/c/errno/if/eagain:/name}.
  test-epilogue: null
  test-prologue: null
- name: Key
  states:
  - name: Created
    test-code: |
      the_key = _POSIX_Keys_Get( ctx->key_obj );
      T_assert_not_null( the_key );
      T_eq_u32( the_key->Object.id, ctx->key_obj );
    text: |
      The object referenced by the ${../if/key-create:/params[0]/name} parameter
      shall be the ${../glossary/thread-specific-data-key:/term} created by the
      ${../if/key-create:/name} call.
  - name: Nop
    test-code: |
      T_eq_u32( ctx->key_obj, KEY_POISON );
    text: |
      The object referenced by the ${../if/key-create:/params[0]/name} parameter
      shall not be modified.
  test-epilogue: null
  test-prologue: |
    const POSIX_Keys_Control *the_key;
- name: Value
  states:
  - name: 'Null'
    test-code: |
      the_key = _POSIX_Keys_Get( ctx->key_obj );
      T_assert_not_null( the_key );
      T_true( _Chain_Is_empty( &the_key->Key_value_pairs ) );
      T_null( _POSIX_Keys_Key_value_find( ctx->key_obj, GetExecuting() ) );
    text: |
      The value ${/c/if/null:/name} shall be associated with the created
      ${../glossary/thread-specific-data-key:/term} in each
      ${../glossary/thread:/term}.
  test-epilogue: null
  test-prologue: |
    const POSIX_Keys_Control *the_key;
- name: Destructor
  states:
  - name: Func
    test-code: |
      worker_id = StartWorker( ctx );
      RestartWorker( ctx, worker_id );
      T_eq_u32( ctx->destructor_calls, 1 );
      T_eq_ptr( ctx->destructor_arg, &worker_value );
      DeleteTask( worker_id );
      T_eq_u32( ctx->destructor_calls, 1 );

      ctx->destructor_arg = NULL;
      worker_id = StartWorker( ctx );
      DeleteTask( worker_id );
      T_eq_u32( ctx->destructor_calls, 2 );
      T_eq_ptr( ctx->destructor_arg, &worker_value );
    text: |
      When a ${../glossary/thread:/term} terminates or is restarted which has a value
      other than ${/c/if/null:/name} associated with the created
      ${../glossary/thread-specific-data-key:/term}, the destructor function
      specified by the ${../if/key-create:/params[1]/name} parameter shall be called
      once with this value as its argument.
  - name: 'Null'
    test-code: |
      worker_id = StartWorker( ctx );
      RestartWorker( ctx, worker_id );
      DeleteTask( worker_id );
      worker_id = StartWorker( ctx );
      DeleteTask( worker_id );
      T_eq_u32( ctx->destructor_calls, 0 );
    text: |
      When a ${../glossary/thread:/term} terminates or is restarted which has a value
      other than ${/c/if/null:/name} associated with the created
      ${../glossary/thread-specific-data-key:/term}, no destructor function shall be
      called.
  test-epilogue: null
  test-prologue: |
    rtems_id worker_id;
pre-conditions:
- name: Destructor
  states:
  - name: Func
    test-code: |
      ctx->destructor = Destructor;
    text: |
      While the ${../if/key-create:/params[1]/name} parameter references a function.
  - name: 'Null'
    test-code: |
      ctx->destructor = NULL;
    text: |
      While the ${../if/key-create:/params[1]/name} parameter is ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Keys
  states:
  - name: Available
    test-code: |
      T_false( _Chain_Is_empty( &_POSIX_Keys_Information.Inactive ) );
    text: |
      While the system has the resources to create another
      ${../glossary/thread-specific-data-key:/term}, see
      ${/acfg/if/max-posix-keys:/name}.
  - name: Exhausted
    test-code: |
      while ( ctx->keys_used < RTEMS_ARRAY_SIZE( ctx->keys ) ) {
        if ( pthread_key_create( &ctx->keys[ ctx->keys_used ], NULL ) != 0 ) {
          break;
        }

        ++ctx->keys_used;
      }

      T_lt_sz( ctx->keys_used, RTEMS_ARRAY_SIZE( ctx->keys ) );
      T_true( _Chain_Is_empty( &_POSIX_Keys_Information.Inactive ) );
    text: |
      While the system lacks the resources to create another
      ${../glossary/thread-specific-data-key:/term}, see
      ${/acfg/if/max-posix-keys:/name}.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/pthread-key-create:/name} specifies that
  ${../if/key-create:/name} creates a
  ${../glossary/thread-specific-data-key:/term}, stores it in the object
  referenced by the ${../if/key-create:/params[0]/name} parameter and associates
  the value ${/c/if/null:/name} with the key in all active threads. This gives
  post-conditions Key and Value. At the termination of a thread which has a value
  other than ${/c/if/null:/name} associated with the key, the destructor function
  is called with this value if it is not ${/c/if/null:/name}. This gives
  pre-condition Destructor and post-condition Destructor.

  The standard requires ${/c/errno/if/eagain:/name} where the system lacks the
  resources to create another key, and ${/c/errno/if/enomem:/name} where
  insufficient memory exists to create the key. RTEMS takes the key from the
  objects which ${/acfg/if/max-posix-keys:/name} defines and allocates no other
  memory. It returns ${/c/errno/if/eagain:/name} where no object is available,
  which pre-condition Keys covers. The item does not cover the unlimited
  allocation mode, in which RTEMS returns ${/c/errno/if/eagain:/name} also where
  no memory exists to extend the objects.

  The standard does not define the behaviour where the
  ${../if/key-create:/params[0]/name} parameter is ${/c/if/null:/name}. RTEMS
  does not check the parameter, so the item has no pre-condition for it.

  The destructor function is observed through the deletion and the restart of a
  task. RTEMS calls the destructor functions also at the restart of a task and
  removes the associations, so a deletion after the restart calls no destructor
  function. ${../if/setspecific:/name} removes the association where it gets the
  value ${/c/if/null:/name}, so no thread has the value ${/c/if/null:/name}
  associated with a key. RTEMS repeats the calls while a destructor function
  associates new values. The item does not specify this case.
requirement-type: functional
skip-reasons: {}
test-action: |
  ctx->status = pthread_key_create( &ctx->key_obj, ctx->destructor );
test-brief: null
test-cleanup: |
  if ( ctx->status == 0 ) {
    T_eq_int( pthread_key_delete( ctx->key_obj ), 0 );
  }

  while ( ctx->keys_used > 0 ) {
    --ctx->keys_used;
    T_eq_int( pthread_key_delete( ctx->keys[ ctx->keys_used ] ), 0 );
  }
