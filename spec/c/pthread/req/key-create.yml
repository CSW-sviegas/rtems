  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          KeyResources: Available
      then: Zero
    - else: EAGAIN
    Destructor:
    - if:
        and:
        - pre-conditions:
            Destructor: Valid
        - post-conditions:
            Status: Zero
      then: Called
    - if:
        post-conditions:
          Status: Zero
      then: NotCalled
    - else: N/A
    Key:
    - if:
        post-conditions:
          Status: Zero
      then: Valid
    - else: Nop
  pre-conditions:
    KeyResources: all
    Destructor: all
type: requirement
