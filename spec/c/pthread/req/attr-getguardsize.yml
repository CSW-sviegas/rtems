post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/attr-getguardsize:/name} shall be
      zero.
  - name: Inval
    test-code: |
      T_eq_int( ctx->status, EINVAL );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/attr-getguardsize:/name} shall be
      ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: GuardSize
  states:
  - name: Zero
    test-code: |
      T_eq_sz( ctx->guardsize_obj, 0 );
    text: |
      The object referenced by the ${../if/attr-getguardsize:/params[1]/name}
      parameter shall be zero.
  - name: Positive
    test-code: |
      T_eq_sz( ctx->guardsize_obj, GUARD_SIZE );
    text: |
      The object referenced by the ${../if/attr-getguardsize:/params[1]/name}
      parameter shall be the ${../glossary/thread-guard-size:/term} of the object
      referenced by the ${../if/attr-getguardsize:/params[0]/name} parameter.
  - name: Nop
    test-code: |
      T_eq_sz( ctx->guardsize_obj, SIZE_MAX );
    text: |
      The object referenced by the ${../if/attr-getguardsize:/params[1]/name}
      parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: Attr
  states:
  - name: Nop
    test-code: |
      T_eq_mem( &ctx->attr_obj, &ctx->attr_before, sizeof( ctx->attr_obj ) );
    text: |
      The object referenced by the ${../if/attr-getguardsize:/params[0]/name}
      parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Obj
    test-code: |
      ctx->attr = &ctx->attr_obj;
    text: |
      While the ${../if/attr-getguardsize:/params[0]/name} parameter references an
      object of type ${/c/if/pthread_attr_t:/name}.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/attr-getguardsize:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Initialized
  states:
  - name: 'Yes'
    test-code: |
      T_eno_success( pthread_attr_init( &ctx->attr_obj ) );
    text: |
      While the object referenced by the ${../if/attr-getguardsize:/params[0]/name}
      parameter is an initialized ${../glossary/thread:/term} attributes object.
  - name: 'No'
    test-code: |
      memset( &ctx->attr_obj, 0, sizeof( ctx->attr_obj ) );
    text: |
      While the object referenced by the ${../if/attr-getguardsize:/params[0]/name}
      parameter is not an initialized ${../glossary/thread:/term} attributes object.
  test-epilogue: null
  test-prologue: null
- name: StoredGuardSize
  states:
  - name: Zero
    test-code: |
      ctx->attr_obj.guardsize = 0;
    text: |
      While the ${../glossary/thread-guard-size:/term} of the object referenced by
      the ${../if/attr-getguardsize:/params[0]/name} parameter is zero.
  - name: Positive
    test-code: |
      ctx->attr_obj.guardsize = GUARD_SIZE;
    text: |
      While the ${../glossary/thread-guard-size:/term} of the object referenced by
      the ${../if/attr-getguardsize:/params[0]/name} parameter is greater than zero.
  test-epilogue: null
  test-prologue: null
- name: GuardSize
  states:
  - name: Obj
    test-code: |
      ctx->guardsize_obj = SIZE_MAX;
      ctx->guardsize = &ctx->guardsize_obj;
    text: |
      While the ${../if/attr-getguardsize:/params[1]/name} parameter references an
      object.
  - name: 'Null'
    test-code: |
      ctx->guardsize = NULL;
    text: |
      While the ${../if/attr-getguardsize:/params[1]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/pthread-attr-getguardsize:/name} specifies that
  ${../if/attr-getguardsize:/name} stores the
  ${../glossary/thread-guard-size:/term} in the object referenced by the
  ${../if/attr-getguardsize:/params[1]/name} parameter. This gives post-condition
  GuardSize. The standard distinguishes a guard size of zero, which provides no
  guard area, from a guard size greater than zero. This gives the states of
  pre-condition StoredGuardSize. The standard lets an implementation round up the
  guard size, but requires the value of the previous set call as the result of
  the get call. RTEMS stores the value without change.

  The standard does not define the behaviour where the
  ${../if/attr-getguardsize:/params[1]/name} parameter is ${/c/if/null:/name}.
  The ${/c/if/null:/name} states specify the behaviour of RTEMS which returns
  ${/c/errno/if/einval:/name}.

  The standard leaves the behaviour undefined where the
  ${../if/attr-getguardsize:/params[0]/name} parameter references no initialized
  ${../glossary/thread:/term} attributes object. It recommends
  ${/c/errno/if/einval:/name} for that case. State Null of pre-condition Attr and
  state No of pre-condition Initialized specify the behaviour of RTEMS which
  follows that recommendation.

  ${../if/attr-getguardsize:/name} does not write the ${../glossary/thread:/term}
  attributes object, which post-condition Attr specifies.
requirement-type: functional
