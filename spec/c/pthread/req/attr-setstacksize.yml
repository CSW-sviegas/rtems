enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/attr-setstacksize
- role: requirement-refinement
  uid: ../../req/group-posix-api
post-conditions:
- name: Status
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->retval, 0 );
    text: |
      The return value of ${../if/attr-setstacksize:/name} shall be equal to zero.
  - name: EINVAL
    test-code: |
      T_eq_int( ctx->retval, EINVAL );
    text: |
      The return value of ${../if/attr-setstacksize:/name} shall be equal to
      ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: AttrObj
  states:
  - name: Set
    test-code: |
      size_t stacksize;
      int    eno;

      eno = pthread_attr_getstacksize( &ctx->attr_obj, &stacksize );
      T_eno_success( eno );
      T_eq_sz( stacksize, STACK_SIZE_VALUE );
    text: |
      The value of the ${../glossary/thread-stack-size:/term} of the
      ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-setstacksize:/params[0]/name} parameter shall be set to the size
      specified by the ${../if/attr-setstacksize:/params[1]/name} parameter.
  - name: Nop
    test-code: |
      T_eq_sz( ctx->attr_obj.stacksize, STALE_STACK_SIZE );
    text: |
      The ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-setstacksize:/params[0]/name} parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Valid
    test-code: |
      ctx->attr = &ctx->attr_obj;
      pthread_attr_init( &ctx->attr_obj );
      ctx->attr_obj.stacksize = STALE_STACK_SIZE;
    text: |
      While the ${../if/attr-setstacksize:/params[0]/name} parameter references an
      initialized ${../glossary/thread:/term} attributes object.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/attr-setstacksize:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  - name: Invalid
    test-code: |
      ctx->attr = &ctx->attr_obj;
      memset( &ctx->attr_obj, 0x0, sizeof( ctx->attr_obj ) );
      ctx->attr_obj.stacksize = STALE_STACK_SIZE;
    text: |
      While the ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-setstacksize:/params[0]/name} parameter is not initialized.
  test-epilogue: null
  test-prologue: null
- name: StackSize
  states:
  - name: Valid
    test-code: |
      ctx->stacksize = STACK_SIZE_VALUE;
    text: |
      While the ${../if/attr-setstacksize:/params[1]/name} parameter specifies a
      stack size.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
