  test-epilogue: null
  test-prologue: null
- name: GuardSize
  states:
  - name: Zero
    test-code: |
      T_eq_sz( ctx->attr_obj.guardsize, 0 );
    text: |
      The ${../glossary/thread-guard-size:/term} of the ${../glossary/thread:/term}
      attributes object referenced by the ${../if/attr-init:/params[0]/name}
      parameter shall be zero.
  test-epilogue: null
  test-prologue: null
- name: DetachState
  states:
  - name: Joinable
    test-code: |
      T_eq_int( ctx->attr_obj.detachstate, PTHREAD_CREATE_JOINABLE );
    text: |
      The ${../glossary/thread-detach-state:/term} of the ${../glossary/thread:/term}
      attributes object referenced by the ${../if/attr-init:/params[0]/name}
      parameter shall be ${../if/create-joinable:/name}.
  test-epilogue: null
  test-prologue: null
- name: Affinity
  states:
  - name: All
    test-code: |
      T_eq_ptr(
        ctx->attr_obj.affinityset,
        &ctx->attr_obj.affinitysetpreallocated
      );
      T_eq_sz(
        ctx->attr_obj.affinitysetsize,
        sizeof( ctx->attr_obj.affinitysetpreallocated )
      );
      T_true( CPU_ISFULLSET( ctx->attr_obj.affinityset ) );
    text: |
      The processor affinity set of the ${../glossary/thread:/term} attributes object
      referenced by the ${../if/attr-init:/params[0]/name} parameter shall be a
      ${/c/if/cpu_set_t:/name} object which contains every processor.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Obj
    test-code: |
      ctx->attr = &ctx->attr_obj;
      memset( &ctx->attr_obj, 0xff, sizeof( ctx->attr_obj ) );
      ctx->attr_obj.is_initialized = false;
    text: |
      While the ${../if/attr-init:/params[0]/name} parameter references an object of
      type ${/c/if/pthread_attr_t:/name}.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/attr-init:/params[0]/name} parameter is ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/pthread-attr-destroy:/name} specifies that
  ${../if/attr-init:/name} initializes the ${../glossary/thread:/term} attributes
  object with the default value of each attribute. It defines the default
  ${../glossary/thread-detach-state:/term} as ${../if/create-joinable:/name} and
  leaves the default ${../glossary/thread-guard-size:/term} to the
  implementation. Each post-condition other than Status specifies the default of
  one attribute in RTEMS.

  The standard requires ${/c/errno/if/enomem:/name} where not enough memory
  exists to initialize the object. ${../if/attr-init:/name} allocates no memory,
  so RTEMS never returns this error.

  The standard leaves the result undefined where the object is already
  initialized and recommends ${/c/errno/if/ebusy:/name} for that case.
  ${../if/attr-init:/name} reads only the ${../if/attr-init:/params[0]/name}
  parameter and initializes the object in each case, so the item has no
  pre-condition for the object. The standard does not define the behaviour where
  the ${../if/attr-init:/params[0]/name} parameter is ${/c/if/null:/name}. State
  Null of pre-condition Attr specifies the behaviour of RTEMS which returns
  ${/c/errno/if/einval:/name}.

  The ${../glossary/thread:/term} attributes object of RTEMS contains further
  data which no function of RTEMS reads. The item does not specify it.
