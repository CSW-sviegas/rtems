enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/attr-init
post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_rsc_success( ctx->retval );
    text: |
      The return status of ${../if/attr-init:/name} shall be zero.
  - name: Einval
    test-code: |
      T_rsc( ctx->retval, EINVAL );
    text: |
      The return status of ${../if/attr-init:/name} shall be
      ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: AttrObj
  states:
  - name: Initialized
    test-code: |
      T_true( ctx->attr_obj.is_initialized );
      T_eq_ptr( ctx->attr_obj.stackaddr, NULL );
      T_eq_sz( ctx->attr_obj.stacksize, 0 );
      T_eq_int( ctx->attr_obj.contentionscope, PTHREAD_SCOPE_PROCESS );
      T_eq_int( ctx->attr_obj.inheritsched, PTHREAD_INHERIT_SCHED );
      T_eq_int( ctx->attr_obj.schedpolicy, SCHED_FIFO );
      T_eq_int( ctx->attr_obj.schedparam.sched_priority, 2 );
      T_eq_sz( ctx->attr_obj.guardsize, 0 );
      T_eq_int( ctx->attr_obj.cputime_clock_allowed, 1 );
      T_eq_int( ctx->attr_obj.detachstate, PTHREAD_CREATE_JOINABLE );
      T_eq_sz(
        ctx->attr_obj.affinitysetsize,
        sizeof( ctx->attr_obj.affinitysetpreallocated )
      );
      T_eq_ptr(
        ctx->attr_obj.affinityset,
        &ctx->attr_obj.affinitysetpreallocated
      );
      T_true( CPU_ISSET( 0, &ctx->attr_obj.affinitysetpreallocated ) );
    text: |
      The ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-init:/params[0]/name} parameter shall be set to the default
      ${../glossary/thread:/term} attributes after the return of the
      ${../if/attr-init:/name} call.

      In particular, the is_initialized member shall be true, the stack address
      shall be ${/c/if/null:/name}, the stack size and guard size shall be
      zero, the contention scope shall be ${../if/scope-process:/name}, the
      inherit-scheduler attribute shall be ${../if/inherit-sched:/name}, the
      scheduling policy shall be SCHED_FIFO with priority two, the detach state
      shall be ${../if/create-joinable:/name}, and the affinity set pointer
      shall reference the preallocated affinity set embedded in the
      ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-init:/params[0]/name} parameter, with all processors marked
      as eligible.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Valid
    test-code: |
      ctx->attr = &ctx->attr_obj;
      memset( &ctx->attr_obj, 0xff, sizeof( ctx->attr_obj ) );
      ctx->attr_obj.is_initialized = false;
    text: |
      While the ${../if/attr-init:/params[0]/name} parameter references a
      ${../glossary/thread:/term} attributes object.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/attr-init:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
requirement-type: functional
skip-reasons: {}
test-action: |
  ctx->retval = pthread_attr_init( ctx->attr );
test-brief: null
test-cleanup: null
test-context:
- brief: |
    This member specifies the ${../if/attr-init:/params[0]/name} parameter
    value.
  description: null
  member: pthread_attr_t *attr
- brief: |
    This member contains the return value.
  description: null
  member: int retval
- brief: |
    This member contains the ${../glossary/thread:/term} attributes object.
  description: null
  member: pthread_attr_t attr_obj
test-context-support: null
test-description: null
test-header: null
test-includes:
- errno.h
- pthread.h
- sched.h
- string.h
test-local-includes: []
test-prepare: null
test-setup: null
test-stop: null
test-support: null
test-target: testsuites/validation/tc-pthread-attr-init.c
test-teardown: null
text: |
  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Attr: 'Null'
      then: Einval
    - else: Ok
    AttrObj:
    - if:
        pre-conditions:
          Attr: 'Null'
      then: N/A
    - else: Initialized
  pre-conditions:
    Attr: all
type: requirement
