  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Attr: 'Null'
      then: EINVAL
    - else: Zero
    AttrObj:
    - if:
        pre-conditions:
          Attr: 'Null'
      then: N/A
    - else: Initialized
  pre-conditions:
