  - name: 'Yes'
    test-code: |
      T_true( ctx->attr_obj.is_initialized );
    text: |
      The object referenced by the ${../if/attr-init:/params[0]/name} parameter shall
      be an initialized ${../glossary/thread:/term} attributes object.
  test-epilogue: null
  test-prologue: null
- name: StackAddr
