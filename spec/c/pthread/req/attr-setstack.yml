enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/attr-setstack
post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_rsc_success( ctx->retval );
    text: |
      The return status of ${../if/attr-setstack:/name} shall be zero.
  - name: Einval
    test-code: |
      T_rsc( ctx->retval, EINVAL );
    text: |
      The return status of ${../if/attr-setstack:/name} shall be
      ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: StackAddrObj
  states:
  - name: Set
    test-code: |
      void   *stackaddr;
      size_t  stacksize;
      int     eno;

      eno = pthread_attr_getstack( &ctx->attr_obj, &stackaddr, &stacksize );
      T_eno_success( eno );
      T_eq_ptr( stackaddr, STACK_ADDR_VALUE );
    text: |
      The value of the ${../glossary/thread-stack-address:/term} of the
      ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-setstack:/params[0]/name} parameter shall be set to the
      address specified by the ${../if/attr-setstack:/params[1]/name}
      parameter.
  - name: Nop
    test-code: |
      T_eq_ptr( ctx->attr_obj.stackaddr, STALE_STACK_ADDR );
    text: |
      The ${../glossary/thread-stack-address:/term} of the
      ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-setstack:/params[0]/name} parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: StackSizeObj
  states:
  - name: Set
    test-code: |
      void   *stackaddr;
      size_t  stacksize;
      int     eno;

      eno = pthread_attr_getstack( &ctx->attr_obj, &stackaddr, &stacksize );
      T_eno_success( eno );
      T_eq_sz( stacksize, STACK_SIZE_VALUE );
    text: |
      The value of the ${../glossary/thread-stack-size:/term} of the
      ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-setstack:/params[0]/name} parameter shall be set to the size
      specified by the ${../if/attr-setstack:/params[2]/name} parameter.
  - name: Nop
    test-code: |
      T_eq_sz( ctx->attr_obj.stacksize, STALE_STACK_SIZE );
    text: |
      The ${../glossary/thread-stack-size:/term} of the
      ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-setstack:/params[0]/name} parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Valid
    test-code: |
      ctx->attr = &ctx->attr_obj;
      pthread_attr_init( &ctx->attr_obj );
      ctx->attr_obj.stackaddr = STALE_STACK_ADDR;
      ctx->attr_obj.stacksize = STALE_STACK_SIZE;
    text: |
      While the ${../if/attr-setstack:/params[0]/name} parameter references an
      initialized ${../glossary/thread:/term} attributes object.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/attr-setstack:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  - name: Invalid
    test-code: |
      ctx->attr = &ctx->attr_obj;
      memset( &ctx->attr_obj, 0x0, sizeof( ctx->attr_obj ) );
      ctx->attr_obj.stackaddr = STALE_STACK_ADDR;
      ctx->attr_obj.stacksize = STALE_STACK_SIZE;
    text: |
      While the ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-setstack:/params[0]/name} parameter is not initialized.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
