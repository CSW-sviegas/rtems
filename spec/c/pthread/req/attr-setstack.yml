post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/attr-setstack:/name} shall be
      zero.
  - name: Inval
    test-code: |
      T_eq_int( ctx->status, EINVAL );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/attr-setstack:/name} shall be
      ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: StackAddr
  states:
  - name: 'Null'
    test-code: |
      T_null( ctx->attr_obj.stackaddr );
    text: |
      The ${../glossary/thread-stack-address:/term} of the
      ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-setstack:/params[0]/name} parameter shall be ${/c/if/null:/name}.
  - name: Area
    test-code: |
      T_eq_ptr( ctx->attr_obj.stackaddr, stack_area );
    text: |
      The ${../glossary/thread-stack-address:/term} of the
      ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-setstack:/params[0]/name} parameter shall be the value of the
      ${../if/attr-setstack:/params[1]/name} parameter.
  - name: Nop
    test-code: |
      T_eq_ptr( ctx->attr_obj.stackaddr, ctx->attr_before.stackaddr );
    text: |
      The ${../glossary/thread-stack-address:/term} of the
      ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-setstack:/params[0]/name} parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: StackSize
  states:
  - name: Zero
    test-code: |
      T_eq_sz( ctx->attr_obj.stacksize, 0 );
    text: |
      The ${../glossary/thread-stack-size:/term} of the ${../glossary/thread:/term}
      attributes object referenced by the ${../if/attr-setstack:/params[0]/name}
      parameter shall be zero.
  - name: Positive
    test-code: |
      T_eq_sz( ctx->attr_obj.stacksize, STACK_SIZE );
    text: |
      The ${../glossary/thread-stack-size:/term} of the ${../glossary/thread:/term}
      attributes object referenced by the ${../if/attr-setstack:/params[0]/name}
      parameter shall be the value of the ${../if/attr-setstack:/params[2]/name}
      parameter.
  - name: Nop
    test-code: |
      T_eq_sz( ctx->attr_obj.stacksize, ctx->attr_before.stacksize );
    text: |
      The ${../glossary/thread-stack-size:/term} of the ${../glossary/thread:/term}
      attributes object referenced by the ${../if/attr-setstack:/params[0]/name}
      parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: Other
  states:
  - name: Nop
    test-code: |
      pthread_attr_t expected;

      memcpy( &expected, &ctx->attr_before, sizeof( expected ) );
      expected.stackaddr = ctx->attr_obj.stackaddr;
      expected.stacksize = ctx->attr_obj.stacksize;
      T_eq_mem( &ctx->attr_obj, &expected, sizeof( expected ) );
    text: |
      The content of the ${../glossary/thread:/term} attributes object referenced by
      the ${../if/attr-setstack:/params[0]/name} parameter, other than its
      ${../glossary/thread-stack-address:/term} and
      ${../glossary/thread-stack-size:/term}, shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Obj
    test-code: |
      ctx->attr = &ctx->attr_obj;
    text: |
      While the ${../if/attr-setstack:/params[0]/name} parameter references an object
      of type ${/c/if/pthread_attr_t:/name}.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/attr-setstack:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Initialized
  states:
  - name: 'Yes'
    test-code: |
      T_eno_success( pthread_attr_init( &ctx->attr_obj ) );
      ctx->attr_obj.stackaddr = STACK_ADDR_POISON;
      ctx->attr_obj.stacksize = INT_MAX;
    text: |
      While the object referenced by the ${../if/attr-setstack:/params[0]/name}
      parameter is an initialized ${../glossary/thread:/term} attributes object.
  - name: 'No'
    test-code: |
      memset( &ctx->attr_obj, 0, sizeof( ctx->attr_obj ) );
      ctx->attr_obj.stackaddr = STACK_ADDR_POISON;
      ctx->attr_obj.stacksize = INT_MAX;
    text: |
      While the object referenced by the ${../if/attr-setstack:/params[0]/name}
      parameter is not an initialized ${../glossary/thread:/term} attributes object.
  test-epilogue: null
  test-prologue: null
- name: StackAddr
  states:
  - name: 'Null'
    test-code: |
      ctx->stackaddr = NULL;
    text: |
      While the ${../if/attr-setstack:/params[1]/name} parameter is
      ${/c/if/null:/name}.
  - name: Area
    test-code: |
      ctx->stackaddr = stack_area;
    text: |
      While the ${../if/attr-setstack:/params[1]/name} parameter is not
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: StackSize
  states:
  - name: Zero
    test-code: |
      ctx->stacksize = 0;
    text: |
      While the ${../if/attr-setstack:/params[2]/name} parameter is zero.
  - name: Positive
    test-code: |
      ctx->stacksize = STACK_SIZE;
    text: |
      While the ${../if/attr-setstack:/params[2]/name} parameter is greater than
      zero.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/pthread-attr-getstack:/name} requires
  ${/c/errno/if/einval:/name} for a value of the
  ${../if/attr-setstack:/params[2]/name} parameter which is less than the minimum
  stack size or which exceeds a limit of the implementation. The minimum stack
  size of RTEMS is zero and RTEMS has no such limit, so every value is valid. The
  states of pre-condition StackSize are zero and a value greater than zero. The
  standard permits an error for a misaligned stack area and for a stack area
  which is not readable and writable. RTEMS checks neither of them, so the states
  of pre-condition StackAddr are ${/c/if/null:/name}, the default of
  ${../if/attr-init:/name} in RTEMS, and an address of a stack area.

  The standard leaves the behaviour undefined where the
  ${../if/attr-setstack:/params[0]/name} parameter references no initialized
  ${../glossary/thread:/term} attributes object. It recommends
  ${/c/errno/if/einval:/name} for that case. State Null of pre-condition Attr and
  state No of pre-condition Initialized specify the behaviour of RTEMS which
  follows that recommendation.

  ${../if/attr-setstack:/name} writes no other attribute of the object, which
  post-condition Other specifies.
