enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/cond-destroy
- role: requirement-refinement
  uid: ../../req/group-posix-api
post-conditions:
- name: Status
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->retval, 0 );
    text: |
      The return value of ${../if/cond-destroy:/name} shall be equal to zero.
  - name: EBUSY
    test-code: |
      T_eq_int( ctx->retval, EBUSY );
    text: |
      The return value of ${../if/cond-destroy:/name} shall be equal to
      ${/c/errno/if/ebusy:/name}.
  - name: EINVAL
    test-code: |
      T_eq_int( ctx->retval, EINVAL );
    text: |
      The return value of ${../if/cond-destroy:/name} shall be equal to
      ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: Object
  states:
  - name: Destroyed
    test-code: |
      T_eq_int( pthread_cond_destroy( &ctx->cond_obj ), EINVAL );
    text: |
      The condition variable object shall be destroyed.
  - name: Valid
    test-code: |
      T_eq_int( pthread_cond_destroy( &ctx->cond_obj ), EBUSY );
    text: |
      The condition variable object shall remain initialized.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Cond
  states:
  - name: 'Null'
    test-code: |
      ctx->cond = NULL;
    text: |
      While the ${../if/cond-destroy:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  - name: Invalid
    test-code: |
      memset( &ctx->cond_obj, 0xff, sizeof( ctx->cond_obj ) );
      ctx->cond = &ctx->cond_obj;
    text: |
      While the ${../if/cond-destroy:/params[0]/name} parameter references an object
      which is neither initialized nor filled with zero bytes.
  - name: Zeroed
    test-code: |
      memset( &ctx->cond_obj, 0, sizeof( ctx->cond_obj ) );
      ctx->cond = &ctx->cond_obj;
    text: |
      While the ${../if/cond-destroy:/params[0]/name} parameter references an object
      filled with zero bytes.
  - name: Valid
    test-code: |
      eno = pthread_cond_init( &ctx->cond_obj, NULL );
      T_eq_int( eno, 0 );
      ctx->cond = &ctx->cond_obj;
    text: |
      While the ${../if/cond-destroy:/params[0]/name} parameter references an
      initialized condition variable object.
  test-epilogue: null
  test-prologue: |
    int eno;
- name: Waiters
  states:
  - name: 'No'
    test-code: |
      /* Nothing to prepare */
    text: |
      While no thread waits on the condition variable object.
  - name: 'Yes'
    test-code: |
      ctx->worker_id = CreateTask( "WORK", PRIO_HIGH );
      StartTask( ctx->worker_id, Worker, ctx );
      WaitForExecutionStop( ctx->worker_id );
    text: |
      While at least one thread waits on the condition variable object.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
requirement-type: functional
skip-reasons: {}
test-action: |
  ctx->retval = pthread_cond_destroy( ctx->cond );
test-brief: null
test-cleanup: |
  if ( ctx->worker_id != 0 ) {
    DeleteTask( ctx->worker_id );
    ctx->worker_id = 0;
  }
test-context:
- brief: |
    This member provides the condition variable object.
  description: null
  member: |
    pthread_cond_t cond_obj
- brief: |
    This member provides the mutex used by the waiting worker.
  description: null
  member: |
    pthread_mutex_t mutex
- brief: |
    This member contains the identifier of the worker task.
  description: null
  member: |
    rtems_id worker_id
- brief: |
    This member specifies the ${../if/cond-destroy:/params[0]/name}
    parameter value.
  description: null
  member: pthread_cond_t *cond
- brief: This member contains the return value.
  description: null
  member: int retval
test-context-support: null
test-description: null
test-header: null
test-includes:
- errno.h
- pthread.h
- string.h
test-local-includes:
- tx-support.h
test-prepare: null
test-setup:
  brief: null
  code: |
    int eno;

    memset( ctx, 0, sizeof( *ctx ) );
    SetSelfPriority( PRIO_NORMAL );
    eno = pthread_mutex_init( &ctx->mutex, NULL );
    T_eq_int( eno, 0 );
  description: null
test-stop: null
test-support: |
  typedef ${.:/test-context-type} Context;

  static void Worker( rtems_task_argument arg )
  {
    Context *ctx;
    int      eno;

    ctx = (Context *) arg;

    eno = pthread_mutex_lock( &ctx->mutex );
    T_eq_int( eno, 0 );

    eno = pthread_cond_wait( &ctx->cond_obj, &ctx->mutex );
    T_eq_int( eno, 0 );

    eno = pthread_mutex_unlock( &ctx->mutex );
    T_eq_int( eno, 0 );

    SuspendSelf();
  }
test-target: testsuites/validation/tc-pthread-cond-destroy.c
test-teardown:
  brief: null
  code: |
    (void) pthread_mutex_destroy( &ctx->mutex );
    RestoreRunnerPriority();
  description: null
text: |
  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Cond:
          - 'Null'
          - Invalid
      then: EINVAL
    - if:
        pre-conditions:
          Cond: Valid
          Waiters: 'Yes'
      then: EBUSY
    - else: Zero
    Object:
    - if:
        post-conditions:
          Status: Zero
      then: Destroyed
    - if:
        post-conditions:
          Status: EBUSY
      then: Valid
    - else: N/A
  pre-conditions:
    Cond: all
    Waiters:
      applicable:
        pre-conditions:
          Cond: Valid
type: requirement
