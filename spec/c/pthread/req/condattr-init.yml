enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/condattr-init
- role: requirement-refinement
  uid: ../../req/group-posix-api
post-conditions:
- name: Status
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->retval, 0 );
    text: |
      The return value of ${../if/condattr-init:/name} shall be equal to zero.
  - name: EINVAL
    test-code: |
      T_eq_int( ctx->retval, EINVAL );
    text: |
      The return value of ${../if/condattr-init:/name} shall be equal to
      ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: AttrObj
  states:
  - name: Init
    test-code: |
      clockid_t clock;
      int       pshared;

      clock = -1;
      pshared = -1;
      T_eq_int( pthread_condattr_getclock( &ctx->attr_obj, &clock ), 0 );
      T_eq_int( clock, CLOCK_REALTIME );
      T_eq_int( pthread_condattr_getpshared( &ctx->attr_obj, &pshared ), 0 );
      T_eq_int( pshared, PTHREAD_PROCESS_PRIVATE );
      T_eq_int( pthread_condattr_destroy( &ctx->attr_obj ), 0 );
    text: |
      The condition variable attributes object referenced by
      ${../if/condattr-init:/params[0]/name} shall be initialized with the default
      attributes.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Valid
    test-code: |
      ctx->attr = &ctx->attr_obj;
    text: |
      While the ${../if/condattr-init:/params[0]/name} parameter references an object
      of type ${/c/if/pthread_condattr_t:/name}.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/condattr-init:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
requirement-type: functional
skip-reasons: {}
test-action: |
  ctx->retval = pthread_condattr_init( ctx->attr );
test-brief: null
test-cleanup: null
test-context:
- brief: |
    This member specifies the ${../if/condattr-init:/params[0]/name}
    parameter value.
  description: null
  member: pthread_condattr_t *attr
- brief: This member contains the return value.
  description: null
  member: int retval
- brief: |
    This member contains the attributes object.
  description: null
  member: pthread_condattr_t attr_obj
test-context-support: null
test-description: null
test-header: null
test-includes:
- errno.h
- pthread.h
- string.h
test-local-includes: []
test-prepare: |
  memset( &ctx->attr_obj, 0, sizeof( ctx->attr_obj ) );
test-setup: null
test-stop: null
test-support: null
test-target: testsuites/validation/tc-pthread-condattr-init.c
test-teardown: null
text: |
  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Attr: 'Null'
      then: EINVAL
    - else: Zero
    AttrObj:
    - if:
        pre-conditions:
          Attr: 'Null'
      then: N/A
    - else: Init
  pre-conditions:
    Attr: all
type: requirement
