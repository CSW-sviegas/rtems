enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/attr-setdetachstate
post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_rsc_success( ctx->retval );
    text: |
      The return status of ${../if/attr-setdetachstate:/name} shall be zero.
  - name: Einval
    test-code: |
      T_rsc( ctx->retval, EINVAL );
    text: |
      The return status of ${../if/attr-setdetachstate:/name} shall be
      ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: AttrObj
  states:
  - name: Set
    test-code: |
      int detachstate;
      int eno;

      eno = pthread_attr_getdetachstate( &ctx->attr_obj, &detachstate );
      T_eno_success( eno );
      T_eq_int( detachstate, ctx->detachstate );
    text: |
      The value of the ${../glossary/thread-detach-state:/term} of the
      ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-setdetachstate:/params[0]/name} parameter shall be set to
      the state specified by the ${../if/attr-setdetachstate:/params[1]/name}
      parameter.
  - name: Nop
    test-code: |
      T_eq_int( ctx->attr_obj.detachstate, -1 );
    text: |
      The ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-setdetachstate:/params[0]/name} parameter shall not be
      modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Valid
    test-code: |
      ctx->attr = &ctx->attr_obj;
      pthread_attr_init( &ctx->attr_obj );
      ctx->attr_obj.detachstate = -1;
    text: |
      While the ${../if/attr-setdetachstate:/params[0]/name} parameter
      references an initialized ${../glossary/thread:/term} attributes object.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/attr-setdetachstate:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  - name: Invalid
    test-code: |
      ctx->attr = &ctx->attr_obj;
      memset( &ctx->attr_obj, 0x0, sizeof( ctx->attr_obj ) );
      ctx->attr_obj.detachstate = -1;
    text: |
      While the ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-setdetachstate:/params[0]/name} parameter is not
      initialized.
  test-epilogue: null
  test-prologue: null
- name: Detachstate
  states:
  - name: Detached
    test-code: |
      ctx->detachstate = PTHREAD_CREATE_DETACHED;
    text: |
      While the ${../if/attr-setdetachstate:/params[1]/name} parameter is equal
      to ${../if/create-detached:/name}.
  - name: Joinable
    test-code: |
      ctx->detachstate = PTHREAD_CREATE_JOINABLE;
    text: |
      While the ${../if/attr-setdetachstate:/params[1]/name} parameter is equal
      to ${../if/create-joinable:/name}.
  - name: Invalid
    test-code: |
      ctx->detachstate = DETACH_STATE_INVALID;
    text: |
      While the ${../if/attr-setdetachstate:/params[1]/name} parameter is not a
      valid ${../glossary/thread-detach-state:/term}.
  test-epilogue: null
  test-prologue: null
rationale: null
