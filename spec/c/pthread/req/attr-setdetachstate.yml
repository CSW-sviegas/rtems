enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/attr-setdetachstate
- role: requirement-refinement
  uid: ../../req/group-posix-api
- role: reference
  uid: /ref/std/posix-2024/pthread-attr-getdetachstate
post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/attr-setdetachstate:/name} shall
      be zero.
  - name: Inval
    test-code: |
      T_eq_int( ctx->status, EINVAL );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/attr-setdetachstate:/name} shall
      be ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: DetachState
  states:
  - name: Detached
    test-code: |
      T_eq_int( ctx->attr_obj.detachstate, PTHREAD_CREATE_DETACHED );
    text: |
      The ${../glossary/thread-detach-state:/term} of the ${../glossary/thread:/term}
      attributes object referenced by the
      ${../if/attr-setdetachstate:/params[0]/name} parameter shall be
      ${../if/create-detached:/name}.
  - name: Joinable
    test-code: |
      T_eq_int( ctx->attr_obj.detachstate, PTHREAD_CREATE_JOINABLE );
    text: |
      The ${../glossary/thread-detach-state:/term} of the ${../glossary/thread:/term}
      attributes object referenced by the
      ${../if/attr-setdetachstate:/params[0]/name} parameter shall be
      ${../if/create-joinable:/name}.
  - name: Nop
    test-code: |
      T_eq_int( ctx->attr_obj.detachstate, ctx->attr_before.detachstate );
    text: |
      The ${../glossary/thread-detach-state:/term} of the ${../glossary/thread:/term}
      attributes object referenced by the
      ${../if/attr-setdetachstate:/params[0]/name} parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: Other
  states:
  - name: Nop
    test-code: |
      pthread_attr_t expected;

      memcpy( &expected, &ctx->attr_before, sizeof( expected ) );
      expected.detachstate = ctx->attr_obj.detachstate;
      T_eq_mem( &ctx->attr_obj, &expected, sizeof( expected ) );
    text: |
      The content of the ${../glossary/thread:/term} attributes object referenced by
      the ${../if/attr-setdetachstate:/params[0]/name} parameter, other than its
      ${../glossary/thread-detach-state:/term}, shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Obj
    test-code: |
      ctx->attr = &ctx->attr_obj;
    text: |
      While the ${../if/attr-setdetachstate:/params[0]/name} parameter references an
      object of type ${/c/if/pthread_attr_t:/name}.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/attr-setdetachstate:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Initialized
  states:
  - name: 'Yes'
    test-code: |
      T_eno_success( pthread_attr_init( &ctx->attr_obj ) );
      ctx->attr_obj.detachstate = -1;
    text: |
      While the object referenced by the ${../if/attr-setdetachstate:/params[0]/name}
      parameter is an initialized ${../glossary/thread:/term} attributes object.
  - name: 'No'
    test-code: |
      memset( &ctx->attr_obj, 0, sizeof( ctx->attr_obj ) );
      ctx->attr_obj.detachstate = -1;
    text: |
      While the object referenced by the ${../if/attr-setdetachstate:/params[0]/name}
      parameter is not an initialized ${../glossary/thread:/term} attributes object.
  test-epilogue: null
  test-prologue: null
- name: DetachState
  states:
  - name: Detached
    test-code: |
      ctx->detachstate = PTHREAD_CREATE_DETACHED;
    text: |
      While the ${../if/attr-setdetachstate:/params[1]/name} parameter is equal to
      ${../if/create-detached:/name}.
  - name: Joinable
    test-code: |
      ctx->detachstate = PTHREAD_CREATE_JOINABLE;
    text: |
      While the ${../if/attr-setdetachstate:/params[1]/name} parameter is equal to
      ${../if/create-joinable:/name}.
  - name: Invalid
    test-code: |
      ctx->detachstate = DETACH_STATE_INVALID;
    text: |
      While the ${../if/attr-setdetachstate:/params[1]/name} parameter is not a valid
      ${../glossary/thread-detach-state:/term}.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/pthread-attr-getdetachstate:/name} requires
  ${/c/errno/if/einval:/name} for a value of the
  ${../if/attr-setdetachstate:/params[1]/name} parameter which is neither
  ${../if/create-detached:/name} nor ${../if/create-joinable:/name}. This gives
  the states of pre-condition DetachState.

  The standard leaves the behaviour undefined where the
  ${../if/attr-setdetachstate:/params[0]/name} parameter references no
  initialized ${../glossary/thread:/term} attributes object. It recommends
  ${/c/errno/if/einval:/name} for that case. State Null of pre-condition Attr and
  state No of pre-condition Initialized specify the behaviour of RTEMS which
  follows that recommendation.
requirement-type: functional
skip-reasons: {}
test-action: |
  memcpy( &ctx->attr_before, &ctx->attr_obj, sizeof( ctx->attr_before ) );
  ctx->status = pthread_attr_setdetachstate( ctx->attr, ctx->detachstate );
