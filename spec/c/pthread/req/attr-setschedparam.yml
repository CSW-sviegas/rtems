post-conditions:
- name: Status
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->retval, 0 );
    text: |
      The return value of ${../if/attr-setschedparam:/name} shall be equal to zero.
  - name: EINVAL
    test-code: |
      T_eq_int( ctx->retval, EINVAL );
    text: |
      The return value of ${../if/attr-setschedparam:/name} shall be equal to
      ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: AttrObj
  states:
  - name: Set
    test-code: |
      CheckSchedParam( &ctx->attr_obj.schedparam, ctx->param );
    text: |
      The value of the ${/c/sched/glossary/parameter:/term} of the
      ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-setschedparam:/params[0]/name} parameter shall be set to the
      parameters object referenced by the ${../if/attr-setschedparam:/params[1]/name}
      parameter.
  - name: Nop
    test-code: |
      struct sched_param param;

      memset( &param, 0xff, sizeof( param ) );
      CheckSchedParam( &ctx->attr_obj.schedparam, &param );
    text: |
      The ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-setschedparam:/params[0]/name} parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Valid
    test-code: |
      ctx->attr = &ctx->attr_obj;
      pthread_attr_init( &ctx->attr_obj );
      memset(
        &ctx->attr_obj.schedparam,
        0xff,
        sizeof( ctx->attr_obj.schedparam )
      );
    text: |
      While the ${../if/attr-setschedparam:/params[0]/name} parameter references an
      initialized ${../glossary/thread:/term} attributes object.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/attr-setschedparam:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  - name: Invalid
    test-code: |
      ctx->attr = &ctx->attr_obj;
      memset( &ctx->attr_obj, 0x0, sizeof( ctx->attr_obj ) );
      memset(
        &ctx->attr_obj.schedparam,
        0xff,
        sizeof( ctx->attr_obj.schedparam )
      );
    text: |
      While the ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-setschedparam:/params[0]/name} parameter is not initialized.
  test-epilogue: null
  test-prologue: null
- name: Param
  states:
  - name: Valid
    test-code: |
      memset( &ctx->param_obj, 0, sizeof( ctx->param_obj ) );
      ctx->param_obj.sched_priority = PARAM_PRIORITY;
      #if defined( _POSIX_SPORADIC_SERVER ) || \
      defined( _POSIX_THREAD_SPORADIC_SERVER )
      ctx->param_obj.sched_ss_low_priority = PARAM_LOW_PRIORITY;
      ctx->param_obj.sched_ss_repl_period.tv_sec = 1;
      ctx->param_obj.sched_ss_repl_period.tv_nsec = 2;
      ctx->param_obj.sched_ss_init_budget.tv_sec = 3;
      ctx->param_obj.sched_ss_init_budget.tv_nsec = 4;
      ctx->param_obj.sched_ss_max_repl = 5;
      #endif
      ctx->param = &ctx->param_obj;
    text: |
      While the ${../if/attr-setschedparam:/params[1]/name} parameter references a
      ${/c/sched/glossary/parameter:/term} object.
  - name: 'Null'
    test-code: |
      ctx->param = NULL;
    text: |
      While the ${../if/attr-setschedparam:/params[1]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
