transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Attr:
          - 'Null'
          - Invalid
      then: Einval
    - if:
        pre-conditions:
          Param: 'Null'
      then: Einval
    - else: Ok
    AttrObj:
    - if:
        pre-conditions:
          Attr: 'Null'
      then: N/A
    - if:
        post-conditions:
          Status: Ok
      then: Set
    - else: Nop
