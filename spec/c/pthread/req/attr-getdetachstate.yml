transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Attr:
          - 'Null'
          - Invalid
      then: Einval
    - if:
        pre-conditions:
          Detachstate: 'Null'
      then: Einval
    - else: Ok
    DetachStateObj:
    - if:
        pre-conditions:
          Detachstate: 'Null'
      then: N/A
    - if:
        post-conditions:
          Status: Ok
      then: Set
    - else: Nop
  pre-conditions:
    Attr: all
    Detachstate: all
