enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/attr-getdetachstate
post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_rsc_success( ctx->retval );
    text: |
      The return status of ${../if/attr-getdetachstate:/name} shall be zero.
  - name: Einval
    test-code: |
      T_rsc( ctx->retval, EINVAL );
    text: |
      The return status of ${../if/attr-getdetachstate:/name} shall be
      ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: DetachStateObj
  states:
  - name: Set
    test-code: |
      T_eq_int( ctx->detachstate_value, DETACH_STATE_VALUE );
    text: |
      The value of the object referenced by the
      ${../if/attr-getdetachstate:/params[1]/name} parameter shall be set to
      the ${../glossary/thread-detach-state:/term} of the
      ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-getdetachstate:/params[0]/name} parameter.
  - name: Nop
    test-code: |
      T_eq_int( ctx->detachstate_value, -1 );
    text: |
      The object referenced by the ${../if/attr-getdetachstate:/params[1]/name}
      parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Valid
    test-code: |
      ctx->attr = &ctx->attr_obj;
      pthread_attr_init( &ctx->attr_obj );
      pthread_attr_setdetachstate( &ctx->attr_obj, DETACH_STATE_VALUE );
    text: |
      While the ${../if/attr-getdetachstate:/params[0]/name} parameter
      references an initialized ${../glossary/thread:/term} attributes object.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/attr-getdetachstate:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  - name: Invalid
    test-code: |
      ctx->attr = &ctx->attr_obj;
      memset( &ctx->attr_obj, 0x0, sizeof( ctx->attr_obj ) );
    text: |
      While the ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-getdetachstate:/params[0]/name} parameter is not
      initialized.
  test-epilogue: null
  test-prologue: null
- name: Detachstate
  states:
  - name: Valid
    test-code: |
      ctx->detachstate_value = -1;
      ctx->detachstate = &ctx->detachstate_value;
    text: |
      While the ${../if/attr-getdetachstate:/params[1]/name} parameter
      references an object of type `int`.
  - name: 'Null'
    test-code: |
      ctx->detachstate = NULL;
    text: |
      While the ${../if/attr-getdetachstate:/params[1]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
rationale: null
