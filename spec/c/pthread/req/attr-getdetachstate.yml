post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/attr-getdetachstate:/name} shall
      be zero.
  - name: Inval
    test-code: |
      T_eq_int( ctx->status, EINVAL );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/attr-getdetachstate:/name} shall
      be ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: DetachState
  states:
  - name: Detached
    test-code: |
      T_eq_int( ctx->detachstate_obj, PTHREAD_CREATE_DETACHED );
    text: |
      The object referenced by the ${../if/attr-getdetachstate:/params[1]/name}
      parameter shall be ${../if/create-detached:/name}.
  - name: Joinable
    test-code: |
      T_eq_int( ctx->detachstate_obj, PTHREAD_CREATE_JOINABLE );
    text: |
      The object referenced by the ${../if/attr-getdetachstate:/params[1]/name}
      parameter shall be ${../if/create-joinable:/name}.
  - name: Nop
    test-code: |
      T_eq_int( ctx->detachstate_obj, DETACH_STATE_POISON );
    text: |
      The object referenced by the ${../if/attr-getdetachstate:/params[1]/name}
      parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: Attr
  states:
  - name: Nop
    test-code: |
      T_eq_mem( &ctx->attr_obj, &ctx->attr_before, sizeof( ctx->attr_obj ) );
    text: |
      The object referenced by the ${../if/attr-getdetachstate:/params[0]/name}
      parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Obj
    test-code: |
      ctx->attr = &ctx->attr_obj;
    text: |
      While the ${../if/attr-getdetachstate:/params[0]/name} parameter references an
      object of type ${/c/if/pthread_attr_t:/name}.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/attr-getdetachstate:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Initialized
  states:
  - name: 'Yes'
    test-code: |
      T_eno_success( pthread_attr_init( &ctx->attr_obj ) );
    text: |
      While the object referenced by the ${../if/attr-getdetachstate:/params[0]/name}
      parameter is an initialized ${../glossary/thread:/term} attributes object.
  - name: 'No'
    test-code: |
      memset( &ctx->attr_obj, 0, sizeof( ctx->attr_obj ) );
    text: |
      While the object referenced by the ${../if/attr-getdetachstate:/params[0]/name}
      parameter is not an initialized ${../glossary/thread:/term} attributes object.
  test-epilogue: null
  test-prologue: null
- name: StoredDetachState
  states:
  - name: Detached
    test-code: |
      ctx->attr_obj.detachstate = PTHREAD_CREATE_DETACHED;
    text: |
      While the ${../glossary/thread-detach-state:/term} of the object referenced by
      the ${../if/attr-getdetachstate:/params[0]/name} parameter is
      ${../if/create-detached:/name}.
  - name: Joinable
    test-code: |
      ctx->attr_obj.detachstate = PTHREAD_CREATE_JOINABLE;
    text: |
      While the ${../glossary/thread-detach-state:/term} of the object referenced by
      the ${../if/attr-getdetachstate:/params[0]/name} parameter is
      ${../if/create-joinable:/name}.
  test-epilogue: null
  test-prologue: null
- name: DetachState
  states:
  - name: Obj
    test-code: |
      ctx->detachstate_obj = DETACH_STATE_POISON;
      ctx->detachstate = &ctx->detachstate_obj;
    text: |
      While the ${../if/attr-getdetachstate:/params[1]/name} parameter references an
      object.
  - name: 'Null'
    test-code: |
      ctx->detachstate = NULL;
    text: |
      While the ${../if/attr-getdetachstate:/params[1]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/pthread-attr-getdetachstate:/name} specifies that
  ${../if/attr-getdetachstate:/name} stores the
  ${../glossary/thread-detach-state:/term} in the object referenced by the
  ${../if/attr-getdetachstate:/params[1]/name} parameter. This gives
  post-condition DetachState. The states of pre-condition StoredDetachState are
  the two values which the standard permits for this attribute.

  The standard does not define the behaviour where the
  ${../if/attr-getdetachstate:/params[1]/name} parameter is ${/c/if/null:/name}.
  The ${/c/if/null:/name} states specify the behaviour of RTEMS which returns
  ${/c/errno/if/einval:/name}.

  The standard leaves the behaviour undefined where the
  ${../if/attr-getdetachstate:/params[0]/name} parameter references no
  initialized ${../glossary/thread:/term} attributes object. It recommends
  ${/c/errno/if/einval:/name} for that case. State Null of pre-condition Attr and
  state No of pre-condition Initialized specify the behaviour of RTEMS which
  follows that recommendation.

  ${../if/attr-getdetachstate:/name} does not write the
  ${../glossary/thread:/term} attributes object, which post-condition Attr
  specifies.
requirement-type: functional
