test-context-support: |
  typedef enum {
    KIND_NONE,
    KIND_OTHER,
    KIND_EXECUTING,
    KIND_EXECUTING_FROM_ISR
  } WorkerKind;
test-description: |
  The worker thread is a Classic API task. Its termination is observed
  through ${../if/join:/name} which returns the exit value of the worker
  thread.

  For the ExecutingFromISR pre-condition, ${../if/cancel:/name} is called
  within interrupt context with the identifier of the interrupted thread.
  The implementation then calls ``_Thread_Cancel()`` with the thread to
  cancel being the executing thread. This violates the assertion
  ``_Assert( the_thread != executing )`` in
  ``cpukit/score/src/threadrestart.c``, so this variant fails in builds with
  ``RTEMS_DEBUG`` enabled. In builds without ``RTEMS_DEBUG``, the
  cancellation request is processed according to the cancelability of the
  interrupted thread.
test-header: null
test-includes:
- errno.h
- pthread.h
test-local-includes:
- tx-support.h
test-prepare: |
  ctx->retval = -1;
  ctx->worker_id = 0;
  ctx->worker_value = NULL;
  ctx->resumed = false;
  ctx->tested = false;
test-setup: null
test-stop: null
test-support: |
  typedef ${.:/test-context-type} Context;

  static void CancelFromISR( void *arg )
  {
    Context *ctx;

    ctx = arg;
    ctx->retval = pthread_cancel( pthread_self() );
  }

  static void Worker( rtems_task_argument arg )
  {
    Context *ctx;
    int      eno;

    ctx = (Context *) arg;

    eno = pthread_setcanceltype( ctx->cancel_type, NULL );
    T_eno_success( eno );
    eno = pthread_setcancelstate( ctx->cancel_state, NULL );
    T_eno_success( eno );

    if ( ctx->kind == KIND_OTHER ) {
      SuspendSelf();
    } else if ( ctx->kind == KIND_EXECUTING ) {
      (void) pthread_cancel( pthread_self() );
    } else {
      CallWithinISR( CancelFromISR, ctx );
    }

    ctx->resumed = true;
    pthread_testcancel();
    ctx->tested = true;

    /* Accept the pending cancellation request */
    (void) pthread_setcancelstate( PTHREAD_CANCEL_ENABLE, NULL );
    pthread_testcancel();
    T_unreachable();
  }
test-target: testsuites/validation/tc-pthread-cancel.c
