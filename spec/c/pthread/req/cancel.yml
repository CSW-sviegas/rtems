enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/cancel
- role: requirement-refinement
  uid: ../../req/group-posix-api
post-conditions:
- name: Status
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->retval, 0 );
    text: |
      The return value of ${../if/cancel:/name} shall be equal to zero.
  - name: ESRCH
    test-code: |
      T_eq_int( ctx->retval, ESRCH );
    text: |
      The return value of ${../if/cancel:/name} shall be equal to
      ${/c/errno/if/esrch:/name}.
  test-epilogue: null
  test-prologue: null
- name: Canceled
  states:
  - name: 'Yes'
    test-code: |
      T_eq_ptr( ctx->worker_value, PTHREAD_CANCELED );
      T_false( ctx->resumed );
    text: |
      The thread specified by the ${../if/cancel:/params[0]/name} parameter shall
      terminate with the exit value ${../if/canceled:/name} without continuing its
      execution after the cancellation request.
  - name: Pending
    test-code: |
      T_eq_ptr( ctx->worker_value, PTHREAD_CANCELED );
      T_true( ctx->resumed );
      T_false( ctx->tested );
    text: |
      The thread specified by the ${../if/cancel:/params[0]/name} parameter shall
      continue its execution after the cancellation request and terminate with the
      exit value ${../if/canceled:/name} when it calls ${../if/testcancel:/name}.
  - name: 'No'
    test-code: |
      T_true( ctx->resumed );
      T_true( ctx->tested );
    text: |
      The thread specified by the ${../if/cancel:/params[0]/name} parameter shall
      continue its execution after a call to ${../if/testcancel:/name}.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Thread
  states:
  - name: NoObj
    test-code: |
      ctx->kind = KIND_NONE;
      ctx->thread = 0xffffffff;
    text: |
      While the ${../if/cancel:/params[0]/name} parameter is not associated with a
      thread.
  - name: Other
    test-code: |
      ctx->kind = KIND_OTHER;
    text: |
      While the ${../if/cancel:/params[0]/name} parameter is associated with a thread
      other than the calling thread.
  - name: Executing
    test-code: |
      ctx->kind = KIND_EXECUTING;
    text: |
      While the ${../if/cancel:/params[0]/name} parameter is associated with the
      calling thread, while the calling thread is not in interrupt context.
  - name: ExecutingFromISR
    test-code: |
      ctx->kind = KIND_EXECUTING_FROM_ISR;
    text: |
      While the ${../if/cancel:/params[0]/name} parameter is associated with the
      calling thread, while the calling thread is in interrupt context.
  test-epilogue: null
  test-prologue: null
- name: Cancelable
  states:
  - name: Async
    test-code: |
      ctx->cancel_state = PTHREAD_CANCEL_ENABLE;
      ctx->cancel_type = PTHREAD_CANCEL_ASYNCHRONOUS;
    text: |
      While the ${../glossary/thread-cancel-state:/term} of the thread specified by
      the ${../if/cancel:/params[0]/name} parameter is ${../if/cancel-enable:/name},
      while the ${../glossary/thread-cancel-type:/term} of the thread is
      ${../if/cancel-asynchronous:/name}.
  - name: Deferred
    test-code: |
      ctx->cancel_state = PTHREAD_CANCEL_ENABLE;
      ctx->cancel_type = PTHREAD_CANCEL_DEFERRED;
    text: |
      While the ${../glossary/thread-cancel-state:/term} of the thread specified by
      the ${../if/cancel:/params[0]/name} parameter is ${../if/cancel-enable:/name},
      while the ${../glossary/thread-cancel-type:/term} of the thread is
      ${../if/cancel-deferred:/name}.
  - name: Disabled
    test-code: |
      ctx->cancel_state = PTHREAD_CANCEL_DISABLE;
      ctx->cancel_type = PTHREAD_CANCEL_ASYNCHRONOUS;
    text: |
      While the ${../glossary/thread-cancel-state:/term} of the thread specified by
      the ${../if/cancel:/params[0]/name} parameter is ${../if/cancel-disable:/name}.
  test-epilogue: |
    if ( ctx->kind != KIND_NONE ) {
      ctx->worker_id = CreateTask( "WORK", GetSelfPriority() );
      StartTask( ctx->worker_id, Worker, ctx );
    }

    if ( ctx->kind == KIND_OTHER ) {
      ctx->thread = ctx->worker_id;

      /* Let the worker set its cancelability and block itself */
      Yield();
    }
  test-prologue: null
rationale: null
references: []
requirement-type: functional
skip-reasons: {}
test-action: |
  if ( ctx->kind == KIND_NONE || ctx->kind == KIND_OTHER ) {
    ctx->retval = pthread_cancel( ctx->thread );
  }

  if ( ctx->worker_id != 0 ) {
    int eno;

    eno = pthread_join( ctx->worker_id, &ctx->worker_value );
    T_eno_success( eno );
  }
