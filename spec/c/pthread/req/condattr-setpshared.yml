enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/condattr-setpshared
- role: requirement-refinement
  uid: ../../req/group-posix-api
post-conditions:
- name: Status
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->retval, 0 );
    text: |
      The return value of ${../if/condattr-setpshared:/name} shall be equal to zero.
  - name: EINVAL
    test-code: |
      T_eq_int( ctx->retval, EINVAL );
    text: |
      The return value of ${../if/condattr-setpshared:/name} shall be equal to
      ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: AttrObj
  states:
  - name: Set
    test-code: |
      pshared = -1;
      T_eq_int( pthread_condattr_getpshared( &ctx->attr_obj, &pshared ), 0 );
      T_eq_int( pshared, ctx->pshared );
    text: |
      The process-shared attribute of the condition variable attributes object
      referenced by ${../if/condattr-setpshared:/params[0]/name} shall be set to the
      value specified by ${../if/condattr-setpshared:/params[1]/name}.
  - name: Nop
    test-code: |
      pshared = -1;
      T_eq_int( pthread_condattr_getpshared( &ctx->attr_obj, &pshared ), 0 );
      T_eq_int( pshared, PTHREAD_PROCESS_PRIVATE );
    text: |
      The process-shared attribute of the condition variable attributes object
      referenced by ${../if/condattr-setpshared:/params[0]/name} shall not be
      modified.
  test-epilogue: null
  test-prologue: |
    int pshared;
pre-conditions:
- name: Attr
  states:
  - name: Valid
    test-code: |
      ctx->attr = &ctx->attr_obj;
      T_eq_int( pthread_condattr_init( &ctx->attr_obj ), 0 );
    text: |
      While the ${../if/condattr-setpshared:/params[0]/name} parameter references an
      initialized condition variable attributes object.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/condattr-setpshared:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Pshared
  states:
  - name: Shared
    test-code: |
      ctx->pshared = PTHREAD_PROCESS_SHARED;
    text: |
      While the ${../if/condattr-setpshared:/params[1]/name} parameter is
      ${../if/process-shared:/name}.
  - name: Private
    test-code: |
      ctx->pshared = PTHREAD_PROCESS_PRIVATE;
    text: |
      While the ${../if/condattr-setpshared:/params[1]/name} parameter is
      ${../if/process-private:/name}.
  - name: Invalid
    test-code: |
      ctx->pshared = -1;
    text: |
      While the ${../if/condattr-setpshared:/params[1]/name} parameter is neither
      ${../if/process-shared:/name} nor ${../if/process-private:/name}.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
requirement-type: functional
skip-reasons: {}
