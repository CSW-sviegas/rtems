post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/condattr-setpshared:/name} shall
      be zero.
  - name: Inval
    test-code: |
      T_eq_int( ctx->status, EINVAL );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/condattr-setpshared:/name} shall
      be ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: Pshared
  states:
  - name: Shared
    test-code: |
      T_eq_int( ctx->attr_obj.process_shared, PTHREAD_PROCESS_SHARED );
    text: |
      The ${../glossary/process-shared:/term} of the
      ${../glossary/condition-variable:/term} attributes object referenced by the
      ${../if/condattr-setpshared:/params[0]/name} parameter shall be
      ${../if/process-shared:/name}.
  - name: Private
    test-code: |
      T_eq_int( ctx->attr_obj.process_shared, PTHREAD_PROCESS_PRIVATE );
    text: |
      The ${../glossary/process-shared:/term} of the
      ${../glossary/condition-variable:/term} attributes object referenced by the
      ${../if/condattr-setpshared:/params[0]/name} parameter shall be
      ${../if/process-private:/name}.
  - name: Nop
    test-code: |
      T_eq_int( ctx->attr_obj.process_shared, PSHARED_POISON );
    text: |
      The ${../glossary/process-shared:/term} of the
      ${../glossary/condition-variable:/term} attributes object referenced by the
      ${../if/condattr-setpshared:/params[0]/name} parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: Other
  states:
  - name: Nop
    test-code: |
      pthread_condattr_t expected;

      memcpy( &expected, &ctx->attr_before, sizeof( expected ) );
      expected.process_shared = ctx->attr_obj.process_shared;
      T_eq_mem( &ctx->attr_obj, &expected, sizeof( expected ) );
    text: |
      The content of the ${../glossary/condition-variable:/term} attributes object
      referenced by the ${../if/condattr-setpshared:/params[0]/name} parameter, other
      than its ${../glossary/process-shared:/term}, shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Obj
    test-code: |
      ctx->attr = &ctx->attr_obj;
    text: |
      While the ${../if/condattr-setpshared:/params[0]/name} parameter references an
      object of type ${/c/if/pthread_condattr_t:/name}.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/condattr-setpshared:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Initialized
  states:
  - name: 'Yes'
    test-code: |
      T_eno_success( pthread_condattr_init( &ctx->attr_obj ) );
      ctx->attr_obj.process_shared = PSHARED_POISON;
    text: |
      While the object referenced by the ${../if/condattr-setpshared:/params[0]/name}
      parameter is an initialized ${../glossary/condition-variable:/term} attributes
      object.
  - name: 'No'
    test-code: |
      memset( &ctx->attr_obj, 0xff, sizeof( ctx->attr_obj ) );
      ctx->attr_obj.is_initialized = 0;
      ctx->attr_obj.process_shared = PSHARED_POISON;
    text: |
      While the object referenced by the ${../if/condattr-setpshared:/params[0]/name}
      parameter is not an initialized ${../glossary/condition-variable:/term}
      attributes object.
  test-epilogue: null
  test-prologue: null
- name: Pshared
  states:
  - name: Shared
    test-code: |
      ctx->pshared = PTHREAD_PROCESS_SHARED;
    text: |
      While the ${../if/condattr-setpshared:/params[1]/name} parameter is equal to
      ${../if/process-shared:/name}.
  - name: Private
    test-code: |
      ctx->pshared = PTHREAD_PROCESS_PRIVATE;
    text: |
      While the ${../if/condattr-setpshared:/params[1]/name} parameter is equal to
      ${../if/process-private:/name}.
  - name: Invalid
    test-code: |
      ctx->pshared = PSHARED_INVALID;
    text: |
      While the ${../if/condattr-setpshared:/params[1]/name} parameter is neither
      ${../if/process-shared:/name} nor ${../if/process-private:/name}.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/pthread-condattr-getpshared:/name} specifies that
  ${../if/condattr-setpshared:/name} sets the ${../glossary/process-shared:/term}
  of the attributes object. RTEMS accepts ${../if/process-private:/name} and
  ${../if/process-shared:/name}, which gives post-condition Pshared.

  The standard states that ${../if/condattr-setpshared:/name} may fail with
  ${/c/errno/if/einval:/name} where the new value specified for the attribute is
  outside the range of legal values for that attribute. RTEMS returns
  ${/c/errno/if/einval:/name} for each value other than
  ${../if/process-private:/name} and ${../if/process-shared:/name}, which gives
  state Invalid of pre-condition Pshared.

  The standard marks ${../if/condattr-setpshared:/name} as part of the Thread
  Process-Shared Synchronization option. The C library of RTEMS defines the
  feature test macro of this option and the ${../glossary/process-shared:/term}
  in the ${../glossary/condition-variable:/term} attributes object
  unconditionally. No build option of RTEMS removes them. RTEMS has one process,
  and ${../if/condattr-setpshared:/name} accepts and stores
  ${../if/process-shared:/name} nevertheless.

  The standard leaves the behaviour undefined where the
  ${../if/condattr-setpshared:/params[0]/name} parameter references no
  initialized ${../glossary/condition-variable:/term} attributes object. It
  recommends ${/c/errno/if/einval:/name} for that case.
  ${../if/condattr-setpshared:/name} does not check whether the object is
  initialized and does not follow the recommendation. State No of pre-condition
  Initialized specifies the behaviour of RTEMS which sets the
  ${../glossary/process-shared:/term} of the object in this case as well. The
  standard does not define the behaviour where the
  ${../if/condattr-setpshared:/params[0]/name} parameter is ${/c/if/null:/name}.
  State Null of pre-condition Attr specifies the behaviour of RTEMS which returns
  ${/c/errno/if/einval:/name}.
requirement-type: functional
skip-reasons: {}
