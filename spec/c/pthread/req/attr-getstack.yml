rationale: |
  ${/ref/std/posix-2024/pthread-attr-getstack:/name} specifies that
  ${../if/attr-getstack:/name} stores the
  ${../glossary/thread-stack-address:/term} in the object referenced by the
  ${../if/attr-getstack:/params[1]/name} parameter and the
  ${../glossary/thread-stack-size:/term} in the object referenced by the
  ${../if/attr-getstack:/params[2]/name} parameter. This gives post-conditions
  StackAddr and StackSize. The states of pre-condition StoredStackAddr are the
  default ${/c/if/null:/name} of ${../if/attr-init:/name} in RTEMS and an address
  of a stack area. The standard leaves the behaviour unspecified where the stack
  address was not set. RTEMS stores the default in that case, which state Null of
  pre-condition StoredStackAddr specifies. The states of pre-condition
  StoredStackSize are zero, the default of ${../if/attr-init:/name} in RTEMS, and
  a value greater than zero.

  The standard does not define the behaviour where the
  ${../if/attr-getstack:/params[1]/name} parameter and the
  ${../if/attr-getstack:/params[2]/name} parameter is ${/c/if/null:/name}. The
  ${/c/if/null:/name} states specify the behaviour of RTEMS which returns
  ${/c/errno/if/einval:/name}.

  The standard leaves the behaviour undefined where the
  ${../if/attr-getstack:/params[0]/name} parameter references no initialized
  ${../glossary/thread:/term} attributes object. It recommends
  ${/c/errno/if/einval:/name} for that case. State Null of pre-condition Attr and
  state No of pre-condition Initialized specify the behaviour of RTEMS which
  follows that recommendation.

  ${../if/attr-getstack:/name} does not write the ${../glossary/thread:/term}
  attributes object, which post-condition Attr specifies.
