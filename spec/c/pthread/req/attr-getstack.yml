transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Attr:
          - 'Null'
          - Invalid
      then: EINVAL
    - if:
        pre-conditions:
          StackAddr: 'Null'
      then: EINVAL
    - if:
        pre-conditions:
          StackSize: 'Null'
      then: EINVAL
    - else: Zero
    StackAddrObj:
    - if:
        pre-conditions:
          StackAddr: 'Null'
      then: N/A
    - if:
        post-conditions:
          Status: Zero
      then: Set
    - else: Nop
    StackSizeObj:
    - if:
        pre-conditions:
          StackSize: 'Null'
      then: N/A
    - if:
        post-conditions:
          Status: Zero
      then: Set
    - else: Nop
  pre-conditions:
