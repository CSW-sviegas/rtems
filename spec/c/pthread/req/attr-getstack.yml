enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/attr-getstack
- role: requirement-refinement
  uid: ../../req/group-posix-api
post-conditions:
- name: Status
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->retval, 0 );
    text: |
      The return value of ${../if/attr-getstack:/name} shall be equal to zero.
  - name: EINVAL
    test-code: |
      T_eq_int( ctx->retval, EINVAL );
    text: |
      The return value of ${../if/attr-getstack:/name} shall be equal to
      ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: StackAddrObj
  states:
  - name: Set
    test-code: |
      T_eq_ptr( ctx->stackaddr_value, STACK_ADDR_VALUE );
    text: |
      The value of the object referenced by the
      ${../if/attr-getstack:/params[1]/name} parameter shall be set to the
      ${../glossary/thread-stack-address:/term} of the ${../glossary/thread:/term}
      attributes object referenced by the ${../if/attr-getstack:/params[0]/name}
      parameter.
  - name: Nop
    test-code: |
      T_eq_ptr( ctx->stackaddr_value, STALE_STACK_ADDR );
    text: |
      The object referenced by the ${../if/attr-getstack:/params[1]/name} parameter
      shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: StackSizeObj
  states:
  - name: Set
    test-code: |
      T_eq_sz( ctx->stacksize_value, STACK_SIZE_VALUE );
    text: |
      The value of the object referenced by the
      ${../if/attr-getstack:/params[2]/name} parameter shall be set to the
      ${../glossary/thread-stack-size:/term} of the ${../glossary/thread:/term}
      attributes object referenced by the ${../if/attr-getstack:/params[0]/name}
      parameter.
  - name: Nop
    test-code: |
      T_eq_sz( ctx->stacksize_value, STALE_STACK_SIZE );
    text: |
      The object referenced by the ${../if/attr-getstack:/params[2]/name} parameter
      shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Valid
    test-code: |
      ctx->attr = &ctx->attr_obj;
      pthread_attr_init( &ctx->attr_obj );
      pthread_attr_setstack( &ctx->attr_obj, STACK_ADDR_VALUE, STACK_SIZE_VALUE );
    text: |
      While the ${../if/attr-getstack:/params[0]/name} parameter references an
      initialized ${../glossary/thread:/term} attributes object.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/attr-getstack:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  - name: Invalid
    test-code: |
      ctx->attr = &ctx->attr_obj;
      memset( &ctx->attr_obj, 0x0, sizeof( ctx->attr_obj ) );
    text: |
      While the ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-getstack:/params[0]/name} parameter is not initialized.
  test-epilogue: null
  test-prologue: null
- name: StackAddr
  states:
  - name: Valid
    test-code: |
      ctx->stackaddr_value = STALE_STACK_ADDR;
      ctx->stackaddr = &ctx->stackaddr_value;
    text: |
      While the ${../if/attr-getstack:/params[1]/name} parameter references an object
      of type `void *`.
  - name: 'Null'
    test-code: |
      ctx->stackaddr = NULL;
    text: |
      While the ${../if/attr-getstack:/params[1]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: StackSize
  states:
  - name: Valid
    test-code: |
      ctx->stacksize_value = STALE_STACK_SIZE;
      ctx->stacksize = &ctx->stacksize_value;
    text: |
      While the ${../if/attr-getstack:/params[2]/name} parameter references an object
      of type ${/c/if/size_t:/name}.
  - name: 'Null'
    test-code: |
      ctx->stacksize = NULL;
    text: |
      While the ${../if/attr-getstack:/params[2]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
rationale: null
