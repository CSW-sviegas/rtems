enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/attr-setschedpolicy
post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_rsc_success( ctx->retval );
    text: |
      The return status of ${../if/attr-setschedpolicy:/name} shall be zero.
  - name: Einval
    test-code: |
      T_rsc( ctx->retval, EINVAL );
    text: |
      The return status of ${../if/attr-setschedpolicy:/name} shall be
      ${/c/errno/if/einval:/name}.
  - name: Enotsup
    test-code: |
      T_rsc( ctx->retval, ENOTSUP );
    text: |
      The return status of ${../if/attr-setschedpolicy:/name} shall be
      ${/c/errno/if/enotsup:/name}.
  test-epilogue: null
  test-prologue: null
- name: AttrObj
  states:
  - name: Set
    test-code: |
      T_eq_int( ctx->attr_obj.schedpolicy, ctx->policy );
    text: |
      The value of the ${/c/sched/glossary/policy:/term} of the
      ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-setschedpolicy:/params[0]/name} parameter shall be set to the
      policy specified by the ${../if/attr-setschedpolicy:/params[1]/name} parameter.
  - name: Nop
    test-code: |
      T_eq_int( ctx->attr_obj.schedpolicy, -1 );
    text: |
      The ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-setschedpolicy:/params[0]/name} parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Valid
    test-code: |
      ctx->attr = &ctx->attr_obj;
      pthread_attr_init( &ctx->attr_obj );
      ctx->attr_obj.schedpolicy = -1;
    text: |
      While the ${../if/attr-setschedpolicy:/params[0]/name} parameter references an
      initialized ${../glossary/thread:/term} attributes object.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/attr-setschedpolicy:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  - name: Invalid
    test-code: |
      ctx->attr = &ctx->attr_obj;
      memset( &ctx->attr_obj, 0x0, sizeof( ctx->attr_obj ) );
      ctx->attr_obj.schedpolicy = -1;
    text: |
      While the ${../glossary/thread:/term} attributes object referenced by the
      ${../if/attr-setschedpolicy:/params[0]/name} parameter is not initialized.
  test-epilogue: null
  test-prologue: null
- name: Policy
  states:
  - name: Other
    test-code: |
      ctx->policy = SCHED_OTHER;
    text: |
      While the ${../if/attr-setschedpolicy:/params[1]/name} parameter is equal to
      ${/c/sched/if/other:/name}.
  - name: Fifo
    test-code: |
      ctx->policy = SCHED_FIFO;
    text: |
      While the ${../if/attr-setschedpolicy:/params[1]/name} parameter is equal to
      ${/c/sched/if/fifo:/name}.
  - name: RoundRobin
    test-code: |
      ctx->policy = SCHED_RR;
    text: |
      While the ${../if/attr-setschedpolicy:/params[1]/name} parameter is equal to
      ${/c/sched/if/rr:/name}.
  - name: Sporadic
    test-code: |
      ctx->policy = SCHED_SPORADIC;
    text: |
      While the ${../if/attr-setschedpolicy:/params[1]/name} parameter is equal to
      ${/c/sched/if/sporadic:/name}.
  - name: Invalid
    test-code: |
      ctx->policy = POLICY_INVALID;
    text: |
      While the ${../if/attr-setschedpolicy:/params[1]/name} parameter is not a valid
      ${/c/sched/glossary/policy:/term}.
  test-epilogue: null
  test-prologue: null
rationale: null
