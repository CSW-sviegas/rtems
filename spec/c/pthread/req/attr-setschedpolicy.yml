enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/attr-setschedpolicy
- role: requirement-refinement
  uid: ../../req/group-posix-api
- role: reference
  uid: /ref/std/posix-2024/pthread-attr-getschedpolicy
post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/attr-setschedpolicy:/name} shall
      be zero.
  - name: Inval
    test-code: |
      T_eq_int( ctx->status, EINVAL );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/attr-setschedpolicy:/name} shall
      be ${/c/errno/if/einval:/name}.
  - name: NotSup
    test-code: |
      T_eq_int( ctx->status, ENOTSUP );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/attr-setschedpolicy:/name} shall
      be ${/c/errno/if/enotsup:/name}.
  test-epilogue: null
  test-prologue: null
- name: Policy
  states:
  - name: Other
    test-code: |
      T_eq_int( ctx->attr_obj.schedpolicy, SCHED_OTHER );
    text: |
      The ${/c/sched/glossary/policy:/term} of the ${../glossary/thread:/term}
      attributes object referenced by the
      ${../if/attr-setschedpolicy:/params[0]/name} parameter shall be
      ${../../sched/if/other:/name}.
  - name: Fifo
    test-code: |
      T_eq_int( ctx->attr_obj.schedpolicy, SCHED_FIFO );
    text: |
      The ${/c/sched/glossary/policy:/term} of the ${../glossary/thread:/term}
      attributes object referenced by the
      ${../if/attr-setschedpolicy:/params[0]/name} parameter shall be
      ${../../sched/if/fifo:/name}.
  - name: RoundRobin
    test-code: |
      T_eq_int( ctx->attr_obj.schedpolicy, SCHED_RR );
    text: |
      The ${/c/sched/glossary/policy:/term} of the ${../glossary/thread:/term}
      attributes object referenced by the
      ${../if/attr-setschedpolicy:/params[0]/name} parameter shall be
      ${../../sched/if/rr:/name}.
  - name: Sporadic
    test-code: |
      T_eq_int( ctx->attr_obj.schedpolicy, SCHED_SPORADIC );
    text: |
      The ${/c/sched/glossary/policy:/term} of the ${../glossary/thread:/term}
      attributes object referenced by the
      ${../if/attr-setschedpolicy:/params[0]/name} parameter shall be
      ${../../sched/if/sporadic:/name}.
  - name: Nop
    test-code: |
      T_eq_int( ctx->attr_obj.schedpolicy, ctx->attr_before.schedpolicy );
    text: |
      The ${/c/sched/glossary/policy:/term} of the ${../glossary/thread:/term}
      attributes object referenced by the
      ${../if/attr-setschedpolicy:/params[0]/name} parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: Other
  states:
  - name: Nop
    test-code: |
      pthread_attr_t expected;

      memcpy( &expected, &ctx->attr_before, sizeof( expected ) );
      expected.schedpolicy = ctx->attr_obj.schedpolicy;
      T_eq_mem( &ctx->attr_obj, &expected, sizeof( expected ) );
    text: |
      The content of the ${../glossary/thread:/term} attributes object referenced by
      the ${../if/attr-setschedpolicy:/params[0]/name} parameter, other than its
      ${/c/sched/glossary/policy:/term}, shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Obj
    test-code: |
      ctx->attr = &ctx->attr_obj;
    text: |
      While the ${../if/attr-setschedpolicy:/params[0]/name} parameter references an
      object of type ${/c/if/pthread_attr_t:/name}.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/attr-setschedpolicy:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Initialized
  states:
  - name: 'Yes'
    test-code: |
      T_eno_success( pthread_attr_init( &ctx->attr_obj ) );
      ctx->attr_obj.schedpolicy = -1;
    text: |
      While the object referenced by the ${../if/attr-setschedpolicy:/params[0]/name}
      parameter is an initialized ${../glossary/thread:/term} attributes object.
  - name: 'No'
    test-code: |
      memset( &ctx->attr_obj, 0, sizeof( ctx->attr_obj ) );
      ctx->attr_obj.schedpolicy = -1;
    text: |
      While the object referenced by the ${../if/attr-setschedpolicy:/params[0]/name}
      parameter is not an initialized ${../glossary/thread:/term} attributes object.
  test-epilogue: null
  test-prologue: null
- name: Policy
  states:
  - name: Other
    test-code: |
      ctx->policy = SCHED_OTHER;
    text: |
      While the ${../if/attr-setschedpolicy:/params[1]/name} parameter is equal to
      ${../../sched/if/other:/name}.
  - name: Fifo
    test-code: |
      ctx->policy = SCHED_FIFO;
    text: |
      While the ${../if/attr-setschedpolicy:/params[1]/name} parameter is equal to
      ${../../sched/if/fifo:/name}.
  - name: RoundRobin
    test-code: |
      ctx->policy = SCHED_RR;
    text: |
      While the ${../if/attr-setschedpolicy:/params[1]/name} parameter is equal to
      ${../../sched/if/rr:/name}.
  - name: Sporadic
    test-code: |
      ctx->policy = SCHED_SPORADIC;
    text: |
      While the ${../if/attr-setschedpolicy:/params[1]/name} parameter is equal to
      ${../../sched/if/sporadic:/name}.
  - name: Invalid
    test-code: |
      ctx->policy = POLICY_INVALID;
    text: |
      While the ${../if/attr-setschedpolicy:/params[1]/name} parameter is not a valid
      ${/c/sched/glossary/policy:/term}.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/pthread-attr-getschedpolicy:/name} requires that the
  supported values of the ${../if/attr-setschedpolicy:/params[1]/name} parameter
  include ${../../sched/if/fifo:/name}, ${../../sched/if/rr:/name}, and
  ${../../sched/if/other:/name}. RTEMS supports the Process Sporadic Server
  option and also accepts ${../../sched/if/sporadic:/name}. This gives the states
  of pre-condition Policy and of post-condition Policy.

  The standard requires ${/c/errno/if/enotsup:/name} for an attempt to set an
  unsupported value and permits ${/c/errno/if/einval:/name} for a value which is
  not valid. RTEMS does not distinguish the two cases and returns
  ${/c/errno/if/enotsup:/name} for every other value, which state Invalid of
  pre-condition Policy specifies. Since the ${/c/errno/if/einval:/name} error is
  optional, this conforms to the standard.

  The standard leaves the behaviour undefined where the
  ${../if/attr-setschedpolicy:/params[0]/name} parameter references no
  initialized ${../glossary/thread:/term} attributes object. State Null of
  pre-condition Attr and state No of pre-condition Initialized specify that RTEMS
  returns ${/c/errno/if/einval:/name}. RTEMS checks these conditions before the
  value of the ${../if/attr-setschedpolicy:/params[1]/name} parameter.

  ${../if/attr-setschedpolicy:/name} writes no other attribute of the object,
  which post-condition Other specifies.
requirement-type: functional
