text: |
  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Attr: 'Null'
      then: EINVAL
    - if:
        pre-conditions:
          Clock: Invalid
      then: EINVAL
    - else: Zero
    AttrObj:
    - if:
        pre-conditions:
          Attr: 'Null'
      then: N/A
    - if:
        post-conditions:
          Status: Zero
      then: Set
    - else: Nop
  pre-conditions:
    Attr: all
    Clock: all
type: requirement
