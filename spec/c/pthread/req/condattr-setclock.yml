enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/condattr-setclock
- role: requirement-refinement
  uid: ../../req/group-posix-api
post-conditions:
- name: Status
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->retval, 0 );
    text: |
      The return value of ${../if/condattr-setclock:/name} shall be equal to zero.
  - name: EINVAL
    test-code: |
      T_eq_int( ctx->retval, EINVAL );
    text: |
      The return value of ${../if/condattr-setclock:/name} shall be equal to
      ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: AttrObj
  states:
  - name: Set
    test-code: |
      clockid_t clock_id;
      int       eno;

      eno = pthread_condattr_getclock( &ctx->attr_obj, &clock_id );
      T_eno_success( eno );
      T_eq_int( clock_id, ctx->clock_id );
    text: |
      The ${../glossary/cond-clock:/term} of the
      ${../glossary/condition-variable:/term} attributes object referenced by the
      ${../if/condattr-setclock:/params[0]/name} parameter shall be set to the clock
      specified by the ${../if/condattr-setclock:/params[1]/name} parameter.
  - name: Nop
    test-code: |
      T_eq_int( ctx->attr_obj.clock, -1 );
    text: |
      The ${../glossary/condition-variable:/term} attributes object referenced by the
      ${../if/condattr-setclock:/params[0]/name} parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Valid
    test-code: |
      ctx->attr = &ctx->attr_obj;
      pthread_condattr_init( &ctx->attr_obj );
      ctx->attr_obj.clock = -1;
    text: |
      While the ${../if/condattr-setclock:/params[0]/name} parameter references an
      initialized ${../glossary/condition-variable:/term} attributes object.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/condattr-setclock:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Clock
  states:
  - name: Realtime
    test-code: |
      ctx->clock_id = CLOCK_REALTIME;
    text: |
      While the ${../if/condattr-setclock:/params[1]/name} parameter is equal to
      ${../../time/if/clock-realtime:/name}.
  - name: Monotonic
    test-code: |
      ctx->clock_id = CLOCK_MONOTONIC;
    text: |
      While the ${../if/condattr-setclock:/params[1]/name} parameter is equal to
      ${../../time/if/clock-monotonic:/name}.
  - name: Invalid
    test-code: |
      ctx->clock_id = CLOCK_PROCESS_CPUTIME_ID;
    text: |
      While the ${../if/condattr-setclock:/params[1]/name} parameter is neither
      ${../../time/if/clock-realtime:/name} nor
      ${../../time/if/clock-monotonic:/name}.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
requirement-type: functional
skip-reasons: {}
