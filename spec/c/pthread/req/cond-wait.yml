  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status: Inval
    Init: N/A
    Binding: N/A
    Owner: N/A
    Blocking: 'No'
  pre-conditions:
    Cond:
    - 'Null'
    CondInit: N/A
    Binding: N/A
    Mutex: N/A
    MutexInit: N/A
    MutexOwner: N/A
    Wake: N/A
- enabled-by: true
  post-conditions:
    Status:
    - if:
      - pre-conditions:
          CondInit: 'No'
      - pre-conditions:
          Binding: Other
      then: Inval
    - if:
      - pre-conditions:
          Mutex: 'Null'
      - pre-conditions:
          MutexInit: 'No'
      - pre-conditions:
          MutexOwner:
          - Other
          - Nobody
      then: Perm
    - if:
        pre-conditions:
          Wake: MutexDestroyed
      then: Inval
    - else: Ok
    Init:
    - if:
        pre-conditions:
          CondInit: Zeroed
      then: Default
    - else: Nop
    Binding:
    - if:
      - pre-conditions:
          CondInit: 'No'
      - pre-conditions:
          Binding: Other
      then: Nop
    - if:
        pre-conditions:
          Wake:
          - Broadcast
          - MutexDestroyed
      then: N/A
    - if:
        and:
        - post-conditions:
            Status: Perm
        - pre-conditions:
            Mutex: Obj
      then: Mutex
    - else: None
    Owner:
    - if:
      - pre-conditions:
          Mutex: 'Null'
      - pre-conditions:
          MutexInit: 'No'
      - pre-conditions:
          Wake: MutexDestroyed
      then: N/A
    - if:
        post-conditions:
          Status: Ok
      then: Caller
    - specified-by: MutexOwner
    Blocking:
    - if:
        pre-conditions:
          Wake:
          - Broadcast
          - MutexDestroyed
      then: 'Yes'
    - else: 'No'
  pre-conditions:
    Cond:
    - Obj
    CondInit: all
    Binding:
      applicable:
        pre-conditions:
          CondInit: 'Yes'
    Mutex:
    - Obj
    MutexInit: all
    MutexOwner:
      applicable:
        pre-conditions:
          MutexInit: 'Yes'
    Wake:
      applicable:
        and:
        - pre-conditions:
            CondInit:
            - 'Yes'
            - Zeroed
            MutexOwner: Caller
        - not:
            pre-conditions:
              Binding: Other
- enabled-by: true
  post-conditions:
    Status:
    - if:
      - pre-conditions:
          CondInit: 'No'
      - pre-conditions:
          Binding: Other
      then: Inval
    - if:
      - pre-conditions:
          Mutex: 'Null'
      - pre-conditions:
          MutexInit: 'No'
      - pre-conditions:
          MutexOwner:
          - Other
          - Nobody
      then: Perm
    - if:
        pre-conditions:
          Wake: MutexDestroyed
      then: Inval
    - else: Ok
    Init:
    - if:
        pre-conditions:
          CondInit: Zeroed
      then: Default
    - else: Nop
    Binding:
    - if:
      - pre-conditions:
          CondInit: 'No'
