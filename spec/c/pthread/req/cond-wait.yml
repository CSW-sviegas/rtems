transition-map:
- enabled-by: true
  post-conditions:
    Status: EINVAL
    Owner: N/A
  pre-conditions:
    Cond:
    - 'Null'
    - Invalid
    Waiters: N/A
    Mutex: N/A
    Wakeup: N/A
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Waiters: OtherMutex
      then: EINVAL
    - if:
        pre-conditions:
          Mutex:
          - 'Null'
          - Invalid
          - Unlocked
      then: EPERM
    - if:
        pre-conditions:
          Wakeup: MutexDestroyed
      then: EINVAL
    - else: Zero
    Owner:
    - if:
      - pre-conditions:
          Mutex:
          - 'Null'
          - Invalid
      - pre-conditions:
          Wakeup: MutexDestroyed
      then: N/A
    - if:
        pre-conditions:
          Mutex: Owned
      then: Caller
    - else: Nobody
  pre-conditions:
    Cond:
    - Zeroed
    - Valid
    Waiters:
      applicable:
      - pre-conditions:
          Cond: Valid
          Waiters:
          - 'No'
          - OtherMutex
      - pre-conditions:
          Cond: Valid
          Mutex:
          - Unlocked
          - Owned
          Waiters: SameMutex
    Mutex: all
    Wakeup:
      applicable:
      - pre-conditions:
          Cond: Zeroed
          Mutex: Owned
      - pre-conditions:
          Cond: Valid
          Mutex: Owned
          Waiters:
          - 'No'
          - SameMutex
