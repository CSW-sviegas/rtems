enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/cond-wait
- role: requirement-refinement
  uid: ../../req/group-posix-api
post-conditions:
- name: Status
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->retval, 0 );
    text: |
      The return value of ${../if/cond-wait:/name} shall be equal to zero.
  - name: EINVAL
    test-code: |
      T_eq_int( ctx->retval, EINVAL );
    text: |
      The return value of ${../if/cond-wait:/name} shall be equal to
      ${/c/errno/if/einval:/name}.
  - name: EPERM
    test-code: |
      T_eq_int( ctx->retval, EPERM );
    text: |
      The return value of ${../if/cond-wait:/name} shall be equal to
      ${/c/errno/if/eperm:/name}.
  test-epilogue: null
  test-prologue: null
- name: Owner
  states:
  - name: Caller
    test-code: |
      eno = pthread_mutex_unlock( ctx->mutex );
      T_eq_int( eno, 0 );
    text: |
      The mutex object shall be owned by the calling thread.
  - name: Nobody
    test-code: |
      eno = pthread_mutex_unlock( ctx->mutex );
      T_eq_int( eno, EPERM );
    text: |
      The mutex object shall not be owned by any thread.
  test-epilogue: null
  test-prologue: |
    int eno;
pre-conditions:
- name: Cond
  states:
  - name: 'Null'
    test-code: |
      ctx->cond = NULL;
    text: |
      While the ${../if/cond-wait:/params[0]/name} parameter is ${/c/if/null:/name}.
  - name: Invalid
    test-code: |
      memset( &ctx->cond_obj, 0xff, sizeof( ctx->cond_obj ) );
      ctx->cond = &ctx->cond_obj;
    text: |
      While the ${../if/cond-wait:/params[0]/name} parameter references an object
      which is neither initialized nor filled with zero bytes.
  - name: Zeroed
    test-code: |
      memset( &ctx->cond_obj, 0, sizeof( ctx->cond_obj ) );
      ctx->cond = &ctx->cond_obj;
    text: |
      While the ${../if/cond-wait:/params[0]/name} parameter references an object
      filled with zero bytes.
  - name: Valid
    test-code: |
      eno = pthread_cond_init( &ctx->cond_obj, NULL );
      T_eq_int( eno, 0 );
      ctx->cond = &ctx->cond_obj;
    text: |
      While the ${../if/cond-wait:/params[0]/name} parameter references an
      initialized condition variable object.
  test-epilogue: null
  test-prologue: |
    int eno;
- name: Waiters
  states:
  - name: 'No'
    test-code: |
      /* Nothing to prepare */
    text: |
      While no thread waits on the condition variable object.
  - name: OtherMutex
    test-code: |
      ctx->worker_mutex = &ctx->other_mutex_obj;
      ctx->worker_id = CreateTask( "WORK", PRIO_HIGH );
      StartTask( ctx->worker_id, Worker, ctx );
      WaitForExecutionStop( ctx->worker_id );
    text: |
      While a thread waits on the condition variable object using a mutex other than
      the one referenced by the ${../if/cond-wait:/params[1]/name} parameter.
  - name: SameMutex
    test-code: |
      eno = pthread_mutex_init( &ctx->mutex_obj, NULL );
      T_eq_int( eno, 0 );
      ctx->worker_mutex = &ctx->mutex_obj;
      ctx->worker_id = CreateTask( "WORK", PRIO_HIGH );
      StartTask( ctx->worker_id, Worker, ctx );
      WaitForExecutionStop( ctx->worker_id );
    text: |
      While a thread waits on the condition variable object using the mutex
      referenced by the ${../if/cond-wait:/params[1]/name} parameter.
  test-epilogue: null
  test-prologue: |
    int eno;
- name: Mutex
  states:
  - name: 'Null'
    test-code: |
      ctx->mutex = NULL;
    text: |
      While the ${../if/cond-wait:/params[1]/name} parameter is ${/c/if/null:/name}.
  - name: Invalid
    test-code: |
      memset( &ctx->mutex_obj, 0xff, sizeof( ctx->mutex_obj ) );
      ctx->mutex = &ctx->mutex_obj;
    text: |
      While the ${../if/cond-wait:/params[1]/name} parameter references an object
      which is neither initialized nor filled with zero bytes.
  - name: Unlocked
    test-code: |
      eno = pthread_mutex_init( &ctx->mutex_obj, NULL );
      T_eq_int( eno, 0 );
      ctx->mutex = &ctx->mutex_obj;
    text: |
      While the ${../if/cond-wait:/params[1]/name} parameter references an
      initialized mutex object which is not owned by any thread.
  - name: Owned
    test-code: |
      eno = pthread_mutex_init( &ctx->mutex_obj, NULL );
      T_eq_int( eno, 0 );
      eno = pthread_mutex_lock( &ctx->mutex_obj );
      T_eq_int( eno, 0 );
      ctx->mutex = &ctx->mutex_obj;
    text: |
      While the ${../if/cond-wait:/params[1]/name} parameter references an
      initialized mutex object which is owned by the calling thread.
  test-epilogue: null
  test-prologue: |
    int eno;
- name: Wakeup
  states:
  - name: Broadcast
    test-code: |
      ctx->waker_id = CreateTask( "WAKE", PRIO_LOW );
      StartTask( ctx->waker_id, Waker, ctx );
    text: |
      While the condition variable object is broadcast after the calling thread
      started to wait.
  - name: MutexDestroyed
    test-code: |
      ctx->destroy_mutex = true;
      ctx->waker_id = CreateTask( "WAKE", PRIO_LOW );
      StartTask( ctx->waker_id, Waker, ctx );
    text: |
      While the mutex object is destroyed and then the condition variable object is
      broadcast after the calling thread started to wait.
  test-epilogue: null
  test-prologue: null
rationale: null
