post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/condattr-destroy:/name} shall be
      zero.
  - name: Inval
    test-code: |
      T_eq_int( ctx->status, EINVAL );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/condattr-destroy:/name} shall be
      ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: Initialized
  states:
  - name: 'No'
    test-code: |
      T_false( ctx->attr_obj.is_initialized );
    text: |
      The object referenced by the ${../if/condattr-destroy:/params[0]/name}
      parameter shall not be an initialized ${../glossary/condition-variable:/term}
      attributes object.
  - name: Nop
    test-code: |
      T_eq_int( ctx->attr_obj.is_initialized, ctx->attr_before.is_initialized );
    text: |
      Whether the object referenced by the ${../if/condattr-destroy:/params[0]/name}
      parameter is an initialized ${../glossary/condition-variable:/term} attributes
      object shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: Other
  states:
  - name: Nop
    test-code: |
      pthread_condattr_t expected;

      memcpy( &expected, &ctx->attr_before, sizeof( expected ) );
      expected.is_initialized = ctx->attr_obj.is_initialized;
      T_eq_mem( &ctx->attr_obj, &expected, sizeof( expected ) );
    text: |
      The content of the object referenced by the
      ${../if/condattr-destroy:/params[0]/name} parameter, other than whether it is
      an initialized ${../glossary/condition-variable:/term} attributes object, shall
      not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Obj
    test-code: |
      ctx->attr = &ctx->attr_obj;
    text: |
      While the ${../if/condattr-destroy:/params[0]/name} parameter references an
      object of type ${/c/if/pthread_condattr_t:/name}.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/condattr-destroy:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Initialized
  states:
  - name: 'Yes'
    test-code: |
      T_eno_success( pthread_condattr_init( &ctx->attr_obj ) );
    text: |
      While the object referenced by the ${../if/condattr-destroy:/params[0]/name}
      parameter is an initialized ${../glossary/condition-variable:/term} attributes
      object.
  - name: 'No'
    test-code: |
      memset( &ctx->attr_obj, 0xff, sizeof( ctx->attr_obj ) );
      ctx->attr_obj.is_initialized = 0;
    text: |
      While the object referenced by the ${../if/condattr-destroy:/params[0]/name}
      parameter is not an initialized ${../glossary/condition-variable:/term}
      attributes object.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/pthread-condattr-destroy:/name} specifies that
  ${../if/condattr-destroy:/name} destroys the
  ${../glossary/condition-variable:/term} attributes object, so that the object
  becomes, in effect, uninitialized, and permits an implementation to set it to
  an invalid value. RTEMS marks the object as not initialized, which
  post-condition Initialized specifies, and keeps the other content, which
  post-condition Other specifies.

  The standard leaves the behaviour undefined where the
  ${../if/condattr-destroy:/params[0]/name} parameter references no initialized
  ${../glossary/condition-variable:/term} attributes object. RTEMS records in the
  object whether it is initialized and reads only this record, so state No of
  pre-condition Initialized gives the object this record and arbitrary other
  content. State Null of pre-condition Attr and state No of pre-condition
  Initialized specify the behaviour of RTEMS which returns
  ${/c/errno/if/einval:/name}.

  The standard specifies no error for ${../if/condattr-destroy:/name}.
requirement-type: functional
skip-reasons: {}
test-action: |
  memcpy( &ctx->attr_before, &ctx->attr_obj, sizeof( ctx->attr_before ) );
  ctx->status = pthread_condattr_destroy( ctx->attr );
