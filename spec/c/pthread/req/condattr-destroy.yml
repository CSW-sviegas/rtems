enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/condattr-destroy
- role: requirement-refinement
  uid: ../../req/group-posix-api
post-conditions:
- name: Status
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->retval, 0 );
    text: |
      The return value of ${../if/condattr-destroy:/name} shall be equal to zero.
  - name: EINVAL
    test-code: |
      T_eq_int( ctx->retval, EINVAL );
    text: |
      The return value of ${../if/condattr-destroy:/name} shall be equal to
      ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: AttrObj
  states:
  - name: Destroyed
    test-code: |
      T_eq_int( pthread_condattr_destroy( &ctx->attr_obj ), EINVAL );
    text: |
      The condition variable attributes object referenced by the
      ${../if/condattr-destroy:/params[0]/name} parameter shall be invalid.
  - name: Nop
    test-code: |
      T_eq_int(
        memcmp( &ctx->attr_obj, &ctx->attr_copy, sizeof( ctx->attr_obj ) ),
        0
      );
    text: |
      The condition variable attributes object referenced by the
      ${../if/condattr-destroy:/params[0]/name} parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Valid
    test-code: |
      ctx->attr = &ctx->attr_obj;
      T_eq_int( pthread_condattr_init( &ctx->attr_obj ), 0 );
    text: |
      While the condition variable attributes object referenced by the
      ${../if/condattr-destroy:/params[0]/name} parameter is valid.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
      memset( &ctx->attr_obj, 0, sizeof( ctx->attr_obj ) );
    text: |
      While the ${../if/condattr-destroy:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  - name: Invalid
    test-code: |
      ctx->attr = &ctx->attr_obj;
      memset( &ctx->attr_obj, 0, sizeof( ctx->attr_obj ) );
    text: |
      While the condition variable attributes object referenced by the
      ${../if/condattr-destroy:/params[0]/name} parameter is invalid.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
