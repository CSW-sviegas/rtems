enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/setcanceltype
- role: requirement-refinement
  uid: ../../req/group-posix-api
post-conditions:
- name: Status
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->retval, 0 );
    text: |
      The return value of ${../if/setcanceltype:/name} shall be equal to zero.
  - name: EPROTO
    test-code: |
      T_eq_int( ctx->retval, EPROTO );
    text: |
      The return value of ${../if/setcanceltype:/name} shall be equal to
      ${/c/errno/if/eproto:/name}.
  - name: EINVAL
    test-code: |
      T_eq_int( ctx->retval, EINVAL );
    text: |
      The return value of ${../if/setcanceltype:/name} shall be equal to
      ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: Type
  states:
  - name: Deferred
    test-code: |
      T_eq_int( GetCancelType(), PTHREAD_CANCEL_DEFERRED );
    text: |
      The ${../glossary/thread-cancel-type:/term} of the calling thread shall be
      ${/c/pthread/if/cancel-deferred:/name} after the return of the
      ${../if/setcanceltype:/name} call.
  - name: Async
    test-code: |
      T_eq_int( GetCancelType(), PTHREAD_CANCEL_ASYNCHRONOUS );
    text: |
      The ${../glossary/thread-cancel-type:/term} of the calling thread shall be
      ${/c/pthread/if/cancel-asynchronous:/name} after the return of the
      ${../if/setcanceltype:/name} call.
  - name: Nop
    test-code: |
      T_eq_int( GetCancelType(), ctx->previous_type );
    text: |
      The ${../glossary/thread-cancel-type:/term} of the calling thread shall not be
      changed by the ${../if/setcanceltype:/name} call.
  test-epilogue: null
  test-prologue: null
- name: OldType
  states:
  - name: Deferred
    test-code: |
      T_eq_int( ctx->old_type, PTHREAD_CANCEL_DEFERRED );
    text: |
      The value of the object referenced by the
      ${../if/setcanceltype:/params[1]/name} parameter shall be set to
      ${/c/pthread/if/cancel-deferred:/name}.
  - name: Async
    test-code: |
      T_eq_int( ctx->old_type, PTHREAD_CANCEL_ASYNCHRONOUS );
    text: |
      The value of the object referenced by the
      ${../if/setcanceltype:/params[1]/name} parameter shall be set to
      ${/c/pthread/if/cancel-asynchronous:/name}.
  - name: Nop
    test-code: |
      T_eq_int( ctx->old_type, INVALID_TYPE );
    text: |
      Objects referenced by the ${../if/setcanceltype:/params[1]/name} parameter in
      past calls to ${../if/setcanceltype:/name} shall not be accessed by the
      ${../if/setcanceltype:/name} call.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Context
  states:
  - name: Thread
    test-code: |
      ctx->in_isr = false;
    text: |
      While the ${../if/setcanceltype:/name} call is made from within thread context.
  - name: Interrupt
    test-code: |
      ctx->in_isr = true;
    text: |
      While the ${../if/setcanceltype:/name} call is made from within interrupt
      context.
  test-epilogue: null
  test-prologue: null
- name: Type
  states:
  - name: Deferred
    test-code: |
      ctx->type = PTHREAD_CANCEL_DEFERRED;
    text: |
      While the ${../if/setcanceltype:/params[0]/name} parameter is
      ${/c/pthread/if/cancel-deferred:/name}.
  - name: Async
    test-code: |
      ctx->type = PTHREAD_CANCEL_ASYNCHRONOUS;
    text: |
      While the ${../if/setcanceltype:/params[0]/name} parameter is
      ${/c/pthread/if/cancel-asynchronous:/name}.
  - name: Invalid
    test-code: |
      ctx->type = INT_MAX;
    text: |
      While the ${../if/setcanceltype:/params[0]/name} parameter is neither
      ${/c/pthread/if/cancel-deferred:/name} nor
      ${/c/pthread/if/cancel-asynchronous:/name}.
  test-epilogue: null
  test-prologue: null
- name: OldType
  states:
  - name: Valid
    test-code: |
      ctx->oldtype = &ctx->old_type;
    text: |
      While the ${../if/setcanceltype:/params[1]/name} parameter references an object
      of type `int`.
  - name: 'Null'
    test-code: |
      ctx->oldtype = NULL;
    text: |
      While the ${../if/setcanceltype:/params[1]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Previous
  states:
  - name: Deferred
    test-code: |
      ctx->previous_type = PTHREAD_CANCEL_DEFERRED;
      (void) pthread_setcanceltype( ctx->previous_type, NULL );
    text: |
      While the ${../glossary/thread-cancel-type:/term} of the calling thread is
      ${/c/pthread/if/cancel-deferred:/name} immediately before the
      ${../if/setcanceltype:/name} call.
  - name: Async
    test-code: |
      ctx->previous_type = PTHREAD_CANCEL_ASYNCHRONOUS;
      (void) pthread_setcanceltype( ctx->previous_type, NULL );
    text: |
      While the ${../glossary/thread-cancel-type:/term} of the calling thread is
      ${/c/pthread/if/cancel-asynchronous:/name} immediately before the
      ${../if/setcanceltype:/name} call.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
