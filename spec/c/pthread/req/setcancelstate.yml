post-conditions:
- name: Status
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->retval, 0 );
    text: |
      The return value of ${../if/setcancelstate:/name} shall be equal to zero.
  - name: EINVAL
    test-code: |
      T_eq_int( ctx->retval, EINVAL );
    text: |
      The return value of ${../if/setcancelstate:/name} shall be equal to
      ${/c/errno/if/einval:/name}.
  - name: EPROTO
    test-code: |
      T_eq_int( ctx->retval, EPROTO );
    text: |
      The return value of ${../if/setcancelstate:/name} shall be equal to
      ${/c/errno/if/eproto:/name}.
  test-epilogue: null
  test-prologue: null
- name: OldState
  states:
  - name: Set
    test-code: |
      T_eq_int( ctx->oldstate_value, ctx->previous );
    text: |
      The value of the object referenced by the
      ${../if/setcancelstate:/params[1]/name} parameter shall be set to the
      ${../glossary/thread-cancel-state:/term} of the calling thread immediately
      before the ${../if/setcancelstate:/name} call.
  - name: Nop
    test-code: |
      T_eq_int( ctx->oldstate_value, INVALID_STATE );
    text: |
      Objects referenced by the ${../if/setcancelstate:/params[1]/name} parameter in
      past calls to ${../if/setcancelstate:/name} shall not be accessed by the
      ${../if/setcancelstate:/name} call.
  test-epilogue: null
  test-prologue: null
- name: State
  states:
  - name: Enabled
    test-code: |
      T_eq_int( GetCancelState(), PTHREAD_CANCEL_ENABLE );
    text: |
      The ${../glossary/thread-cancel-state:/term} of the calling thread shall be
      ${/c/pthread/if/cancel-enable:/name} after the return of the
      ${../if/setcancelstate:/name} call.
  - name: Disabled
    test-code: |
      T_eq_int( GetCancelState(), PTHREAD_CANCEL_DISABLE );
    text: |
      The ${../glossary/thread-cancel-state:/term} of the calling thread shall be
      ${/c/pthread/if/cancel-disable:/name} after the return of the
      ${../if/setcancelstate:/name} call.
  - name: Nop
    test-code: |
      T_eq_int( GetCancelState(), ctx->previous );
    text: |
      The ${../glossary/thread-cancel-state:/term} of the calling thread shall not be
      changed by the ${../if/setcancelstate:/name} call.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Context
  states:
  - name: Thread
    test-code: |
      ctx->in_isr = false;
    text: |
      While the ${../if/setcancelstate:/name} call is made from within thread
      context.
  - name: Interrupt
    test-code: |
      ctx->in_isr = true;
    text: |
      While the ${../if/setcancelstate:/name} call is made from within interrupt
      context.
  test-epilogue: null
  test-prologue: null
- name: NewState
  states:
  - name: Enabled
    test-code: |
      ctx->state = PTHREAD_CANCEL_ENABLE;
    text: |
      While the ${../if/setcancelstate:/params[0]/name} parameter is
      ${/c/pthread/if/cancel-enable:/name}.
  - name: Disabled
    test-code: |
      ctx->state = PTHREAD_CANCEL_DISABLE;
    text: |
      While the ${../if/setcancelstate:/params[0]/name} parameter is
      ${/c/pthread/if/cancel-disable:/name}.
  - name: Invalid
    test-code: |
      ctx->state = INT_MAX;
    text: |
      While the ${../if/setcancelstate:/params[0]/name} parameter is neither
      ${/c/pthread/if/cancel-enable:/name} nor ${/c/pthread/if/cancel-disable:/name}.
  test-epilogue: null
  test-prologue: null
- name: OldState
  states:
  - name: Valid
    test-code: |
      ctx->oldstate = &ctx->oldstate_value;
    text: |
      While the ${../if/setcancelstate:/params[1]/name} parameter references an
      object of type `int`.
  - name: 'Null'
    test-code: |
      ctx->oldstate = NULL;
    text: |
      While the ${../if/setcancelstate:/params[1]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Previous
  states:
  - name: Enabled
    test-code: |
      ctx->previous = PTHREAD_CANCEL_ENABLE;
      (void) pthread_setcancelstate( ctx->previous, NULL );
    text: |
      While the ${../glossary/thread-cancel-state:/term} of the calling thread is
      ${/c/pthread/if/cancel-enable:/name} immediately before the
      ${../if/setcancelstate:/name} call.
  - name: Disabled
    test-code: |
      ctx->previous = PTHREAD_CANCEL_DISABLE;
      (void) pthread_setcancelstate( ctx->previous, NULL );
    text: |
      While the ${../glossary/thread-cancel-state:/term} of the calling thread is
      ${/c/pthread/if/cancel-disable:/name} immediately before the
      ${../if/setcancelstate:/name} call.
  test-epilogue: null
  test-prologue: null
