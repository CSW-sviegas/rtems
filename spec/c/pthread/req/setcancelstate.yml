transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Context: Interrupt
      then: EPROTO
    - if:
        pre-conditions:
          NewState: Invalid
      then: EINVAL
    - else: Zero
    OldState:
    - if:
        pre-conditions:
          OldState: 'Null'
      then: N/A
    - if:
        post-conditions:
          Status: Zero
      then: Set
    - else: Nop
    State:
    - if:
        post-conditions:
          Status: Zero
      then-specified-by: NewState
    - else: Nop
  pre-conditions:
    Context: all
    NewState: all
    OldState: all
    Previous: all
