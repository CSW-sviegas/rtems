  typedef enum { COND_INIT_YES, COND_INIT_ZEROED, COND_INIT_NO } CondInit;

  typedef enum {
    MUTEX_OWNER_CALLER,
    MUTEX_OWNER_OTHER,
    MUTEX_OWNER_NOBODY
  } MutexOwner;

  typedef enum { WAKE_BROADCAST, WAKE_TIMEOUT, WAKE_MUTEX_DESTROYED } Wake;
