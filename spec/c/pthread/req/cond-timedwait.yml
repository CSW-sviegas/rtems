post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/cond-timedwait:/name} shall be
      zero.
  - name: Inval
    test-code: |
      T_eq_int( ctx->status, EINVAL );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/cond-timedwait:/name} shall be
      ${/c/errno/if/einval:/name}.
  - name: Perm
    test-code: |
      T_eq_int( ctx->status, EPERM );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/cond-timedwait:/name} shall be
      ${/c/errno/if/eperm:/name}.
  - name: TimedOut
    test-code: |
      T_eq_int( ctx->status, ETIMEDOUT );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/cond-timedwait:/name} shall be
      ${/c/errno/if/etimedout:/name}.
  test-epilogue: null
  test-prologue: null
- name: Init
  states:
  - name: Default
    test-code: |
      T_eq_ulong( ctx->cond_obj._flags, COND_FLAGS_REALTIME( &ctx->cond_obj ) );
    text: |
      The object referenced by the ${../if/cond-timedwait:/params[0]/name} parameter
      shall be a ${../glossary/condition-variable:/term} initialized with the
      ${../glossary/cond-clock:/term} ${/c/time/if/clock-realtime:/name}.
  - name: Nop
    test-code: |
      T_eq_ulong( ctx->cond_obj._flags, ctx->cond_before._flags );
    text: |
      The initialization state and the ${../glossary/cond-clock:/term} of the object
      referenced by the ${../if/cond-timedwait:/params[0]/name} parameter shall not
      be modified.
  test-epilogue: null
  test-prologue: null
- name: Binding
  states:
  - name: Mutex
    test-code: |
      T_eq_ptr( ctx->cond_obj._mutex, &ctx->mutex_obj );
    text: |
      The ${../glossary/condition-variable:/term} referenced by the
      ${../if/cond-timedwait:/params[0]/name} parameter shall be bound to the mutex
      referenced by the ${../if/cond-timedwait:/params[1]/name} parameter.
  - name: None
    test-code: |
      T_null( ctx->cond_obj._mutex );
    text: |
      The ${../glossary/condition-variable:/term} referenced by the
      ${../if/cond-timedwait:/params[0]/name} parameter shall be bound to no mutex.
  - name: Nop
    test-code: |
      T_eq_ptr( ctx->cond_obj._mutex, ctx->cond_before._mutex );
    text: |
      The binding of the object referenced by the
      ${../if/cond-timedwait:/params[0]/name} parameter to a mutex shall not be
      modified.
  test-epilogue: null
  test-prologue: null
- name: Owner
  states:
  - name: Caller
    test-code: |
      T_eq_ptr( ctx->mutex_obj._Recursive._Mutex._Queue._owner, ctx->runner );
    text: |
      The mutex referenced by the ${../if/cond-timedwait:/params[1]/name} parameter
      shall be owned by the calling thread.
  - name: Other
    test-code: |
      T_eq_ptr( ctx->mutex_obj._Recursive._Mutex._Queue._owner, ctx->owner );
    text: |
      The mutex referenced by the ${../if/cond-timedwait:/params[1]/name} parameter
      shall be owned by the thread other than the calling thread which owned it
      before the call.
  - name: Nobody
    test-code: |
      T_null( ctx->mutex_obj._Recursive._Mutex._Queue._owner );
    text: |
      The mutex referenced by the ${../if/cond-timedwait:/params[1]/name} parameter
      shall not be owned by any thread.
  test-epilogue: null
  test-prologue: null
- name: Blocking
  states:
  - name: 'Yes'
    test-code: |
      T_true( ctx->blocked );
    text: |
      The calling thread shall block on the ${../glossary/condition-variable:/term}
      until the condition variable is signaled or broadcast, or until the timeout of
      the wait for the time point referenced by the
      ${../if/cond-timedwait:/params[2]/name} parameter expires.
  - name: 'No'
    test-code: |
      T_false( ctx->blocked );
    text: |
      The calling thread shall not block on the
      ${../glossary/condition-variable:/term}.
  test-epilogue: null
  test-prologue: null
- name: Clock
  states:
  - name: Realtime
    test-code: |
      T_eq_ptr(
        ctx->timer_header,
        &_Per_CPU_Get_by_index( 0 )->Watchdog.Header[ PER_CPU_WATCHDOG_REALTIME ]
      );
    text: |
      The time point referenced by the ${../if/cond-timedwait:/params[2]/name}
      parameter shall be measured against ${/c/time/if/clock-realtime:/name}.
  - name: Monotonic
    test-code: |
      T_eq_ptr(
        ctx->timer_header,
        &_Per_CPU_Get_by_index( 0 )->Watchdog.Header[ PER_CPU_WATCHDOG_MONOTONIC ]
      );
    text: |
      The time point referenced by the ${../if/cond-timedwait:/params[2]/name}
      parameter shall be measured against ${/c/time/if/clock-monotonic:/name}.
  test-epilogue: null
  test-prologue: null
