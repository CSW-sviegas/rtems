    test-code: |
      ctx->clock = CLOCK_REALTIME;
    text: |
      While the ${../glossary/cond-clock:/term} of the
      ${../glossary/condition-variable:/term} referenced by the
      ${../if/cond-timedwait:/params[0]/name} parameter is
      ${/c/time/if/clock-realtime:/name}.
  - name: Monotonic
    test-code: |
      ctx->clock = CLOCK_MONOTONIC;
    text: |
      While the ${../glossary/cond-clock:/term} of the
      ${../glossary/condition-variable:/term} referenced by the
      ${../if/cond-timedwait:/params[0]/name} parameter is
      ${/c/time/if/clock-monotonic:/name}.
  test-epilogue: null
  test-prologue: null
- name: Binding
  states:
  - name: None
    test-code: |
      ctx->binding = NULL;
    text: |
      While the ${../glossary/condition-variable:/term} referenced by the
      ${../if/cond-timedwait:/params[0]/name} parameter is bound to no mutex.
  - name: Same
    test-code: |
      ctx->binding = &ctx->mutex_obj;
    text: |
      While the ${../glossary/condition-variable:/term} referenced by the
      ${../if/cond-timedwait:/params[0]/name} parameter is bound to the mutex
      referenced by the ${../if/cond-timedwait:/params[1]/name} parameter.
  - name: Other
    test-code: |
      ctx->binding = &ctx->other_mutex_obj;
    text: |
      While the ${../glossary/condition-variable:/term} referenced by the
      ${../if/cond-timedwait:/params[0]/name} parameter is bound to a mutex other
      than the one referenced by the ${../if/cond-timedwait:/params[1]/name}
      parameter.
  test-epilogue: null
  test-prologue: null
- name: Mutex
  states:
  - name: Obj
    test-code: |
      ctx->mutex = &ctx->mutex_obj;
    text: |
      While the ${../if/cond-timedwait:/params[1]/name} parameter references an
      object of type ${/c/if/pthread_mutex_t:/name}.
  - name: 'Null'
    test-code: |
      ctx->mutex = NULL;
    text: |
      While the ${../if/cond-timedwait:/params[1]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: MutexInit
  states:
  - name: 'Yes'
    test-code: |
      ctx->mutex_init = true;
    text: |
      While the object referenced by the ${../if/cond-timedwait:/params[1]/name}
      parameter is an initialized mutex.
  - name: 'No'
    test-code: |
      ctx->mutex_init = false;
    text: |
      While the object referenced by the ${../if/cond-timedwait:/params[1]/name}
      parameter is neither an initialized mutex nor filled with zero bytes.
  test-epilogue: null
  test-prologue: null
- name: MutexOwner
  states:
  - name: Caller
    test-code: |
      ctx->mutex_owner = MUTEX_OWNER_CALLER;
    text: |
      While the mutex referenced by the ${../if/cond-timedwait:/params[1]/name}
      parameter is owned by the calling thread.
  - name: Other
    test-code: |
      ctx->mutex_owner = MUTEX_OWNER_OTHER;
    text: |
      While the mutex referenced by the ${../if/cond-timedwait:/params[1]/name}
      parameter is owned by a thread other than the calling thread.
  - name: Nobody
    test-code: |
      ctx->mutex_owner = MUTEX_OWNER_NOBODY;
    text: |
      While the mutex referenced by the ${../if/cond-timedwait:/params[1]/name}
      parameter is not owned by any thread.
  test-epilogue: null
  test-prologue: null
- name: Abstime
  states:
  - name: Obj
    test-code: |
      ctx->abstime = &ctx->abstime_obj;
    text: |
      While the ${../if/cond-timedwait:/params[2]/name} parameter references an
      object of type ${/c/if/timespec:/name}.
  - name: 'Null'
    test-code: |
      ctx->abstime = NULL;
    text: |
      While the ${../if/cond-timedwait:/params[2]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Time
  states:
  - name: Future
    test-code: |
      ctx->abstime_obj.tv_sec = FAR_FUTURE;
      ctx->abstime_obj.tv_nsec = 0;
    text: |
      While the ${../if/cond-timedwait:/params[2]/name} parameter references a time
      point in the future.
  - name: Past
    test-code: |
      ctx->abstime_obj.tv_sec = 0;
      ctx->abstime_obj.tv_nsec = 0;
    text: |
      While the ${../if/cond-timedwait:/params[2]/name} parameter references a time
      point in the past with a seconds value of zero or more and a nanoseconds value
      of zero or more and less than one billion.
  - name: NegSec
    test-code: |
      ctx->abstime_obj.tv_sec = -1;
      ctx->abstime_obj.tv_nsec = 0;
    text: |
      While the ${../if/cond-timedwait:/params[2]/name} parameter references a time
      point with a negative seconds value and a nanoseconds value of zero or more and
      less than one billion.
  - name: NegNsec
    test-code: |
      ctx->abstime_obj.tv_sec = 0;
      ctx->abstime_obj.tv_nsec = -1;
    text: |
      While the ${../if/cond-timedwait:/params[2]/name} parameter references a time
      point with a negative nanoseconds value.
  - name: BigNsec
    test-code: |
      ctx->abstime_obj.tv_sec = 0;
      ctx->abstime_obj.tv_nsec = 1000000000;
    text: |
      While the ${../if/cond-timedwait:/params[2]/name} parameter references a time
      point with a nanoseconds value greater than or equal to one billion.
  test-epilogue: null
  test-prologue: null
- name: Wake
  states:
  - name: Broadcast
    test-code: |
      ctx->wake = WAKE_BROADCAST;
    text: |
      While the ${../glossary/condition-variable:/term} is broadcast after the
      calling thread blocked on it and before the timeout of the wait for the time
      point referenced by the ${../if/cond-timedwait:/params[2]/name} parameter
      expires.
  - name: Timeout
    test-code: |
      ctx->wake = WAKE_TIMEOUT;
    text: |
      While the timeout of the wait for the time point referenced by the
      ${../if/cond-timedwait:/params[2]/name} parameter expires after the calling
      thread blocked on the ${../glossary/condition-variable:/term} and before the
      condition variable is broadcast.
  - name: MutexDestroyed
    test-code: |
      ctx->wake = WAKE_MUTEX_DESTROYED;
    text: |
      While the mutex referenced by the ${../if/cond-timedwait:/params[1]/name}
      parameter is destroyed and then the ${../glossary/condition-variable:/term} is
      broadcast after the calling thread blocked on the condition variable and before
      the time point referenced by the ${../if/cond-timedwait:/params[2]/name}
      parameter is reached.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/pthread-cond-clockwait:/name} specifies
  ${../if/cond-timedwait:/name}.

  Pre-condition Abstime comes from the first check of the call. A
  ${/c/if/null:/name} ${../if/cond-timedwait:/params[2]/name} parameter gives
  ${/c/errno/if/einval:/name} before the call reads the
  ${../glossary/condition-variable:/term}. The standard does not define this
  case. The state specifies the behaviour of RTEMS.

  Pre-conditions Cond and CondInit come from the validation of the condition
  variable. A ${/c/if/null:/name} pointer and an object which is neither
  initialized nor filled with zero bytes give ${/c/errno/if/einval:/name}. The
  call initializes an object filled with zero bytes with the default attributes,
  which post-condition Init specifies. The standard leaves the behaviour
  undefined where the object is not an initialized condition variable and
  recommends ${/c/errno/if/einval:/name}. The states specify the behaviour of
  RTEMS which follows that recommendation.

  Pre-condition Clock comes from the ${../glossary/cond-clock:/term} which the
  call reads from the condition variable. The standard demands that this clock
  measures the time point. Post-condition Clock specifies the clock of the
  timeout. An object filled with zero bytes gets the default clock
  ${/c/time/if/clock-realtime:/name}.

  Pre-condition Binding comes from the mutex to which the condition variable is
  bound. The call binds the condition variable to the mutex referenced by the
  ${../if/cond-timedwait:/params[1]/name} parameter before it checks the time
  point and releases the mutex, which post-condition Binding specifies. Where a
  broadcast ends the wait, the broadcast removes the binding. The item of
  ${../if/cond-broadcast:/name} covers this, so post-condition Binding is not
  applicable there. A call of ${../if/cond-signal:/name} or
  ${../if/cond-broadcast:/name} which finds no waiting thread and a call of
  ${../if/cond-init:/name} remove the binding. The source reads the binding, not
  whether a thread waits, so the states describe the binding. The standard leaves
  a wait with a different mutex undefined while a thread waits on the condition
  variable. State Other specifies the behaviour of RTEMS which returns
  ${/c/errno/if/einval:/name}. The standard requires that the next wait forms a
  new binding once all waiting threads were unblocked. RTEMS keeps the binding
  after a timeout, after an error, and after ${../if/cond-signal:/name} unblocks
  the last waiting thread. A later wait with another mutex then returns
  ${/c/errno/if/einval:/name}. This deviates from the standard.

  Pre-condition Time comes from the check of the time point when the call blocks
  the calling thread. A nanoseconds value out of range gives
  ${/c/errno/if/einval:/name}, which the standard demands. A time point in the
  past, which includes a negative seconds value, gives
  ${/c/errno/if/etimedout:/name}. The standard demands that error checks other
  than ${/c/errno/if/etimedout:/name} return before the call modifies the mutex
  or the condition variable. RTEMS checks the time point after it bound the
  condition variable to the mutex and released the mutex. It then reacquires the
  mutex before it returns ${/c/errno/if/einval:/name}. This deviates from the
  standard. State Future uses a fixed time point beyond the range of the
  watchdog, so the timeout gets the maximum expiration time and the test needs no
  reading of a clock.

  Pre-conditions Mutex, MutexInit and MutexOwner come from the release of the
  mutex. The call releases the mutex before it checks the time point. Where the
  release fails, the call returns ${/c/errno/if/eperm:/name} without a
  reacquisition of the mutex for every time point. The item uses mutexes with the
  default attributes. The standard demands ${/c/errno/if/eperm:/name} only for
  error checking and robust mutexes. For other mutexes it leaves the behaviour
  undefined where the calling thread does not own the mutex, and where the
  ${../if/cond-timedwait:/params[1]/name} parameter references no initialized
  mutex. The states specify the behaviour of RTEMS. For a mutex which is not
  initialized the standard recommends ${/c/errno/if/einval:/name}. RTEMS returns
  ${/c/errno/if/eperm:/name}, which does not follow that recommendation. RTEMS
  handles an error checking mutex like a mutex with the default attributes. The
  item does not cover error checking mutexes. For them the standard demands that
  the error return happens before the call modifies the mutex or the condition
  variable. RTEMS binds the condition variable to the mutex before it detects the
  error. This deviates from the standard.

  Pre-condition Wake covers the end of the wait. Post-condition Blocking checks
  that the call returns only after the condition variable was broadcast or the
  timeout expired. The timeout expires when the clock reaches the time point. The
  test ends the wait through the expiration of the timeout of the calling thread
  without a change of the clocks, so the clocks do not reach the time point. The
  call reacquires the mutex after the wait. Where this fails, the call returns
  ${/c/errno/if/einval:/name}. The standard leaves the destruction of a mutex
  which a thread uses in a condition wait undefined. State MutexDestroyed
  specifies the behaviour of RTEMS.

  RTEMS provides no robust mutexes, so the call returns none of the three errors
  which the standard names for robust mutexes. The standard permits that a thread
  which a signal interrupts resumes the wait as if it was not interrupted. A
  POSIX signal does not end the wait in RTEMS. POSIX signals are available only
  if RTEMS is built with the option RTEMS_POSIX_API enabled. The standard makes
  the call a ${../glossary/cancellation-point:/term}. RTEMS implements no
  ${../glossary/cancellation-point:/term}, which deviates from the standard. The
  item does not cover signals, thread cancellation, recursive mutexes, and mutex
  protocols. The order in which waiting threads are unblocked belongs to the
  items of ${../if/cond-signal:/name} and ${../if/cond-broadcast:/name}.
requirement-type: functional
skip-reasons:
  NullMutexSame: |
    A ${/c/if/null:/name} ${../if/cond-timedwait:/params[1]/name} parameter
    references no mutex, so the ${../glossary/condition-variable:/term} cannot be
    bound to it.
test-action: |
  PrepareCond( ctx );
  PrepareMutex( ctx );
  ctx->waker_id = CreateTask( "WAKE", PRIO_LOW );
  SetAffinityOne( ctx->waker_id, 0 );
  StartTask( ctx->waker_id, Waker, ctx );
  memcpy( &ctx->cond_before, &ctx->cond_obj, sizeof( ctx->cond_before ) );
  ctx->status = pthread_cond_timedwait( ctx->cond, ctx->mutex, ctx->abstime );
  ctx->blocked = ctx->woken;
test-brief: null
test-cleanup: |
  DeleteTask( ctx->waker_id );

  if ( ctx->owner_locked ) {
    SendEvents( ctx->owner_id, EVENT_UNLOCK );
  }

  (void) pthread_mutex_unlock( &ctx->mutex_obj );
  (void) pthread_mutex_destroy( &ctx->mutex_obj );
  (void) pthread_cond_destroy( &ctx->cond_obj );
