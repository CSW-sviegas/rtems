transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Abstime: 'Null'
      then: EINVAL
    - if:
        pre-conditions:
          Cond:
          - Invalid
          - 'Null'
      then: EINVAL
    - if:
        pre-conditions:
          Binding: Other
      then: EINVAL
    - if:
        pre-conditions:
          Abstime: Invalid
      then: EINVAL
    - if:
        pre-conditions:
          Abstime: Future
          Mutex: NotOwned
      then: EPERM
    - if:
        pre-conditions:
          Abstime: Past
      then: ETIMEDOUT
    - if:
        pre-conditions:
          Wake: Broadcast
      then: Zero
    - if:
        pre-conditions:
          Wake: Timeout
      then: ETIMEDOUT
    - else: EINVAL
    Owner:
    - if:
        post-conditions:
          Status: EPERM
      then: Nobody
    - if:
        pre-conditions:
          Binding: Other
          Mutex: NotOwned
      then: Nobody
    - if:
        pre-conditions:
          Wake: Destroyed
      then: N/A
    - else: Caller
  pre-conditions:
    Cond: all
    Mutex:
      applicable:
        pre-conditions:
          Abstime:
          - Future
          - Past
          - Invalid
          Cond:
          - Valid
          - Zeroed
    Abstime: all
    Binding:
      applicable:
        pre-conditions:
          Abstime:
          - Future
          - Past
          - Invalid
          Cond:
          - Valid
          - Zeroed
    Wake:
      applicable:
        pre-conditions:
          Abstime: Future
          Binding:
          - Free
          - Same
          Cond:
          - Valid
          - Zeroed
          Mutex: Owned
