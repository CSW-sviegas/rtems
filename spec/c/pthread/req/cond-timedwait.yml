- role: requirement-refinement
  uid: ../../req/group-posix-api
post-conditions:
- name: Status
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->retval, 0 );
    text: |
      The return value of ${../if/cond-timedwait:/name} shall be equal to zero.
  - name: EINVAL
    test-code: |
      T_eq_int( ctx->retval, EINVAL );
    text: |
      The return value of ${../if/cond-timedwait:/name} shall be equal to
      ${/c/errno/if/einval:/name}.
  - name: ETIMEDOUT
    test-code: |
      T_eq_int( ctx->retval, ETIMEDOUT );
    text: |
      The return value of ${../if/cond-timedwait:/name} shall be equal to
      ${/c/errno/if/etimedout:/name}.
  - name: EPERM
    test-code: |
      T_eq_int( ctx->retval, EPERM );
    text: |
      The return value of ${../if/cond-timedwait:/name} shall be equal to
      ${/c/errno/if/eperm:/name}.
  test-epilogue: null
  test-prologue: null
- name: Owner
  states:
  - name: Caller
    test-code: |
      eno = pthread_mutex_unlock( ctx->mutex );
      T_eno_success( eno );
    text: |
      The mutex object referenced by ${../if/cond-timedwait:/params[1]/name} shall be
      owned by the calling thread after the return.
  - name: Nobody
    test-code: |
      eno = pthread_mutex_unlock( ctx->mutex );
      T_eq_int( eno, EPERM );
    text: |
      The mutex object referenced by ${../if/cond-timedwait:/params[1]/name} shall
      not be owned by the calling thread.
  test-epilogue: null
  test-prologue: |
    int eno;
pre-conditions:
- name: Cond
  states:
  - name: Valid
    test-code: |
      ctx->cond = &ctx->cond_obj;
    text: |
      While the ${../if/cond-timedwait:/params[0]/name} parameter references an
      initialized condition variable object.
  - name: Zeroed
    test-code: |
      memset( &ctx->cond_obj, 0, sizeof( ctx->cond_obj ) );
      ctx->cond = &ctx->cond_obj;
    text: |
      While the ${../if/cond-timedwait:/params[0]/name} parameter references a
      condition variable object which is filled with zero bytes.
  - name: Invalid
    test-code: |
      memset( &ctx->cond_obj, 0xff, sizeof( ctx->cond_obj ) );
      ctx->cond = &ctx->cond_obj;
    text: |
      While the ${../if/cond-timedwait:/params[0]/name} parameter references an
      invalid condition variable object.
  - name: 'Null'
    test-code: |
      ctx->cond = NULL;
    text: |
      While the ${../if/cond-timedwait:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Mutex
  states:
  - name: Owned
    test-code: |
      /* Already prepared */
    text: |
      While the mutex object referenced by ${../if/cond-timedwait:/params[1]/name} is
      owned by the calling thread.
  - name: NotOwned
    test-code: |
      eno = pthread_mutex_unlock( ctx->mutex );
      T_eno_success( eno );
      ctx->mutex_owned = false;
    text: |
      While the mutex object referenced by ${../if/cond-timedwait:/params[1]/name} is
      not owned by any thread.
  test-epilogue: null
  test-prologue: |
    int eno;
- name: Abstime
  states:
  - name: Future
    test-code: |
      clock_gettime( CLOCK_REALTIME, &ctx->abstime_obj );
      ctx->abstime_obj.tv_sec += 1000;
      ctx->abstime = &ctx->abstime_obj;
    text: |
      While the ${../if/cond-timedwait:/params[2]/name} parameter references a time
      point which is in the future.
  - name: Past
    test-code: |
      ctx->abstime_obj.tv_sec = 0;
      ctx->abstime_obj.tv_nsec = 0;
      ctx->abstime = &ctx->abstime_obj;
    text: |
      While the ${../if/cond-timedwait:/params[2]/name} parameter references a time
      point which is in the past.
  - name: Invalid
    test-code: |
      ctx->abstime_obj.tv_sec = 1;
      ctx->abstime_obj.tv_nsec = 1000000000;
      ctx->abstime = &ctx->abstime_obj;
    text: |
      While the ${../if/cond-timedwait:/params[2]/name} parameter references a time
      point with a nanoseconds value which is out of range.
  - name: 'Null'
    test-code: |
      ctx->abstime = NULL;
    text: |
      While the ${../if/cond-timedwait:/params[2]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Binding
  states:
  - name: Free
    test-code: |
      /* Nothing to do */
    text: |
      While no thread waits on the condition variable object.
  - name: Same
    test-code: |
      if ( ctx->mutex_owned ) {
        eno = pthread_mutex_unlock( ctx->mutex );
        T_eno_success( eno );
      }

      ctx->waiter_id = StartWorker( ctx, WORKER_WAIT_SAME, PRIO_HIGH );

      if ( ctx->mutex_owned ) {
        eno = pthread_mutex_lock( ctx->mutex );
        T_eno_success( eno );
      }
    text: |
      While a thread waits on the condition variable object using the mutex object
      referenced by ${../if/cond-timedwait:/params[1]/name}.
  - name: Other
    test-code: |
      ctx->waiter_id = StartWorker( ctx, WORKER_WAIT_OTHER, PRIO_HIGH );
    text: |
      While a thread waits on the condition variable object using a mutex object
      different from the one referenced by ${../if/cond-timedwait:/params[1]/name}.
  test-epilogue: null
  test-prologue: |
    int eno;
- name: Wake
  states:
  - name: Broadcast
    test-code: |
      ctx->worker_id = StartWorker( ctx, WORKER_BROADCAST, PRIO_LOW );
    text: |
      While the condition variable object is broadcast before the time point is
      reached.
  - name: Timeout
    test-code: |
      ctx->worker_id = StartWorker( ctx, WORKER_TIMEOUT, PRIO_LOW );
    text: |
      While the time point is reached before the condition variable object is
      broadcast.
  - name: Destroyed
    test-code: |
      ctx->worker_id = StartWorker( ctx, WORKER_DESTROY, PRIO_LOW );
    text: |
      While the mutex object referenced by ${../if/cond-timedwait:/params[1]/name} is
      destroyed and the condition variable object is broadcast before the time point
      is reached.
  test-epilogue: null
  test-prologue: null
