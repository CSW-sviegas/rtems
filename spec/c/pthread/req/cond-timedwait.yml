  ctx->clock = CLOCK_REALTIME;
  ctx->binding = NULL;
  ctx->mutex_init = false;
  ctx->mutex_owner = MUTEX_OWNER_NOBODY;
  ctx->wake = WAKE_BROADCAST;
  ctx->waker_id = 0;
  ctx->woken = false;
  ctx->blocked = false;
  ctx->timer_header = NULL;
