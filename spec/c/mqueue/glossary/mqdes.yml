term: message queue descriptor
text: |
  An opaque descriptor representing an open POSIX message queue, used to
  reference the queue in subsequent operations. See
  [POSIX.1-2024, Base Definitions, Section 3.245 Message Queue Descriptor](https://pubs.opengroup.org/onlinepubs/9799919799/basedefs/V1_chap03.html#tag_04_245).
