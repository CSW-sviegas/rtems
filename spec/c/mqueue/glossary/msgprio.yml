term: message priority
text: |
  An unsigned integer indicating the priority of a message. Messages with higher
  priority values are inserted into the queue before messages with lower priority
  values. See
  [POSIX.1-2024, System Interfaces, mq_send](https://pubs.opengroup.org/onlinepubs/9799919799/functions/mq_send.html).
type: glossary
