brief: |
  Remove the name of the ${/glossary/messagequeue:/term} specified by
  ${.:/params[0]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
- Copyright (C) 2026 Critical Software S.A.
definition:
  default:
    attributes: null
    body: null
    params:
    - const char *${.:/params[0]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    The ${.:/params[0]/name} parameter was ${/c/if/null:/name}.
  role: errno
  uid: /c/errno/if/einval
- description: |
    The length of the string referenced by ${.:/params[0]/name} was greater than
    the maximum length of a ${/glossary/messagequeue:/term} name.
  role: errno
  uid: /c/errno/if/enametoolong
- description: |
    No ${/glossary/messagequeue:/term} had the name specified by
    ${.:/params[0]/name}.
  role: errno
  uid: /c/errno/if/enoent
- role: reference
  uid: /ref/std/posix-2024/mq-unlink
name: mq_unlink
notes: |
  See ${/ref/std/posix-2024/mq-unlink:/name}.

  The ${/glossary/messagequeue:/term} is deleted when it is not open. Otherwise,
  it is deleted by the ${close:/name} call which closes it.
params:
- description: |
    is the name of the ${/glossary/messagequeue:/term}.
  dir: in
  name: name
return:
  return: null
  return-values:
  - description: |
      On success, zero is returned.
    value: 0
  - description: |
      On error, -1 is returned, and ${/c/errno/if/errno:/name} is set to indicate the
      error.
    value: -1
type: interface
