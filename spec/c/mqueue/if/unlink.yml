brief: |
  Remove the ${/glossary/messagequeue:/term} with the name specified by
  ${.:/params[0]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
- Copyright (C) 2026 Critical Software S.A.
definition:
  default:
    attributes: null
    body: null
    params:
    - const char *${.:/params[0]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    The ${.:/params[0]/name} parameter was ${/c/if/null:/name}.
  role: errno
  uid: /c/errno/if/einval
- description: |
    The length of the name specified by ${.:/params[0]/name} was greater than the
    maximum length of a ${/glossary/messagequeue:/term} name.
  role: errno
  uid: /c/errno/if/enametoolong
- description: |
    There was no ${/glossary/messagequeue:/term} with the name specified by
    ${.:/params[0]/name}.
  role: errno
  uid: /c/errno/if/enoent
name: mq_unlink
notes: |
  See [POSIX.1-2024, System Interfaces, mq_unlink()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/mq_unlink.html).
params:
- description: |
    is the name of the message queue to unlink.
  dir: in
  name: name
return:
  return: null
  return-values:
  - description: |
      The requested operation was successful.
    value: 0
  - description: |
      On error, -1 is returned, and ${/c/errno/if/errno:/name} is set to indicate the
      error.
    value: -1
type: interface
