brief: |
  Receive a ${/glossary/message:/term} from the ${/glossary/messagequeue:/term}
  specified by ${.:/params[0]/name} and store it in the buffer referenced by
  ${.:/params[1]/name} bounded by the size in bytes specified by
  ${.:/params[2]/name}, and store the ${../glossary/msgprio:/term} in the object
  referenced by ${.:/params[3]/name} with a ${/glossary/timeout:/term} referenced
  by ${.:/params[4]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
- Copyright (C) 2026 Critical Software S.A.
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/mqd_t:/name} ${.:/params[0]/name}
    - char *restrict ${.:/params[1]/name}
    - ${/c/if/size_t:/name} ${.:/params[2]/name}
    - unsigned int *restrict ${.:/params[3]/name}
    - const ${/c/if/timespec:/name} *restrict ${.:/params[4]/name}
    return: ${/c/if/ssize_t:/name}
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    The ${/glossary/messagequeue:/term} was empty, and the
    ${/c/fcntl/if/o-nonblock:/name} flag was set for the
    ${/glossary/messagequeue:/term} description.
  role: errno
  uid: /c/errno/if/eagain
- description: |
    This error number indicates the following error conditions:

    - The ${../glossary/mqdes:/term} specified by ${.:/params[0]/name} was invalid.
    - The ${../glossary/mqdes:/term} specified by ${.:/params[0]/name} was not
      opened for reading.
  role: errno
  uid: /c/errno/if/ebadf
- description: |
    The call would have blocked, and the ${.:/params[4]/name} parameter was
    invalid.
  role: errno
  uid: /c/errno/if/einval
- description: |
    ${.:/params[2]/name} was less than the
    ${/c/if/mq_attr:/definition[2]/default/name} attribute of the
    ${/glossary/messagequeue:/term}.
  role: errno
  uid: /c/errno/if/emsgsize
- description: |
    The call timed out before a ${/glossary/message:/term} could be transferred.
  role: errno
  uid: /c/errno/if/etimedout
name: mq_timedreceive
notes: |
  See [POSIX.1-2024, System Interfaces, mq_timedreceive()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/mq_timedreceive.html).
params:
- description: |
    is the ${../glossary/mqdes:/term}.
  dir: null
  name: mqdes
- description: |
    is the pointer to the buffer where the received message will be stored.
  dir: out
  name: msg_ptr
- description: |
    is the length of the message buffer.
  dir: null
  name: msg_len
- description: |
    is the pointer to the location where the ${../glossary/msgprio:/term} will be
    stored. If this parameter is ${/c/if/null:/name}, then the
    ${../glossary/msgprio:/term} is not stored.
  dir: out
  name: msg_prio
- description: |
    is the absolute time at which the receive operation will time out.
  dir: in
  name: abs_timeout
return:
  return: |
    On success, the number of bytes in the received ${/glossary/message:/term} is
    returned.
  return-values:
  - description: |
      On error, -1 is returned, and ${/c/errno/if/errno:/name} is set to indicate the
      error.
    value: -1
type: interface
