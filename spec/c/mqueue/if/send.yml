SPDX-License-Identifier: CC-BY-SA-4.0 OR BSD-2-Clause
brief: |
  Send the ${/glossary/message:/term} referenced by ${.:/params[1]/name} of the
  size specified by ${.:/params[2]/name} with the ${../glossary/msgprio:/term}
  specified by ${.:/params[3]/name} to the ${/glossary/messagequeue:/term}
  specified by ${.:/params[0]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
- Copyright (C) 2026 Critical Software S.A.
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/mqd_t:/name} ${.:/params[0]/name}
    - const char *${.:/params[1]/name}
    - ${/c/if/size_t:/name} ${.:/params[2]/name}
    - unsigned int ${.:/params[3]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    The ${.:/params[3]/name} parameter was greater than
    ${/c/limits/if/mq-prio-max:/name}.
  role: errno
  uid: /c/errno/if/einval
- description: |
    The ${.:/params[0]/name} parameter was not a ${../glossary/mqdes:/term}.
  role: errno
  uid: /c/errno/if/ebadf
- description: |
    The ${/glossary/messagequeue:/term} specified by ${.:/params[0]/name} was open
    for reading only.
  role: errno
  uid: /c/errno/if/ebadf
- description: |
    The ${/glossary/messagequeue:/term} specified by ${.:/params[0]/name} was not
    open.
  role: errno
  uid: /c/errno/if/ebadf
- description: |
    The ${.:/params[2]/name} parameter was greater than the maximum
    ${../glossary/msgsize:/term} of the ${/glossary/messagequeue:/term}.
  role: errno
  uid: /c/errno/if/emsgsize
- description: |
    The ${/glossary/messagequeue:/term} was full and the
    ${/c/fcntl/if/o-nonblock:/name} flag of the ${/glossary/messagequeue:/term} was
    set.
  role: errno
  uid: /c/errno/if/eagain
- role: reference
  uid: /ref/std/posix-2024/mq-send
name: mq_send
notes: |
  See ${/ref/std/posix-2024/mq-send:/name}.

  RTEMS accepts a ${.:/params[3]/name} value equal to
  ${/c/limits/if/mq-prio-max:/name}.
params:
- description: |
    is the ${../glossary/mqdes:/term}.
  dir: null
  name: mqdes
- description: |
    is the pointer to the ${/glossary/message:/term}.
  dir: in
  name: msg_ptr
- description: |
    is the ${../glossary/msgsize:/term} of the ${/glossary/message:/term}.
  dir: null
  name: msg_len
- description: |
    is the ${../glossary/msgprio:/term} of the ${/glossary/message:/term}.
  dir: null
  name: msg_prio
return:
  return: null
  return-values:
  - description: |
      On success, zero is returned.
    value: 0
  - description: |
      On error, -1 is returned, and ${/c/errno/if/errno:/name} is set to indicate the
      error.
    value: -1
type: interface
