brief: |
  Set the ${../glossary/mqattr:/term}s of the ${/glossary/messagequeue:/term}
  specified by ${.:/params[0]/name} using the attributes referenced by
  ${.:/params[1]/name} and store the previous attributes in the object referenced
  by ${.:/params[2]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
- Copyright (C) 2026 Critical Software S.A.
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/mqd_t:/name} ${.:/params[0]/name}
    - const ${/c/if/mq_attr:/name} *restrict ${.:/params[1]/name}
    - ${/c/if/mq_attr:/name} *restrict ${.:/params[2]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    This error number indicates the following error conditions:

    - The ${../glossary/mqdes:/term} specified by ${.:/params[0]/name} was invalid.
    - The ${/glossary/messagequeue:/term} specified by ${.:/params[0]/name} was not
      open.
  role: errno
  uid: /c/errno/if/ebadf
- description: |
    The ${.:/params[1]/name} parameter was ${/c/if/null:/name}.
  role: errno
  uid: /c/errno/if/einval
name: mq_setattr
notes: |
  See [POSIX.1-2024, System Interfaces, mq_setattr()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/mq_setattr.html).
params:
- description: |
    is the ${../glossary/mqdes:/term}.
  dir: null
  name: mqdes
- description: |
    is the pointer to an ${/c/if/mq_attr:/name} object containing the new
    attributes.
  dir: in
  name: mqstat
- description: |
    is the pointer to an ${/c/if/mq_attr:/name} object where the previous
    attributes will be stored.
  dir: out
  name: omqstat
return:
  return: null
  return-values:
  - description: |
      The requested operation was successful.
    value: 0
  - description: |
      On error, -1 is returned, and ${/c/errno/if/errno:/name} is set to indicate the
      error.
    value: -1
type: interface
