enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/close
- role: requirement-refinement
  uid: ../../req/group-posix-api
post-conditions:
- name: Status
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/close:/name} shall be zero.
  - name: MinusOne
    test-code: |
      T_eq_int( ctx->status, -1 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/close:/name} shall be minus one.
  test-epilogue: null
  test-prologue: null
- name: Errno
  states:
  - name: Nop
    test-code: |
      T_eq_int( ctx->errno_value, ERRNO_POISON );
    text: |
      The value of ${/c/errno/if/errno:/name} shall not be modified by the
      ${../if/close:/name} call.
  - name: Badf
    test-code: |
      T_eq_int( ctx->errno_value, EBADF );
    text: |
      The value of ${/c/errno/if/errno:/name} shall be ${/c/errno/if/ebadf:/name}.
  test-epilogue: null
  test-prologue: null
- name: Open
  states:
  - name: 'No'
    test-code: |
      T_eq_u32( ctx->queue->open_count, 0 );
    text: |
      The ${/glossary/messagequeue:/term} shall not be open.
  - name: Once
    test-code: |
      T_eq_u32( ctx->queue->open_count, 1 );
    text: |
      The ${/glossary/messagequeue:/term} shall be open once.
  - name: Nop
    test-code: |
      T_eq_u32( ctx->queue->open_count, ctx->open_count );
    text: |
      The number of opens of the ${/glossary/messagequeue:/term} shall not be
      modified by the ${../if/close:/name} call.
  test-epilogue: null
  test-prologue: null
- name: Queue
  states:
  - name: Deleted
    test-code: |
      T_eq_sz( GetInactiveCount(), ctx->inactive_count + 1 );
    text: |
      The ${/glossary/messagequeue:/term} shall be deleted.
  - name: Nop
    test-code: |
      T_eq_sz( GetInactiveCount(), ctx->inactive_count );
    text: |
      No ${/glossary/messagequeue:/term} shall be deleted by the ${../if/close:/name}
      call.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: MqDes
  states:
  - name: Valid
    test-code: |
      ctx->mqdes = ctx->queue_id;
    text: |
      While the ${../if/close:/params[0]/name} parameter is the
      ${../glossary/mqdes:/term} of a ${/glossary/messagequeue:/term}.
  - name: Invalid
    test-code: |
      ctx->mqdes = (mqd_t) INVALID_ID;
    text: |
      While the ${../if/close:/params[0]/name} parameter is not a
      ${../glossary/mqdes:/term}.
  test-epilogue: null
  test-prologue: null
- name: Open
  states:
  - name: 'No'
    test-code: |
      T_eq_int( mq_close( ctx->queue_id ), 0 );
    text: |
      While the ${/glossary/messagequeue:/term} is not open.
  - name: Once
    test-code: |
      /* The message queue was opened once by the preparation */
    text: |
      While the ${/glossary/messagequeue:/term} is open once.
  - name: Twice
    test-code: |
      T_eq_int( mq_open( NAME, O_RDWR ), ctx->queue_id );
    text: |
      While the ${/glossary/messagequeue:/term} is open twice.
  test-epilogue: null
  test-prologue: null
- name: Name
  states:
  - name: 'Yes'
    test-code: |
      /* The message queue was created with a name */
    text: |
      While the ${/glossary/messagequeue:/term} has a name.
  - name: 'No'
    test-code: |
      T_eq_int( mq_unlink( NAME ), 0 );
    text: |
      While the ${/glossary/messagequeue:/term} has no name.
  test-epilogue: null
  test-prologue: null
rationale: |
  The dimensions follow the reads of the implementation. The
  ${../if/close:/params[0]/name} parameter selects the
  ${/glossary/messagequeue:/term}, the number of opens decides whether the
  ${../glossary/mqdes:/term} is open, and the name decides whether closing the
  last open deletes the ${/glossary/messagequeue:/term}, see
  ${/ref/std/posix-2024/mq-close:/name} and
  ${/ref/std/posix-2024/mq-unlink:/name}.

  In RTEMS, each ${../if/open:/name} call for a ${/glossary/messagequeue:/term}
  returns the same ${../glossary/mqdes:/term}, so the state Twice of the
  pre-condition Open stands for two ${../glossary/mqdes:/term}s which refer to
  the same ${/glossary/messagequeue:/term}. A ${/glossary/messagequeue:/term}
  which is not open and has no name is deleted, so this combination is skipped.

  The standard requires that ${../if/close:/name} removes a notification request
  of the calling process. RTEMS does not do this. A notification request can be
  registered only if RTEMS is built with the option RTEMS_POSIX_API enabled, and
  the function which registers it is not specified by this item.
requirement-type: functional
skip-reasons:
  Deleted: |
    A ${/glossary/messagequeue:/term} which is not open and has no name is deleted.
test-action: |
  ctx->open_count = ctx->queue->open_count;
  ctx->inactive_count = GetInactiveCount();
  errno = ERRNO_POISON;
  ctx->status = mq_close( ctx->mqdes );
  ctx->errno_value = errno;
test-brief: null
test-cleanup: |
  int i;

  if ( ctx->queue->linked ) {
    T_eq_int( mq_unlink( NAME ), 0 );
  }

  for ( i = 0; i < 2 && ctx->queue->open_count > 0; ++i ) {
    T_eq_int( mq_close( ctx->queue_id ), 0 );
  }
