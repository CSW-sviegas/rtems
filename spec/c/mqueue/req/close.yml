transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          MqDes: Valid
          Open:
          - Once
          - Twice
      then: Zero
    - else: MinusOne
    Errno:
    - if:
        post-conditions:
          Status: Zero
      then: Nop
    - else: Badf
    Open:
    - if:
        pre-conditions:
          MqDes: Invalid
      then: N/A
    - if:
        pre-conditions:
          Name: 'No'
          Open: Once
      then: N/A
    - if:
        pre-conditions:
          Open: Once
      then: 'No'
    - if:
        pre-conditions:
          Open: Twice
      then: Once
    - else: Nop
    Queue:
    - if:
        pre-conditions:
          MqDes: Valid
          Name: 'No'
          Open: Once
      then: Deleted
    - else: Nop
    Flush:
    - if:
        post-conditions:
          Queue: Deleted
      then: 'Yes'
    - else: 'No'
  pre-conditions:
    MqDes: all
    Waiter: all
    Open:
      applicable:
        pre-conditions:
          MqDes: Valid
    Name:
      applicable:
        pre-conditions:
          MqDes: Valid
- enabled-by: true
  post-conditions: Deleted
  pre-conditions:
    MqDes:
    - Valid
    Waiter: all
    Open:
    - 'No'
    Name:
    - 'No'
type: requirement
