  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          MqDes: Valid
          MqStat: Obj
          Open: 'Yes'
      then: Zero
    - else: MinusOne
    Errno:
    - if:
        pre-conditions:
          MqStat: 'Null'
      then: Inval
    - if:
        post-conditions:
          Status: MinusOne
      then: Badf
    - else: Nop
    PrevFlags:
    - if:
        pre-conditions:
          OMqStat: 'Null'
      then: N/A
    - if:
        post-conditions:
          Status: Zero
      then-specified-by: StoredFlags
    - else: Nop
    PrevMaxMsg:
    - if:
        pre-conditions:
          OMqStat: 'Null'
      then: N/A
    - if:
        post-conditions:
          Status: Zero
      then-specified-by: StoredMaxMsg
    - else: Nop
    PrevMsgSize:
    - if:
        pre-conditions:
          OMqStat: 'Null'
      then: N/A
    - if:
        post-conditions:
          Status: Zero
      then-specified-by: StoredMsgSize
    - else: Nop
    PrevCurMsgs:
    - if:
        pre-conditions:
          OMqStat: 'Null'
      then: N/A
    - if:
        post-conditions:
          Status: Zero
      then-specified-by: StoredCurMsgs
    - else: Nop
    Flags:
    - if:
        pre-conditions:
          MqDes: Invalid
      then: N/A
    - if:
        post-conditions:
          Status: Zero
      then-specified-by: NewFlags
    - else: Nop
    Other:
    - if:
        pre-conditions:
          MqDes: Invalid
      then: N/A
    - else: Nop
    MqStatObj:
    - if:
        pre-conditions:
          MqStat: 'Null'
      then: N/A
    - else: Nop
  pre-conditions:
    MqStat: all
    NewFlags:
      applicable:
        pre-conditions:
          MqStat: Obj
    OMqStat: all
    StoredFlags:
      applicable:
        pre-conditions:
          MqDes: Valid
    StoredMaxMsg:
      applicable:
        pre-conditions:
          MqDes: Valid
    StoredMsgSize:
      applicable:
        pre-conditions:
          MqDes: Valid
    MqDes: all
    StoredCurMsgs:
      applicable:
        pre-conditions:
          MqDes: Valid
    Open:
      applicable:
        pre-conditions:
          MqDes: Valid
type: requirement
