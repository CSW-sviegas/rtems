test-context-support: null
test-description: null
test-header: null
test-includes:
- errno.h
- fcntl.h
- mqueue.h
- sys/stat.h
test-local-includes:
- tx-support.h
test-prepare: |
  errno = -1;
  ctx->retval = -1;
  ctx->oflag = O_CREAT | O_RDWR;
  ctx->mq = mq_open( QUEUE_NAME, ctx->oflag, S_IRWXU, &queue_attr );
  T_ne_u32( ctx->mq, (mqd_t) -1 );
  T_eq_int( mq_send( ctx->mq, "a", 1, 0 ), 0 );
  ctx->mqstat_obj.mq_flags = O_NONBLOCK;
  ctx->mqstat_obj.mq_maxmsg = 0;
  ctx->mqstat_obj.mq_msgsize = 0;
  ctx->mqstat_obj.mq_curmsgs = 0;
  ctx->omqstat_obj.mq_flags = -1;
  ctx->omqstat_obj.mq_maxmsg = -1;
  ctx->omqstat_obj.mq_msgsize = -1;
  ctx->omqstat_obj.mq_curmsgs = -1;
test-setup: null
test-stop: null
test-support: |
  #define QUEUE_NAME "mq"

  #define MAX_MSG 2

  #define MSG_SIZE 4

  static const struct mq_attr queue_attr = { 0, MAX_MSG, MSG_SIZE, 0 };
test-target: testsuites/validation/tc-posix-mq-setattr.c
test-teardown: null
text: |
  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
      - pre-conditions:
          MqStat: 'Null'
      - pre-conditions:
          Mqdes:
          - Closed
          - Invalid
      then: MinusOne
    - else: Zero
    Errno:
    - if:
        pre-conditions:
          MqStat: 'Null'
      then: EINVAL
    - if:
        post-conditions:
          Status: MinusOne
      then: EBADF
    - else: Unchanged
    PrevFlags:
    - if:
        pre-conditions:
          OMqStat: 'Null'
      then: N/A
    - if:
        post-conditions:
          Status: Zero
      then: Set
    - else: Nop
    PrevMaxMsg:
    - if:
        pre-conditions:
          OMqStat: 'Null'
      then: N/A
    - if:
        post-conditions:
          Status: Zero
      then: Set
    - else: Nop
    PrevMsgSize:
    - if:
        pre-conditions:
          OMqStat: 'Null'
      then: N/A
    - if:
        post-conditions:
          Status: Zero
      then: Set
    - else: Nop
    PrevCurMsgs:
    - if:
        pre-conditions:
          OMqStat: 'Null'
      then: N/A
    - if:
        post-conditions:
          Status: Zero
      then: Set
    - else: Nop
    Flags:
    - if:
        pre-conditions:
          Mqdes: Invalid
      then: N/A
    - if:
        post-conditions:
          Status: Zero
      then: Set
    - else: Nop
  pre-conditions:
    Mqdes: all
    MqStat: all
    OMqStat: all
type: requirement
