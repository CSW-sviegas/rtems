        - post-conditions:
            Status: N/A
        - pre-conditions:
            Context: Interrupt
      then: N/A
    - else: 'No'
    Tasks:
    - if: *id006
      then: Fifo
    - else: N/A
    FatalError:
    - if: *id007
      then: 'Yes'
    - else: Nop
  pre-conditions:
    MsgPrio: all
    MsgLen: all
    MqDes: all
    StoredPrio:
