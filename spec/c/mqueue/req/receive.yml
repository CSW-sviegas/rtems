  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
      - pre-conditions:
          Mqdes:
          - WriteOnly
          - Closed
          - Invalid
      - pre-conditions:
          MsgLen: TooSmall
      - pre-conditions:
          Blocking: 'No'
          Queue: Empty
      then: MinusOne
    - else: Length
    Errno:
    - if:
        pre-conditions:
          Mqdes:
          - WriteOnly
          - Invalid
      then: EBADF
    - if:
        pre-conditions:
          MsgLen: TooSmall
      then: EMSGSIZE
    - if:
        pre-conditions:
          Mqdes: Closed
      then: EBADF
    - if:
        pre-conditions:
          Blocking: 'No'
          Queue: Empty
      then: EAGAIN
    - else: Unchanged
    Buffer:
    - if:
        post-conditions:
          Status: MinusOne
      then: Nop
    - else: Received
    Prio:
    - if:
        post-conditions:
          Status: MinusOne
      then: Nop
    - if:
        pre-conditions:
          MsgPrio: 'Null'
      then: N/A
    - else: Received
    Message:
    - if:
        post-conditions:
          Status: MinusOne
      then: Nop
    - else: Dequeued
  pre-conditions:
    Mqdes: all
    MsgLen:
      applicable:
        pre-conditions:
          Mqdes:
          - Valid
          - Closed
    MsgPrio:
      applicable:
        pre-conditions:
          Mqdes: Valid
          MsgLen: Valid
    Queue:
      applicable:
        pre-conditions:
          Mqdes: Valid
    Blocking:
      applicable:
        pre-conditions:
          Mqdes: Valid
          MsgLen: Valid
          Queue: Empty
type: requirement
