  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if: &id001
      - pre-conditions:
          MqDes: Invalid
      - pre-conditions:
          Open: 'No'
      - pre-conditions:
          Access: WriteOnly
      then: MinusOne
    - if: &id002
        pre-conditions:
          MsgLen:
          - Zero
          - One
          - Below
      then: MinusOne
    - if: &id003
        pre-conditions:
          Messages:
          - Some
          - Full
      then-specified-by: StoredSize
    - if: &id004
        pre-conditions:
          NonBlock: 'Yes'
      then: MinusOne
    - if: &id005
        pre-conditions:
          Context: Interrupt
      then: N/A
    - else: N/A
    Errno:
    - if: *id001
      then: Badf
    - if: *id002
      then: MsgSize
    - if: *id003
      then: Nop
    - if: *id004
      then: Again
    - if: *id005
      then: N/A
    - else: N/A
    Buffer:
    - if:
        post-conditions:
          Status: MinusOne
      then: Nop
    - if:
        post-conditions:
          Status: N/A
      then: N/A
    - if:
        pre-conditions:
          StoredSize: Zero
      then: Nop
    - specified-by: StoredSize
    Priority:
    - if:
        pre-conditions:
          MsgPrio: 'Null'
      then: N/A
    - if:
        post-conditions:
          Status: MinusOne
      then: Nop
    - if:
        post-conditions:
          Status: N/A
      then: N/A
    - specified-by: StoredPrio
    Queue:
    - if:
        pre-conditions:
          MqDes: Invalid
      then: N/A
    - if:
        and:
        - post-conditions:
            Status:
            - Zero
            - One
            - Below
            - Max
      then: Removed
    - else: Nop
    Sender:
    - if:
        pre-conditions:
          MqDes: Invalid
      then: N/A
    - if:
        pre-conditions:
          Waiters: None
