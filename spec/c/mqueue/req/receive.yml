enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/receive
- role: requirement-refinement
  uid: ../../req/group-posix-api
post-conditions:
- name: Status
  states:
  - name: Length
    test-code: |
      T_eq_long( ctx->retval, MSG_SIZE );
    text: |
      The return value of ${../if/receive:/name} shall be equal to the
      ${../glossary/msgsize:/term} of the received ${/glossary/message:/term}.
  - name: MinusOne
    test-code: |
      T_eq_long( ctx->retval, -1 );
    text: |
      The return value of ${../if/receive:/name} shall be equal to minus one.
  test-epilogue: null
  test-prologue: null
- name: Errno
  states:
  - name: Unchanged
    test-code: |
      T_eq_int( errno, -1 );
    text: |
      The ${/c/errno/if/errno:/name} shall not be changed by the
      ${../if/receive:/name} call.
  - name: EBADF
    test-code: |
      T_eq_int( errno, EBADF );
    text: |
      The ${/c/errno/if/errno:/name} shall be set to ${/c/errno/if/ebadf:/name}.
  - name: EMSGSIZE
    test-code: |
      T_eq_int( errno, EMSGSIZE );
    text: |
      The ${/c/errno/if/errno:/name} shall be set to ${/c/errno/if/emsgsize:/name}.
  - name: EAGAIN
    test-code: |
      T_eq_int( errno, EAGAIN );
    text: |
      The ${/c/errno/if/errno:/name} shall be set to ${/c/errno/if/eagain:/name}.
  test-epilogue: null
  test-prologue: null
- name: Buffer
  states:
  - name: Received
    test-code: |
      T_eq_mem( ctx->recv_buf, ctx->msg, MSG_SIZE );
    text: |
      The buffer referenced by ${../if/receive:/params[1]/name} shall contain the
      received ${/glossary/message:/term}.
  - name: Nop
    test-code: |
      T_eq_mem( ctx->recv_buf, ctx->untouched_buf, MSG_SIZE );
    text: |
      The buffer referenced by ${../if/receive:/params[1]/name} shall not be modified
      by the ${../if/receive:/name} call.
  test-epilogue: null
  test-prologue: null
- name: Prio
  states:
  - name: Received
    test-code: |
      T_eq_uint( ctx->prio_value, MSG_PRIO );
    text: |
      The object referenced by ${../if/receive:/params[3]/name} shall be set to the
      ${../glossary/msgprio:/term} of the received ${/glossary/message:/term}.
  - name: Nop
    test-code: |
      T_eq_uint( ctx->prio_value, UINT_MAX );
    text: |
      The object referenced by ${../if/receive:/params[3]/name} shall not be modified
      by the ${../if/receive:/name} call.
  test-epilogue: null
  test-prologue: null
- name: Message
  states:
  - name: Dequeued
    test-code: |
      T_eq_long( GetPendingCount( ctx ), 0 );
    text: |
      The received ${/glossary/message:/term} shall be removed from the
      ${/glossary/messagequeue:/term}.
  - name: Nop
    test-code: |
      if ( ctx->queue_pending ) {
        T_eq_long( GetPendingCount( ctx ), 1 );
        CheckReceive( ctx );
      } else {
        T_eq_long( GetPendingCount( ctx ), 0 );
      }
    text: |
      The ${/glossary/messagequeue:/term} shall not be changed by the
      ${../if/receive:/name} call.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Mqdes
  states:
  - name: Valid
    test-code: |
      ctx->mqdes = ctx->mq;
    text: |
      While the ${../if/receive:/params[0]/name} parameter is a
      ${../glossary/mqdes:/term} of a ${/glossary/messagequeue:/term} opened for
      reading.
  - name: WriteOnly
    test-code: |
      T_eq_int( mq_close( ctx->mq ), 0 );
      T_eq_int( mq_unlink( MQ_NAME ), 0 );
      ctx->mq = mq_open( MQ_NAME, O_CREAT | O_WRONLY, 0600, &ctx->mq_attr );
      T_ne_u32( ctx->mq, INVALID_MQ );
      ctx->mqdes = ctx->mq;
    text: |
      While the ${../if/receive:/params[0]/name} parameter is a
      ${../glossary/mqdes:/term} of a ${/glossary/messagequeue:/term} opened for
      writing only.
  - name: Closed
    test-code: |
      ctx->mqdes = ctx->mq;
      T_eq_int( mq_close( ctx->mq ), 0 );
      ctx->mq_closed = true;
    text: |
      While the ${../if/receive:/params[0]/name} parameter is a
      ${../glossary/mqdes:/term} of a ${/glossary/messagequeue:/term} which was
      closed and not unlinked.
  - name: Invalid
    test-code: |
      ctx->mqdes = INVALID_MQ;
    text: |
      While the ${../if/receive:/params[0]/name} parameter is not a
      ${../glossary/mqdes:/term} of a ${/glossary/messagequeue:/term}.
  test-epilogue: null
  test-prologue: null
- name: MsgLen
  states:
  - name: Valid
    test-code: |
      ctx->msg_len = MSG_SIZE;
    text: |
      While the ${../if/receive:/params[2]/name} parameter is greater than or equal
      to the maximum ${../glossary/msgsize:/term} of the
      ${/glossary/messagequeue:/term}.
  - name: TooSmall
    test-code: |
      ctx->msg_len = MSG_SIZE - 1;
    text: |
      While the ${../if/receive:/params[2]/name} parameter is less than the maximum
      ${../glossary/msgsize:/term} of the ${/glossary/messagequeue:/term}.
  test-epilogue: null
  test-prologue: null
- name: MsgPrio
  states:
  - name: Valid
    test-code: |
      ctx->msg_prio = &ctx->prio_value;
    text: |
      While the ${../if/receive:/params[3]/name} parameter references an object of
      type `unsigned int`.
  - name: 'Null'
    test-code: |
      ctx->msg_prio = NULL;
    text: |
      While the ${../if/receive:/params[3]/name} parameter is ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Queue
  states:
  - name: Pending
    test-code: |
      ctx->queue_pending = true;
      T_eq_int(
        mq_send( ctx->mq, (const char *) ctx->msg, MSG_SIZE, MSG_PRIO ),
        0
      );
    text: |
      While the ${/glossary/messagequeue:/term} contains a
      ${/glossary/message:/term}.
  - name: Empty
    test-code: |
      /* Already prepared */
    text: |
      While the ${/glossary/messagequeue:/term} is empty.
  test-epilogue: null
  test-prologue: null
- name: Blocking
  states:
  - name: 'Yes'
    test-code: |
      ctx->mq_attr.mq_flags = O_RDWR;
      T_eq_int( mq_setattr( ctx->mq, &ctx->mq_attr, NULL ), 0 );
      SendEvents( ctx->worker_id, EVENT_SEND );
    text: |
      While the ${/c/fcntl/if/o-nonblock:/name} flag is not set for the
      ${/glossary/messagequeue:/term} description, while a thread sends a
      ${/glossary/message:/term} once the calling thread is blocked.
  - name: 'No'
    test-code: |
      /* Already prepared */
    text: |
      While the ${/c/fcntl/if/o-nonblock:/name} flag is set for the
      ${/glossary/messagequeue:/term} description.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
requirement-type: functional
skip-reasons: {}
test-action: |
  ctx->retval = mq_receive(
    ctx->mqdes,
    ctx->msg_ptr,
    ctx->msg_len,
    ctx->msg_prio
  );
test-brief: null
test-cleanup: |
  if ( !ctx->mq_closed ) {
    T_eq_int( mq_close( ctx->mq ), 0 );
  }

  T_eq_int( mq_unlink( MQ_NAME ), 0 );
