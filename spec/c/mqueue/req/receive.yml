enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/receive
- role: requirement-refinement
  uid: ../../req/group-posix-api
post-conditions:
- name: Status
  states:
  - name: One
    test-code: |
      T_eq_ssz( ctx->status, 1 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/receive:/name} shall be one.
  - name: Max
    test-code: |
      T_eq_ssz( ctx->status, MSG_SIZE );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/receive:/name} shall be the
      ${../glossary/msgsize:/term} of the received ${/glossary/message:/term}.
  - name: MinusOne
    test-code: |
      T_eq_ssz( ctx->status, -1 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/receive:/name} shall be minus
      one.
  test-epilogue: null
  test-prologue: null
- name: Errno
  states:
  - name: Nop
    test-code: |
      T_eq_int( ctx->errno_value, ERRNO_POISON );
    text: |
      The value of ${/c/errno/if/errno:/name} shall not be modified by the
      ${../if/receive:/name} call.
  - name: Badf
    test-code: |
      T_eq_int( ctx->errno_value, EBADF );
    text: |
      The value of ${/c/errno/if/errno:/name} shall be ${/c/errno/if/ebadf:/name}.
  - name: MsgSize
    test-code: |
      T_eq_int( ctx->errno_value, EMSGSIZE );
    text: |
      The value of ${/c/errno/if/errno:/name} shall be ${/c/errno/if/emsgsize:/name}.
  - name: Again
    test-code: |
      T_eq_int( ctx->errno_value, EAGAIN );
    text: |
      The value of ${/c/errno/if/errno:/name} shall be ${/c/errno/if/eagain:/name}.
  test-epilogue: null
  test-prologue: null
- name: Buffer
  states:
  - name: One
    test-code: |
      CheckBuffer( ctx, 1 );
    text: |
      The buffer referenced by the ${../if/receive:/params[1]/name} parameter shall
      consist of the received ${/glossary/message:/term} of one byte followed by the
      bytes of the buffer before the call.
  - name: Max
    test-code: |
      CheckBuffer( ctx, MSG_SIZE );
    text: |
      The buffer referenced by the ${../if/receive:/params[1]/name} parameter shall
      consist of the received ${/glossary/message:/term} of the maximum
      ${../glossary/msgsize:/term} followed by the bytes of the buffer before the
      call.
  - name: Nop
    test-code: |
      CheckBuffer( ctx, 0 );
    text: |
      The buffer referenced by the ${../if/receive:/params[1]/name} parameter shall
      not be modified.
  test-epilogue: null
  test-prologue: null
- name: Priority
  states:
  - name: Low
    test-code: |
      T_eq_uint( ctx->prio_obj, 0 );
    text: |
      The object referenced by the ${../if/receive:/params[3]/name} parameter shall
      be zero.
  - name: High
    test-code: |
      T_eq_uint( ctx->prio_obj, MQ_PRIO_MAX );
    text: |
      The object referenced by the ${../if/receive:/params[3]/name} parameter shall
      be the ${../glossary/msgprio:/term} of the received ${/glossary/message:/term}.
  - name: Nop
    test-code: |
      T_eq_uint( ctx->prio_obj, PRIO_POISON );
    text: |
      The object referenced by the ${../if/receive:/params[3]/name} parameter shall
      not be modified.
  test-epilogue: null
  test-prologue: null
- name: Queue
  states:
  - name: Removed
    test-code: |
      T_null( FindMessage( ctx, RECEIVE_BYTE ) );
      T_eq_ptr( FindMessage( ctx, FILLER_BYTE ), GetFirstMessage( ctx ) );
    text: |
      The received ${/glossary/message:/term} shall be removed from the
      ${/glossary/messagequeue:/term}.
  - name: Nop
    test-code: |
      T_eq_u32( GetPendingCount( ctx ), ctx->pending_count );

      if ( ctx->pending_count > 0 ) {
        T_eq_ptr( FindMessage( ctx, RECEIVE_BYTE ), GetFirstMessage( ctx ) );
      }
    text: |
      The ${/glossary/messagequeue:/term} shall not be modified by the
      ${../if/receive:/name} call.
  test-epilogue: null
  test-prologue: null
- name: Sender
  states:
  - name: Moved
    test-code: |
      T_true( ctx->sender->done );
      T_eq_ptr( FindMessage( ctx, SENDER_BYTE ), GetLastMessage( ctx ) );
    text: |
      The ${/glossary/message:/term} of the thread which waits to send a
      ${/glossary/message:/term} shall be added to the
      ${/glossary/messagequeue:/term}.
  - name: Nop
    test-code: |
      T_false( ctx->sender->done );
      T_null( FindMessage( ctx, SENDER_BYTE ) );
    text: |
      The thread which waits to send a ${/glossary/message:/term} shall still wait.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: MsgPrio
  states:
  - name: Obj
    test-code: |
      ctx->msg_prio = &ctx->prio_obj;
    text: |
      While the ${../if/receive:/params[3]/name} parameter references an object of
      type unsigned int.
  - name: 'Null'
    test-code: |
      ctx->msg_prio = NULL;
    text: |
      While the ${../if/receive:/params[3]/name} parameter is ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: MsgLen
  states:
  - name: Max
    test-code: |
      ctx->msg_len = MSG_SIZE;
    text: |
      While the ${../if/receive:/params[2]/name} parameter is equal to the maximum
      ${../glossary/msgsize:/term} of the ${/glossary/messagequeue:/term}.
  - name: Greater
    test-code: |
      ctx->msg_len = MSG_SIZE + 1;
    text: |
      While the ${../if/receive:/params[2]/name} parameter is greater than the
      maximum ${../glossary/msgsize:/term} of the ${/glossary/messagequeue:/term}.
  - name: TooSmall
    test-code: |
      ctx->msg_len = MSG_SIZE - 1;
    text: |
      While the ${../if/receive:/params[2]/name} parameter is less than the maximum
      ${../glossary/msgsize:/term} of the ${/glossary/messagequeue:/term}.
  test-epilogue: null
  test-prologue: null
- name: MqDes
  states:
  - name: Valid
    test-code: |
      ctx->mqdes = ctx->queue_id;
    text: |
      While the ${../if/receive:/params[0]/name} parameter is the
      ${../glossary/mqdes:/term} of a ${/glossary/messagequeue:/term}.
  - name: Invalid
    test-code: |
      ctx->mqdes = (mqd_t) INVALID_ID;
    text: |
      While the ${../if/receive:/params[0]/name} parameter is not a
      ${../glossary/mqdes:/term}.
  test-epilogue: null
  test-prologue: null
- name: StoredPrio
  states:
  - name: Low
    test-code: |
      ctx->stored_prio = 0;
    text: |
      While the ${../glossary/msgprio:/term} of the first ${/glossary/message:/term}
      of the ${/glossary/messagequeue:/term} is zero.
  - name: High
    test-code: |
      ctx->stored_prio = MQ_PRIO_MAX;
    text: |
      While the ${../glossary/msgprio:/term} of the first ${/glossary/message:/term}
      of the ${/glossary/messagequeue:/term} is greater than zero.
  test-epilogue: null
  test-prologue: null
- name: StoredSize
  states:
  - name: One
    test-code: |
      ctx->stored_size = 1;
    text: |
      While the ${../glossary/msgsize:/term} of the first ${/glossary/message:/term}
      of the ${/glossary/messagequeue:/term} is one.
  - name: Max
    test-code: |
      ctx->stored_size = MSG_SIZE;
    text: |
      While the ${../glossary/msgsize:/term} of the first ${/glossary/message:/term}
      of the ${/glossary/messagequeue:/term} is greater than one.
  test-epilogue: null
  test-prologue: null
- name: Queue
  states:
  - name: Empty
    test-code: |
      ctx->empty = true;
    text: |
      While the ${/glossary/messagequeue:/term} contains no
      ${/glossary/message:/term} and a thread sends the first
      ${/glossary/message:/term} to the ${/glossary/messagequeue:/term} when the
      calling thread waits for a ${/glossary/message:/term}.
  - name: Pending
    test-code: |
      SendStored( ctx );
      SendFiller( ctx );
    text: |
      While the ${/glossary/messagequeue:/term} contains ${/glossary/message:/term}s
      and no thread waits to send a ${/glossary/message:/term} to the
      ${/glossary/messagequeue:/term}.
  - name: Sender
    test-code: |
      SendStored( ctx );
      SendFiller( ctx );
      SendEvents( ctx->sender_id, EVENT_SEND );
      WaitForExecutionStop( ctx->sender_id );
      T_false( ctx->sender->done );
      ctx->sender_waits = true;
    text: |
      While the ${/glossary/messagequeue:/term} is full and a thread waits to send a
      ${/glossary/message:/term} to the ${/glossary/messagequeue:/term}.
  test-epilogue: null
  test-prologue: null
- name: Access
  states:
  - name: ReadWrite
    test-code: |
      ctx->oflag = O_RDWR;
    text: |
      While the ${/glossary/messagequeue:/term} is open for reading and writing.
  - name: ReadOnly
    test-code: |
      ctx->oflag = O_RDONLY;
    text: |
      While the ${/glossary/messagequeue:/term} is open for reading only.
  - name: WriteOnly
    test-code: |
      ctx->oflag = O_WRONLY;
    text: |
      While the ${/glossary/messagequeue:/term} is open for writing only.
  test-epilogue: null
  test-prologue: null
- name: NonBlock
  states:
  - name: 'Yes'
    test-code: |
      SetFlags( ctx, ctx->oflag | O_NONBLOCK );
    text: |
      While the flags of the ${/glossary/messagequeue:/term} contain
      ${/c/fcntl/if/o-nonblock:/name}.
  - name: 'No'
    test-code: |
      SetFlags( ctx, ctx->oflag );
    text: |
      While the flags of the ${/glossary/messagequeue:/term} do not contain
      ${/c/fcntl/if/o-nonblock:/name}.
  test-epilogue: null
  test-prologue: null
- name: Open
  states:
  - name: 'Yes'
    test-code: |
      /* The message queue was opened by its creation */
    text: |
      While the ${/glossary/messagequeue:/term} is open.
  - name: 'No'
    test-code: |
      T_eq_int( mq_close( ctx->queue_id ), 0 );
    text: |
      While the ${/glossary/messagequeue:/term} is not open.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/mq-receive:/name} specifies that ${../if/receive:/name}
  removes the oldest of the ${/glossary/message:/term}s with the highest priority
  from the ${/glossary/messagequeue:/term}, copies it to the buffer referenced by
  the ${../if/receive:/params[1]/name} parameter, returns its size, and stores
  its priority in the object referenced by the ${../if/receive:/params[3]/name}
  parameter if this parameter is not ${/c/if/null:/name}. This gives the
  pre-conditions MsgPrio, StoredPrio, and StoredSize and the post-conditions
  Status, Buffer, Priority, and Queue. The ${/glossary/message:/term} which the
  test receives is the first ${/glossary/message:/term} of the
  ${/glossary/messagequeue:/term}, the other ${/glossary/message:/term} has the
  priority zero. The standard requires that an empty
  ${/glossary/messagequeue:/term} blocks the call unless
  ${/c/fcntl/if/o-nonblock:/name} is set, which gives pre-condition NonBlock. The
  ${/glossary/messagequeue:/term} of the test can hold two
  ${/glossary/message:/term}s.

  A thread which waits to send a ${/glossary/message:/term} to a full
  ${/glossary/messagequeue:/term} adds its ${/glossary/message:/term} when the
  call removes a ${/glossary/message:/term}, see state Sender of pre-condition
  Queue and post-condition Sender.

  The standard requires ${/c/errno/if/ebadf:/name} if the
  ${../if/receive:/params[0]/name} parameter is not a valid
  ${../glossary/mqdes:/term} open for reading and ${/c/errno/if/emsgsize:/name}
  if the ${../if/receive:/params[2]/name} parameter is less than the maximum
  ${../glossary/msgsize:/term}. This gives pre-condition MqDes, the state
  WriteOnly of pre-condition Access, state No of pre-condition Open, and
  pre-condition MsgLen. RTEMS checks the size before it checks whether the
  ${/glossary/messagequeue:/term} is open.

  The interruption of a waiting call by a signal is not covered, since RTEMS
  provides signals only if it is built with the option RTEMS_POSIX_API enabled.
requirement-type: functional
skip-reasons: {}
test-action: |
  ctx->pending_count = GetPendingCount( ctx );
  ResumeTask( ctx->worker_id );
  WaitForExecutionStop( ctx->worker_id );

  if ( !ctx->done ) {
    T_true( ctx->empty );
    SendStored( ctx );
    WaitForExecutionStop( ctx->worker_id );
    T_true( ctx->done );
  }

  if ( ctx->sender_waits ) {
    WaitForExecutionStop( ctx->sender_id );
  }
test-brief: null
test-cleanup: |
  if ( ctx->queue->open_count == 0 ) {
    T_eq_u32( mq_open( NAME, O_RDWR ), ctx->queue_id );
  }

  SetFlags( ctx, O_RDWR );

  if ( ctx->sender_waits && !ctx->sender->done ) {
    char buf[ MSG_SIZE ];

    T_gt_ssz( mq_receive( ctx->queue_id, buf, sizeof( buf ), NULL ), 0 );
    WaitForExecutionStop( ctx->sender_id );
    T_true( ctx->sender->done );
  }

  T_eq_int( mq_close( ctx->queue_id ), 0 );
  T_eq_int( mq_unlink( NAME ), 0 );
