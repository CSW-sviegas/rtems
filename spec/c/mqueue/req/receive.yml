enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/receive
- role: requirement-refinement
  uid: ../../req/group-posix-api
- role: function-implementation
  uid: /score/tq/req/enqueue-fifo
post-conditions:
- name: Status
  states:
  - name: Zero
    test-code: |
      T_eq_ssz( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/receive:/name} shall be zero.
  - name: One
    test-code: |
      T_eq_ssz( ctx->status, 1 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/receive:/name} shall be one.
  - name: Below
    test-code: |
      T_eq_ssz( ctx->status, MSG_SIZE - 1 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/receive:/name} shall be the
      ${../glossary/msgsize:/term} of the first ${/glossary/message:/term}, which is
      greater than one and less than the maximum ${../glossary/msgsize:/term}.
  - name: Max
    test-code: |
      T_eq_ssz( ctx->status, MSG_SIZE );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/receive:/name} shall be the
      maximum ${../glossary/msgsize:/term} of the ${/glossary/messagequeue:/term}.
  - name: MinusOne
    test-code: |
      T_eq_ssz( ctx->status, -1 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/receive:/name} shall be minus
      one.
  test-epilogue: null
  test-prologue: null
- name: Errno
  states:
  - name: Nop
    test-code: |
      T_eq_int( ctx->errno_value, ERRNO_POISON );
    text: |
      The value of ${/c/errno/if/errno:/name} shall not be modified by the
      ${../if/receive:/name} call.
  - name: Badf
    test-code: |
      T_eq_int( ctx->errno_value, EBADF );
    text: |
      The value of ${/c/errno/if/errno:/name} shall be ${/c/errno/if/ebadf:/name}.
  - name: MsgSize
    test-code: |
      T_eq_int( ctx->errno_value, EMSGSIZE );
    text: |
      The value of ${/c/errno/if/errno:/name} shall be ${/c/errno/if/emsgsize:/name}.
  - name: Again
    test-code: |
      T_eq_int( ctx->errno_value, EAGAIN );
    text: |
      The value of ${/c/errno/if/errno:/name} shall be ${/c/errno/if/eagain:/name}.
  test-epilogue: null
  test-prologue: null
- name: Buffer
  states:
  - name: One
    test-code: |
      CheckBuffer( ctx, 1 );
    text: |
      The buffer referenced by the ${../if/receive:/params[1]/name} parameter shall
      consist of the first ${/glossary/message:/term} of one byte followed by the
      bytes of the buffer before the call.
  - name: Below
    test-code: |
      CheckBuffer( ctx, MSG_SIZE - 1 );
    text: |
      The buffer referenced by the ${../if/receive:/params[1]/name} parameter shall
      consist of the first ${/glossary/message:/term}, which is greater than one byte
      and less than the maximum ${../glossary/msgsize:/term}, followed by the bytes
      of the buffer before the call.
  - name: Max
    test-code: |
      CheckBuffer( ctx, MSG_SIZE );
    text: |
      The buffer referenced by the ${../if/receive:/params[1]/name} parameter shall
      consist of the first ${/glossary/message:/term} of the maximum
      ${../glossary/msgsize:/term} followed by the bytes of the buffer before the
      call.
  - name: Nop
    test-code: |
      CheckBuffer( ctx, 0 );
    text: |
      The buffer referenced by the ${../if/receive:/params[1]/name} parameter shall
      not be modified.
  test-epilogue: null
  test-prologue: null
- name: Priority
  states:
  - name: Low
    test-code: |
      T_eq_uint( ctx->prio_obj, 0 );
    text: |
      The object referenced by the ${../if/receive:/params[3]/name} parameter shall
      be zero.
  - name: High
    test-code: |
      T_eq_uint( ctx->prio_obj, MQ_PRIO_MAX - 1 );
    text: |
      The object referenced by the ${../if/receive:/params[3]/name} parameter shall
      be ${/c/if/mq_prio_max:/name} minus one.
  - name: Nop
    test-code: |
      T_eq_uint( ctx->prio_obj, PRIO_POISON );
    text: |
      The object referenced by the ${../if/receive:/params[3]/name} parameter shall
      not be modified.
  test-epilogue: null
  test-prologue: null
- name: Queue
  states:
  - name: Removed
    test-code: |
      T_null( FindMessage( ctx, RECEIVE_BYTE ) );
    text: |
      The first ${/glossary/message:/term} shall be removed from the
      ${/glossary/messagequeue:/term}.
  - name: Nop
    test-code: |
      CheckQueueUnchanged( ctx );
    text: |
      The ${/glossary/messagequeue:/term} shall not be modified by the
      ${../if/receive:/name} call.
  test-epilogue: null
  test-prologue: null
- name: Sender
  states:
  - name: Moved
    test-code: |
      T_true( ctx->sender_done );
      T_eq_int( ctx->sender_status, 0 );
      T_eq_ptr( FindMessage( ctx, SENDER_BYTE ), GetLastMessage( ctx ) );
    text: |
      The ${/glossary/message:/term} of the thread which waits to send a
      ${/glossary/message:/term} shall be added to the end of the
      ${/glossary/messagequeue:/term}, and the call of this thread shall return zero.
  - name: Nop
    test-code: |
      T_false( ctx->sender_done );
      T_null( FindMessage( ctx, SENDER_BYTE ) );
    text: |
      The thread which waits to send a ${/glossary/message:/term} shall still wait.
  test-epilogue: null
  test-prologue: null
- name: Wait
  states:
  - name: 'Yes'
    test-code: |
      T_false( ctx->done );
      T_eq_ptr(
        ctx->worker_tcb->Wait.queue,
        &ctx->queue->Message_queue.Wait_queue.Queue
      );
    text: |
      The calling thread shall wait for a ${/glossary/message:/term} of the
      ${/glossary/messagequeue:/term}.
  - name: 'No'
    test-code: |
      T_true( ctx->done );
    text: |
      The ${../if/receive:/name} call shall return.
  test-epilogue: null
  test-prologue: null
- name: Tasks
  states:
  - name: Fifo
    test-code: |
      ReleaseWorker( ctx );
      ${/score/tq/req/enqueue-fifo:/test-run}( &ctx->tq_ctx );
    text: |
      The calling thread shall be enqueued in FIFO order as specified by
      ${/score/tq/req/enqueue-fifo:/spec}.
  test-epilogue: null
  test-prologue: null
- name: FatalError
  states:
  - name: 'Yes'
    test-code: |
      T_eq_u32( ctx->fatal_calls, 1 );
    text: |
      The fatal error with a fatal source of
      ${/score/interr/if/internal-error-core:/name} and a fatal code of
      ${/score/interr/if/bad-thread-dispatch-disable-level:/name} shall occur by the
      ${../if/receive:/name} call.
  - name: Nop
    test-code: |
      T_eq_u32( ctx->fatal_calls, 0 );
    text: |
      The ${../if/receive:/name} call shall not cause a fatal error.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: MsgPrio
  states:
  - name: Obj
    test-code: |
      ctx->msg_prio = &ctx->prio_obj;
    text: |
      While the ${../if/receive:/params[3]/name} parameter references an object of
      type unsigned int.
  - name: 'Null'
    test-code: |
      ctx->msg_prio = NULL;
    text: |
      While the ${../if/receive:/params[3]/name} parameter is ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: MsgLen
  states:
  - name: Zero
    test-code: |
      ctx->msg_len = 0;
    text: |
      While the ${../if/receive:/params[2]/name} parameter is zero.
  - name: One
    test-code: |
      ctx->msg_len = 1;
    text: |
      While the ${../if/receive:/params[2]/name} parameter is one.
  - name: Below
    test-code: |
      ctx->msg_len = MSG_SIZE - 1;
    text: |
      While the ${../if/receive:/params[2]/name} parameter is greater than one and
      less than the maximum ${../glossary/msgsize:/term} of the
      ${/glossary/messagequeue:/term}.
  - name: Max
    test-code: |
      ctx->msg_len = MSG_SIZE;
    text: |
      While the ${../if/receive:/params[2]/name} parameter is equal to the maximum
      ${../glossary/msgsize:/term} of the ${/glossary/messagequeue:/term}.
  - name: Greater
    test-code: |
      ctx->msg_len = MSG_SIZE + 1;
    text: |
      While the ${../if/receive:/params[2]/name} parameter is greater than the
      maximum ${../glossary/msgsize:/term} of the ${/glossary/messagequeue:/term}.
  test-epilogue: null
  test-prologue: null
- name: MqDes
  states:
  - name: Valid
    test-code: |
      ctx->valid = true;
    text: |
      While the ${../if/receive:/params[0]/name} parameter is the
      ${../glossary/mqdes:/term} of a ${/glossary/messagequeue:/term}.
  - name: Invalid
    test-code: |
      ctx->valid = false;
    text: |
      While the ${../if/receive:/params[0]/name} parameter is not a
      ${../glossary/mqdes:/term}.
  test-epilogue: null
  test-prologue: null
- name: StoredPrio
  states:
  - name: Low
    test-code: |
      ctx->stored_prio = 0;
    text: |
      While the ${../glossary/msgprio:/term} of the first ${/glossary/message:/term}
      of the ${/glossary/messagequeue:/term} is zero.
  - name: High
    test-code: |
      ctx->stored_prio = MQ_PRIO_MAX - 1;
    text: |
      While the ${../glossary/msgprio:/term} of the first ${/glossary/message:/term}
      of the ${/glossary/messagequeue:/term} is ${/c/if/mq_prio_max:/name} minus one.
  test-epilogue: null
  test-prologue: null
- name: StoredSize
  states:
  - name: Zero
    test-code: |
      ctx->stored_size = 0;
    text: |
      While the ${../glossary/msgsize:/term} of the first ${/glossary/message:/term}
      of the ${/glossary/messagequeue:/term} is zero.
  - name: One
    test-code: |
      ctx->stored_size = 1;
    text: |
      While the ${../glossary/msgsize:/term} of the first ${/glossary/message:/term}
      of the ${/glossary/messagequeue:/term} is one.
  - name: Below
    test-code: |
      ctx->stored_size = MSG_SIZE - 1;
    text: |
      While the ${../glossary/msgsize:/term} of the first ${/glossary/message:/term}
      of the ${/glossary/messagequeue:/term} is greater than one and less than the
      maximum ${../glossary/msgsize:/term} of the ${/glossary/messagequeue:/term}.
  - name: Max
    test-code: |
      ctx->stored_size = MSG_SIZE;
    text: |
      While the ${../glossary/msgsize:/term} of the first ${/glossary/message:/term}
      of the ${/glossary/messagequeue:/term} is equal to the maximum
      ${../glossary/msgsize:/term} of the ${/glossary/messagequeue:/term}.
  test-epilogue: null
  test-prologue: null
- name: Access
  states:
  - name: ReadWrite
    test-code: |
      ctx->oflag = O_RDWR;
    text: |
      While the ${/glossary/messagequeue:/term} is open for reading and writing.
  - name: ReadOnly
    test-code: |
      ctx->oflag = O_RDONLY;
    text: |
      While the ${/glossary/messagequeue:/term} is open for reading only.
  - name: WriteOnly
    test-code: |
      ctx->oflag = O_WRONLY;
    text: |
      While the ${/glossary/messagequeue:/term} is open for writing only.
  test-epilogue: null
  test-prologue: null
- name: NonBlock
  states:
  - name: 'Yes'
    test-code: |
      ctx->oflag |= O_NONBLOCK;
    text: |
      While the flags of the ${/glossary/messagequeue:/term} contain
      ${/c/fcntl/if/o-nonblock:/name}.
  - name: 'No'
    test-code: |
      /* O_NONBLOCK is not set */
    text: |
      While the flags of the ${/glossary/messagequeue:/term} do not contain
      ${/c/fcntl/if/o-nonblock:/name}.
  test-epilogue: null
  test-prologue: null
- name: Messages
  states:
  - name: Zero
    test-code: |
      Create( ctx );
    text: |
      While the ${/glossary/messagequeue:/term} contains no
      ${/glossary/message:/term}.
  - name: Some
    test-code: |
      Create( ctx );
      SendStored( ctx );
    text: |
      While the ${/glossary/messagequeue:/term} contains at least one
      ${/glossary/message:/term} and is not full.
  - name: Full
    test-code: |
      Create( ctx );
      SendStored( ctx );
      SendFiller( ctx );
    text: |
      While the ${/glossary/messagequeue:/term} is full.
  test-epilogue: null
  test-prologue: null
- name: Waiters
  states:
  - name: None
    test-code: |
      /* No thread waits */
    text: |
      While no thread waits to send a ${/glossary/message:/term} to the
      ${/glossary/messagequeue:/term}.
  - name: Sender
    test-code: |
      StartSender( ctx );
    text: |
      While a thread waits to send a ${/glossary/message:/term} to the
      ${/glossary/messagequeue:/term}.
  test-epilogue: null
  test-prologue: null
- name: Open
  states:
  - name: 'Yes'
    test-code: |
      /* The message queue was opened by its creation */
    text: |
      While the ${/glossary/messagequeue:/term} is open.
  - name: 'No'
    test-code: |
      T_eq_int( mq_close( ctx->queue_id ), 0 );
    text: |
      While the ${/glossary/messagequeue:/term} is not open.
  test-epilogue: null
  test-prologue: null
- name: Context
  states:
  - name: Task
    test-code: |
      ctx->interrupt = false;
    text: |
      While the ${../if/receive:/name} function is called from within task context.
  - name: Interrupt
    test-code: |
      ctx->interrupt = true;
    text: |
      While the ${../if/receive:/name} function is called from within interrupt
      context.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/mq-receive:/name} specifies that ${../if/receive:/name}
  removes the oldest of the ${/glossary/message:/term}s with the highest priority
  from the ${/glossary/messagequeue:/term}, copies it to the buffer referenced by
  the ${../if/receive:/params[1]/name} parameter, returns its size, and stores
  its priority in the object referenced by the ${../if/receive:/params[3]/name}
  parameter if this parameter is not ${/c/if/null:/name}. This gives the
  pre-conditions MsgPrio, StoredPrio, StoredSize, and Messages and the
  post-conditions Status, Buffer, Priority, and Queue. The pre-conditions
  StoredSize and MsgLen have the states zero, one, a value below the maximum
  ${../glossary/msgsize:/term}, and the maximum ${../glossary/msgsize:/term};
  MsgLen also has a value greater than the maximum ${../glossary/msgsize:/term}.
  The ${/glossary/message:/term} which the test receives is the first
  ${/glossary/message:/term} of the ${/glossary/messagequeue:/term}. The
  ${/glossary/messagequeue:/term} of the test can hold two
  ${/glossary/message:/term}s.

  The standard requires ${/c/errno/if/ebadf:/name} if the
  ${../if/receive:/params[0]/name} parameter is not a valid
  ${../glossary/mqdes:/term} open for reading and ${/c/errno/if/emsgsize:/name}
  if the ${../if/receive:/params[2]/name} parameter is less than the maximum
  ${../glossary/msgsize:/term}. This gives pre-condition MqDes, the state
  WriteOnly of pre-condition Access, state No of pre-condition Open, and
  pre-condition MsgLen. RTEMS checks the ${/glossary/messagequeue:/term} before
  the size.

  The standard requires that an empty ${/glossary/messagequeue:/term} blocks the
  call unless ${/c/fcntl/if/o-nonblock:/name} is set, which gives pre-condition
  NonBlock. While the calling thread waits, the ${/glossary/messagequeue:/term}
  enqueues it in FIFO order, see post-condition Tasks.

  Another event ends a wait. A ${/glossary/message:/term} which a thread sends
  ends the wait, see the items of ${../if/send:/name} and
  ${../if/timedsend:/name}. The deletion of the ${/glossary/messagequeue:/term}
  ends the wait, see the items of ${../if/close:/name} and ${../if/unlink:/name}.
  A thread which waits to send a ${/glossary/message:/term} to a full
  ${/glossary/messagequeue:/term} adds its ${/glossary/message:/term} when the
  call removes a ${/glossary/message:/term}, see pre-condition Waiters and
  post-condition Sender.

  The ${/rtems/task/if/delete:/name}, ${/rtems/task/if/restart:/name}, and
  ${/c/pthread/if/cancel:/name} items specify the extraction of a waiting thread.
  The thread queue of the message queue uses the FIFO discipline, so a priority
  change of a waiting thread does not change its position. A signal and the
  notification of a message queue need the option RTEMS_POSIX_API, so the item
  does not cover them.

  Pre-condition Context gives a call from within interrupt context. A
  ${/glossary/message:/term} or an error is returned as in task context. Where
  the call would wait, it ends in the fatal error of post-condition FatalError.
requirement-type: functional
skip-reasons: {}
test-action: |
  if ( ctx->valid ) {
    ctx->mqdes = ctx->queue_id;
    ctx->pending_count = GetPendingCount( ctx );
  } else {
    ctx->mqdes = (mqd_t) INVALID_ID;
  }

  if ( ctx->interrupt ) {
    CallWithinISR( ReceiveWithinISR, ctx );
  } else {
    ResumeTask( ctx->worker_id );
    WaitForExecutionStop( ctx->worker_id );
  }

  if ( ctx->sender_started ) {
    WaitForExecutionStop( ctx->sender_id );
  }
test-brief: null
test-cleanup: |
  if ( !ctx->interrupt && ctx->valid && !ctx->done ) {
    ReleaseWorker( ctx );
  }

  if ( ctx->queue != NULL ) {
    if ( ctx->queue->open_count == 0 ) {
      T_eq_u32( mq_open( NAME, O_RDWR ), ctx->queue_id );
    }

    if ( ctx->sender_started && !ctx->sender_done ) {
      ReceiveAny( ctx );
      WaitForExecutionStop( ctx->sender_id );
      T_true( ctx->sender_done );
    }

    T_eq_int( mq_close( ctx->queue_id ), 0 );
    T_eq_int( mq_unlink( NAME ), 0 );
    ctx->queue = NULL;
  }
