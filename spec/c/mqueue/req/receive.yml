    - if:
        post-conditions:
          Status: MinusOne
      then: Nop
    - else: Moved
    Wait:
    - if: &id006
        and:
        - post-conditions:
            Status: N/A
        - pre-conditions:
            Context: Task
      then: 'Yes'
    - if: &id007
