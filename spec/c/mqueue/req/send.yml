enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/send
- role: requirement-refinement
  uid: ../../req/group-posix-api
- role: function-implementation
  uid: /score/tq/req/enqueue-fifo
post-conditions:
- name: Status
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/send:/name} shall be zero.
  - name: MinusOne
    test-code: |
      T_eq_int( ctx->status, -1 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/send:/name} shall be minus one.
  test-epilogue: null
  test-prologue: null
- name: Errno
  states:
  - name: Nop
    test-code: |
      T_eq_int( ctx->errno_value, ERRNO_POISON );
    text: |
      The value of ${/c/errno/if/errno:/name} shall not be modified by the
      ${../if/send:/name} call.
  - name: Inval
    test-code: |
      T_eq_int( ctx->errno_value, EINVAL );
    text: |
      The value of ${/c/errno/if/errno:/name} shall be ${/c/errno/if/einval:/name}.
  - name: Badf
    test-code: |
      T_eq_int( ctx->errno_value, EBADF );
    text: |
      The value of ${/c/errno/if/errno:/name} shall be ${/c/errno/if/ebadf:/name}.
  - name: MsgSize
    test-code: |
      T_eq_int( ctx->errno_value, EMSGSIZE );
    text: |
      The value of ${/c/errno/if/errno:/name} shall be ${/c/errno/if/emsgsize:/name}.
  - name: Again
    test-code: |
      T_eq_int( ctx->errno_value, EAGAIN );
    text: |
      The value of ${/c/errno/if/errno:/name} shall be ${/c/errno/if/eagain:/name}.
  test-epilogue: null
  test-prologue: null
- name: Message
  states:
  - name: Receiver
    test-code: |
      T_true( ctx->received );
      T_null( FindSentMessage( ctx ) );
    text: |
      The thread which waits to receive a ${/glossary/message:/term} from the
      ${/glossary/messagequeue:/term} shall receive the ${/glossary/message:/term}.
  - name: Front
    test-code: |
      T_false( ctx->received );
      T_eq_ptr( FindSentMessage( ctx ), GetFirstMessage( ctx ) );
    text: |
      The ${/glossary/message:/term} shall be the first ${/glossary/message:/term} of
      the ${/glossary/messagequeue:/term}.
  - name: Back
    test-code: |
      T_false( ctx->received );
      T_eq_ptr( FindSentMessage( ctx ), GetLastMessage( ctx ) );
    text: |
      The ${/glossary/message:/term} shall be the last ${/glossary/message:/term} of
      the ${/glossary/messagequeue:/term}.
  - name: Nop
    test-code: |
      T_false( ctx->received );
      T_null( FindSentMessage( ctx ) );
      T_eq_u32( GetPendingCount( ctx ), ctx->pending_count );
    text: |
      The ${../if/send:/name} call shall add the ${/glossary/message:/term} neither
      to the ${/glossary/messagequeue:/term} nor to a waiting thread.
  test-epilogue: null
  test-prologue: null
- name: Priority
  states:
  - name: Low
    test-code: |
      T_eq_uint( GetSentPriority( ctx ), 0 );
    text: |
      The ${../glossary/msgprio:/term} of the ${/glossary/message:/term} shall be
      zero.
  - name: Mid
    test-code: |
      T_eq_uint( GetSentPriority( ctx ), PRIO_MID );
    text: |
      The ${../glossary/msgprio:/term} of the ${/glossary/message:/term} shall be
      equal to the ${../glossary/msgprio:/term} of the other
      ${/glossary/message:/term}s of the ${/glossary/messagequeue:/term}.
  - name: High
    test-code: |
      T_eq_uint( GetSentPriority( ctx ), MQ_PRIO_MAX - 1 );
    text: |
      The ${../glossary/msgprio:/term} of the ${/glossary/message:/term} shall be
      ${/c/if/mq_prio_max:/name} minus one.
  test-epilogue: null
  test-prologue: null
- name: Size
  states:
  - name: Zero
    test-code: |
      CheckSentContent( ctx, 0 );
    text: |
      The ${../glossary/msgsize:/term} of the ${/glossary/message:/term} shall be
      zero.
  - name: One
    test-code: |
      CheckSentContent( ctx, 1 );
    text: |
      The ${/glossary/message:/term} shall consist of the first byte referenced by
      the ${../if/send:/params[1]/name} parameter.
  - name: Below
    test-code: |
      CheckSentContent( ctx, MSG_SIZE - 1 );
    text: |
      The ${/glossary/message:/term} shall consist of the bytes referenced by the
      ${../if/send:/params[1]/name} parameter, which are more than one byte and less
      than the maximum ${../glossary/msgsize:/term}.
  - name: Max
    test-code: |
      CheckSentContent( ctx, MSG_SIZE );
    text: |
      The ${/glossary/message:/term} shall consist of the bytes referenced by the
      ${../if/send:/params[1]/name} parameter of the maximum
      ${../glossary/msgsize:/term}.
  test-epilogue: null
  test-prologue: null
- name: Wait
  states:
  - name: 'Yes'
    test-code: |
      T_false( ctx->done );
      T_eq_ptr(
        ctx->worker_tcb->Wait.queue,
        &ctx->queue->Message_queue.Wait_queue.Queue
      );
    text: |
      The calling thread shall wait for space in the ${/glossary/messagequeue:/term}.
  - name: 'No'
    test-code: |
      T_true( ctx->done );
    text: |
      The ${../if/send:/name} call shall return.
  test-epilogue: null
  test-prologue: null
- name: Tasks
  states:
  - name: Fifo
    test-code: |
      ReleaseWorker( ctx );
      ${/score/tq/req/enqueue-fifo:/test-run}( &ctx->tq_ctx );
    text: |
      The calling thread shall be enqueued in FIFO order as specified by
      ${/score/tq/req/enqueue-fifo:/spec}.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: MsgPrio
  states:
  - name: Low
    test-code: |
      ctx->msg_prio = 0;
    text: |
      While the ${../if/send:/params[3]/name} parameter is zero.
  - name: Mid
    test-code: |
      ctx->msg_prio = PRIO_MID;
    text: |
      While the ${../if/send:/params[3]/name} parameter is equal to the
      ${../glossary/msgprio:/term} of the ${/glossary/message:/term}s in the
      ${/glossary/messagequeue:/term}.
  - name: High
    test-code: |
      ctx->msg_prio = MQ_PRIO_MAX - 1;
    text: |
      While the ${../if/send:/params[3]/name} parameter is equal to
      ${/c/if/mq_prio_max:/name} minus one.
  - name: TooHigh
    test-code: |
      ctx->msg_prio = MQ_PRIO_MAX;
    text: |
      While the ${../if/send:/params[3]/name} parameter is equal to
      ${/c/if/mq_prio_max:/name}.
  test-epilogue: null
  test-prologue: null
- name: MsgLen
  states:
  - name: Zero
    test-code: |
      ctx->msg_len = 0;
    text: |
      While the ${../if/send:/params[2]/name} parameter is zero.
  - name: One
    test-code: |
      ctx->msg_len = 1;
    text: |
      While the ${../if/send:/params[2]/name} parameter is one.
  - name: Below
    test-code: |
      ctx->msg_len = MSG_SIZE - 1;
    text: |
      While the ${../if/send:/params[2]/name} parameter is greater than one and less
      than the maximum ${../glossary/msgsize:/term} of the
      ${/glossary/messagequeue:/term}.
  - name: Max
    test-code: |
      ctx->msg_len = MSG_SIZE;
    text: |
      While the ${../if/send:/params[2]/name} parameter is equal to the maximum
      ${../glossary/msgsize:/term} of the ${/glossary/messagequeue:/term}.
  - name: TooLong
    test-code: |
      ctx->msg_len = MSG_SIZE + 1;
    text: |
      While the ${../if/send:/params[2]/name} parameter is greater than the maximum
      ${../glossary/msgsize:/term} of the ${/glossary/messagequeue:/term}.
  test-epilogue: null
  test-prologue: null
- name: MqDes
  states:
  - name: Valid
    test-code: |
      ctx->valid = true;
    text: |
      While the ${../if/send:/params[0]/name} parameter is the
      ${../glossary/mqdes:/term} of a ${/glossary/messagequeue:/term}.
  - name: Invalid
    test-code: |
      ctx->valid = false;
    text: |
      While the ${../if/send:/params[0]/name} parameter is not a
      ${../glossary/mqdes:/term}.
  test-epilogue: null
  test-prologue: null
- name: Access
  states:
  - name: ReadWrite
    test-code: |
      ctx->oflag = O_RDWR;
    text: |
      While the ${/glossary/messagequeue:/term} is open for reading and writing.
  - name: WriteOnly
    test-code: |
      ctx->oflag = O_WRONLY;
    text: |
      While the ${/glossary/messagequeue:/term} is open for writing only.
  - name: ReadOnly
    test-code: |
      ctx->oflag = O_RDONLY;
    text: |
      While the ${/glossary/messagequeue:/term} is open for reading only.
  test-epilogue: null
  test-prologue: null
- name: NonBlock
  states:
  - name: 'Yes'
    test-code: |
      ctx->oflag |= O_NONBLOCK;
    text: |
      While the flags of the ${/glossary/messagequeue:/term} contain
      ${/c/fcntl/if/o-nonblock:/name}.
  - name: 'No'
    test-code: |
      /* O_NONBLOCK is not set */
    text: |
      While the flags of the ${/glossary/messagequeue:/term} do not contain
      ${/c/fcntl/if/o-nonblock:/name}.
  test-epilogue: null
  test-prologue: null
- name: Messages
  states:
  - name: Zero
    test-code: |
      Create( ctx );
    text: |
      While the ${/glossary/messagequeue:/term} contains no
      ${/glossary/message:/term}.
  - name: Some
    test-code: |
      Create( ctx );
      SendFiller( ctx );
    text: |
      While the ${/glossary/messagequeue:/term} contains at least one
      ${/glossary/message:/term} and is not full.
  - name: Full
    test-code: |
      Create( ctx );
      SendFiller( ctx );
      SendFiller( ctx );
    text: |
      While the ${/glossary/messagequeue:/term} is full.
  test-epilogue: null
  test-prologue: null
- name: Waiters
  states:
  - name: None
    test-code: |
      /* No thread waits */
    text: |
      While no thread waits to receive a ${/glossary/message:/term} from the
      ${/glossary/messagequeue:/term}.
  - name: Receiver
    test-code: |
      StartReceiver( ctx );
    text: |
      While a thread waits to receive a ${/glossary/message:/term} from the
      ${/glossary/messagequeue:/term}.
  test-epilogue: null
  test-prologue: null
- name: Open
  states:
  - name: 'Yes'
    test-code: |
      /* The message queue was opened by its creation */
    text: |
      While the ${/glossary/messagequeue:/term} is open.
  - name: 'No'
    test-code: |
      T_eq_int( mq_close( ctx->queue_id ), 0 );
    text: |
      While the ${/glossary/messagequeue:/term} is not open.
  test-epilogue: null
  test-prologue: null
- name: Context
  states:
  - name: Task
    test-code: |
      ctx->interrupt = false;
    text: |
      While the ${../if/send:/name} function is called from within task context.
  - name: Interrupt
    test-code: |
      ctx->interrupt = true;
    text: |
      While the ${../if/send:/name} function is called from within interrupt context.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/mq-send:/name} specifies that ${../if/send:/name} adds
  the ${/glossary/message:/term} referenced by the ${../if/send:/params[1]/name}
  parameter of the size specified by the ${../if/send:/params[2]/name} parameter
  to the ${/glossary/messagequeue:/term} at the position given by the
  ${../if/send:/params[3]/name} parameter, after the ${/glossary/message:/term}s
  of equal priority. This gives the pre-conditions MsgPrio, MsgLen, and Messages
  and the post-conditions Message, Priority, and Size. The pre-condition MsgLen
  has the states zero, one, a value below the maximum
  ${../glossary/msgsize:/term}, the maximum ${../glossary/msgsize:/term}, and a
  value greater than the maximum ${../glossary/msgsize:/term}, which the function
  rejects. The ${/glossary/message:/term}s in the ${/glossary/messagequeue:/term}
  have the priority of state Mid of pre-condition MsgPrio. The
  ${/glossary/messagequeue:/term} of the test can hold two
  ${/glossary/message:/term}s.

  A thread which waits to receive a ${/glossary/message:/term} gets the
  ${/glossary/message:/term} directly, see state Receiver of pre-condition
  Waiters and post-condition Message. A thread waits to receive only while the
  ${/glossary/messagequeue:/term} is empty. The standard leaves the choice of the
  thread to the implementation.

  The standard requires ${/c/errno/if/ebadf:/name} if the
  ${../if/send:/params[0]/name} parameter is not a valid
  ${../glossary/mqdes:/term} open for writing. This gives pre-condition MqDes,
  the state ReadOnly of pre-condition Access, and state No of pre-condition Open.
  The standard requires ${/c/errno/if/einval:/name} for a
  ${../if/send:/params[3]/name} value outside of the valid range, which is less
  than ${/c/if/mq_prio_max:/name}. State TooHigh of pre-condition MsgPrio gives
  ${/c/if/mq_prio_max:/name}, the least value outside of this range. RTEMS checks
  the priority before the ${/glossary/messagequeue:/term}.

  The standard requires that a full ${/glossary/messagequeue:/term} blocks the
  call unless ${/c/fcntl/if/o-nonblock:/name} is set, which gives pre-condition
  NonBlock. While the calling thread waits, the ${/glossary/messagequeue:/term}
  enqueues it in FIFO order, see post-condition Tasks.

  Another event ends a wait. A thread which receives a ${/glossary/message:/term}
  ends the wait, the ${/glossary/message:/term} of the waiting thread then enters
  the ${/glossary/messagequeue:/term}, see the items of ${../if/receive:/name}
  and ${../if/timedreceive:/name}. The deletion of the
  ${/glossary/messagequeue:/term} ends the wait, see the items of
  ${../if/close:/name} and ${../if/unlink:/name}.

  The ${/rtems/task/if/delete:/name}, ${/rtems/task/if/restart:/name}, and
  ${/c/pthread/if/cancel:/name} items specify the extraction of a waiting thread.
  The thread queue of the message queue uses the FIFO discipline, so a priority
  change of a waiting thread does not change its position. A signal and the
  notification of a message queue need the option RTEMS_POSIX_API, so the item
  does not cover them.

  Pre-condition Context gives a call from within interrupt context. Where the
  call would wait, it returns minus one and sets ${/c/errno/if/errno:/name} to
  ${/c/errno/if/eagain:/name}.
requirement-type: functional
skip-reasons: {}
test-action: |
  if ( ctx->valid ) {
    ctx->mqdes = ctx->queue_id;
    ctx->pending_count = GetPendingCount( ctx );
  } else {
    ctx->mqdes = (mqd_t) INVALID_ID;
  }

  if ( ctx->interrupt ) {
    CallWithinISR( SendWithinISR, ctx );
  } else {
    ResumeTask( ctx->worker_id );
    WaitForExecutionStop( ctx->worker_id );
  }

  if ( ctx->receiver_started ) {
    WaitForExecutionStop( ctx->receiver_id );
  }
test-brief: null
test-cleanup: |
  if ( !ctx->interrupt && ctx->valid && !ctx->done ) {
    ReleaseWorker( ctx );
  }

  if ( ctx->queue != NULL ) {
    if ( ctx->queue->open_count == 0 ) {
      T_eq_u32( mq_open( NAME, O_RDWR ), ctx->queue_id );
    }

    if ( ctx->receiver_started && !ctx->received ) {
      Send( ctx, FILLER_BYTE, 1 );
      WaitForExecutionStop( ctx->receiver_id );
      T_true( ctx->received );
    }

    T_eq_int( mq_close( ctx->queue_id ), 0 );
    T_eq_int( mq_unlink( NAME ), 0 );
    ctx->queue = NULL;
  }
