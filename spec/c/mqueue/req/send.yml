enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/send
- role: requirement-refinement
  uid: ../../req/group-posix-api
post-conditions:
- name: Status
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->retval, 0 );
    text: |
      The return value of ${../if/send:/name} shall be equal to zero.
  - name: MinusOne
    test-code: |
      T_eq_int( ctx->retval, -1 );
    text: |
      The return value of ${../if/send:/name} shall be equal to minus one.
  test-epilogue: null
  test-prologue: null
- name: Errno
  states:
  - name: Unchanged
    test-code: |
      T_eq_int( errno, -1 );
    text: |
      The ${/c/errno/if/errno:/name} shall not be changed by the ${../if/send:/name}
      call.
  - name: EINVAL
    test-code: |
      T_eq_int( errno, EINVAL );
    text: |
      The ${/c/errno/if/errno:/name} shall be set to ${/c/errno/if/einval:/name}.
  - name: EBADF
    test-code: |
      T_eq_int( errno, EBADF );
    text: |
      The ${/c/errno/if/errno:/name} shall be set to ${/c/errno/if/ebadf:/name}.
  - name: EMSGSIZE
    test-code: |
      T_eq_int( errno, EMSGSIZE );
    text: |
      The ${/c/errno/if/errno:/name} shall be set to ${/c/errno/if/emsgsize:/name}.
  - name: EAGAIN
    test-code: |
      T_eq_int( errno, EAGAIN );
    text: |
      The ${/c/errno/if/errno:/name} shall be set to ${/c/errno/if/eagain:/name}.
  test-epilogue: null
  test-prologue: null
- name: Message
  states:
  - name: Enqueued
    test-code: |
      T_eq_long( GetPendingCount( ctx ), 1 );
      CheckReceive( ctx, ctx->msg, ctx->msg_prio );
    text: |
      The ${/glossary/message:/term} specified by ${../if/send:/params[1]/name} shall
      be added to the ${/glossary/messagequeue:/term} with the
      ${../glossary/msgprio:/term} specified by ${../if/send:/params[3]/name}.
  - name: Delivered
    test-code: |
      T_eq_long( GetPendingCount( ctx ), 0 );
      T_eq_long( ctx->recv_len, MSG_SIZE );
      T_eq_mem( ctx->recv_buf, ctx->msg, MSG_SIZE );
      T_eq_uint( ctx->recv_prio, ctx->msg_prio );
    text: |
      The ${/glossary/message:/term} specified by ${../if/send:/params[1]/name} shall
      be received by the thread waiting in ${../if/receive:/name} with the
      ${../glossary/msgprio:/term} specified by ${../if/send:/params[3]/name}.
  - name: Nop
    test-code: |
      if ( ctx->queue_full ) {
        T_eq_long( GetPendingCount( ctx ), 1 );
        CheckReceive( ctx, ctx->old_msg, 0 );
      } else {
        T_eq_long( GetPendingCount( ctx ), 0 );
      }
    text: |
      The ${/glossary/messagequeue:/term} shall not be changed by the
      ${../if/send:/name} call.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: MsgPrio
  states:
  - name: Valid
    test-code: |
      ctx->msg_prio = MQ_PRIO_MAX;
    text: |
      While the ${../if/send:/params[3]/name} parameter is less than or equal to
      ${/c/limits/if/mq-prio-max:/name}.
  - name: Invalid
    test-code: |
      ctx->msg_prio = MQ_PRIO_MAX + 1;
    text: |
      While the ${../if/send:/params[3]/name} parameter is greater than
      ${/c/limits/if/mq-prio-max:/name}.
  test-epilogue: null
  test-prologue: null
- name: Mqdes
  states:
  - name: Valid
    test-code: |
      ctx->mqdes = ctx->mq;
    text: |
      While the ${../if/send:/params[0]/name} parameter is a
      ${../glossary/mqdes:/term} of a ${/glossary/messagequeue:/term} opened for
      writing.
  - name: ReadOnly
    test-code: |
      T_eq_int( mq_close( ctx->mq ), 0 );
      T_eq_int( mq_unlink( MQ_NAME ), 0 );
      ctx->mq = mq_open( MQ_NAME, O_CREAT | O_RDONLY, 0600, &ctx->mq_attr );
      T_ne_u32( ctx->mq, INVALID_MQ );
      ctx->mqdes = ctx->mq;
    text: |
      While the ${../if/send:/params[0]/name} parameter is a
      ${../glossary/mqdes:/term} of a ${/glossary/messagequeue:/term} opened for
      reading only.
  - name: Closed
    test-code: |
      ctx->mqdes = ctx->mq;
      T_eq_int( mq_close( ctx->mq ), 0 );
      ctx->mq_closed = true;
    text: |
      While the ${../if/send:/params[0]/name} parameter is a
      ${../glossary/mqdes:/term} of a ${/glossary/messagequeue:/term} which was
      closed.
  - name: Invalid
    test-code: |
      ctx->mqdes = INVALID_MQ;
    text: |
      While the ${../if/send:/params[0]/name} parameter is not a
      ${../glossary/mqdes:/term} of a ${/glossary/messagequeue:/term}.
  test-epilogue: null
  test-prologue: null
- name: MsgLen
  states:
  - name: Fits
    test-code: |
      ctx->msg_len = MSG_SIZE;
    text: |
      While the ${../if/send:/params[2]/name} parameter is less than or equal to the
      maximum ${../glossary/msgsize:/term} of the ${/glossary/messagequeue:/term}.
  - name: TooLong
    test-code: |
      ctx->msg_len = MSG_SIZE + 1;
    text: |
      While the ${../if/send:/params[2]/name} parameter is greater than the maximum
      ${../glossary/msgsize:/term} of the ${/glossary/messagequeue:/term}.
  test-epilogue: null
  test-prologue: null
- name: Queue
  states:
  - name: Empty
    test-code: |
      /* Already prepared */
    text: |
      While the ${/glossary/messagequeue:/term} is empty and no thread waits to
      receive a ${/glossary/message:/term}.
  - name: Receiver
    test-code: |
      SetPriority( ctx->worker_id, PRIO_HIGH );
      SendEvents( ctx->worker_id, EVENT_RECEIVE );
    text: |
      While the ${/glossary/messagequeue:/term} is empty and a thread waits in
      ${../if/receive:/name} to receive a ${/glossary/message:/term}.
  - name: Full
    test-code: |
      ctx->queue_full = true;
      T_eq_int( mq_send( ctx->mq, (const char *) ctx->old_msg, MSG_SIZE, 0 ), 0 );
    text: |
      While the ${/glossary/messagequeue:/term} is full.
  test-epilogue: null
  test-prologue: null
- name: Blocking
  states:
  - name: 'Yes'
    test-code: |
      SetPriority( ctx->worker_id, PRIO_LOW );
      SendEvents( ctx->worker_id, EVENT_RECEIVE );
    text: |
      While the ${/c/fcntl/if/o-nonblock:/name} flag is not set for the
      ${/glossary/messagequeue:/term} description, while a thread receives a
      ${/glossary/message:/term} once the calling thread is blocked.
  - name: 'No'
    test-code: |
      ctx->mq_attr.mq_flags = O_RDWR | O_NONBLOCK;
      T_eq_int( mq_setattr( ctx->mq, &ctx->mq_attr, NULL ), 0 );
    text: |
      While the ${/c/fcntl/if/o-nonblock:/name} flag is set for the
      ${/glossary/messagequeue:/term} description.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
requirement-type: functional
skip-reasons: {}
test-action: |
  ctx->retval = mq_send(
    ctx->mqdes,
    ctx->msg_ptr,
    ctx->msg_len,
    ctx->msg_prio
  );
test-brief: null
test-cleanup: |
  if ( !ctx->mq_closed ) {
    T_eq_int( mq_close( ctx->mq ), 0 );
  }

  T_eq_int( mq_unlink( MQ_NAME ), 0 );
