  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          MsgPrio: Invalid
      then: MinusOne
    - if:
        pre-conditions:
          Mqdes:
          - ReadOnly
          - Closed
          - Invalid
      then: MinusOne
    - if:
        pre-conditions:
          MsgLen: TooLong
      then: MinusOne
    - if:
        pre-conditions:
          Blocking: 'No'
          Queue: Full
      then: MinusOne
    - else: Zero
    Errno:
    - if:
        pre-conditions:
          MsgPrio: Invalid
      then: EINVAL
    - if:
        pre-conditions:
          Mqdes:
          - ReadOnly
          - Closed
          - Invalid
      then: EBADF
    - if:
        pre-conditions:
          MsgLen: TooLong
      then: EMSGSIZE
    - if:
        pre-conditions:
          Blocking: 'No'
          Queue: Full
      then: EAGAIN
    - else: Unchanged
    Message:
    - if:
        post-conditions:
          Status: MinusOne
      then: Nop
    - if:
        pre-conditions:
          Queue: Receiver
      then: Delivered
    - else: Enqueued
  pre-conditions:
    MsgPrio: all
    Mqdes:
      applicable:
        pre-conditions:
          MsgPrio: Valid
    MsgLen:
      applicable:
        pre-conditions:
          Mqdes: Valid
          MsgPrio: Valid
    Queue:
      applicable:
        pre-conditions:
          Mqdes: Valid
          MsgLen: Fits
          MsgPrio: Valid
    Blocking:
      applicable:
        pre-conditions:
          Mqdes: Valid
          MsgLen: Fits
          MsgPrio: Valid
          Queue: Full
type: requirement
