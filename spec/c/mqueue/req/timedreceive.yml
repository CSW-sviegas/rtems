test-context-support: |
  #define MSG_SIZE 4
test-description: null
test-header: null
test-includes:
- errno.h
- fcntl.h
- limits.h
- mqueue.h
- rtems.h
- string.h
- sys/stat.h
- time.h
test-local-includes:
- tx-support.h
test-prepare: |
  ctx->retval = -1;
  ctx->eno = 0;
  ctx->curmsgs = 0;
  memset( ctx->buf, UINT8_MAX, sizeof( ctx->buf ) );
  ctx->prio_obj = UINT_MAX;
  ctx->msg_ptr = ctx->buf;
  ctx->abs_timeout = &ctx->abstime_obj;
  ctx->abstime_obj.tv_sec = 1621322302;
  ctx->abstime_obj.tv_nsec = 0;
test-setup:
  brief: null
  code: |
    rtems_time_of_day now = { 1988, 1, 1, 0, 0, 0, 0 };

    T_rsc_success( rtems_clock_set( &now ) );
    SetSelfPriority( PRIO_NORMAL );
    ctx->worker_id = CreateTask( "WORK", PRIO_HIGH );
    StartTask( ctx->worker_id, Worker, ctx );
  description: null
test-stop: null
test-support: |
  #define QUEUE_NAME "mq"

  #define MESSAGE_SIZE 3

  #define MESSAGE_PRIO 5

  static const struct mq_attr queue_attr = { 0, 1, MSG_SIZE, 0 };

  static const char message[] = "xyz";

  typedef ${.:/test-context-type} Context;

  static void Worker( rtems_task_argument arg )
  {
    Context *ctx;

    ctx = (Context *) arg;

    while ( true ) {
      SuspendSelf();
      errno = -1;
      ctx->retval = mq_timedreceive(
        ctx->mqdes,
        ctx->msg_ptr,
        ctx->msg_len,
        ctx->msg_prio,
        ctx->abs_timeout
      );
      ctx->eno = errno;
    }
  }
test-target: testsuites/validation/tc-posix-mq-timedreceive.c
test-teardown:
  brief: null
  code: |
    DeleteTask( ctx->worker_id );
    RestoreRunnerPriority();
  description: null
text: |
  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
      - pre-conditions:
          Mqdes:
          - Closed
          - Invalid
      - pre-conditions:
          Flags: WriteOnly
      - pre-conditions:
          MsgLen: TooSmall
      - pre-conditions:
          Messages: None
      then: MinusOne
    - else: Length
    Errno:
    - if:
      - pre-conditions:
          Mqdes: Invalid
      - pre-conditions:
          Flags: WriteOnly
      then: EBADF
    - if:
        pre-conditions:
          MsgLen: TooSmall
      then: EMSGSIZE
    - if:
        pre-conditions:
          Mqdes: Closed
      then: EBADF
    - if:
        pre-conditions:
          Flags: NonBlock
          Messages: None
      then: EAGAIN
    - if:
        pre-conditions:
          Abstime:
          - Invalid
          - 'Null'
      then: EINVAL
    - if:
        pre-conditions:
          Messages: None
      then: ETIMEDOUT
    - else: Unchanged
    Msg:
    - if:
        post-conditions:
          Status: Length
      then: Set
    - else: Nop
    Prio:
    - if:
        pre-conditions:
          MsgPrio: 'Null'
      then: N/A
    - if:
        post-conditions:
          Status: Length
      then: Set
    - else: Nop
    Timer:
    - if:
        pre-conditions:
          Abstime: Future
      then: Realtime
    - else: Inactive
    Queue:
    - if:
        post-conditions:
          Status: Length
      then: Removed
    - else: Nop
  pre-conditions:
    Flags: all
    Messages: all
    Mqdes: all
    MsgLen: all
    MsgPrio: all
    Abstime:
      applicable:
        pre-conditions:
          Flags: Blocking
          Messages: None
          Mqdes: Valid
          MsgLen: Enough
type: requirement
