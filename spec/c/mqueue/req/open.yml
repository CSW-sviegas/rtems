  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Name:
          - 'Null'
          - TooLong
      then: MinusOne
    - if:
        pre-conditions:
          Creat: 'Yes'
          Excl: 'Yes'
          Exists: 'Yes'
      then: MinusOne
    - if:
        pre-conditions:
          Exists: 'Yes'
      then: MqDes
    - if:
        pre-conditions:
          Creat: 'No'
      then: MinusOne
    - if:
        pre-conditions:
          Attr: 'Null'
          Free: 'Yes'
          Memory: 'Yes'
      then: MqDes
    - if:
        pre-conditions:
          Free: 'Yes'
