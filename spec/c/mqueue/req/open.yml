text: |
  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
      - pre-conditions:
          Name:
          - 'Null'
          - TooLong
      - pre-conditions:
          Creat: Unset
          Exists: 'No'
      - pre-conditions:
          Creat: Set
          Excl: Set
          Exists: 'Yes'
      - pre-conditions:
          Attr:
          - InvMaxMsg
          - InvMsgSize
          - Huge
      - pre-conditions:
          Free: 'No'
      - pre-conditions:
          Memory: None
      then: MinusOne
    - else: Mqdes
    Errno:
    - if:
        post-conditions:
          Status: Mqdes
      then: Unchanged
    - if:
        pre-conditions:
          Name: 'Null'
      then: EINVAL
    - if:
        pre-conditions:
          Name: TooLong
      then: ENAMETOOLONG
    - if:
        pre-conditions:
          Creat: Unset
          Exists: 'No'
      then: ENOENT
    - if:
        pre-conditions:
          Exists: 'Yes'
      then: EEXIST
    - if:
        pre-conditions:
          Attr:
          - InvMaxMsg
          - InvMsgSize
      then: EINVAL
    - if:
        pre-conditions:
          Free: 'No'
      then: ENFILE
    - if:
        pre-conditions:
          Memory: None
      then: ENOMEM
    - else: ENOSPC
    Attr:
    - if:
        post-conditions:
          Status: MinusOne
      then: N/A
    - if:
        pre-conditions:
          Exists: 'Yes'
      then: Existing
    - if:
        pre-conditions:
          Attr: 'Null'
      then: Default
    - else: Given
    Linked:
    - if:
        pre-conditions:
          Name:
          - 'Null'
          - TooLong
      then: N/A
    - if:
        pre-conditions:
          Exists: 'Yes'
      then: 'Yes'
    - if:
        post-conditions:
          Status: Mqdes
      then: 'Yes'
    - else: 'No'
  pre-conditions:
    Name: all
    Exists:
      applicable:
        pre-conditions:
          Name: Valid
    Creat:
      applicable:
        pre-conditions:
          Name: Valid
    Excl:
      applicable:
        pre-conditions:
          Creat: Set
          Exists: 'Yes'
          Name: Valid
    Attr:
      applicable:
        pre-conditions:
          Creat: Set
          Exists: 'No'
          Name: Valid
    Free:
      applicable:
        pre-conditions:
          Creat: Set
          Exists: 'No'
          Name: Valid
    Memory:
      applicable:
        pre-conditions:
          Creat: Set
          Exists: 'No'
          Name: Valid
type: requirement
