enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/open
- role: requirement-refinement
  uid: ../../req/group-posix-api
post-conditions:
- name: Status
  states:
  - name: Mqdes
    test-code: |
      T_ne_u32( ctx->retval, MQ_OPEN_FAILED );
    text: |
      The return value of ${../if/open:/name} shall be a ${../glossary/mqdes:/term}.
  - name: MinusOne
    test-code: |
      T_eq_u32( ctx->retval, MQ_OPEN_FAILED );
    text: |
      The return value of ${../if/open:/name} shall be equal to minus one.
  test-epilogue: null
  test-prologue: null
- name: Errno
  states:
  - name: Unchanged
    test-code: |
      T_eq_int( errno, -1 );
    text: |
      The ${/c/errno/if/errno:/name} shall not be changed by the ${../if/open:/name}
      call.
  - name: EINVAL
    test-code: |
      T_eq_int( errno, EINVAL );
    text: |
      The ${/c/errno/if/errno:/name} shall be set to ${/c/errno/if/einval:/name}.
  - name: ENAMETOOLONG
    test-code: |
      T_eq_int( errno, ENAMETOOLONG );
    text: |
      The ${/c/errno/if/errno:/name} shall be set to
      ${/c/errno/if/enametoolong:/name}.
  - name: ENOENT
    test-code: |
      T_eq_int( errno, ENOENT );
    text: |
      The ${/c/errno/if/errno:/name} shall be set to ${/c/errno/if/enoent:/name}.
  - name: EEXIST
    test-code: |
      T_eq_int( errno, EEXIST );
    text: |
      The ${/c/errno/if/errno:/name} shall be set to ${/c/errno/if/eexist:/name}.
  - name: ENFILE
    test-code: |
      T_eq_int( errno, ENFILE );
    text: |
      The ${/c/errno/if/errno:/name} shall be set to ${/c/errno/if/enfile:/name}.
  - name: ENOMEM
    test-code: |
      T_eq_int( errno, ENOMEM );
    text: |
      The ${/c/errno/if/errno:/name} shall be set to ${/c/errno/if/enomem:/name}.
  - name: ENOSPC
    test-code: |
      T_eq_int( errno, ENOSPC );
    text: |
      The ${/c/errno/if/errno:/name} shall be set to ${/c/errno/if/enospc:/name}.
  test-epilogue: null
  test-prologue: null
- name: Attr
  states:
  - name: Default
    test-code: |
      rv = mq_getattr( ctx->retval, &attr );
      T_psx_success( rv );
      T_eq_long( attr.mq_maxmsg, DEFAULT_MAXMSG );
      T_eq_long( attr.mq_msgsize, DEFAULT_MSGSIZE );
    text: |
      The ${../glossary/mqattr:/term}s of the ${/glossary/messagequeue:/term}
      specified by the returned ${../glossary/mqdes:/term} shall be the default
      ${../glossary/mqattr:/term}s of ${../if/open:/name}.
  - name: Given
    test-code: |
      rv = mq_getattr( ctx->retval, &attr );
      T_psx_success( rv );
      T_eq_long( attr.mq_maxmsg, ctx->attr_obj.mq_maxmsg );
      T_eq_long( attr.mq_msgsize, ctx->attr_obj.mq_msgsize );
    text: |
      The ${../glossary/mqattr:/term}s of the ${/glossary/messagequeue:/term}
      specified by the returned ${../glossary/mqdes:/term} shall be the
      ${../glossary/mqattr:/term}s specified by the optional argument of
      ${../if/open:/name}.
  - name: Existing
    test-code: |
      rv = mq_getattr( ctx->retval, &attr );
      T_psx_success( rv );
      T_eq_long( attr.mq_maxmsg, EXISTING_MAXMSG );
      T_eq_long( attr.mq_msgsize, EXISTING_MSGSIZE );
    text: |
      The ${../glossary/mqattr:/term}s of the ${/glossary/messagequeue:/term}
      specified by the returned ${../glossary/mqdes:/term} shall be the
      ${../glossary/mqattr:/term}s of the existing ${/glossary/messagequeue:/term}.
  test-epilogue: null
  test-prologue: |
    struct mq_attr attr;
    int            rv;
- name: Linked
  states:
  - name: 'Yes'
    test-code: |
      rv = mq_unlink( NAME );
      T_psx_success( rv );
    text: |
      A ${/glossary/messagequeue:/term} with the name specified by
      ${../if/open:/params[0]/name} shall exist after the ${../if/open:/name} call.
  - name: 'No'
    test-code: |
      rv = mq_unlink( NAME );
      T_psx_error( rv, ENOENT );
    text: |
      No ${/glossary/messagequeue:/term} with the name specified by
      ${../if/open:/params[0]/name} shall exist after the ${../if/open:/name} call.
  test-epilogue: null
  test-prologue: |
    int rv;
pre-conditions:
- name: Name
  states:
  - name: Valid
    test-code: |
      ctx->name = NAME;
    text: |
      While the ${../if/open:/params[0]/name} parameter references a valid string
      which is not longer than the maximum name length.
  - name: 'Null'
    test-code: |
      ctx->name = NULL;
    text: |
      While the ${../if/open:/params[0]/name} parameter is ${/c/if/null:/name}.
  - name: TooLong
    test-code: |
      memset( ctx->long_name, 'a', sizeof( ctx->long_name ) - 1 );
      ctx->long_name[ 0 ] = '/';
      ctx->long_name[ sizeof( ctx->long_name ) - 1 ] = '\0';
      ctx->name = ctx->long_name;
    text: |
      While the ${../if/open:/params[0]/name} parameter references a string which is
      longer than the maximum name length.
  test-epilogue: null
  test-prologue: null
- name: Exists
  states:
  - name: 'Yes'
    test-code: |
      ctx->mqd_obj = mq_open(
        NAME,
        O_RDWR | O_CREAT | O_EXCL,
        0600,
        &existing_attr
      );
      T_ne_u32( ctx->mqd_obj, MQ_OPEN_FAILED );
    text: |
      While a ${/glossary/messagequeue:/term} with the name specified by
      ${../if/open:/params[0]/name} exists.
  - name: 'No'
    test-code: |
      /* Nothing to do */
    text: |
      While no ${/glossary/messagequeue:/term} with the name specified by
      ${../if/open:/params[0]/name} exists.
  test-epilogue: null
  test-prologue: null
- name: Creat
  states:
  - name: Set
    test-code: |
      ctx->oflag |= O_CREAT;
    text: |
      While the ${/c/fcntl/if/o-creat:/name} flag is set in the
      ${../if/open:/params[1]/name} parameter.
  - name: Unset
    test-code: |
      ctx->oflag &= ~O_CREAT;
    text: |
      While the ${/c/fcntl/if/o-creat:/name} flag is not set in the
      ${../if/open:/params[1]/name} parameter.
  test-epilogue: null
  test-prologue: null
- name: Excl
  states:
  - name: Set
    test-code: |
      ctx->oflag |= O_EXCL;
    text: |
      While the ${/c/fcntl/if/o-excl:/name} flag is set in the
      ${../if/open:/params[1]/name} parameter.
  - name: Unset
    test-code: |
      ctx->oflag &= ~O_EXCL;
    text: |
      While the ${/c/fcntl/if/o-excl:/name} flag is not set in the
      ${../if/open:/params[1]/name} parameter.
  test-epilogue: null
  test-prologue: null
- name: Attr
  states:
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the optional ${../glossary/mqattr:/term}s argument is
      ${/c/if/null:/name}.
  - name: Valid
    test-code: |
      ctx->attr_obj.mq_maxmsg = 5;
      ctx->attr_obj.mq_msgsize = 12;
      ctx->attr = &ctx->attr_obj;
    text: |
      While the optional ${../glossary/mqattr:/term}s argument references valid
      ${../glossary/mqattr:/term}s.
  - name: InvMaxMsg
    test-code: |
      ctx->attr_obj.mq_maxmsg = 0;
      ctx->attr_obj.mq_msgsize = 12;
      ctx->attr = &ctx->attr_obj;
    text: |
      While the optional ${../glossary/mqattr:/term}s argument references
      ${../glossary/mqattr:/term}s with a ${../glossary/maxmsgs:/term} which is not
      positive.
  - name: InvMsgSize
    test-code: |
      ctx->attr_obj.mq_maxmsg = 5;
      ctx->attr_obj.mq_msgsize = 0;
      ctx->attr = &ctx->attr_obj;
    text: |
      While the optional ${../glossary/mqattr:/term}s argument references
      ${../glossary/mqattr:/term}s with a ${../glossary/msgsize:/term} which is not
      positive.
  - name: Huge
    test-code: |
      ctx->attr_obj.mq_maxmsg = INT_MAX;
      ctx->attr_obj.mq_msgsize = 12;
      ctx->attr = &ctx->attr_obj;
    text: |
      While the optional ${../glossary/mqattr:/term}s argument references
      ${../glossary/mqattr:/term}s which require more message buffer storage than the
      system can provide.
  test-epilogue: null
  test-prologue: null
- name: Free
  states:
  - name: 'Yes'
    test-code: |
      /* Ensured by the test suite configuration */
    text: |
      While the system has at least one inactive message queue object available.
  - name: 'No'
    test-code: |
      ctx->seized_objects = T_seize_objects( Create, NULL );
    text: |
      While the system has no inactive message queue object available.
  test-epilogue: null
  test-prologue: null
- name: Memory
  states:
  - name: Available
    test-code: |
      /* Nothing to do */
    text: |
      While the system has enough memory to store a copy of the name.
  - name: None
    test-code: |
      ctx->greedy = rtems_workspace_greedy_allocate( NULL, 0 );
    text: |
      While the system has no memory available to store a copy of the name.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
requirement-type: functional
skip-reasons: {}
test-action: |
  ctx->retval = mq_open( ctx->name, ctx->oflag, ctx->mode, ctx->attr );
test-brief: null
test-cleanup: |
  size_t i;

  if ( ctx->greedy != NULL ) {
    rtems_workspace_greedy_free( ctx->greedy );
    ctx->greedy = NULL;
  }

  if ( ctx->retval != MQ_OPEN_FAILED ) {
    int rv;

    rv = mq_close( ctx->retval );
    T_psx_success( rv );
  }

  if ( ctx->mqd_obj != MQ_OPEN_FAILED ) {
    int rv;

    rv = mq_close( ctx->mqd_obj );
    T_psx_success( rv );
  }

  (void) mq_unlink( NAME );

  for ( i = 0; i < ctx->seized_count; ++i ) {
    char seized_name[ SEIZED_NAME_SIZE ];

    SeizedName( seized_name, i );
    (void) mq_unlink( seized_name );
  }

  T_surrender_objects( &ctx->seized_objects, Delete );
