post-conditions:
- name: Status
  states:
  - name: MqDes
    test-code: |
      T_ne_u32( ctx->status, MQ_OPEN_FAILED );
      T_not_null( GetQueueByName( NAME ) );
      T_eq_ptr( GetQueue( ctx->status ), GetQueueByName( NAME ) );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/open:/name} shall be the
      ${../glossary/mqdes:/term} of the ${/glossary/messagequeue:/term} with the name
      specified by the ${../if/open:/params[0]/name} parameter.
  - name: MinusOne
    test-code: |
      T_eq_u32( ctx->status, MQ_OPEN_FAILED );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/open:/name} shall be minus one.
  test-epilogue: null
  test-prologue: null
- name: Errno
  states:
  - name: Nop
    test-code: |
      T_eq_int( ctx->errno_value, ERRNO_POISON );
    text: |
      The value of ${/c/errno/if/errno:/name} shall not be modified by the
      ${../if/open:/name} call.
  - name: Inval
    test-code: |
      T_eq_int( ctx->errno_value, EINVAL );
    text: |
      The value of ${/c/errno/if/errno:/name} shall be ${/c/errno/if/einval:/name}.
  - name: NameTooLong
    test-code: |
      T_eq_int( ctx->errno_value, ENAMETOOLONG );
    text: |
      The value of ${/c/errno/if/errno:/name} shall be
      ${/c/errno/if/enametoolong:/name}.
  - name: NoEnt
    test-code: |
      T_eq_int( ctx->errno_value, ENOENT );
    text: |
      The value of ${/c/errno/if/errno:/name} shall be ${/c/errno/if/enoent:/name}.
  - name: Exist
    test-code: |
      T_eq_int( ctx->errno_value, EEXIST );
    text: |
      The value of ${/c/errno/if/errno:/name} shall be ${/c/errno/if/eexist:/name}.
  - name: NFile
    test-code: |
      T_eq_int( ctx->errno_value, ENFILE );
    text: |
      The value of ${/c/errno/if/errno:/name} shall be ${/c/errno/if/enfile:/name}.
  - name: NoMem
    test-code: |
      T_eq_int( ctx->errno_value, ENOMEM );
    text: |
      The value of ${/c/errno/if/errno:/name} shall be ${/c/errno/if/enomem:/name}.
  - name: NoSpc
    test-code: |
      T_eq_int( ctx->errno_value, ENOSPC );
    text: |
      The value of ${/c/errno/if/errno:/name} shall be ${/c/errno/if/enospc:/name}.
  test-epilogue: null
  test-prologue: null
- name: Queue
  states:
  - name: Created
    test-code: |
      T_eq_sz( GetInactiveCount() + 1, ctx->inactive_count );
    text: |
      The ${/glossary/messagequeue:/term} shall be created.
  - name: Nop
    test-code: |
      T_eq_sz( GetInactiveCount(), ctx->inactive_count );
    text: |
      No ${/glossary/messagequeue:/term} shall be created by the ${../if/open:/name}
      call.
  test-epilogue: null
  test-prologue: null
- name: Name
  states:
  - name: Valid
    test-code: |
      T_not_null( GetQueueByName( NAME ) );
    text: |
      A ${/glossary/messagequeue:/term} shall have the name specified by the
      ${../if/open:/params[0]/name} parameter.
  - name: Invalid
    test-code: |
      T_null( GetQueueByName( NAME ) );
    text: |
      No ${/glossary/messagequeue:/term} shall have the name specified by the
      ${../if/open:/params[0]/name} parameter.
  test-epilogue: null
  test-prologue: null
- name: Flags
  states:
  - name: ReadWrite
    test-code: |
      T_eq_int( GetQueueByName( NAME )->oflag, ctx->oflag );
      T_eq_int(
        GetQueueByName( NAME )->oflag & ( O_ACCMODE | O_NONBLOCK ),
        O_RDWR
      );
    text: |
      The flags of the ${/glossary/messagequeue:/term} shall be the value of the
      ${../if/open:/params[1]/name} parameter, which specifies the access mode for
      reading and writing and does not contain ${/c/fcntl/if/o-nonblock:/name}.
  - name: ReadNonBlock
    test-code: |
      T_eq_int( GetQueueByName( NAME )->oflag, ctx->oflag );
      T_eq_int(
        GetQueueByName( NAME )->oflag & ( O_ACCMODE | O_NONBLOCK ),
        O_RDONLY | O_NONBLOCK
      );
    text: |
      The flags of the ${/glossary/messagequeue:/term} shall be the value of the
      ${../if/open:/params[1]/name} parameter, which specifies the access mode for
      reading only and contains ${/c/fcntl/if/o-nonblock:/name}.
  - name: Nop
    test-code: |
      T_eq_int( ctx->existing->oflag, FLAGS_EXISTING );
    text: |
      The flags of the ${/glossary/messagequeue:/term} shall not be modified by the
      ${../if/open:/name} call.
  test-epilogue: null
  test-prologue: null
- name: MaxMsg
  states:
  - name: Default
    test-code: |
      T_eq_u32(
        GetQueueByName( NAME )->Message_queue.maximum_pending_messages,
        10
      );
    text: |
      The ${../glossary/maxmsgs:/term} of the ${/glossary/messagequeue:/term} shall
      be ten.
  - name: Positive
    test-code: |
      T_eq_u32(
        GetQueueByName( NAME )->Message_queue.maximum_pending_messages,
        MAX_MSG
      );
    text: |
      The ${../glossary/maxmsgs:/term} of the ${/glossary/messagequeue:/term} shall
      be the value of the ${/c/if/mq_attr:/definition[1]/default/name} member of the
      ${../glossary/mqattr:/term}s argument.
  - name: Nop
    test-code: |
      T_eq_u32(
        ctx->existing->Message_queue.maximum_pending_messages,
        EXISTING_MAX_MSG
      );
    text: |
      The ${../glossary/maxmsgs:/term} of the ${/glossary/messagequeue:/term} shall
      not be modified by the ${../if/open:/name} call.
  test-epilogue: null
  test-prologue: null
- name: MsgSize
  states:
  - name: Default
    test-code: |
      T_eq_sz( GetQueueByName( NAME )->Message_queue.maximum_message_size, 16 );
    text: |
      The maximum ${../glossary/msgsize:/term} of the ${/glossary/messagequeue:/term}
      shall be 16.
  - name: Positive
    test-code: |
      T_eq_sz(
        GetQueueByName( NAME )->Message_queue.maximum_message_size,
        MSG_SIZE
      );
    text: |
      The maximum ${../glossary/msgsize:/term} of the ${/glossary/messagequeue:/term}
      shall be the value of the ${/c/if/mq_attr:/definition[2]/default/name} member
      of the ${../glossary/mqattr:/term}s argument.
  - name: Nop
    test-code: |
      T_eq_sz(
        ctx->existing->Message_queue.maximum_message_size,
        EXISTING_MSG_SIZE
      );
    text: |
      The maximum ${../glossary/msgsize:/term} of the ${/glossary/messagequeue:/term}
      shall not be modified by the ${../if/open:/name} call.
  test-epilogue: null
  test-prologue: null
- name: Open
  states:
  - name: Once
    test-code: |
      T_eq_u32( GetQueueByName( NAME )->open_count, 1 );
    text: |
      The ${/glossary/messagequeue:/term} shall be open once.
  - name: Twice
    test-code: |
      T_eq_u32( GetQueueByName( NAME )->open_count, 2 );
    text: |
      The ${/glossary/messagequeue:/term} shall be open twice.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Name
  states:
  - name: Valid
    test-code: |
      ctx->name = NAME;
    text: |
      While the ${../if/open:/params[0]/name} parameter references a string which is
      not longer than the maximum length of a ${/glossary/messagequeue:/term} name.
  - name: 'Null'
    test-code: |
      ctx->name = NULL;
    text: |
      While the ${../if/open:/params[0]/name} parameter is ${/c/if/null:/name}.
  - name: TooLong
    test-code: |
      ctx->name = ctx->long_name;
    text: |
      While the ${../if/open:/params[0]/name} parameter references a string which is
      longer than the maximum length of a ${/glossary/messagequeue:/term} name.
  test-epilogue: null
  test-prologue: null
- name: Flags
  states:
  - name: ReadWrite
    test-code: |
      ctx->oflag = O_RDWR;
    text: |
      While the ${../if/open:/params[1]/name} parameter specifies the access mode for
      reading and writing and does not contain ${/c/fcntl/if/o-nonblock:/name}.
  - name: ReadNonBlock
    test-code: |
      ctx->oflag = O_RDONLY | O_NONBLOCK;
    text: |
      While the ${../if/open:/params[1]/name} parameter specifies the access mode for
      reading only and contains ${/c/fcntl/if/o-nonblock:/name}.
  test-epilogue: null
  test-prologue: null
- name: Creat
  states:
  - name: 'Yes'
    test-code: |
      ctx->oflag |= O_CREAT;
    text: |
      While the ${../if/open:/params[1]/name} parameter contains
      ${/c/fcntl/if/o-creat:/name}.
  - name: 'No'
    test-code: |
      /* O_CREAT is not set */
    text: |
      While the ${../if/open:/params[1]/name} parameter does not contain
      ${/c/fcntl/if/o-creat:/name}.
  test-epilogue: null
  test-prologue: null
- name: Excl
  states:
  - name: 'Yes'
    test-code: |
      ctx->oflag |= O_EXCL;
    text: |
      While the ${../if/open:/params[1]/name} parameter contains
      ${/c/fcntl/if/o-excl:/name}.
  - name: 'No'
    test-code: |
      /* O_EXCL is not set */
    text: |
      While the ${../if/open:/params[1]/name} parameter does not contain
      ${/c/fcntl/if/o-excl:/name}.
  test-epilogue: null
  test-prologue: null
- name: Attr
  states:
  - name: Obj
    test-code: |
      ctx->attr = &ctx->attr_obj;
    text: |
      While the ${../glossary/mqattr:/term}s argument references an object of type
      ${/c/if/mq_attr:/name}.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../glossary/mqattr:/term}s argument is ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: MaxMsg
  states:
  - name: Positive
    test-code: |
      ctx->attr_obj.mq_maxmsg = MAX_MSG;
    text: |
      While the ${/c/if/mq_attr:/definition[1]/default/name} member of the
      ${../glossary/mqattr:/term}s argument is positive and small enough to allocate
      the ${/glossary/message:/term} buffers.
  - name: NotPositive
    test-code: |
      ctx->attr_obj.mq_maxmsg = 0;
    text: |
      While the ${/c/if/mq_attr:/definition[1]/default/name} member of the
      ${../glossary/mqattr:/term}s argument is not positive.
  - name: Huge
    test-code: |
      ctx->attr_obj.mq_maxmsg = INT_MAX;
    text: |
      While the ${/c/if/mq_attr:/definition[1]/default/name} member of the
      ${../glossary/mqattr:/term}s argument is too large to allocate the
      ${/glossary/message:/term} buffers.
  test-epilogue: null
  test-prologue: null
- name: MsgSize
  states:
  - name: Positive
    test-code: |
      ctx->attr_obj.mq_msgsize = MSG_SIZE;
    text: |
      While the ${/c/if/mq_attr:/definition[2]/default/name} member of the
      ${../glossary/mqattr:/term}s argument is positive.
  - name: NotPositive
    test-code: |
      ctx->attr_obj.mq_msgsize = 0;
    text: |
      While the ${/c/if/mq_attr:/definition[2]/default/name} member of the
      ${../glossary/mqattr:/term}s argument is not positive.
  test-epilogue: null
  test-prologue: null
- name: Exists
  states:
  - name: 'Yes'
    test-code: |
      ctx->existing_id = mq_open( NAME, FLAGS_EXISTING, 0, &existing_attr );
      T_ne_u32( ctx->existing_id, MQ_OPEN_FAILED );
      ctx->existing = GetQueue( ctx->existing_id );
      T_assert_not_null( ctx->existing );
    text: |
      While a ${/glossary/messagequeue:/term} has the name specified by the
      ${../if/open:/params[0]/name} parameter.
  - name: 'No'
    test-code: |
      /* No message queue has the name */
    text: |
      While no ${/glossary/messagequeue:/term} has the name specified by the
      ${../if/open:/params[0]/name} parameter.
  test-epilogue: null
  test-prologue: null
- name: Free
  states:
  - name: 'Yes'
    test-code: |
      /* The test suite configuration provides an inactive object */
    text: |
      While an inactive ${/glossary/messagequeue:/term} object is available.
  - name: 'No'
    test-code: |
      ctx->seized_objects = T_seize_objects( Create, ctx );
    text: |
      While no inactive ${/glossary/messagequeue:/term} object is available.
  test-epilogue: null
  test-prologue: null
- name: Memory
  states:
  - name: 'Yes'
    test-code: |
      /* The test suite configuration provides enough memory */
    text: |
      While enough memory is available to store the name.
  - name: 'No'
    test-code: |
      ctx->greedy = rtems_workspace_greedy_allocate( NULL, 0 );
    text: |
      While not enough memory is available to store the name.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/mq-open:/name} specifies that ${../if/open:/name} returns
  a ${../glossary/mqdes:/term} of the ${/glossary/messagequeue:/term} with the
  name specified by the ${../if/open:/params[0]/name} parameter. The name gives
  pre-conditions Name and Exists. The flags ${/c/fcntl/if/o-creat:/name} and
  ${/c/fcntl/if/o-excl:/name} give the pre-conditions Creat and Excl, the
  ${../glossary/mqattr:/term}s argument gives the pre-conditions Attr, MaxMsg,
  and MsgSize. The errors ${/c/errno/if/enametoolong:/name},
  ${/c/errno/if/enoent:/name}, ${/c/errno/if/eexist:/name},
  ${/c/errno/if/einval:/name}, ${/c/errno/if/enfile:/name}, and
  ${/c/errno/if/enospc:/name} of the standard give the states TooLong of
  pre-condition Name, No of pre-condition Creat, Yes of pre-condition Excl,
  NotPositive of the pre-conditions MaxMsg and MsgSize, No of pre-condition Free,
  and Huge of pre-condition MaxMsg.

  The standard does not define the behaviour where the
  ${../if/open:/params[0]/name} parameter is ${/c/if/null:/name}. The state Null
  of pre-condition Name specifies the behaviour of RTEMS which returns minus one
  and sets ${/c/errno/if/errno:/name} to ${/c/errno/if/einval:/name}. RTEMS
  copies the name to the workspace, state No of pre-condition Memory gives the
  error ${/c/errno/if/enomem:/name} of this copy.

  The standard leaves the default ${../glossary/mqattr:/term}s to the
  implementation. RTEMS uses ten ${/glossary/message:/term}s of 16 bytes, which
  the states Default of the post-conditions MaxMsg and MsgSize specify.

  RTEMS stores the flags of the call which creates the
  ${/glossary/messagequeue:/term} in the ${/glossary/messagequeue:/term}. A call
  which opens an existing ${/glossary/messagequeue:/term} does not change these
  flags and returns the same ${../glossary/mqdes:/term}, see state Nop of
  post-condition Flags. The standard requires an open message queue description
  for each call. This deviation of RTEMS is stated in the notes of
  ${../if/open:/name}.

  RTEMS ignores the permission mode argument, it has no permissions for message
  queues. The standard requires an error for a denied permission, RTEMS does not
  return this error. RTEMS does not limit the number of
  ${../glossary/mqdes:/term}s of a process, so the error of the standard for too
  many ${../glossary/mqdes:/term}s of a process is not returned.
requirement-type: functional
skip-reasons: {}
test-action: |
  ctx->inactive_count = GetInactiveCount();
  errno = ERRNO_POISON;
  ctx->status = mq_open( ctx->name, ctx->oflag, 0, ctx->attr );
  ctx->errno_value = errno;
test-brief: null
test-cleanup: |
  if ( ctx->greedy != NULL ) {
    rtems_workspace_greedy_free( ctx->greedy );
    ctx->greedy = NULL;
  }

  T_surrender_objects( &ctx->seized_objects, Delete );

  if ( ctx->status != MQ_OPEN_FAILED ) {
    T_eq_int( mq_close( ctx->status ), 0 );
  }

  if ( ctx->existing != NULL ) {
    T_eq_int( mq_close( ctx->existing_id ), 0 );
    ctx->existing = NULL;
  }

  if ( GetQueueByName( NAME ) != NULL ) {
    T_eq_int( mq_unlink( NAME ), 0 );
  }
