  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          MqDes: Valid
          MqStat: Obj
          Open: 'Yes'
      then: Zero
    - else: MinusOne
    Errno:
    - if:
        pre-conditions:
          MqStat: 'Null'
      then: Inval
    - if:
        post-conditions:
          Status: MinusOne
      then: Badf
    - else: Nop
    Flags:
    - if:
        pre-conditions:
          MqStat: 'Null'
      then: N/A
    - if:
        post-conditions:
          Status: Zero
      then-specified-by: StoredFlags
    - else: Nop
    MaxMsg:
    - if:
        pre-conditions:
          MqStat: 'Null'
      then: N/A
    - if:
        post-conditions:
          Status: Zero
      then-specified-by: StoredMaxMsg
    - else: Nop
    MsgSize:
    - if:
        pre-conditions:
          MqStat: 'Null'
      then: N/A
    - if:
        post-conditions:
          Status: Zero
      then-specified-by: StoredMsgSize
    - else: Nop
    CurMsgs:
    - if:
        pre-conditions:
          MqStat: 'Null'
      then: N/A
    - if:
        post-conditions:
          Status: Zero
      then-specified-by: StoredCurMsgs
    - else: Nop
    Queue:
    - if:
        pre-conditions:
          MqDes: Invalid
      then: N/A
    - else: Nop
  pre-conditions:
    MqStat: all
    StoredFlags:
      applicable:
        pre-conditions:
          MqDes: Valid
    StoredMaxMsg:
      applicable:
        pre-conditions:
          MqDes: Valid
    StoredMsgSize:
      applicable:
        pre-conditions:
          MqDes: Valid
    MqDes: all
    StoredCurMsgs:
      applicable:
        pre-conditions:
          MqDes: Valid
    Open:
      applicable:
        pre-conditions:
          MqDes: Valid
type: requirement
