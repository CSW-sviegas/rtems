enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/timedsend
- role: requirement-refinement
  uid: ../../req/group-posix-api
post-conditions:
- name: Status
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->retval, 0 );
    text: |
      The return value of ${../if/timedsend:/name} shall be equal to zero.
  - name: MinusOne
    test-code: |
      T_eq_int( ctx->retval, -1 );
    text: |
      The return value of ${../if/timedsend:/name} shall be equal to minus one.
  test-epilogue: null
  test-prologue: null
- name: Errno
  states:
  - name: Unchanged
    test-code: |
      T_eq_int( ctx->eno, -1 );
    text: |
      The ${/c/errno/if/errno:/name} shall not be changed by the
      ${../if/timedsend:/name} call.
  - name: EAGAIN
    test-code: |
      T_eq_int( ctx->eno, EAGAIN );
    text: |
      The ${/c/errno/if/errno:/name} shall be set to ${/c/errno/if/eagain:/name}.
  - name: EBADF
    test-code: |
      T_eq_int( ctx->eno, EBADF );
    text: |
      The ${/c/errno/if/errno:/name} shall be set to ${/c/errno/if/ebadf:/name}.
  - name: EINVAL
    test-code: |
      T_eq_int( ctx->eno, EINVAL );
    text: |
      The ${/c/errno/if/errno:/name} shall be set to ${/c/errno/if/einval:/name}.
  - name: EMSGSIZE
    test-code: |
      T_eq_int( ctx->eno, EMSGSIZE );
    text: |
      The ${/c/errno/if/errno:/name} shall be set to ${/c/errno/if/emsgsize:/name}.
  - name: ETIMEDOUT
    test-code: |
      T_eq_int( ctx->eno, ETIMEDOUT );
    text: |
      The ${/c/errno/if/errno:/name} shall be set to ${/c/errno/if/etimedout:/name}.
  test-epilogue: null
  test-prologue: null
- name: Timer
  states:
  - name: Inactive
    test-code: |
      T_eq_int( ctx->timer_info.state, TASK_TIMER_INACTIVE );
    text: |
      The timer of the calling task shall be inactive.
  - name: Realtime
    test-code: |
      T_eq_int( ctx->timer_info.state, TASK_TIMER_REALTIME );
    text: |
      The timer of the calling task shall be active using the
      ${/glossary/clock-realtime:/term}.
  test-epilogue: null
  test-prologue: null
- name: Queue
  states:
  - name: Added
    test-code: |
      T_eq_long( attr.mq_curmsgs, 1 );
      len = mq_receive( mq, buf, sizeof( buf ), &prio );
      T_eq_sz( len, MSG_SIZE );
      T_eq_u32( prio, MQ_PRIO_MAX );
      T_eq_mem( buf, message, MSG_SIZE );
    text: |
      The ${/glossary/message:/term} referenced by the
      ${../if/timedsend:/params[1]/name} parameter with the size in bytes specified
      by the ${../if/timedsend:/params[2]/name} parameter and the
      ${../glossary/msgprio:/term} specified by the
      ${../if/timedsend:/params[3]/name} parameter shall be appended to the
      ${/glossary/messagequeue:/term} specified by the
      ${../if/timedsend:/params[0]/name} parameter.
  - name: Nop
    test-code: |
      T_eq_long( attr.mq_curmsgs, ctx->curmsgs );

      if ( ctx->curmsgs > 0 ) {
        len = mq_receive( mq, buf, sizeof( buf ), &prio );
        T_eq_sz( len, 1 );
        T_eq_u32( prio, 0 );
        T_eq_mem( buf, "x", 1 );
      }
    text: |
      The ${/glossary/messagequeue:/term} shall not be changed by the
      ${../if/timedsend:/name} call.
  test-epilogue: |
    T_eq_int( mq_close( mq ), 0 );
  test-prologue: |
    char           buf[ MSG_SIZE ];
    mqd_t          mq;
    struct mq_attr attr;
    unsigned int   prio;
    ssize_t        len;

    mq = mq_open( QUEUE_NAME, O_RDWR );
    T_ne_u32( mq, (mqd_t) -1 );
    T_eq_int( mq_getattr( mq, &attr ), 0 );
pre-conditions:
- name: Flags
  states:
  - name: Blocking
    test-code: |
      ctx->mq = mq_open( QUEUE_NAME, O_CREAT | O_RDWR, S_IRWXU, &queue_attr );
      T_ne_u32( ctx->mq, (mqd_t) -1 );
    text: |
      While the ${/glossary/messagequeue:/term} was opened for writing without the
      ${/c/fcntl/if/o-nonblock:/name} flag.
  - name: NonBlock
    test-code: |
      ctx->mq = mq_open(
        QUEUE_NAME,
        O_CREAT | O_RDWR | O_NONBLOCK,
        S_IRWXU,
        &queue_attr
      );
      T_ne_u32( ctx->mq, (mqd_t) -1 );
    text: |
      While the ${/glossary/messagequeue:/term} was opened for writing with the
      ${/c/fcntl/if/o-nonblock:/name} flag.
  - name: ReadOnly
    test-code: |
      ctx->mq = mq_open( QUEUE_NAME, O_CREAT | O_RDONLY, S_IRWXU, &queue_attr );
      T_ne_u32( ctx->mq, (mqd_t) -1 );
    text: |
      While the ${/glossary/messagequeue:/term} was opened for reading only.
  test-epilogue: null
  test-prologue: null
- name: Full
  states:
  - name: 'Yes'
    test-code: |
      T_eq_int( mq_send( ctx->mq, "x", 1, 0 ), 0 );
      ctx->curmsgs = 1;
    text: |
      While the ${/glossary/messagequeue:/term} is full.
  - name: 'No'
    test-code: |
      /* Already prepared */
    text: |
      While the ${/glossary/messagequeue:/term} is not full.
  test-epilogue: null
  test-prologue: null
- name: Mqdes
  states:
  - name: Valid
    test-code: |
      ctx->mqdes = ctx->mq;
    text: |
      While the ${../if/timedsend:/params[0]/name} parameter specifies a
      ${../glossary/mqdes:/term} of an open ${/glossary/messagequeue:/term}.
  - name: Closed
    test-code: |
      T_eq_int( mq_close( ctx->mq ), 0 );
      ctx->mqdes = ctx->mq;
    text: |
      While the ${../if/timedsend:/params[0]/name} parameter specifies a
      ${../glossary/mqdes:/term} of a ${/glossary/messagequeue:/term} which was
      closed and not unlinked.
  - name: Invalid
    test-code: |
      ctx->mqdes = INVALID_ID;
    text: |
      While the ${../if/timedsend:/params[0]/name} parameter is not a
      ${../glossary/mqdes:/term}.
  test-epilogue: null
  test-prologue: null
- name: MsgLen
  states:
  - name: Fits
    test-code: |
      ctx->msg_len = MSG_SIZE;
    text: |
      While the ${../if/timedsend:/params[2]/name} parameter is less than or equal to
      the maximum ${../glossary/msgsize:/term} of the
      ${/glossary/messagequeue:/term}.
  - name: TooLong
    test-code: |
      ctx->msg_len = MSG_SIZE + 1;
    text: |
      While the ${../if/timedsend:/params[2]/name} parameter is greater than the
      maximum ${../glossary/msgsize:/term} of the ${/glossary/messagequeue:/term}.
  test-epilogue: null
  test-prologue: null
- name: MsgPrio
  states:
  - name: Valid
    test-code: |
      ctx->msg_prio = MQ_PRIO_MAX;
    text: |
      While the ${../if/timedsend:/params[3]/name} parameter is less than or equal to
      ${/c/limits/if/mq-prio-max:/name}.
  - name: Invalid
    test-code: |
      ctx->msg_prio = MQ_PRIO_MAX + 1;
    text: |
      While the ${../if/timedsend:/params[3]/name} parameter is greater than
      ${/c/limits/if/mq-prio-max:/name}.
  test-epilogue: null
  test-prologue: null
- name: Abstime
  states:
  - name: Future
    test-code: |
      ctx->abstime_obj.tv_sec = 1621322302;
      ctx->abstime_obj.tv_nsec = 0;
    text: |
      While the ${../if/timedsend:/params[4]/name} parameter references an object of
      type ${/c/if/timespec:/name} specifying a valid time point which is after the
      current time of the ${/glossary/clock-realtime:/term}.
  - name: Past
    test-code: |
      ctx->abstime_obj.tv_sec = 0;
      ctx->abstime_obj.tv_nsec = 0;
    text: |
      While the ${../if/timedsend:/params[4]/name} parameter references an object of
      type ${/c/if/timespec:/name} specifying a valid time point which is before or
      at the current time of the ${/glossary/clock-realtime:/term}.
  - name: Invalid
    test-code: |
      ctx->abstime_obj.tv_sec = 1621322302;
      ctx->abstime_obj.tv_nsec = -1;
    text: |
      While the ${../if/timedsend:/params[4]/name} parameter references an object of
      type ${/c/if/timespec:/name} whose nanoseconds value is invalid.
  - name: 'Null'
    test-code: |
      ctx->abstime = NULL;
    text: |
      While the ${../if/timedsend:/params[4]/name} parameter is ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
requirement-type: functional
skip-reasons: {}
test-action: |
  ResumeTask( ctx->worker_id );
  GetTaskTimerInfo( ctx->worker_id, &ctx->timer_info );
  FinalClockTick();
test-brief: null
test-cleanup: |
  (void) mq_close( ctx->mq );
  (void) mq_unlink( QUEUE_NAME );
