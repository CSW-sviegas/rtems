enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/timedsend
- role: requirement-refinement
  uid: ../../req/group-posix-api
post-conditions:
- name: Status
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/timedsend:/name} shall be zero.
  - name: MinusOne
    test-code: |
      T_eq_int( ctx->status, -1 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/timedsend:/name} shall be minus
      one.
  test-epilogue: null
  test-prologue: null
- name: Errno
  states:
  - name: Nop
    test-code: |
      T_eq_int( ctx->errno_value, ERRNO_POISON );
    text: |
      The value of ${/c/errno/if/errno:/name} shall not be modified by the
      ${../if/timedsend:/name} call.
  - name: Inval
    test-code: |
      T_eq_int( ctx->errno_value, EINVAL );
    text: |
      The value of ${/c/errno/if/errno:/name} shall be ${/c/errno/if/einval:/name}.
  - name: Badf
    test-code: |
      T_eq_int( ctx->errno_value, EBADF );
    text: |
      The value of ${/c/errno/if/errno:/name} shall be ${/c/errno/if/ebadf:/name}.
  - name: MsgSize
    test-code: |
      T_eq_int( ctx->errno_value, EMSGSIZE );
    text: |
      The value of ${/c/errno/if/errno:/name} shall be ${/c/errno/if/emsgsize:/name}.
  - name: Again
    test-code: |
      T_eq_int( ctx->errno_value, EAGAIN );
    text: |
      The value of ${/c/errno/if/errno:/name} shall be ${/c/errno/if/eagain:/name}.
  - name: TimedOut
    test-code: |
      T_eq_int( ctx->errno_value, ETIMEDOUT );
    text: |
      The value of ${/c/errno/if/errno:/name} shall be
      ${/c/errno/if/etimedout:/name}.
  test-epilogue: null
  test-prologue: null
- name: Message
  states:
  - name: Receiver
    test-code: |
      T_true( ctx->received );
      T_eq_u8( ctx->recv_buf[ 0 ], SEND_BYTE );
      T_null( FindSentMessage( ctx ) );
    text: |
      The ${/glossary/message:/term} shall be received by the thread which waits to
      receive a ${/glossary/message:/term} from the ${/glossary/messagequeue:/term}.
  - name: Front
    test-code: |
      T_false( ctx->received );
      T_eq_ptr( FindSentMessage( ctx ), GetFirstMessage( ctx ) );
    text: |
      The ${/glossary/message:/term} shall be the first ${/glossary/message:/term} of
      the ${/glossary/messagequeue:/term}.
  - name: Back
    test-code: |
      T_false( ctx->received );
      T_eq_ptr( FindSentMessage( ctx ), GetLastMessage( ctx ) );
    text: |
      The ${/glossary/message:/term} shall be the last ${/glossary/message:/term} of
      the ${/glossary/messagequeue:/term}.
  - name: Nop
    test-code: |
      T_false( ctx->received );
      T_null( FindSentMessage( ctx ) );
      T_eq_u32( GetPendingCount( ctx ), ctx->pending_count );
    text: |
      Neither the ${/glossary/messagequeue:/term} nor a waiting thread shall receive
      the ${/glossary/message:/term}.
  test-epilogue: null
  test-prologue: null
- name: Priority
  states:
  - name: Low
    test-code: |
      T_eq_uint( GetSentPriority( ctx ), 0 );
    text: |
      The ${../glossary/msgprio:/term} of the ${/glossary/message:/term} shall be
      zero.
  - name: Mid
    test-code: |
      T_eq_uint( GetSentPriority( ctx ), PRIO_MID );
    text: |
      The ${../glossary/msgprio:/term} of the ${/glossary/message:/term} shall be the
      value of the ${../if/timedsend:/params[3]/name} parameter.
  - name: High
    test-code: |
      T_eq_uint( GetSentPriority( ctx ), MQ_PRIO_MAX );
    text: |
      The ${../glossary/msgprio:/term} of the ${/glossary/message:/term} shall be
      ${/c/limits/if/mq-prio-max:/name}.
  test-epilogue: null
  test-prologue: null
- name: Size
  states:
  - name: One
    test-code: |
      CheckSentContent( ctx, 1 );
    text: |
      The ${/glossary/message:/term} shall consist of the first byte referenced by
      the ${../if/timedsend:/params[1]/name} parameter.
  - name: Max
    test-code: |
      CheckSentContent( ctx, MSG_SIZE );
    text: |
      The ${/glossary/message:/term} shall consist of the bytes referenced by the
      ${../if/timedsend:/params[1]/name} parameter of the size specified by the
      ${../if/timedsend:/params[2]/name} parameter.
  test-epilogue: null
  test-prologue: null
- name: Timer
  states:
  - name: Inactive
    test-code: |
      T_eq_int( ctx->timer_info.state, TASK_TIMER_INACTIVE );
    text: |
      The timer of the calling task shall be inactive.
  - name: Realtime
    test-code: |
      T_eq_int( ctx->timer_info.state, TASK_TIMER_REALTIME );
    text: |
      The timer of the calling task shall be active using the
      ${/glossary/clock-realtime:/term}.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: MsgPrio
  states:
  - name: Low
    test-code: |
      ctx->msg_prio = 0;
    text: |
      While the ${../if/timedsend:/params[3]/name} parameter is zero.
  - name: Mid
    test-code: |
      ctx->msg_prio = PRIO_MID;
    text: |
      While the ${../if/timedsend:/params[3]/name} parameter is equal to the
      ${../glossary/msgprio:/term} of the ${/glossary/message:/term}s in the
      ${/glossary/messagequeue:/term}.
  - name: High
    test-code: |
      ctx->msg_prio = MQ_PRIO_MAX;
    text: |
      While the ${../if/timedsend:/params[3]/name} parameter is equal to
      ${/c/limits/if/mq-prio-max:/name}.
  - name: TooHigh
    test-code: |
      ctx->msg_prio = MQ_PRIO_MAX + 1;
    text: |
      While the ${../if/timedsend:/params[3]/name} parameter is greater than
      ${/c/limits/if/mq-prio-max:/name}.
  test-epilogue: null
  test-prologue: null
- name: MsgLen
  states:
  - name: One
    test-code: |
      ctx->msg_len = 1;
    text: |
      While the ${../if/timedsend:/params[2]/name} parameter is one.
  - name: Max
    test-code: |
      ctx->msg_len = MSG_SIZE;
    text: |
      While the ${../if/timedsend:/params[2]/name} parameter is equal to the maximum
      ${../glossary/msgsize:/term} of the ${/glossary/messagequeue:/term}.
  - name: TooLong
    test-code: |
      ctx->msg_len = MSG_SIZE + 1;
    text: |
      While the ${../if/timedsend:/params[2]/name} parameter is greater than the
      maximum ${../glossary/msgsize:/term} of the ${/glossary/messagequeue:/term}.
  test-epilogue: null
  test-prologue: null
- name: MqDes
  states:
  - name: Valid
    test-code: |
      ctx->mqdes = ctx->queue_id;
    text: |
      While the ${../if/timedsend:/params[0]/name} parameter is the
      ${../glossary/mqdes:/term} of a ${/glossary/messagequeue:/term}.
  - name: Invalid
    test-code: |
      ctx->mqdes = (mqd_t) INVALID_ID;
    text: |
      While the ${../if/timedsend:/params[0]/name} parameter is not a
      ${../glossary/mqdes:/term}.
  test-epilogue: null
  test-prologue: null
- name: Queue
  states:
  - name: Empty
    test-code: |
      /* The message queue was created without messages */
    text: |
      While the ${/glossary/messagequeue:/term} contains no
      ${/glossary/message:/term} and no thread waits to receive a
      ${/glossary/message:/term} from the ${/glossary/messagequeue:/term}.
  - name: Receiver
    test-code: |
      ctx->receiver_waits = true;
      SendEvents( ctx->receiver_id, EVENT_RECEIVE );
      WaitForExecutionStop( ctx->receiver_id );
    text: |
      While the ${/glossary/messagequeue:/term} contains no
      ${/glossary/message:/term} and a thread waits to receive a
      ${/glossary/message:/term} from the ${/glossary/messagequeue:/term}.
  - name: Pending
    test-code: |
      SendFiller( ctx );
    text: |
      While the ${/glossary/messagequeue:/term} contains a ${/glossary/message:/term}
      and is not full.
  - name: Full
    test-code: |
      ctx->full = true;

      while ( GetPendingCount( ctx ) < MAX_MSG ) {
        SendFiller( ctx );
      }
    text: |
      While the ${/glossary/messagequeue:/term} is full.
  test-epilogue: null
  test-prologue: null
- name: Access
  states:
  - name: ReadWrite
    test-code: |
      ctx->oflag = O_RDWR;
    text: |
      While the ${/glossary/messagequeue:/term} is open for reading and writing.
  - name: WriteOnly
    test-code: |
      ctx->oflag = O_WRONLY;
    text: |
      While the ${/glossary/messagequeue:/term} is open for writing only.
  - name: ReadOnly
    test-code: |
      ctx->oflag = O_RDONLY;
    text: |
      While the ${/glossary/messagequeue:/term} is open for reading only.
  test-epilogue: null
  test-prologue: null
- name: NonBlock
  states:
  - name: 'Yes'
    test-code: |
      SetFlags( ctx, ctx->oflag | O_NONBLOCK );
    text: |
      While the flags of the ${/glossary/messagequeue:/term} contain
      ${/c/fcntl/if/o-nonblock:/name}.
  - name: 'No'
    test-code: |
      SetFlags( ctx, ctx->oflag );
    text: |
      While the flags of the ${/glossary/messagequeue:/term} do not contain
      ${/c/fcntl/if/o-nonblock:/name}.
  test-epilogue: null
  test-prologue: null
- name: Open
  states:
  - name: 'Yes'
    test-code: |
      /* The message queue was opened by its creation */
    text: |
      While the ${/glossary/messagequeue:/term} is open.
  - name: 'No'
    test-code: |
      T_eq_int( mq_close( ctx->queue_id ), 0 );
    text: |
      While the ${/glossary/messagequeue:/term} is not open.
  test-epilogue: null
  test-prologue: null
- name: Abstime
  states:
  - name: Future
    test-code: |
      ctx->abstime_obj.tv_sec = 1621322302;
      ctx->abstime_obj.tv_nsec = 0;
      ctx->abstime = &ctx->abstime_obj;
    text: |
      While the ${../if/timedsend:/params[4]/name} parameter references an object of
      type ${/c/if/timespec:/name} which specifies a time point after the current
      time of the ${/glossary/clock-realtime:/term}.
  - name: PastOrNow
    test-code: |
      ctx->abstime_obj.tv_sec = 0;
      ctx->abstime_obj.tv_nsec = 0;
      ctx->abstime = &ctx->abstime_obj;
    text: |
      While the ${../if/timedsend:/params[4]/name} parameter references an object of
      type ${/c/if/timespec:/name} which specifies a time point before or at the
      current time of the ${/glossary/clock-realtime:/term}.
  - name: InvalidNsec
    test-code: |
      ctx->abstime_obj.tv_sec = 1621322302;
      ctx->abstime_obj.tv_nsec = -1;
      ctx->abstime = &ctx->abstime_obj;
    text: |
      While the ${../if/timedsend:/params[4]/name} parameter references an object of
      type ${/c/if/timespec:/name} with an invalid nanoseconds member.
  - name: 'Null'
    test-code: |
      ctx->abstime = NULL;
    text: |
      While the ${../if/timedsend:/params[4]/name} parameter is ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Receive
  states:
  - name: 'Yes'
    test-code: |
      ctx->receive = true;
    text: |
      While a thread receives a ${/glossary/message:/term} from the
      ${/glossary/messagequeue:/term} when the calling thread waits for space.
  - name: 'No'
    test-code: |
      ctx->receive = false;
    text: |
      While no thread receives a ${/glossary/message:/term} from the
      ${/glossary/messagequeue:/term} when the calling thread waits for space.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/mq-send:/name} specifies that ${../if/timedsend:/name}
  adds the ${/glossary/message:/term} referenced by the
  ${../if/timedsend:/params[1]/name} parameter of the size specified by the
  ${../if/timedsend:/params[2]/name} parameter to the
  ${/glossary/messagequeue:/term} at the position given by the
  ${../if/timedsend:/params[3]/name} parameter, after the
  ${/glossary/message:/term}s of equal priority. This gives the pre-conditions
  MsgPrio and MsgLen, the states Pending and Full of pre-condition Queue, and the
  post-conditions Message, Priority, and Size. The standard requires that a full
  ${/glossary/messagequeue:/term} blocks the call unless
  ${/c/fcntl/if/o-nonblock:/name} is set, which gives pre-condition NonBlock. The
  ${/glossary/messagequeue:/term} of the test can hold two
  ${/glossary/message:/term}s.

  The standard specifies that a waiting call ends with
  ${/c/errno/if/etimedout:/name} at the time specified by the
  ${../if/timedsend:/params[4]/name} parameter, measured by the
  ${/glossary/clock-realtime:/term}, and that the validity of this time is
  checked only if the call has to wait. This gives the pre-conditions Abstime and
  Receive and the post-condition Timer. The pre-condition Abstime applies only
  where the call would wait.

  A thread which waits in a receive call gets the ${/glossary/message:/term}
  directly, see state Receiver of pre-condition Queue. The standard leaves the
  choice of the thread to the implementation.

  The standard requires ${/c/errno/if/ebadf:/name} if the
  ${../if/timedsend:/params[0]/name} parameter is not a valid
  ${../glossary/mqdes:/term} open for writing. This gives pre-condition MqDes,
  the state ReadOnly of pre-condition Access, and state No of pre-condition Open.

  The standard requires ${/c/errno/if/einval:/name} for a
  ${../if/timedsend:/params[3]/name} value outside of the valid range, which is
  less than ${/c/limits/if/mq-prio-max:/name}. RTEMS returns this error only for
  values greater than ${/c/limits/if/mq-prio-max:/name}. It accepts the value
  ${/c/limits/if/mq-prio-max:/name}, see state High of pre-condition MsgPrio.
  This deviation of RTEMS is stated in the notes of ${../if/timedsend:/name}.

  The interruption of a waiting call by a signal is not covered, since RTEMS
  provides signals only if it is built with the option RTEMS_POSIX_API enabled.
requirement-type: functional
skip-reasons: {}
test-action: |
  ctx->pending_count = GetPendingCount( ctx );
  ResumeTask( ctx->worker_id );
  WaitForExecutionStop( ctx->worker_id );
  GetTaskTimerInfo( ctx->worker_id, &ctx->timer_info );

  if ( !ctx->done ) {
    T_true( ctx->full );

    if ( ctx->receive ) {
      ReceiveFiller( ctx );
    } else {
      FinalClockTick();
    }

    WaitForExecutionStop( ctx->worker_id );
    T_true( ctx->done );
  }

  ctx->received = ctx->receiver_waits && !ctx->receiver->is_waiting;
test-brief: null
test-cleanup: |
  if ( ctx->queue->open_count == 0 ) {
    T_eq_u32( mq_open( NAME, O_RDWR ), ctx->queue_id );
  }

  SetFlags( ctx, O_RDWR );

  if ( ctx->receiver_waits && !ctx->received ) {
    T_eq_int( mq_send( ctx->queue_id, "X", 1, 0 ), 0 );
    WaitForExecutionStop( ctx->receiver_id );
  }

  T_eq_int( mq_close( ctx->queue_id ), 0 );
  T_eq_int( mq_unlink( NAME ), 0 );
