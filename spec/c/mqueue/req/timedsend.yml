test-context-support: null
test-description: null
test-header: null
test-includes:
- errno.h
- fcntl.h
- limits.h
- mqueue.h
- rtems.h
- sys/stat.h
- time.h
test-local-includes:
- tx-support.h
test-prepare: |
  ctx->retval = -1;
  ctx->eno = 0;
  ctx->curmsgs = 0;
  ctx->msg_ptr = message;
  ctx->abstime = &ctx->abstime_obj;
  ctx->abstime_obj.tv_sec = 1621322302;
  ctx->abstime_obj.tv_nsec = 0;
test-setup:
  brief: null
  code: |
    rtems_time_of_day now = { 1988, 1, 1, 0, 0, 0, 0 };

    T_rsc_success( rtems_clock_set( &now ) );
    SetSelfPriority( PRIO_NORMAL );
    ctx->worker_id = CreateTask( "WORK", PRIO_HIGH );
    StartTask( ctx->worker_id, Worker, ctx );
  description: null
test-stop: null
test-support: |
  #define QUEUE_NAME "mq"

  #define MSG_SIZE 4

  static const struct mq_attr queue_attr = { 0, 1, MSG_SIZE, 0 };

  static const char message[] = "abcde";

  typedef ${.:/test-context-type} Context;

  static void Worker( rtems_task_argument arg )
  {
    Context *ctx;

    ctx = (Context *) arg;

    while ( true ) {
      SuspendSelf();
      errno = -1;
      ctx->retval = mq_timedsend(
        ctx->mqdes,
        ctx->msg_ptr,
        ctx->msg_len,
        ctx->msg_prio,
        ctx->abstime
      );
      ctx->eno = errno;
    }
  }
test-target: testsuites/validation/tc-posix-mq-timedsend.c
test-teardown:
  brief: null
  code: |
    DeleteTask( ctx->worker_id );
    RestoreRunnerPriority();
  description: null
text: |
  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
      - pre-conditions:
          MsgPrio: Invalid
      - pre-conditions:
          Mqdes:
          - Closed
          - Invalid
      - pre-conditions:
          Flags: ReadOnly
      - pre-conditions:
          MsgLen: TooLong
      - pre-conditions:
          Full: 'Yes'
      then: MinusOne
    - else: Zero
    Errno:
    - if:
        pre-conditions:
          MsgPrio: Invalid
      then: EINVAL
    - if:
      - pre-conditions:
          Mqdes:
          - Closed
          - Invalid
      - pre-conditions:
          Flags: ReadOnly
      then: EBADF
    - if:
        pre-conditions:
          MsgLen: TooLong
      then: EMSGSIZE
    - if:
        pre-conditions:
          Flags: NonBlock
          Full: 'Yes'
      then: EAGAIN
    - if:
        pre-conditions:
          Abstime:
          - Invalid
          - 'Null'
      then: EINVAL
    - if:
        pre-conditions:
          Full: 'Yes'
      then: ETIMEDOUT
    - else: Unchanged
    Timer:
    - if:
        pre-conditions:
          Abstime: Future
      then: Realtime
    - else: Inactive
    Queue:
    - if:
        post-conditions:
          Status: Zero
      then: Added
    - else: Nop
  pre-conditions:
    Flags: all
    Full:
      applicable:
        pre-conditions:
          Flags:
          - Blocking
          - NonBlock
    Mqdes: all
    MsgLen: all
    MsgPrio: all
    Abstime:
      applicable:
        pre-conditions:
          Flags: Blocking
          Full: 'Yes'
          Mqdes: Valid
          MsgLen: Fits
          MsgPrio: Valid
type: requirement
