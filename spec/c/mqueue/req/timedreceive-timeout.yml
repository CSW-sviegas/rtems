rationale: |
  ${/ref/std/posix-2024/mq-receive:/name} requires ${/c/errno/if/etimedout:/name}
  when the time point passes before the call can receive the
  ${/glossary/message:/term}. The call waits where the access mode of the
  ${/glossary/messagequeue:/term} permits the call, so each such access mode is a
  state of pre-condition Access. The thread queue of the
  ${/glossary/messagequeue:/term} uses the FIFO discipline. The delegated tests
  trigger the timeout of the waiting thread directly, so the time point lies in
  the far future.
requirement-type: functional
skip-reasons: {}
test-action: |
  static const struct mq_attr attr = {
    .mq_maxmsg = MAX_MSG,
    .mq_msgsize = MSG_SIZE
  };

  ctx->queue_id = mq_open( NAME, O_CREAT | O_EXCL | ctx->oflag, 0, &attr );
  T_assert_ne_u32( ctx->queue_id, (mqd_t) -1 );
  ctx->queue = GetQueue( ctx->queue_id );
  T_assert_not_null( ctx->queue );
test-brief: null
test-cleanup: |
  T_eq_int( mq_close( ctx->queue_id ), 0 );
  T_eq_int( mq_unlink( NAME ), 0 );
