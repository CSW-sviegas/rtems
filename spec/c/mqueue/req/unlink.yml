transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Exists: 'Yes'
          Name: Valid
      then: Zero
    - else: MinusOne
    Errno:
    - if:
        pre-conditions:
          Name: 'Null'
      then: Inval
    - if:
        pre-conditions:
          Name: TooLong
      then: NameTooLong
    - if:
        pre-conditions:
          Exists: 'No'
      then: NoEnt
    - else: Nop
    Name:
    - if:
        post-conditions:
          Status: Zero
      then: Removed
    - else: Nop
    Queue:
    - if:
        pre-conditions:
          Exists: 'Yes'
          Open: 'No'
      then: Deleted
    - else: Nop
  pre-conditions:
    Name: all
    Exists:
      applicable:
        pre-conditions:
          Name: Valid
    Open:
      applicable:
        pre-conditions:
          Exists: 'Yes'
type: requirement
