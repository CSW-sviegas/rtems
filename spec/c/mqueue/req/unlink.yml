enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/unlink
- role: requirement-refinement
  uid: ../../req/group-posix-api
post-conditions:
- name: Status
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/unlink:/name} shall be zero.
  - name: MinusOne
    test-code: |
      T_eq_int( ctx->status, -1 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/unlink:/name} shall be minus one.
  test-epilogue: null
  test-prologue: null
- name: Errno
  states:
  - name: Nop
    test-code: |
      T_eq_int( ctx->errno_value, ERRNO_POISON );
    text: |
      The value of ${/c/errno/if/errno:/name} shall not be modified by the
      ${../if/unlink:/name} call.
  - name: Inval
    test-code: |
      T_eq_int( ctx->errno_value, EINVAL );
    text: |
      The value of ${/c/errno/if/errno:/name} shall be ${/c/errno/if/einval:/name}.
  - name: NameTooLong
    test-code: |
      T_eq_int( ctx->errno_value, ENAMETOOLONG );
    text: |
      The value of ${/c/errno/if/errno:/name} shall be
      ${/c/errno/if/enametoolong:/name}.
  - name: NoEnt
    test-code: |
      T_eq_int( ctx->errno_value, ENOENT );
    text: |
      The value of ${/c/errno/if/errno:/name} shall be ${/c/errno/if/enoent:/name}.
  test-epilogue: null
  test-prologue: null
- name: Name
  states:
  - name: Removed
    test-code: |
      T_null( GetQueueByName( ctx->name ) );
      T_false( ctx->queue->linked );
      T_eq_ptr( GetQueueByName( OTHER_NAME ), ctx->other );
    text: |
      The name specified by the ${../if/unlink:/params[0]/name} parameter shall be
      removed from the ${/glossary/messagequeue:/term}.
  - name: Nop
    test-code: |
      T_eq_ptr(
        GetQueueByName( NAME ),
        ( ctx->name == ctx->max_name ? NULL : ctx->queue )
      );
      T_eq_ptr(
        GetQueueByName( ctx->max_name ),
        ( ctx->name == ctx->max_name ? ctx->queue : NULL )
      );
      T_eq_ptr( GetQueueByName( OTHER_NAME ), ctx->other );
    text: |
      The ${../if/unlink:/name} call shall remove no name of a
      ${/glossary/messagequeue:/term}.
  test-epilogue: null
  test-prologue: null
- name: Queue
  states:
  - name: Deleted
    test-code: |
      T_eq_sz( GetInactiveCount(), ctx->inactive_count + 1 );
    text: |
      The ${/glossary/messagequeue:/term} shall be deleted.
  - name: Nop
    test-code: |
      T_eq_sz( GetInactiveCount(), ctx->inactive_count );
    text: |
      The ${../if/unlink:/name} call shall delete no ${/glossary/messagequeue:/term}.
  test-epilogue: null
  test-prologue: null
- name: Flush
  states:
  - name: 'Yes'
    test-code: |
      ++ctx->wait_expected;
      T_eq_u32( ctx->wait_done, ctx->wait_expected );
    text: |
      The call of each thread which waits at the ${/glossary/messagequeue:/term}
      shall end with the ${/glossary/returnvalue:/term} minus one and
      ${/c/errno/if/errno:/name} set to ${/c/errno/if/ebadf:/name}.
  - name: 'No'
    test-code: |
      T_eq_u32( ctx->wait_done, ctx->wait_expected );
    text: |
      The ${../if/unlink:/name} call shall end no wait at the
      ${/glossary/messagequeue:/term}.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Name
  states:
  - name: Valid
    test-code: |
      ctx->name = NAME;
    text: |
      While the ${../if/unlink:/params[0]/name} parameter references a string which
      is shorter than the maximum length of a ${/glossary/messagequeue:/term} name.
  - name: Max
    test-code: |
      ctx->name = ctx->max_name;
    text: |
      While the ${../if/unlink:/params[0]/name} parameter references a string which
      has the maximum length of a ${/glossary/messagequeue:/term} name.
  - name: 'Null'
    test-code: |
      ctx->name = NULL;
    text: |
      While the ${../if/unlink:/params[0]/name} parameter is ${/c/if/null:/name}.
  - name: TooLong
    test-code: |
      ctx->name = ctx->long_name;
    text: |
      While the ${../if/unlink:/params[0]/name} parameter references a string which
      is longer than the maximum length of a ${/glossary/messagequeue:/term} name.
  test-epilogue: null
  test-prologue: null
- name: Exists
  states:
  - name: 'Yes'
    test-code: |
      ctx->queue_id = mq_open( ctx->name, O_CREAT | O_EXCL | O_RDWR, 0, NULL );
      T_ne_u32( ctx->queue_id, (mqd_t) -1 );
      ctx->queue = GetQueue( ctx->queue_id );
      T_assert_not_null( ctx->queue );
    text: |
      While a ${/glossary/messagequeue:/term} has the name specified by the
      ${../if/unlink:/params[0]/name} parameter.
  - name: 'No'
    test-code: |
      /* No message queue has the name */
    text: |
      While no ${/glossary/messagequeue:/term} has the name specified by the
      ${../if/unlink:/params[0]/name} parameter.
  test-epilogue: null
  test-prologue: null
- name: Waiter
  states:
  - name: Receiver
    test-code: |
      ctx->send = false;
      WaitAtQueue( ctx );
    text: |
      While a thread waits to receive a ${/glossary/message:/term} from the
      ${/glossary/messagequeue:/term}.
  - name: Sender
    test-code: |
      FillQueue( ctx );
      ctx->send = true;
      WaitAtQueue( ctx );
    text: |
      While a thread waits to send a ${/glossary/message:/term} to the
      ${/glossary/messagequeue:/term}.
  test-epilogue: null
  test-prologue: null
- name: Open
  states:
  - name: 'Yes'
    test-code: |
      /* The message queue was opened by its creation */
    text: |
      While the ${/glossary/messagequeue:/term} is open.
  - name: 'No'
    test-code: |
      T_eq_int( mq_close( ctx->queue_id ), 0 );
    text: |
      While the ${/glossary/messagequeue:/term} is not open.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/mq-unlink:/name} specifies that ${../if/unlink:/name}
  removes the name of the ${/glossary/messagequeue:/term} and that the
  ${/glossary/messagequeue:/term} is destroyed when it is not open, otherwise
  when the last open is closed. This gives the pre-conditions Exists and Open and
  the post-conditions Name and Queue. The deletion ends each wait at the
  ${/glossary/messagequeue:/term}, which gives the post-condition Flush. A thread
  waits at the ${/glossary/messagequeue:/term} to receive or to send a
  ${/glossary/message:/term}, which gives the pre-condition Waiter. The error
  ${/c/errno/if/enametoolong:/name} gives state TooLong of pre-condition Name.
  State Max of pre-condition Name arranges a name of the maximum length, which is
  the boundary of the check of the name length. The error
  ${/c/errno/if/enoent:/name} gives state No of pre-condition Exists. A second
  ${/glossary/messagequeue:/term}, which the test does not unlink, shows that no
  other name is removed.

  The standard does not define the behaviour where the
  ${../if/unlink:/params[0]/name} parameter is ${/c/if/null:/name}. The state
  Null of pre-condition Name specifies the behaviour of RTEMS which returns minus
  one and sets ${/c/errno/if/errno:/name} to ${/c/errno/if/einval:/name}.

  The standard requires an error if the caller has no permission to unlink the
  ${/glossary/messagequeue:/term}. RTEMS has no permissions for message queues,
  so this error is not returned.
requirement-type: functional
skip-reasons: {}
test-action: |
  ctx->inactive_count = GetInactiveCount();
  errno = ERRNO_POISON;
  ctx->status = mq_unlink( ctx->name );
  ctx->errno_value = errno;
test-brief: null
test-cleanup: |
  if ( ctx->queue != NULL ) {
    if ( ctx->queue->linked || ctx->queue->open_count > 0 ) {
      if ( ctx->queue->linked ) {
        T_eq_int( mq_unlink( ctx->queue->Object.name.name_p ), 0 );
      }

      if ( ctx->queue->open_count > 0 ) {
        T_eq_int( mq_close( ctx->queue_id ), 0 );
      }

      ++ctx->wait_expected;
    }

    ctx->queue = NULL;
  }

  T_eq_u32( ctx->wait_done, ctx->wait_expected );
