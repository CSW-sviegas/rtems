  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
      - pre-conditions:
          ClockId:
          - Other
      - pre-conditions:
          Tp:
          - 'Null'
      then: MinusOne
    - else: Zero
    Errno:
    - if:
      - pre-conditions:
          ClockId:
          - Other
      - pre-conditions:
          Tp:
          - 'Null'
      then: EINVAL
    - else: Unchanged
    Tp:
    - if:
        pre-conditions:
          Tp:
          - 'Null'
      then: N/A
    - if:
        pre-conditions:
          ClockId:
          - Other
      then: Unchanged
    - specified-by: ClockId
  pre-conditions:
    ClockId: all
    Tp: all
type: requirement
