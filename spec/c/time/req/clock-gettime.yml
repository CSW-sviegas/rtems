test-context-support: null
test-description: |
  The software timecounter of the test suite advances at each read. The prepare
  restores the counter after each of its reads, so the directive call reads the
  same counter value. The expected time of each clock follows from the values
  which the prepare reads.
test-header: null
test-includes:
- errno.h
- rtems.h
- rtems/cpuuse.h
- rtems/cpuuseimpl.h
- rtems/score/threadimpl.h
- rtems/score/todimpl.h
- time.h
test-local-includes:
- tx-support.h
test-prepare: |
  uint32_t          counter;
  Timestamp_Control uptime;
  Timestamp_Control used;
  Timestamp_Control ran;
  Thread_Control   *executing;

  rtems_cpu_usage_reset();
  Yield();
  counter = GetTimecountCounter();

  rtems_clock_get_monotonic( &ctx->now_monotonic );
  SetTimecountCounter( counter );

  rtems_clock_get_realtime( &ctx->now_realtime );
  SetTimecountCounter( counter );

  _TOD_Get_uptime( &uptime );
  SetTimecountCounter( counter );

  _Timestamp_Subtract( &CPU_usage_Uptime_at_last_reset, &uptime, &used );
  _Timestamp_To_timespec( &used, &ctx->process_time );

  executing = _Thread_Get_executing();
  _Timestamp_Subtract(
    &executing->cpu_time_used_at_last_reset,
    &executing->cpu_time_used,
    &used
  );
  _Timestamp_Subtract(
    &_Thread_Get_CPU( executing )->cpu_usage_timestamp,
    &uptime,
    &ran
  );
  _Timestamp_Add_to( &used, &ran );
  _Timestamp_To_timespec( &used, &ctx->thread_time );

  errno = -1;
  ctx->status = -1;
  ctx->tp_obj.tv_sec = -1;
  ctx->tp_obj.tv_nsec = -1;
test-setup:
  brief: null
  code: |
    ctx->worker_id = CreateTask( "WORK", GetSelfPriority() );
    StartTask( ctx->worker_id, Worker, 0 );
  description: null
test-stop: null
test-support: |
  static void Worker( rtems_task_argument arg )
  {
    (void) arg;
    while ( true ) {
      Yield();
    }
  }
test-target: testsuites/validation/tc-time-clock-gettime.c
test-teardown:
  brief: null
  code: |
    DeleteTask( ctx->worker_id );
  description: null
