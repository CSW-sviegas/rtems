enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/clock-gettime
post-conditions:
- name: Status
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/clock-gettime:/name} shall be
      equal to zero.
  - name: MinusOne
    test-code: |
      T_eq_int( ctx->status, -1 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/clock-gettime:/name} shall be
      equal to minus one.
  test-epilogue: null
  test-prologue: null
- name: Errno
  states:
  - name: Unchanged
    test-code: |
      T_eq_int( errno, -1 );
    text: |
      The ${/c/errno/if/errno:/name} shall not be changed by the directive call.
  - name: EINVAL
    test-code: |
      T_eq_int( errno, EINVAL );
    text: |
      The ${/c/errno/if/errno:/name} shall be equal to ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: Tp
  states:
  - name: Monotonic
    test-code: |
      T_eq_i64( ctx->tp_obj.tv_sec, ctx->now_monotonic.tv_sec );
      T_eq_long( ctx->tp_obj.tv_nsec, ctx->now_monotonic.tv_nsec );
    text: |
      The object referenced by the ${../if/clock-gettime:/params[1]/name} parameter
      shall be set to the time elapsed since some fixed time point in the past
      measured using the ${/glossary/clock-monotonic:/term} at some time point during
      the directive call.
  - name: Realtime
    test-code: |
      T_eq_i64( ctx->tp_obj.tv_sec, ctx->now_realtime.tv_sec );
      T_eq_long( ctx->tp_obj.tv_nsec, ctx->now_realtime.tv_nsec );
    text: |
      The object referenced by the ${../if/clock-gettime:/params[1]/name} parameter
      shall be set to the time elapsed since the ${/glossary/unix-epoch:/term}
      measured using the ${/glossary/clock-realtime:/term} at some time point during
      the directive call.
  - name: ProcessCPUTimeId
    test-code: |
      T_eq_i64( ctx->tp_obj.tv_sec, ctx->process_time.tv_sec );
      T_eq_long( ctx->tp_obj.tv_nsec, ctx->process_time.tv_nsec );
    text: |
      The object referenced by the ${../if/clock-gettime:/params[1]/name} parameter
      shall be set to the time elapsed since the last
      ${/glossary/cpu-usage-reset-point:/term} at some time point during the
      directive call.
  - name: ThreadCPUTimeId
    test-code: |
      T_eq_i64( ctx->tp_obj.tv_sec, ctx->thread_time.tv_sec );
      T_eq_long( ctx->tp_obj.tv_nsec, ctx->thread_time.tv_nsec );
    text: |
      The object referenced by the ${../if/clock-gettime:/params[1]/name} parameter
      shall be set to the execution time of the executing thread since the last
      ${/glossary/cpu-usage-reset-point:/term} at some time point during the
      directive call.
  - name: Unchanged
    test-code: |
      T_eq_i64( ctx->tp_obj.tv_sec, -1 );
      T_eq_long( ctx->tp_obj.tv_nsec, -1 );
    text: |
      The object referenced by the ${../if/clock-gettime:/params[1]/name} parameter
      shall not be changed by the directive call.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: ClockId
  states:
  - name: Monotonic
    test-code: |
      ctx->clock_id = CLOCK_MONOTONIC;
    text: |
      While the ${../if/clock-gettime:/params[0]/name} parameter is equal to
      ${../if/clock-monotonic:/name}.
  - name: Realtime
    test-code: |
      ctx->clock_id = CLOCK_REALTIME;
    text: |
      While the ${../if/clock-gettime:/params[0]/name} parameter is equal to
      ${../if/clock-realtime:/name}.
  - name: ProcessCPUTimeId
    test-code: |
      ctx->clock_id = CLOCK_PROCESS_CPUTIME_ID;
    text: |
      While the ${../if/clock-gettime:/params[0]/name} parameter is equal to
      ${../if/clock-process-cputime-id:/name}.
  - name: ThreadCPUTimeId
    test-code: |
      ctx->clock_id = CLOCK_THREAD_CPUTIME_ID;
    text: |
      While the ${../if/clock-gettime:/params[0]/name} parameter is equal to
      ${../if/clock-thread-cputime-id:/name}.
  - name: Other
    test-code: |
      ctx->clock_id = CLOCK_TAI;
    text: |
      While the ${../if/clock-gettime:/params[0]/name} parameter is not equal to
      ${../if/clock-monotonic:/name}, ${../if/clock-realtime:/name},
      ${../if/clock-process-cputime-id:/name}, or
      ${../if/clock-thread-cputime-id:/name}.
  test-epilogue: null
  test-prologue: null
- name: Tp
  states:
  - name: Valid
    test-code: |
      ctx->tp = &ctx->tp_obj;
    text: |
      While the ${../if/clock-gettime:/params[1]/name} parameter references an object
      of type ${/c/if/timespec:/name}.
  - name: 'Null'
    test-code: |
      ctx->tp = NULL;
    text: |
      While the ${../if/clock-gettime:/params[1]/name} parameter is equal to
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension ClockId covers the identifier of the clock, 5 states. The directive
  supports four clocks. State Other covers every other identifier.

  The CPU time clocks measure from the last
  ${/glossary/cpu-usage-reset-point:/term}. The directive has no branch on the
  kind of the CPU usage reset point. The prepare establishes a CPU usage reset
  point through ${/rtems/cpuuse/if/reset:/name} before each variant.

  Dimension Tp covers the pointer to the time object, 2 states. The directive
  checks the pointer against ${/c/if/null:/name} alone, so the domain splits into
  the null pointer and a pointer to an object.
