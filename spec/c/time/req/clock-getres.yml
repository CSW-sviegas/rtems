transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          ClockId: Other
      then: MinusOne
    - else: Zero
    Errno:
    - if:
        pre-conditions:
          ClockId: Other
      then: EINVAL
    - else: Unchanged
    ResObj:
    - if:
        pre-conditions:
          Res: 'Null'
      then: N/A
    - if:
        pre-conditions:
          ClockId: Other
      then: Unchanged
    - if:
        pre-conditions:
          TimecounterFreq: High
      then: OneNanosecond
    - else: Period
  pre-conditions:
    ClockId: all
    Res: all
    TimecounterFreq:
      applicable:
        pre-conditions:
          ClockId:
          - Monotonic
          - Realtime
          - ProcessCPUTimeId
          - ThreadCPUTimeId
          Res: Valid
type: requirement
