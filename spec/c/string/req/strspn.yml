      T_eq_sz( ctx->retval, ctx->stop );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/strspn:/name} shall be equal to
      the index of the first character of the string referenced by the
      ${../if/strspn:/params[0]/name} parameter which does not occur in the string
      referenced by the ${../if/strspn:/params[1]/name} parameter.
  - name: Length
    test-code: |
      T_eq_sz( ctx->retval, ctx->length );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/strspn:/name} shall be equal to
      the length of the string referenced by the ${../if/strspn:/params[0]/name}
      parameter.
  test-epilogue: null
  test-prologue: null
- name: S1
  states:
  - name: Nop
    test-code: |
      CheckUnchanged( ctx->s1_buf, ctx->s1_before, sizeof( ctx->s1_buf ) );
    text: |
      The bytes of the string referenced by the ${../if/strspn:/params[0]/name}
      parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: S2
  states:
  - name: Nop
    test-code: |
      CheckUnchanged( ctx->s2_buf, ctx->s2_before, sizeof( ctx->s2_buf ) );
    text: |
      The bytes of the string referenced by the ${../if/strspn:/params[1]/name}
      parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: Errno
  states:
  - name: Nop
    test-code: |
      T_eq_int( ctx->errno_value, -1 );
    text: |
      The value of ${/c/errno/if/errno:/name} shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Accept
  states:
  - name: Empty
    test-code: |
      ctx->accept_length = 0;
    text: |
      While the length of the string referenced by the
      ${../if/strspn:/params[1]/name} parameter is equal to zero.
  - name: One
    test-code: |
      ctx->accept_length = 1;
    text: |
      While the length of the string referenced by the
      ${../if/strspn:/params[1]/name} parameter is equal to one.
  - name: Several
    test-code: |
      ctx->accept_length = ACCEPT_MAX;
    text: |
      While the length of the string referenced by the
      ${../if/strspn:/params[1]/name} parameter is greater than one.
  test-epilogue: null
  test-prologue: null
- name: HighByte
  states:
  - name: 'Yes'
    test-code: |
      ctx->high = true;
    text: |
      While the string referenced by the ${../if/strspn:/params[1]/name} parameter
      holds a character with a value greater than 127, where the value is interpreted
      as type `unsigned char`.
  - name: 'No'
    test-code: |
      ctx->high = false;
    text: |
      While the string referenced by the ${../if/strspn:/params[1]/name} parameter
      holds no character with a value greater than 127, where the value is
      interpreted as type `unsigned char`.
  test-epilogue: null
  test-prologue: null
- name: Segment
  states:
  - name: Empty
    test-code: |
      ctx->segment = SEGMENT_EMPTY;
    text: |
      While the length of the string referenced by the
      ${../if/strspn:/params[0]/name} parameter is equal to zero.
  - name: None
    test-code: |
      ctx->segment = SEGMENT_NONE;
    text: |
      While the length of the string referenced by the
      ${../if/strspn:/params[0]/name} parameter is greater than zero, while the first
      character of the string referenced by the ${../if/strspn:/params[0]/name}
      parameter does not occur in the string referenced by the
      ${../if/strspn:/params[1]/name} parameter.
  - name: Part
    test-code: |
      ctx->segment = SEGMENT_PART;
    text: |
      While the first character of the string referenced by the
      ${../if/strspn:/params[0]/name} parameter occurs in the string referenced by
      the ${../if/strspn:/params[1]/name} parameter, while a character of the string
      referenced by the ${../if/strspn:/params[0]/name} parameter does not occur in
      the string referenced by the ${../if/strspn:/params[1]/name} parameter.
  - name: Whole
    test-code: |
      ctx->segment = SEGMENT_WHOLE;
    text: |
      While the length of the string referenced by the
      ${../if/strspn:/params[0]/name} parameter is greater than zero, while each
      character of the string referenced by the ${../if/strspn:/params[0]/name}
      parameter occurs in the string referenced by the
      ${../if/strspn:/params[1]/name} parameter.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/c23/strspn:/name} defines the ${/glossary/returnvalue:/term} as the
  length of the maximum initial segment of the string referenced by the
  ${../if/strspn:/params[0]/name} parameter. The segment consists of characters
  of the string referenced by the ${../if/strspn:/params[1]/name} parameter. It
  defines no error. It leaves the behaviour undefined where a parameter
  references no string, so the item states no ${/c/if/null:/name} pointer.
  ${/ref/std/posix-2024/strspn:/name} states that the function does not change
  ${/c/errno/if/errno:/name} on valid input.

  Dimension Accept covers the length of the string referenced by the
  ${../if/strspn:/params[1]/name} parameter, 3 states. An empty string holds no
  character, so it accepts none. One character and several characters tell apart
  a test of the first character from a test of each character of the string.

  ${/ref/std/c23/string-function-conventions:/name} interprets each character of
  a string function as type `unsigned char`. The characters with a value greater
  than 127 have a negative value as type `signed char`. The HighByte dimension
  holds this distinction.

  Dimension Segment covers the maximum initial segment relative to the string
  referenced by the ${../if/strspn:/params[0]/name} parameter, 4 states. The
  segment of an empty string is empty. The segment of a string of a length
  greater than zero is empty, a proper prefix of the string, or the whole string.

  The state code of each dimension records its state. The action builds both
  strings from the three records.
