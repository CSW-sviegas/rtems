test-context-support: |
  typedef enum {
    SEGMENT_EMPTY,
    SEGMENT_NONE,
    SEGMENT_PART,
    SEGMENT_WHOLE
  } Segment;
test-description: |
  The string referenced by the ${../if/strspn:/params[1]/name} parameter is
  followed by the first character of the string referenced by the
  ${../if/strspn:/params[0]/name} parameter which does not occur in it. A segment
  of a proper prefix or of the whole string holds each character of the string
  referenced by the ${../if/strspn:/params[1]/name} parameter. A character which
  occurs follows the segment and the end of the string. Where the string
  referenced by the ${../if/strspn:/params[1]/name} parameter holds a character
  greater than 127, the character which does not occur differs from it in the
  most significant bit only.
test-header: null
test-includes:
- errno.h
- stdbool.h
