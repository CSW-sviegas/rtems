test-description: |
  The memory areas lie in one buffer, so the offsets of the two areas arrange
  their relative position. Two overlapping areas differ by the least distance
  which the alignment of their start addresses permits. A memory area of the
  state Between starts two bytes above an aligned address. It starts two bytes
  below an aligned address if the other memory area starts one byte below an
  aligned address. The least distance of each pair of alignment states then gives
  the same overlapping sizes for each size of type long. Memory areas which start
  one byte below an aligned address and have a size of one more than a multiple
  of the size of type long end at aligned addresses, so the copy towards lower
  addresses runs its block loop. The long size runs the loop of four blocks
  twice. The test fills the buffer with a pattern of distinct bytes before each
  call and records the source bytes with a loop of its own.
