  - name: Between
    test-code: |
      ctx->s1_misalign = 2;
    text: |
      While the memory area referenced by the ${../if/memcmp:/params[0]/name}
      parameter starts more than one byte above an address which is aligned to the
      size of type long, while the memory area referenced by the
      ${../if/memcmp:/params[0]/name} parameter starts more than one byte below the
      next address which is aligned to the size of type long.
  - name: BelowAligned
    test-code: |
      ctx->s1_misalign = sizeof( long ) - 1;
    text: |
      While the memory area referenced by the ${../if/memcmp:/params[0]/name}
      parameter starts one byte below an address which is aligned to the size of type
      long.
  test-epilogue: null
  test-prologue: null
- name: S2Alignment
  states:
  - name: Aligned
    test-code: |
      ctx->s2_misalign = 0;
    text: |
      While the memory area referenced by the ${../if/memcmp:/params[1]/name}
      parameter starts at an address which is aligned to the size of type long.
  - name: AboveAligned
    test-code: |
      ctx->s2_misalign = 1;
    text: |
      While the memory area referenced by the ${../if/memcmp:/params[1]/name}
      parameter starts one byte above an address which is aligned to the size of type
      long.
  - name: Between
    test-code: |
      ctx->s2_misalign = 2;
    text: |
      While the memory area referenced by the ${../if/memcmp:/params[1]/name}
      parameter starts more than one byte above an address which is aligned to the
      size of type long, while the memory area referenced by the
      ${../if/memcmp:/params[1]/name} parameter starts more than one byte below the
      next address which is aligned to the size of type long.
  - name: BelowAligned
    test-code: |
      ctx->s2_misalign = sizeof( long ) - 1;
    text: |
      While the memory area referenced by the ${../if/memcmp:/params[1]/name}
      parameter starts one byte below an address which is aligned to the size of type
