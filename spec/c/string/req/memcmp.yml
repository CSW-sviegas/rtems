skip-reasons:
  EqualAreasHaveNoDifference: |
    Two equal memory areas hold no differing byte.
  LastByteHasNoRest: |
    A memory area holds no byte after its last byte.
  OneByteIsLast: |
    A memory area of size one holds no byte before its last byte.
  ZeroSizeHasNoByte: |
    A memory area of size zero holds no byte.
test-action: |
  memcpy( ctx->before1, ctx->buf1, sizeof( ctx->buf1 ) );
  memcpy( ctx->before2, ctx->buf2, sizeof( ctx->buf2 ) );
  errno = -1;
  ctx->retval = memcmp( ctx->s1, ctx->s2, ctx->n );
  ctx->errno_value = errno;
