- errno.h
- rtems.h
- string.h
test-local-includes: []
test-prepare: |
  memset( ctx->buf1, FILL, sizeof( ctx->buf1 ) );
  memset( ctx->buf2, FILL, sizeof( ctx->buf2 ) );
  ctx->s1_misalign = 0;
  ctx->s2_misalign = 0;
  ctx->n = 0;
  ctx->retval = 0x7fffffff;
test-setup: null
test-stop: null
test-support: |
  #define FILL 0x5a

  #define LOW 0x11

  #define HIGH 0xa5

  static void CheckUnchanged(
    const unsigned char *actual,
    const unsigned char *expected,
    size_t               size
  )
  {
    size_t i;

    for ( i = 0; i < size; ++i ) {
      T_quiet_eq_u8( actual[ i ], expected[ i ] );
    }
  }
test-target: testsuites/validation/tc-string-memcmp.c
