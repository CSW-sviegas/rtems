post-conditions:
- name: Result
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->retval, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/memcmp:/name} shall be equal to
      zero.
  - name: Negative
    test-code: |
      T_lt_int( ctx->retval, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/memcmp:/name} shall be less than
      zero.
  - name: Positive
    test-code: |
      T_gt_int( ctx->retval, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/memcmp:/name} shall be greater
      than zero.
  test-epilogue: null
  test-prologue: null
- name: S1
  states:
  - name: Nop
    test-code: |
      CheckUnchanged( ctx->buf1, ctx->before1, sizeof( ctx->buf1 ) );
    text: |
      The bytes of the memory area referenced by the ${../if/memcmp:/params[0]/name}
      parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: S2
  states:
  - name: Nop
    test-code: |
      CheckUnchanged( ctx->buf2, ctx->before2, sizeof( ctx->buf2 ) );
    text: |
      The bytes of the memory area referenced by the ${../if/memcmp:/params[1]/name}
      parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: Errno
  states:
  - name: Nop
    test-code: |
      T_eq_int( ctx->errno_value, -1 );
    text: |
      The value of ${/c/errno/if/errno:/name} shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: N
  states:
  - name: Zero
    test-code: |
      ctx->n = 0;
    text: |
      While the size specified by ${../if/memcmp:/params[2]/name} is equal to zero.
  - name: One
    test-code: |
      ctx->n = 1;
    text: |
      While the size specified by ${../if/memcmp:/params[2]/name} is equal to one.
  - name: Short
    test-code: |
      ctx->n = 2;
    text: |
      While the size specified by ${../if/memcmp:/params[2]/name} is greater than
      one, while the size specified by ${../if/memcmp:/params[2]/name} is less than
      the size of type long minus one.
  - name: BelowWord
    test-code: |
      ctx->n = sizeof( long ) - 1;
    text: |
      While the size specified by ${../if/memcmp:/params[2]/name} is equal to the
      size of type long minus one.
  - name: Word
    test-code: |
      ctx->n = sizeof( long );
    text: |
      While the size specified by ${../if/memcmp:/params[2]/name} is equal to the
      size of type long.
  - name: AboveWord
    test-code: |
      ctx->n = sizeof( long ) + 1;
    text: |
      While the size specified by ${../if/memcmp:/params[2]/name} is equal to the
      size of type long plus one.
  - name: Long
    test-code: |
      ctx->n = 5 * sizeof( long ) + 1;
    text: |
      While the size specified by ${../if/memcmp:/params[2]/name} is greater than the
      size of type long plus one.
  test-epilogue: null
  test-prologue: null
- name: S1Alignment
  states:
  - name: Aligned
    test-code: |
      ctx->s1_misalign = 0;
    text: |
      While the memory area referenced by the ${../if/memcmp:/params[0]/name}
      parameter starts at an address which is aligned to the size of type long.
  - name: AboveAligned
    test-code: |
      ctx->s1_misalign = 1;
    text: |
      While the memory area referenced by the ${../if/memcmp:/params[0]/name}
      parameter starts one byte above an address which is aligned to the size of type
