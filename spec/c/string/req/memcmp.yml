test-description: |
  Both memory areas start inside buffers filled with the same byte. The first
  differing byte is the first or the last byte. Its pair holds one byte below
  0x80 and one byte above 0x80, so a comparison as signed char inverts the order.
  Equal memory areas differ in the byte which follows them.
