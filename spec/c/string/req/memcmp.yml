  test-epilogue: |
    ctx->s1 = &ctx->buf1[ sizeof( long ) + ctx->s1_misalign ];
    ctx->s2 = &ctx->buf2[ sizeof( long ) + ctx->s2_misalign ];
  test-prologue: null
- name: Position
  states:
  - name: Before
    test-code: |
      ctx->pos = 0;
    text: |
      While a byte which precedes the last byte of the first
      ${../if/memcmp:/params[2]/name} bytes of the memory area referenced by the
      ${../if/memcmp:/params[0]/name} parameter differs from the byte at the same
      position of the memory area referenced by the ${../if/memcmp:/params[1]/name}
      parameter.
  - name: Last
    test-code: |
      ctx->pos = ctx->n - 1;
    text: |
      While each byte which precedes the last byte of the first
      ${../if/memcmp:/params[2]/name} bytes of the memory area referenced by the
      ${../if/memcmp:/params[0]/name} parameter is equal to the byte at the same
      position of the memory area referenced by the ${../if/memcmp:/params[1]/name}
      parameter.
  test-epilogue: null
  test-prologue: null
- name: Diff
  states:
  - name: Equal
    test-code: |
      ctx->s1[ ctx->n ] = LOW;
      ctx->s2[ ctx->n ] = HIGH;
    text: |
      While each byte of the first ${../if/memcmp:/params[2]/name} bytes of the
      memory area referenced by the ${../if/memcmp:/params[0]/name} parameter is
      equal to the byte at the same position of the memory area referenced by the
      ${../if/memcmp:/params[1]/name} parameter.
  - name: Less
    test-code: |
      ctx->s1[ ctx->pos ] = LOW;
      ctx->s2[ ctx->pos ] = HIGH;
    text: |
      While the value as `unsigned char` of the first byte of the first
      ${../if/memcmp:/params[2]/name} bytes of the memory area referenced by the
      ${../if/memcmp:/params[0]/name} parameter which differs from the byte at the
      same position of the memory area referenced by the
      ${../if/memcmp:/params[1]/name} parameter is less than the value as
      `unsigned char` of that byte.
  - name: Greater
    test-code: |
      ctx->s1[ ctx->pos ] = HIGH;
      ctx->s2[ ctx->pos ] = LOW;
    text: |
      While the value as `unsigned char` of the first byte of the first
      ${../if/memcmp:/params[2]/name} bytes of the memory area referenced by the
      ${../if/memcmp:/params[0]/name} parameter which differs from the byte at the
      same position of the memory area referenced by the
      ${../if/memcmp:/params[1]/name} parameter is greater than the value as
      `unsigned char` of that byte.
  test-epilogue: null
  test-prologue: null
- name: Rest
  states:
  - name: Equal
    test-code: |
      /* The prepare fills both memory areas with the same byte */
    text: |
      While each byte after the first differing byte of the first
      ${../if/memcmp:/params[2]/name} bytes of the memory area referenced by the
      ${../if/memcmp:/params[0]/name} parameter is equal to the byte at the same
      position of the memory area referenced by the ${../if/memcmp:/params[1]/name}
      parameter.
  - name: Differs
    test-code: |
      ctx->s1[ ctx->n - 1 ] = ctx->s2[ ctx->pos ];
      ctx->s2[ ctx->n - 1 ] = ctx->s1[ ctx->pos ];
    text: |
      While a byte after the first differing byte of the first
      ${../if/memcmp:/params[2]/name} bytes of the memory area referenced by the
      ${../if/memcmp:/params[0]/name} parameter differs from the byte at the same
      position of the memory area referenced by the ${../if/memcmp:/params[1]/name}
      parameter.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension N covers the size, 7 states. ${/ref/std/c23/memcmp:/name} compares
  the bytes of the two memory areas. A size of zero leaves no byte to compare.
  The implementation of the pre-qualified library compares the size against zero
  and the size of type long. The states Zero and One hold the boundary zero and
  the value above it. The other boundary has a state for the value below it, at
  it and above it. The states Short and Long hold the values between and after
  these states.

  Dimension S1Alignment covers the start address of the memory area referenced by
  the ${../if/memcmp:/params[0]/name} parameter, 4 states. Dimension S2Alignment
  covers the start address of the memory area referenced by the
  ${../if/memcmp:/params[1]/name} parameter, 4 states. The block loop of the
  implementation needs two aligned start addresses. Otherwise the byte loop
  compares all bytes. The offset of the start address to the preceding aligned
  address ranges from zero to the size of type long minus one. The states Aligned
  and AboveAligned hold the boundary zero and the value above it. The state
  BelowAligned holds the largest offset. The state Between holds the offsets
  between them.

  Dimension Position covers the bytes which precede the last byte, 2 states. A
  pair of them differs, or all pairs are equal. A first differing pair at the
  last byte follows a byte loop, or a block loop over equal blocks.

  Dimension Diff covers the first pair of differing bytes, 3 states.
  ${/ref/std/c23/memcmp:/name} takes the sign of the result from this pair. It
  reads both bytes as `unsigned char`. The pair is absent, or its first byte is
  less or greater than its second byte.

  Dimension Rest covers the bytes after the first pair of differing bytes, 2
  states. ${/ref/std/c23/memcmp:/name} ignores them. These bytes are equal, or a
  later pair differs. The test places a pair of the opposite order at the last
  byte. It shows that the first pair decides.

  ${/ref/std/posix-2024/memcmp:/name} states that the function does not change
  ${/c/errno/if/errno:/name} on valid input.
