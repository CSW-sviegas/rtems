    ${../if/strstr:/name} call.
  description: null
  member: |
    int errno_value[ 3 ]
test-context-support: |
  typedef enum {
    OCCURRENCES_NONE,
    OCCURRENCES_ONE,
    OCCURRENCES_SEVERAL
  } Occurrences;

  typedef enum {
    POSITION_NONE,
    POSITION_START,
    POSITION_BETWEEN,
    POSITION_END
  } Position;

  typedef enum { PARTIAL_NO, PARTIAL_INSIDE, PARTIAL_TAIL } Partial;

  typedef enum {
    NEAR_MATCH_NONE,
    NEAR_MATCH_FIRST,
    NEAR_MATCH_INNER,
    NEAR_MATCH_LAST
  } NearMatch;

  typedef enum {
    HAYSTACK_SHORTER,
    HAYSTACK_BELOW,
    HAYSTACK_EQUAL,
    HAYSTACK_ABOVE,
    HAYSTACK_LONGER
  } Haystack;
test-description: |
  Each variant builds a pair of strings and calls ${../if/strstr:/name} for it.
  For a needle of up to three characters, and for a haystack of at most the
  needle length plus one, a table provides the strings. The entries for a needle
  of up to three characters come from an enumeration of all strings over a few
  letters. A recipe table builds the strings for longer needles from one of
  several needle shapes. A longer haystack starts with a fill of 2560 characters
  which do not occur in the needle. For a needle of at least five characters, a
  longer haystack is built for three needle shapes, which lead the search through
  both of its paths with left halves of different lengths. For a needle with a
  ${../glossary/border:/term}, an inner ${../glossary/near-match:/term} before an
  occurrence starts one period of the needle before it. The test compares each
  result with a search of its own.
test-header: null
test-includes:
- errno.h
- stdbool.h
- stdint.h
- string.h
test-local-includes: []
test-prepare: |
  ctx->position = POSITION_NONE;
test-setup: null
test-stop: null
