rationale: |
  ${/ref/std/c23/strstr:/name} defines no error for the function. It leaves the
  behaviour undefined where a parameter references no string, so the item states
  no ${/c/if/null:/name} pointer. ${/ref/std/posix-2024/strstr:/name} states that
  the function does not change ${/c/errno/if/errno:/name} on valid input.

  Dimension Length covers the length of the string referenced by the
  ${../if/strstr:/params[1]/name} parameter, 7 states.
  ${/ref/std/c23/strstr:/name} specifies the result for a string of zero length
  apart from every other string. The implementation of the pre-qualified library
  selects its search by this length. It compares the length against one, two,
  three and four. The states Empty to Five hold the values below, at and above
  these boundaries. The Long state holds the values after these states.

  Dimension Haystack covers the length of the string referenced by the
  ${../if/strstr:/params[0]/name} parameter, 5 states. It takes this length
  relative to the length of the string referenced by the
  ${../if/strstr:/params[1]/name} parameter. The implementation compares the two
  lengths. The states BelowNeedle, EqualNeedle and AboveNeedle hold the values
  below, at and above this boundary. The states Shorter and Longer hold the
  values below and above these states. An enumeration of all strings of these
  lengths gives the skip reasons of the states up to AboveNeedle. It covers each
  needle of up to seven characters. The skip reasons are the same for each length
  from four on.

  ${/ref/std/c23/strstr:/name} interprets each character of a string function as
  type `unsigned char`. The characters with a value greater than 127 have a
  negative value as type `signed char`. The HighByte dimension holds this
  distinction.

  Dimension Occurrences covers the number of occurrences of the string referenced
  by the ${../if/strstr:/params[1]/name} parameter in the string referenced by
  the ${../if/strstr:/params[0]/name} parameter, 3 states.
  ${/ref/std/c23/strstr:/name} specifies the first occurrence, and only several
  occurrences tell the first occurrence apart from another one. An empty string
  occurs at each index of a string and after its last character. It therefore
  occurs once in an empty string and more than once in every other string.

  Dimension Position covers the index of the first occurrence relative to the
  ends of the string referenced by the ${../if/strstr:/params[0]/name} parameter,
  3 states. ${/ref/std/c23/strstr:/name} leaves an access beyond the end of an
  object undefined. The End state holds this bound of the search. A string
  without an occurrence has no first occurrence, so the dimension does not apply
  to it.

  Dimension Overlap covers the pairs of occurrences, 2 states. Two occurrences
  share a character only where the string referenced by the
  ${../if/strstr:/params[1]/name} parameter has a ${../glossary/border:/term}.

  Dimension Partial covers the ${../glossary/partial-match:/term} before the
  first occurrence and at the end of the string referenced by the
  ${../if/strstr:/params[0]/name} parameter, 3 states. An occurrence can start
  inside the characters which a ${../glossary/partial-match:/term} examines.

  Dimension NearMatch covers the first ${../glossary/near-match:/term} before the
  first occurrence, 4 states. ${/ref/std/c23/strstr:/name} locates the sequence
  of characters of the string referenced by the ${../if/strstr:/params[1]/name}
  parameter. An occurrence therefore needs a match of every character. A
  ${../glossary/near-match:/term} fails this condition in exactly one character.
  The states tell apart the first character, an inner character and the last
  character. For a needle with a ${../glossary/border:/term}, the test places the
  inner ${../glossary/near-match:/term} so that it shares characters with the
  first occurrence. The implementation then reaches the shift after a mismatch in
  the left half of a periodic needle.
