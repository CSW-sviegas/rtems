requirement-type: functional
skip-reasons:
  AboveHaystackHasNoRoomBetween: |
    In a haystack of the needle length plus one, an occurrence at an index greater
    than zero ends at the last character.
  AboveHaystackIsTwoSequences: |
    A haystack of the needle length plus one holds exactly two sequences of the
    needle length, at index zero and at index one. Each occurrence and each
    ${../glossary/near-match:/term} is one of them, so two of them share all
    characters but one.
  BorderInNearMatch: |
    A ${../glossary/near-match:/term} which differs in the first character ends
    with each ${../glossary/border:/term} of the string. Without an occurrence,
    such a ${../glossary/border:/term} is a ${../glossary/partial-match:/term}.
  EmptyAtIndexZero: |
    The first occurrence of an empty string is at index zero.
  EmptyHasNoBorder: |
    An empty string has no ${../glossary/border:/term}.
  EmptyHasNoPrefix: |
    An empty string has no proper non-empty prefix.
  EmptyHaystackHoldsNoPartialMatch: |
    An empty haystack holds no ${../glossary/partial-match:/term}.
  EmptyHoldsNoCharacter: |
    An empty string holds no character.
  EmptyOccursEverywhere: |
    An empty string occurs at each index of a string and after its last character.
    It occurs once in an empty string only.
  EqualCharactersFormNearMatch: |
    For a needle of two equal characters, the character before the first occurrence
    and each character next to a ${../glossary/partial-match:/term} differs from
    the needle character. Together with the needle character it forms a
    ${../glossary/near-match:/term}.
  EqualHaystackIsNeedle: |
    A haystack of the needle length which holds an occurrence is equal to the
    needle. It holds one occurrence at index zero, and it holds no
    ${../glossary/partial-match:/term} and no ${../glossary/near-match:/term}.
  EqualHaystackIsOneSequence: |
    A haystack of the needle length holds exactly one sequence of the needle
    length. An occurrence or a ${../glossary/near-match:/term} is the whole
    haystack, so the haystack ends with each of its suffixes.
  NearMatchStartsWithPrefix: |
    A ${../glossary/near-match:/term} which no occurrence precedes and which
    matches the first character starts with a ${../glossary/partial-match:/term}.
  NoIndexBeforeZero: |
    No index is less than zero.
  NoInnerCharacter: |
    A string of at most two characters has no character other than its first and
    its last character.
  NoNegativeLength: |
    A string has no negative length.
  NoOccurrenceAfterEnd: |
    No occurrence starts after an occurrence which ends at the last character.
  NoPartialAtEnd: |
    A string which ends with an occurrence does not end with a
    ${../glossary/partial-match:/term}.
  OneCharacterHasNoBorder: |
    A string of one character has no ${../glossary/border:/term}.
  OneCharacterHasNoPrefix: |
    A string of one character has no proper non-empty prefix, so no
    ${../glossary/partial-match:/term} of it exists.
  OneCharacterHaystackEndsWithPartialMatch: |
    A haystack of at most one character which holds a
    ${../glossary/partial-match:/term} ends with it.
  OtherCharacterIsNearMatch: |
    For a string of one character, each other character is a
    ${../glossary/near-match:/term} of it. A haystack which holds a character
    before the first occurrence, or which holds a character and no occurrence,
    holds such a character.
  OverlapNeedsBorder: |
    Two occurrences of a string without a ${../glossary/border:/term} share no
    character.
  OverlapNeedsTwo: |
    An overlap needs two occurrences.
  PartialMatchStartsNearMatch: |
    For a needle of two characters, a ${../glossary/partial-match:/term} which does
    not end the haystack starts a ${../glossary/near-match:/term} which differs in
    the last character.
  ShortHaystackHoldsNoNearMatch: |
    A string which is shorter than the string referenced by the
    ${../if/strstr:/params[1]/name} parameter holds no
    ${../glossary/near-match:/term} of it.
  ShortHaystackHoldsNoOccurrence: |
    A string which is shorter than the string referenced by the
    ${../if/strstr:/params[1]/name} parameter holds no occurrence of it.
test-action: |
  size_t shape;

  ctx->count = 0;

  for ( shape = 0; shape < ShapeCount( ctx ); ++shape ) {
    size_t i;

    i = ctx->count;
    ctx->shape = shape;
    ctx->size = 0;
    T_quiet_true( Build( ctx, 2560 ) );
    ctx->expected[ i ] = Find( ctx );
    memcpy( ctx->s1_before, ctx->s1_buf, sizeof( ctx->s1_buf ) );
    memcpy( ctx->s2_before, ctx->s2_buf, sizeof( ctx->s2_buf ) );
    errno = -1;
    ctx->retval[ i ] = strstr( ctx->s1_buf, ctx->s2_buf );
    ctx->errno_value[ i ] = errno;
    ctx->s1_cmp[ i ] = memcmp(
      ctx->s1_before,
      ctx->s1_buf,
      sizeof( ctx->s1_buf )
    );
    ctx->s2_cmp[ i ] = memcmp(
      ctx->s2_before,
      ctx->s2_buf,
      sizeof( ctx->s2_buf )
    );
    ctx->count = i + 1;
  }
