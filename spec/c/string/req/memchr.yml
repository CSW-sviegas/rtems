test-description: |
  The memory area starts inside a buffer filled with a byte which differs from
  the byte to locate. Where the memory area holds more than two bytes, the second
  byte holds a second match. Otherwise the first byte holds it. The second byte
  lies in the first block of an aligned memory area and starts the first block of
  a memory area which starts one byte below an aligned address. It lies before
  the first block of the other memory areas. A memory area without a match has
  the byte to locate immediately before and after it. A size beyond the object
  places the matches as the long size does.
