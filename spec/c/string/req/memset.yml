post-conditions:
- name: Result
  states:
  - name: S
    test-code: |
      T_eq_ptr( ctx->retval, ctx->s );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/memset:/name} shall be the value
      of the ${../if/memset:/params[0]/name} parameter.
  test-epilogue: null
  test-prologue: null
- name: Area
  states:
  - name: Set
    test-code: |
      CheckArea( ctx );
    text: |
      Each of the first ${../if/memset:/params[2]/name} bytes of the memory area
      referenced by the ${../if/memset:/params[0]/name} parameter shall be set to the
      value of the ${../if/memset:/params[1]/name} parameter converted to
      `unsigned char`.
  test-epilogue: null
  test-prologue: null
- name: Outside
  states:
  - name: Nop
    test-code: |
      CheckOutside( ctx );
    text: |
      The bytes outside the first ${../if/memset:/params[2]/name} bytes of the memory
      area referenced by the ${../if/memset:/params[0]/name} parameter shall not be
      modified.
  test-epilogue: null
  test-prologue: null
- name: Errno
  states:
  - name: Nop
    test-code: |
      T_eq_int( ctx->errno_value, -1 );
    text: |
      The value of ${/c/errno/if/errno:/name} shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: N
  states:
  - name: Zero
    test-code: |
      ctx->n = 0;
    text: |
      While the size specified by ${../if/memset:/params[2]/name} is equal to zero.
  - name: One
    test-code: |
      ctx->n = 1;
    text: |
      While the size specified by ${../if/memset:/params[2]/name} is equal to one.
  - name: Short
    test-code: |
      ctx->n = 2;
    text: |
      While the size specified by ${../if/memset:/params[2]/name} is greater than
      one, while the size specified by ${../if/memset:/params[2]/name} is less than
      the size of type long minus one.
  - name: BelowWord
    test-code: |
      ctx->n = sizeof( long ) - 1;
    text: |
      While the size specified by ${../if/memset:/params[2]/name} is equal to the
      size of type long minus one.
  - name: Word
    test-code: |
      ctx->n = sizeof( long );
    text: |
      While the size specified by ${../if/memset:/params[2]/name} is equal to the
      size of type long.
  - name: AboveWord
    test-code: |
      ctx->n = sizeof( long ) + 1;
    text: |
      While the size specified by ${../if/memset:/params[2]/name} is equal to the
      size of type long plus one.
  - name: Medium
    test-code: |
      ctx->n = sizeof( long ) + 2;
    text: |
      While the size specified by ${../if/memset:/params[2]/name} is greater than the
      size of type long plus one, while the size specified by
      ${../if/memset:/params[2]/name} is less than four times the size of type long
      minus one.
  - name: BelowBlock
    test-code: |
      ctx->n = 4 * sizeof( long ) - 1;
    text: |
      While the size specified by ${../if/memset:/params[2]/name} is equal to four
      times the size of type long minus one.
  - name: Block
    test-code: |
      ctx->n = 4 * sizeof( long );
    text: |
      While the size specified by ${../if/memset:/params[2]/name} is equal to four
      times the size of type long.
  - name: AboveBlock
    test-code: |
      ctx->n = 4 * sizeof( long ) + 1;
    text: |
      While the size specified by ${../if/memset:/params[2]/name} is equal to four
      times the size of type long plus one.
  - name: Long
    test-code: |
      ctx->n = 9 * sizeof( long ) + 1;
    text: |
      While the size specified by ${../if/memset:/params[2]/name} is greater than
      four times the size of type long plus one.
  test-epilogue: null
  test-prologue: null
- name: Alignment
  states:
  - name: Aligned
    test-code: |
      ctx->s = &ctx->buf[ 2 * sizeof( long ) ];
    text: |
      While the memory area referenced by the ${../if/memset:/params[0]/name}
      parameter starts at an address which is aligned to the size of type long.
  - name: AboveAligned
    test-code: |
      ctx->s = &ctx->buf[ 2 * sizeof( long ) + 1 ];
    text: |
      While the memory area referenced by the ${../if/memset:/params[0]/name}
      parameter starts one byte above an address which is aligned to the size of type
      long.
  - name: Between
    test-code: |
      ctx->s = &ctx->buf[ 2 * sizeof( long ) + 2 ];
    text: |
      While the memory area referenced by the ${../if/memset:/params[0]/name}
      parameter starts more than one byte above an address which is aligned to the
      size of type long, while the memory area referenced by the
      ${../if/memset:/params[0]/name} parameter starts more than one byte below the
      next address which is aligned to the size of type long.
  - name: BelowAligned
    test-code: |
      ctx->s = &ctx->buf[ 2 * sizeof( long ) + sizeof( long ) - 1 ];
    text: |
      While the memory area referenced by the ${../if/memset:/params[0]/name}
      parameter starts one byte below an address which is aligned to the size of type
      long.
  test-epilogue: null
  test-prologue: null
- name: C
  states:
  - name: InRange
    test-code: |
      ctx->c = TARGET;
    text: |
      While the value of the ${../if/memset:/params[1]/name} parameter is in the
      range of the type `unsigned char`.
  - name: Negative
    test-code: |
      ctx->c = TARGET - ( UCHAR_MAX + 1 );
    text: |
      While the value of the ${../if/memset:/params[1]/name} parameter is less than
      zero.
  - name: Greater
    test-code: |
      ctx->c = TARGET + ( UCHAR_MAX + 1 );
    text: |
      While the value of the ${../if/memset:/params[1]/name} parameter is greater
      than the maximum value of the type `unsigned char`.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension N covers the size, 11 states. ${/ref/std/c23/memset:/name} sets each
  byte of the memory area. A size of zero sets no byte. The implementation of the
  pre-qualified library compares the size against zero, the size of type long and
  four times this size. The states Zero and One hold the boundary zero and the
  value above it. Each other boundary has a state for the value below it, at it
  and above it. The states Short, Medium and Long hold the values between and
  after these states. A size beyond the memory area is outside the domain, so N
  has no state for the last value of the type.

  Dimension C covers the value of the character, 3 states.
  ${/ref/std/c23/memset:/name} converts it to `unsigned char`. The conversion
  keeps a value of that range. It changes a negative value and a value beyond the
  maximum of the type.

  Dimension Alignment covers the start address of the memory area, 4 states. The
  implementation sets the bytes before the first aligned address one at a time.
  The offset of the start address to the preceding aligned address ranges from
  zero to the size of type long minus one. The states Aligned and AboveAligned
  hold the boundary zero and the value above it. The state BelowAligned holds the
  largest offset. The state Between holds the offsets between them.

  ${/ref/std/posix-2024/memset:/name} states that the function does not change
  ${/c/errno/if/errno:/name} on valid input.
