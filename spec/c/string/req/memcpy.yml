  - name: BelowAligned
    test-code: |
      ctx->dest_offset = sizeof( long ) - 1;
    text: |
      While the memory area referenced by the ${../if/memcpy:/params[0]/name}
      parameter starts one byte below an address which is aligned to the size of type
