      While the size specified by ${../if/memcpy:/params[2]/name} is greater than
      one, while the size specified by ${../if/memcpy:/params[2]/name} is less than
      the size of type long minus one.
  - name: BelowWord
    test-code: |
      ctx->n = sizeof( long ) - 1;
    text: |
      While the size specified by ${../if/memcpy:/params[2]/name} is equal to the
      size of type long minus one.
  - name: Word
    test-code: |
      ctx->n = sizeof( long );
    text: |
      While the size specified by ${../if/memcpy:/params[2]/name} is equal to the
      size of type long.
  - name: AboveWord
    test-code: |
      ctx->n = sizeof( long ) + 1;
