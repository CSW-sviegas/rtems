rationale: |
  Dimension N covers the size, 11 states. ${/ref/std/c23/memcpy:/name} defines
  the copy for each size. A size of zero copies no byte. The implementation of
  the pre-qualified library compares the size against zero, the size of type long
  and four times this size. The states Zero and One hold the boundary zero and
  the value above it. Each other boundary has a state for the value below it, at
  it and above it. The states Short, Medium and Long hold the values between and
  after these states. A size beyond the memory areas is outside the domain, so N
  has no state for the last value of the type.

  Dimension DestAlignment covers the start address of the destination memory
  area, 4 states. Dimension SrcAlignment covers the start address of the source
  memory area, 4 states. The block loops of the implementation need two aligned
  start addresses. Otherwise the byte loop copies all bytes. The offset of the
  start address to the preceding aligned address ranges from zero to the size of
  type long minus one. The states Aligned and AboveAligned hold the boundary zero
  and the value above it. The state BelowAligned holds the largest offset. The
  state Between holds the offsets between them. Two overlapping memory areas are
  outside the domain, so no dimension covers their relative position.

  ${/ref/std/posix-2024/memcpy:/name} states that the function does not change
  ${/c/errno/if/errno:/name} on valid input.
