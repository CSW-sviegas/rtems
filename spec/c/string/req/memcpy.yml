      While the size specified by ${../if/memcpy:/params[2]/name} is equal to the
      size of type long plus one.
  - name: Medium
    test-code: |
      ctx->n = sizeof( long ) + 2;
    text: |
      While the size specified by ${../if/memcpy:/params[2]/name} is greater than the
      size of type long plus one, while the size specified by
      ${../if/memcpy:/params[2]/name} is less than four times the size of type long
